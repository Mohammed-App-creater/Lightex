# Local development: `docker compose up` serves the API on http://localhost:8000.
# Redis and the Celery worker are optional: `docker compose --profile worker up`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lightex"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args: { INSTALL_DEV: "true" }
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-only-not-secret
      DATABASE_URL: postgres://postgres:postgres@db:5432/lightex
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      REFRESH_COOKIE_SECURE: "false"
      STORAGE_BACKEND: fake
      REDIS_URL: ${REDIS_URL:-}
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on:
      db: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    profiles: ["worker"]
    ports: ["6379:6379"]

  worker:
    build:
      context: .
      args: { INSTALL_DEV: "true" }
    profiles: ["worker"]
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: dev-only-not-secret
      DATABASE_URL: postgres://postgres:postgres@db:5432/lightex
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: fake
    volumes: [".:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
