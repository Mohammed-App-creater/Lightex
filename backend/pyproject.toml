[project]
name = "lightex-backend"
version = "1.0.0"
description = "Lightex v1 API (Django + DRF)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF100"]
ignore = [
  "DJ001",  # null=True on text fields is deliberate where "unset" differs from ""
  "DJ008",  # __str__ is not needed on every model
  "S308",   # mark_safe is not used on user content
  "B904",
  "SIM108", # if/else blocks are often clearer than ternaries
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S101", "S105", "S106"]
"core/common/management/commands/seed_demo.py" = ["S311", "S105"]
"modules/tracking/hooks/seed.py" = ["S311", "S105"]
"modules/tracking/testing.py" = ["S105"]
"config/settings/*.py" = ["S105"]
"core/common/testing.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["migrations/", "[.]venv/"]

[[tool.mypy.overrides]]
module = ["core.*.tests.*", "core.tests.*", "modules.tracking.*.tests.*", "modules.tracking.tests.*", "conftest", "core.common.testing", "modules.tracking.testing"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers --ds=config.settings.test"
markers = [
  "concurrency: tests that need real transactions (TransactionTestCase)",
  "realtime_pg: board 33 broker tests on a real LISTEN connection to the test database",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["core", "modules"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.importlinter]
root_packages = ["core", "modules"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core never imports modules"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["modules"]
# No exceptions (platform Stage 2): modules plug into core through registries filled from AppConfig.ready().

[[tool.importlinter.contracts]]
name = "Modules are independent"
type = "independence"
modules = ["modules.tracking", "modules.sales"]
