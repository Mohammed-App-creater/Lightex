[project]
name = "lightex-backend"
version = "1.0.0"
description = "Lightex v1 API (Django + DRF)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF100"]
ignore = [
  "DJ001",  # null=True on text fields is deliberate where "unset" differs from ""
  "DJ008",  # __str__ is not needed on every model
  "S308",   # mark_safe is not used on user content
  "B904",
  "SIM108", # if/else blocks are often clearer than ternaries
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S101", "S105", "S106"]
"core/common/management/commands/seed_demo.py" = ["S311", "S105"]
"config/settings/*.py" = ["S105"]
"core/common/testing.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["migrations/", "[.]venv/"]

[[tool.mypy.overrides]]
module = ["core.*.tests.*", "modules.tracking.*.tests.*", "conftest", "core.common.testing"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers --ds=config.settings.test"
markers = [
  "concurrency: tests that need real transactions (TransactionTestCase)",
  "realtime_pg: board 33 broker tests on a real LISTEN connection to the test database",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["core", "modules"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.importlinter]
root_packages = ["core", "modules"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core never imports modules"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["modules"]
ignore_imports = [
  # Today's core -> tracking imports (docs/platform/stage1-contract.md §4). This list may shrink but never grow.
  "core.access.roles -> modules.tracking.projects.models",  # Stage 2 removes
  "core.access.services -> modules.tracking.projects.models",  # Stage 2 removes
  "core.audit.trash -> modules.tracking.imports.services",  # Stage 2 removes
  "core.audit.trash -> modules.tracking.projects.models",  # Stage 2 removes
  "core.audit.trash -> modules.tracking.projects.services",  # Stage 2 removes
  "core.audit.trash -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.audit.trash -> modules.tracking.tasks.services",  # Stage 2 removes
  "core.audit.views -> modules.tracking.projects.models",  # Stage 2 removes
  "core.audit.views -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.audit.views -> modules.tracking.tasks.selectors",  # Stage 2 removes
  "core.channels.runner -> modules.tracking.projects.models",  # Stage 2 removes
  "core.channels.runner -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.collab.services -> modules.tracking.projects.models",  # Stage 2 removes
  "core.collab.services -> modules.tracking.tasks.selectors",  # Stage 2 removes
  "core.collab.views -> modules.tracking.tasks.views",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.dashboards.models",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.dashboards.widgets",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.integrations.models",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.integrations.processor",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.integrations.runner",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.planning.models",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.projects.models",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.tasks.services",  # Stage 2 removes
  "core.common.management.commands.seed_demo -> modules.tracking.timetracking.models",  # Stage 2 removes
  "core.common.testing -> modules.tracking.projects.models",  # Stage 2 removes
  "core.common.testing -> modules.tracking.projects.services",  # Stage 2 removes
  "core.notifications.handlers -> modules.tracking.imports.models",  # Stage 2 removes
  "core.notifications.handlers -> modules.tracking.planning.models",  # Stage 2 removes
  "core.notifications.handlers -> modules.tracking.projects.models",  # Stage 2 removes
  "core.notifications.handlers -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.notifications.management.commands.send_due_soon -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.notifications.views -> modules.tracking.projects.models",  # Stage 2 removes
  "core.realtime.presence -> modules.tracking.dashboards.models",  # Stage 2 removes
  "core.realtime.presence -> modules.tracking.projects.models",  # Stage 2 removes
  "core.realtime.presence -> modules.tracking.projects.selectors",  # Stage 2 removes
  "core.realtime.presence -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.realtime.services -> modules.tracking.projects.models",  # Stage 2 removes
  "core.realtime.stream -> modules.tracking.projects.models",  # Stage 2 removes
  "core.realtime.views -> modules.tracking.projects.selectors",  # Stage 2 removes
  "core.search.services -> modules.tracking.projects.models",  # Stage 2 removes
  "core.search.services -> modules.tracking.projects.selectors",  # Stage 2 removes
  "core.search.services -> modules.tracking.projects.serializers",  # Stage 2 removes
  "core.search.services -> modules.tracking.tasks.models",  # Stage 2 removes
  "core.search.services -> modules.tracking.tasks.selectors",  # Stage 2 removes
  "core.search.services -> modules.tracking.tasks.serializers",  # Stage 2 removes
  "core.workspaces.services -> modules.tracking.dashboards.models",  # Stage 2 removes
