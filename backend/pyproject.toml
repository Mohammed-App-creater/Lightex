[project]
name = "lightex-backend"
version = "1.0.0"
description = "Lightex v1 API (Django + DRF)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/migrations/*.py", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF100"]
ignore = [
  "DJ001",  # null=True on text fields is deliberate where "unset" differs from ""
  "DJ008",  # __str__ is not needed on every model
  "S308",   # mark_safe is not used on user content
  "B904",
  "SIM108", # if/else blocks are often clearer than ternaries
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"conftest.py" = ["S101", "S105", "S106"]
"apps/common/management/commands/seed_demo.py" = ["S311", "S105"]
"config/settings/*.py" = ["S105"]
"apps/common/testing.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = ["migrations/", "[.]venv/"]

[[tool.mypy.overrides]]
module = ["apps.*.tests.*", "conftest", "apps.common.testing"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers --ds=config.settings.test"
markers = ["concurrency: tests that need real transactions (TransactionTestCase)"]
filterwarnings = ["ignore::DeprecationWarning:celery.*", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
