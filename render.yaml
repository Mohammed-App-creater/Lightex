# Render blueprint for the Lightex API (free plan friendly: no worker, Celery runs inline).
# Create it with "New → Blueprint" pointing at this repository, then fill in the "sync: false" values.
services:
  - type: web
    name: lightex-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lightex-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false # e.g. lightex-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the web client's origin, e.g. https://lightex.example.com
      - key: FRONTEND_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false # e.g. https://lightex-api.onrender.com
      # Client and API on different sites: the refresh cookie must be SameSite=None (and Secure).
      - key: REFRESH_COOKIE_SAMESITE
        value: None
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: lightex-db
    plan: free
    databaseName: lightex
