name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml", "docs/openapi.yaml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", "docs/openapi.yaml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lightex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lightex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy apps config
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Tests and coverage
        run: |
          pytest --cov --cov-report=term --cov-fail-under=85
          coverage report --include="apps/access/*" --fail-under=95
      - name: OpenAPI schema is current
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml --validate --settings=config.settings.test
          diff -u ../docs/openapi.yaml /tmp/openapi.yaml
