.tp-ts{font-size:11px;color:var(--text-3)}
.tp-dz{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:70px;padding:10px;border:1.5px dashed var(--line-2);border-radius:8px;text-align:center;color:var(--text-2);transition:border-color 120ms var(--ease),background-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.tp-dz.over{border-color:var(--accent);background:var(--accent-s);box-shadow:0 0 0 4px var(--accent-s)}
.tp-dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.tp-up{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tp-up .tp-bar span{background:var(--accent);transition:width 120ms linear}
.tp-up.err{border-color:var(--danger)}
.tp-ext{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font:600 8.5px/1 'JetBrains Mono',monospace;background:var(--raised);border:1px solid var(--line-2);flex:none}
.tp-tabs{position:relative;display:inline-flex;border-bottom:1px solid var(--line);margin-bottom:12px}
.tp-tab{width:112px;height:34px;border:0;background:transparent;color:var(--text-2);font:500 13px/1 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tp-tab[aria-selected=true]{color:var(--text)}
.tp-ind{position:absolute;left:0;bottom:-1px;width:112px;height:2px;background:var(--accent);border-radius:2px;transition:transform 200ms var(--spring)}
.tp-cmt{display:flex;gap:12px;padding:8px 0}
.tp-mention{color:var(--accent-t);background:var(--accent-s);padding:0 3px;border-radius:4px;font-weight:500}
.tp-icode{font-family:'JetBrains Mono',monospace;font-size:12px;padding:1px 4px;border-radius:4px;background:var(--raised);border:1px solid var(--line)}
.tp-comp{position:relative;display:flex;gap:10px;align-items:flex-start;padding-top:8px}
.tp-cin{flex:1;min-height:40px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:400 13px/20px 'Inter',sans-serif;resize:none}
.tp-cin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.tp-tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tp-tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tp-tli{position:relative;font-size:13px;line-height:20px;color:var(--text-2)}
.tp-tli::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--control)}
.tp-tli b{color:var(--text);font-weight:500}
.tp-banner{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised)}
.tp-dim{opacity:.55;pointer-events:none;filter:saturate(.6)}
.tp-key:focus-visible,.tp-ib:focus-visible,.tp-done:focus-visible,.tp-ti:focus-visible,.tp-chip:focus-visible,.tp-f:focus-visible,.tp-planh:focus-visible,.tp-pv:focus-visible,.tp-mini:focus-visible,.tp-addp:focus-visible,.tp-mi:focus-visible,.tp-descb:focus-visible,.tp-btn:focus-visible,.tp-tab:focus-visible,.tp-oc button:focus-visible,.tp-dz:focus-within,.tp-cb:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){
  .tp:not(.static){position:fixed;top:auto;left:0;right:0;bottom:0;width:auto!important;height:92vh;border-left:0;border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;animation:tpsheet 280ms var(--ease)}
  .tp:not(.static) .tp-grab{display:block}
}
.sheet .tp-body,.narrow .tp-body{padding:12px 16px 32px}
.sheet .tp-chips{flex-wrap:nowrap;overflow-x:auto}
.sheet .tp-chip{height:36px}
.sheet .tp-crumb{display:none}
@media (max-width:760px){.tp-body,.full .tp-body{grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "props" "main";padding:12px 16px 32px}.full .tp-props{border-left:0;padding-left:0}.tp-chips{flex-wrap:nowrap;overflow-x:auto}.tp-chip{height:36px}}
@media (prefers-reduced-motion:reduce){.tp,.tp *{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/*TP-CSS-END*/
</style>
</helmet>
<div class="ds t-navy" style="width:1440px;height:3020px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · TASK DETAIL v2</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Task panel</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>3 chips</span><span>4 fields</span><span>Planning folded</span><span>empty = hidden</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px">
    <sc-for list="{{frames}}" as="fr" hint-placeholder-count="7">
      <figure class="frame" style="grid-column:span {{fr.span}}">
        <figcaption>{{fr.label}}<span>{{fr.meta}}</span></figcaption>
        <div class="dev" style="height:{{fr.h}}px;border-radius:{{fr.r}}px;width:{{fr.w}}">
          <sc-if value="{{fr.phone}}" hint-placeholder-val="{{false}}"><div class="mockbg"><i></i><i></i><i></i><i></i></div><div class="scrim"></div></sc-if>
          <sc-for list="{{fr.panels}}" as="p" hint-placeholder-count="1">
<!--TP-START-->
            <aside class="tp {{p.cls}}" aria-label="Task {{p.key}}" sc-camel-on-key-down="{{p.onKey}}">
              <span class="tp-grab" aria-hidden="true"></span>
              <div class="tp-head">
                <span class="tp-crumb">{{p.crumb}}</span><span style="color:var(--text-3);margin:0 2px">/</span>
                <button class="tp-key" type="button" sc-camel-on-click="{{p.copyKey}}" aria-label="Copy task key {{p.key}}">{{p.key}}<svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"></rect><path d="M2 8V3a1 1 0 011-1h5" stroke-linecap="round"></path></svg></button>
                <sc-if value="{{p.copied}}" hint-placeholder-val="{{false}}"><span role="status" style="font-size:12px;color:var(--ok)">Copied</span></sc-if>
                <span style="flex:1"></span>
                <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}">
                  <button class="tp-done {{p.doneCls}}" type="button" aria-pressed="{{p.isDone}}" sc-camel-on-click="{{p.markDone}}" title="{{p.doneTitle}}"><span class="tp-ring {{p.ringFx}}"></span>{{p.doneLabel}}</button>
                </sc-if>
                <sc-if value="{{p.showExpand}}" hint-placeholder-val="{{true}}">
                  <button class="tp-ib" type="button" sc-camel-on-click="{{p.toggleFull}}" aria-label="{{p.fullLabel}}" title="{{p.fullLabel}} (⌘⇧F)">
                    <sc-if value="{{p.isFull}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L8.5 5.5M8.5 2.5v3h3M2 12l3.5-3.5M5.5 11.5v-3h-3"></path></svg></sc-if>
                    <sc-if value="{{p.notFull}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 2h3.5v3.5M5.5 12H2V8.5M12 2L8 6M2 12l4-4"></path></svg></sc-if>
                  </button>
                </sc-if>
                <span class="tp-rel">
                  <button class="tp-ib" type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="{{p.moreOpen}}" sc-camel-on-click="{{p.toggleMore}}"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"></circle><circle cx="8" cy="8" r="1.3"></circle><circle cx="12.5" cy="8" r="1.3"></circle></svg></button>
                  <sc-if value="{{p.moreOpen}}" hint-placeholder-val="{{false}}">
                    <div class="tp-menu" role="menu" style="top:36px;right:0">
                      <button class="tp-mi" type="button" role="menuitem" sc-camel-on-click="{{p.copyLink}}"><span style="flex:1">Copy link</span><span class="tp-kbd">⌘L</span></button>
                      <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-mi" type="button" role="menuitem"><span style="flex:1">Duplicate</span><span class="tp-kbd">⌘D</span></button></sc-if>
                      <sc-if value="{{p.canDelete}}" hint-placeholder-val="{{true}}"><div class="tp-sep"></div><button class="tp-mi dng" type="button" role="menuitem" sc-camel-on-click="{{p.deleteTask}}"><span style="flex:1">Delete task</span><span class="tp-kbd">⌫</span></button></sc-if>
                    </div>
                  </sc-if>
                </span>
                <sc-if value="{{p.showClose}}" hint-placeholder-val="{{true}}">
                  <button class="tp-ib" type="button" sc-camel-on-click="{{p.closePanel}}" aria-label="Close" title="Close (Esc)"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"></path></svg></button>
                </sc-if>
              </div>

              <div class="tp-scroll tp-fade">
                <sc-if value="{{p.isDeleted}}" hint-placeholder-val="{{false}}">
                  <div style="padding:14px 20px 0"><div class="tp-banner" role="status">
                    <svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"></path></svg>
                    <span style="flex:1;font-weight:600">Deleted <span style="font-weight:400;color:var(--text-3)">· restorable for 30 days</span></span>
                    <button class="tp-btn sec" type="button" sc-camel-on-click="{{p.restore}}">Restore</button>
                  </div></div>
                </sc-if>
                <div class="tp-body {{p.bodyCls}}">

                  <div class="tp-title">
                    <sc-if value="{{p.titleEditing}}" hint-placeholder-val="{{false}}">
                      <input class="tp-tin" type="text" aria-label="Task title" value="{{p.draftTitle}}" sc-camel-on-change="{{p.onDraftTitle}}" sc-camel-on-key-down="{{p.onTitleKey}}" sc-camel-on-blur="{{p.saveTitle}}" sc-camel-auto-focus="{{true}}">
                    </sc-if>
                    <sc-if value="{{p.titleStatic}}" hint-placeholder-val="{{true}}">
                      <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-ti" type="button" sc-camel-on-click="{{p.startTitle}}">{{p.title}}</button></sc-if>
                      <sc-if value="{{p.cannotEdit}}" hint-placeholder-val="{{false}}"><h2 style="margin:0;font:600 22px/30px 'Inter',sans-serif;letter-spacing:-.015em">{{p.title}}</h2></sc-if>
                    </sc-if>
                    <sc-if value="{{p.isViewer}}" hint-placeholder-val="{{false}}">
                      <div class="tp-note"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1.5 7S3.5 3 7 3s5.5 4 5.5 4-2 4-5.5 4-5.5-4-5.5-4z"></path><circle cx="7" cy="7" r="1.6"></circle></svg>View only</div>
                    </sc-if>
                  </div>

                  <div class="tp-props">
                    <div class="tp-chips">
                      <span class="tp-rel">
                        <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-chip" type="button" aria-haspopup="listbox" aria-expanded="{{p.statusOpen}}" sc-camel-on-click="{{p.toggleStatus}}" aria-label="Status: {{p.st.name}}"><span class="tp-g {{p.st.glyph}}" style="color:{{p.st.color}}"></span>{{p.st.name}}</button></sc-if>
                        <sc-if value="{{p.cannotEdit}}" hint-placeholder-val="{{false}}"><span class="tp-chip ro"><span class="tp-g {{p.st.glyph}}" style="color:{{p.st.color}}"></span>{{p.st.name}}</span></sc-if>
                        <sc-if value="{{p.statusOpen}}" hint-placeholder-val="{{false}}">
                          <div class="tp-menu" role="listbox" aria-label="Status" style="top:34px;left:0">
                            <sc-for list="{{p.statusOpts}}" as="o" hint-placeholder-count="6"><button class="tp-mi {{o.on}}" type="button" role="option" aria-selected="{{o.sel}}" sc-camel-on-click="{{o.pick}}"><span class="tp-g {{o.glyph}}" style="color:{{o.color}}"></span><span style="flex:1">{{o.name}}</span><span class="tp-kbd">{{o.n}}</span></button></sc-for>
                          </div>
                        </sc-if>
                      </span>
                      <span class="tp-rel">
                        <sc-if value="{{p.priSet}}" hint-placeholder-val="{{true}}">
                          <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-chip" type="button" aria-haspopup="listbox" aria-expanded="{{p.priOpen}}" sc-camel-on-click="{{p.togglePri}}" aria-label="Priority: {{p.pri.name}}"><span class="tp-bars {{p.pri.cls}}" style="color:{{p.pri.color}}"><i></i><i></i><i></i><i></i></span>{{p.pri.name}}</button></sc-if>
                          <sc-if value="{{p.cannotEdit}}" hint-placeholder-val="{{false}}"><span class="tp-chip ro"><span class="tp-bars {{p.pri.cls}}" style="color:{{p.pri.color}}"><i></i><i></i><i></i><i></i></span>{{p.pri.name}}</span></sc-if>
                        </sc-if>
                        <sc-if value="{{p.priGhost}}" hint-placeholder-val="{{false}}"><button class="tp-chip ghost" type="button" aria-haspopup="listbox" aria-expanded="{{p.priOpen}}" sc-camel-on-click="{{p.togglePri}}">+ Priority</button></sc-if>
                        <sc-if value="{{p.priOpen}}" hint-placeholder-val="{{false}}">
                          <div class="tp-menu" role="listbox" aria-label="Priority" style="top:34px;left:0">
                            <sc-for list="{{p.priOpts}}" as="o" hint-placeholder-count="5"><button class="tp-mi {{o.on}}" type="button" role="option" aria-selected="{{o.sel}}" sc-camel-on-click="{{o.pick}}"><span class="tp-bars {{o.cls}}" style="color:{{o.color}}"><i></i><i></i><i></i><i></i></span><span style="flex:1">{{o.name}}</span><span class="tp-kbd">{{o.n}}</span></button></sc-for>
                          </div>
                        </sc-if>
                      </span>
                      <span class="tp-rel">
                        <sc-if value="{{p.asgSet}}" hint-placeholder-val="{{true}}">
                          <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-chip" type="button" aria-haspopup="listbox" aria-expanded="{{p.asgOpen}}" sc-camel-on-click="{{p.toggleAsg}}" aria-label="Assignee: {{p.asg.name}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{p.asg.hue}})">{{p.asg.ini}}</span>{{p.asg.name}}</button></sc-if>
                          <sc-if value="{{p.cannotEdit}}" hint-placeholder-val="{{false}}"><span class="tp-chip ro"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{p.asg.hue}})">{{p.asg.ini}}</span>{{p.asg.name}}</span></sc-if>
                        </sc-if>
                        <sc-if value="{{p.asgGhost}}" hint-placeholder-val="{{false}}"><button class="tp-chip ghost" type="button" aria-haspopup="listbox" aria-expanded="{{p.asgOpen}}" sc-camel-on-click="{{p.toggleAsg}}">+ Assign</button></sc-if>
                        <sc-if value="{{p.asgOpen}}" hint-placeholder-val="{{false}}">
                          <div class="tp-menu" role="listbox" aria-label="Assignee" style="top:34px;left:0">
                            <sc-for list="{{p.people}}" as="o" hint-placeholder-count="4"><button class="tp-mi {{o.on}}" type="button" role="option" aria-selected="{{o.sel}}" sc-camel-on-click="{{o.pick}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{o.hue}})">{{o.ini}}</span><span style="flex:1">{{o.name}}</span></button></sc-for>
                            <sc-if value="{{p.asgSet}}" hint-placeholder-val="{{true}}"><div class="tp-sep"></div><button class="tp-mi" type="button" sc-camel-on-click="{{p.unassign}}">Unassign</button></sc-if>
                          </div>
                        </sc-if>
                      </span>
                    </div>

                    <sc-if value="{{p.hasFields}}" hint-placeholder-val="{{true}}">
                      <div class="tp-grid">
                        <sc-for list="{{p.fields}}" as="f" hint-placeholder-count="4">
                          <sc-if value="{{f.input}}" hint-placeholder-val="{{false}}">
                            <div class="tp-f" style="cursor:default"><span class="tp-fl">{{f.label}}</span><span style="display:flex;align-items:center;gap:6px"><input class="tp-num" type="number" min="0" max="99" aria-label="Estimate in points" value="{{p.draftEst}}" sc-camel-on-change="{{p.onDraftEst}}" sc-camel-on-key-down="{{p.onEstKey}}" sc-camel-on-blur="{{p.saveEst}}" sc-camel-auto-focus="{{true}}"><span class="tp-sub">pts</span></span></div>
                          </sc-if>
                          <sc-if value="{{f.btn}}" hint-placeholder-val="{{true}}">
                            <button class="tp-f" type="button" sc-camel-on-click="{{f.act}}"><span class="tp-fl">{{f.label}}</span><span class="tp-fv"><sc-if value="{{f.hasAv}}" hint-placeholder-val="{{false}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{f.hue}})">{{f.ini}}</span></sc-if>{{f.value}}<span class="tp-sub {{f.subCls}}">{{f.sub}}</span></span></button>
                          </sc-if>
                          <sc-if value="{{f.ro}}" hint-placeholder-val="{{false}}">
                            <div class="tp-f ro"><span class="tp-fl">{{f.label}}</span><span class="tp-fv"><sc-if value="{{f.hasAv}}" hint-placeholder-val="{{false}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{f.hue}})">{{f.ini}}</span></sc-if>{{f.value}}<span class="tp-sub {{f.subCls}}">{{f.sub}}</span></span></div>
                          </sc-if>
                        </sc-for>
                      </div>
                    </sc-if>

                    <sc-if value="{{p.hasPlanning}}" hint-placeholder-val="{{true}}">
                      <div class="tp-plan">
                        <button class="tp-planh" type="button" aria-expanded="{{p.planOpen}}" sc-camel-on-click="{{p.togglePlan}}">
                          <svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                          Planning<span class="tp-sum">{{p.planSummary}}</span>
                        </button>
                        <div class="tp-col {{p.planCls}}"><div>
                          <div style="padding:0 0 8px">
                            <sc-for list="{{p.planRows}}" as="r" hint-placeholder-count="3">
                              <div class="tp-pr"><span class="tp-fl" style="font-size:12px">{{r.label}}</span><span><button class="tp-pv {{r.cls}}" type="button">{{r.value}}</button></span></div>
                            </sc-for>
                            <sc-if value="{{p.hasObjRow}}" hint-placeholder-val="{{true}}">
                              <div class="tp-pr" style="align-items:start;padding-top:4px;padding-bottom:4px"><span class="tp-fl" style="font-size:12px;padding-top:5px">Objectives</span>
                                <div class="tp-rel" style="display:flex;flex-wrap:wrap;gap:6px">
                                  <sc-for list="{{p.objChips}}" as="o" hint-placeholder-count="2">
                                    <span class="tp-oc {{o.cls}}"><svg width="11" height="11" sc-camel-view-box="0 0 14 14" fill="none" stroke="var(--accent-t)" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle><circle cx="7" cy="7" r="1.8"></circle></svg>{{o.name}}<sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="Unlink {{o.name}}" sc-camel-on-click="{{o.remove}}"><svg width="9" height="9" sc-camel-view-box="0 0 10 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8"></path></svg></button></sc-if></span>
                                  </sc-for>
                                  <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-mini" type="button" aria-haspopup="listbox" aria-expanded="{{p.objOpen}}" sc-camel-on-click="{{p.toggleObj}}" aria-label="Link objective">+</button></sc-if>
                                  <sc-if value="{{p.objOpen}}" hint-placeholder-val="{{false}}">
                                    <div class="tp-menu" role="listbox" aria-multiselectable="true" style="top:30px;left:0;width:250px">
                                      <sc-for list="{{p.objOpts}}" as="o" hint-placeholder-count="5"><label class="tp-mi" style="cursor:pointer"><input class="tp-cb" type="checkbox" checked="{{o.on}}" sc-camel-on-change="{{o.toggle}}"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{o.name}}</span></label></sc-for>
                                    </div>
                                  </sc-if>
                                </div>
                              </div>
                            </sc-if>
                          </div>
                        </div></div>
                      </div>
                    </sc-if>

                    <sc-if value="{{p.hasLabels}}" hint-placeholder-val="{{true}}">
                      <div class="tp-labels" aria-label="Labels">
                        <sc-for list="{{p.labels}}" as="l" hint-placeholder-count="2"><span class="tp-lab"><span class="tp-dot" style="background:{{l.color}}"></span>{{l.name}}</span></sc-for>
                        <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-mini" type="button" aria-label="Add label">+</button></sc-if>
                      </div>
                    </sc-if>

                    <sc-if value="{{p.canAdd}}" hint-placeholder-val="{{true}}">
                      <div class="tp-rel">
                        <button class="tp-addp" type="button" aria-haspopup="menu" aria-expanded="{{p.addOpen}}" sc-camel-on-click="{{p.toggleAdd}}"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>Add property</button>

class Component extends DCLogic {
  state = { tp: {}, tasks: {} };
//TP-JS-START
  tpGet(id) { return (this.state.tp && this.state.tp[id]) || {}; }

  tpTick(id) {
    const u = this.tpGet(id);
    const ups = u.uploads || [];
    if (!ups.some((x) => !x.err && x.pct < 100)) return;
    const done = [];
    const next = ups.map((x) => {
      if (x.err || x.pct >= 100) return x;
      const pct = Math.min(100, x.pct + 4 + Math.round(Math.random() * 7));
      if (pct >= 100) done.push(x);
      return { ...x, pct };
    });
    this.tpSet(id, { uploads: next.filter((x) => x.err || x.pct < 100), extra: (u.extra || []).concat(done.map((x) => ({ name: x.name, size: x.size.toFixed(1) + ' MB', kind: x.kind, ext: x.ext }))) });
  }
  tpAddFiles(id, list) {
    const IMG = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];
    const CODE = ['ts', 'tsx', 'js', 'jsx', 'py', 'go', 'rs', 'java', 'rb', 'json', 'yml', 'yaml', 'md', 'sql', 'sh', 'css', 'html', 'txt', 'diff'];
    const add = Array.prototype.slice.call(list || [], 0, 10).map((f, i) => {
      const name = String(f.name || 'file').slice(0, 120);
      const ext = (name.split('.').pop() || '').toLowerCase();
      const mb = (f.size || 0) / (1024 * 1024);
      const kind = IMG.indexOf(ext) >= 0 ? 'img' : (CODE.indexOf(ext) >= 0 ? 'code' : '');
      let err = '';
      if (!kind) err = 'Images or code files only';
      else if (mb > 10) err = 'Too large · ' + mb.toFixed(1) + ' MB (max 10)';
      return { id: 'u' + Date.now() + i, name, size: mb, pct: 0, kind, ext: ext.toUpperCase().slice(0, 4), err };
    });
    const u = this.tpGet(id);
    this.tpSet(id, { uploads: (u.uploads || []).concat(add), dragOver: false });
  }
  tpBuild(id, cfg) {
    const self = this;

    const T = cfg.task;

      backlog: ['Backlog', 'backlog', 'var(--text-3)'], todo: ['Todo', 'todo', 'var(--todo)'], progress: ['In progress', 'progress', 'var(--warn)'],
      review: ['In review', 'review', 'var(--info)'], done: ['Done', 'done', 'var(--ok)'], cancel: ['Canceled', 'cancel', 'var(--text-3)']
    };
    const PR = { 4: ['Urgent', 'n4', 'var(--danger)'], 3: ['High', 'n3', 'var(--orange)'], 2: ['Medium', 'n2', 'var(--warn)'], 1: ['Low', 'n1', 'var(--low)'] };
    const PEOPLE = [{ name: 'Alex Kim', ini: 'AK', hue: 285 }, { name: 'Jordan Lee', ini: 'JL', hue: 200 }, { name: 'Sam Patel', ini: 'SP', hue: 20 }, { name: 'Riley Chen', ini: 'RC', hue: 150 }];
    const OBJ = [{ id: 'o1', name: 'Cut p95 latency to 200ms' }, { id: 'o2', name: 'Ship beta on time' }, { id: 'o3', name: 'Zero P1 incidents in Q4' }, { id: 'o4', name: 'Onboarding under 5 minutes' }];
    const isDone = T.status === 'done';
    const fx = u.fx === T.key && isDone;
    const st = S[T.status] || S.todo;
    const fields = [];

    if (T.type) fields.push(fieldBase('Type', T.type));
    if (T.est != null) {
      const editing = !!u.estEditing && canEdit;
      fields.push(fieldBase('Estimate', T.est + ' pts', { input: editing, btn: canEdit && !editing, act: () => set({ estEditing: true, draftEst: String(T.est) }) }));
    }

    const hasPlanning = planRows.length > 0 || objs.length > 0;

      { key: 'PRJ-43', title: 'Add ResizeObserver to the board', ini: 'AK', hue: 285 },
      { key: 'PRJ-44', title: 'Debounce reflow on sidebar toggle', ini: 'JL', hue: 200 },

    const files = baseFiles.concat(u.extra || []).map((f) => ({ ...f, isImg: f.kind === 'img', isCode: f.kind === 'code', preview: f.preview || '// ' + f.name }));
    const uploads = (u.uploads || []).map((x) => ({

      cancelLabel: x.err ? 'Dismiss' : 'Cancel upload', cancel: () => self.tpSet(id, { uploads: (self.tpGet(id).uploads || []).filter((y) => y.id !== x.id) })
