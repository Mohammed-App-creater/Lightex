<style>

.t-light{--bg:#FAFAFB;--surface:#FFFFFF;--raised:#F3F3F6;--hover:#EAEAEF;--line:#E4E4EA;--line-2:#D0D0D9;--control:#8A8A9B;--text:#121217;--text-2:#55556A;--text-3:#5F5F70;--accent:#1D4ED8;--accent-h:#2563EB;--accent-t:#1D4ED8;--accent-s:rgba(29,78,216,.10);--ring:rgba(29,78,216,.35);--spark:#0891B2;--low:#0F766E;--todo:#3E3E50;--ok:#157A3A;--warn:#8A5A00;--danger:#B92F26;--info:#6B3FD4;--orange:#A84A0A;--shadow-pop:0 8px 24px rgba(18,18,23,.10);--shadow-modal:0 24px 64px rgba(18,18,23,.18);--av-l:.90;--av-c:.06}

.ds{--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}

.bd-grid{position:absolute;inset:-40px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 70% 60% at 50% 45%,#000 20%,transparent 80%);animation:audrift 28s linear infinite}

@keyframes audrift{from{transform:translate(0,0)}to{transform:translate(40px,40px)}}

/* card */

.au-h{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em}

.au-in:hover{border-color:var(--control)}
.au-in:focus,.au-in.fk{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.au-in[aria-invalid=true]{border-color:var(--danger)}
.au-in[aria-invalid=true]:focus{box-shadow:0 0 0 3px var(--dng-s)}
.au-in.pr{padding-right:44px}

.au-meter{display:flex;align-items:center;gap:10px}

.au-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;padding:0 14px;border-radius:8px;border:1px solid transparent;font:500 14px/1 'Inter',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background-color 120ms var(--ease),border-color 120ms var(--ease),transform 120ms var(--ease)}

.au-lk{color:var(--accent-t);text-decoration:none;font-weight:500;border-radius:4px}

.au-cb::after{content:"";width:8px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform 150ms var(--spring)}

/* banner */
.au-banner{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--danger);background:var(--dng-s);font-size:13px;line-height:18px;color:var(--text);animation:auin 180ms var(--ease)}
.au-banner svg{flex:none;margin-top:1px;color:var(--danger)}
.au-banner b{font-weight:600;display:block}
.au-banner span{color:var(--text-2);font-size:12px}

/* invite */
.au-inv{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line);text-align:center}
.au-ws{width:48px;height:48px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font:600 16px/1 'Inter',sans-serif;letter-spacing:-.02em;color:var(--text);background:oklch(var(--av-l) var(--av-c) 255);border:1px solid var(--line-2)}
.au-by{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.au-by b{color:var(--text);font-weight:500}
.au-av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:var(--text);flex:none}
.au-role{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--raised);font-size:12px;font-weight:500;color:var(--text)}
.au-role i{width:6px;height:6px;border-radius:50%;background:var(--accent-t)}

/* done states */
.au-done{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;animation:auin 220ms var(--ease)}
.au-ico{width:52px;height:52px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;background:var(--raised);border:1px solid var(--line-2);color:var(--accent-t)}
.au-ico.ok{color:var(--ok);position:relative}
.au-ico.ok::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--spark);box-shadow:0 -30px 0 var(--spark),26px -15px 0 var(--spark),26px 15px 0 var(--spark),0 30px 0 var(--spark),-26px 15px 0 var(--spark),-26px -15px 0 var(--spark);animation:auspark 520ms var(--ease) 80ms both;pointer-events:none}
@keyframes auspark{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
.au-mail{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text)}
.au-done .au-btn{margin-top:4px}
.au-cd{font-family:'JetBrains Mono',monospace;font-size:12.5px}

/* post-login transition */
.au-tr{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:var(--bg);animation:aufade 200ms var(--ease)}
.au-tr .wm{font-size:56px}
.ph .au-tr .wm{font-size:44px}
.au-tr .sv{transform-box:fill-box;transform-origin:center}
.au-tr .a-bar{animation:barIn 260ms var(--ease) both}
.au-tr .a-bolt{animation:strike 320ms var(--spring) 140ms both}
.au-tr .a-flash{animation:flash 460ms var(--ease) 300ms both}
.au-tr .a-x{animation:settle 260ms var(--ease) 460ms both}
.au-tr .a-word{animation:wordIn 300ms var(--ease) 520ms both}
.au-tr .a-ws{animation:wordIn 300ms var(--ease) 760ms both;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
@keyframes barIn{from{clip-path:inset(0 100% 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes strike{from{opacity:0;transform:translate(14px,-18px) scale(1.15)}to{opacity:1;transform:none}}
@keyframes flash{0%{opacity:0;transform:scale(.4)}30%{opacity:.7}100%{opacity:0;transform:scale(1.8)}}
@keyframes settle{0%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes wordIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes aufade{from{opacity:0}to{opacity:1}}
.au-ghost{position:absolute;right:14px;top:14px;z-index:6;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);background:var(--raised);color:var(--text-2);font:500 12px/1 'Inter',sans-serif;cursor:pointer}
.au-ghost:hover{color:var(--text);background:var(--hover)}

/* app placeholder */
.app{position:absolute;inset:0;z-index:4;display:flex;background:var(--bg);animation:aufade 360ms var(--ease)}
.app-rail{width:184px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.app-wsr{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px;border-radius:7px;font-size:13px;font-weight:600}
.app-wsr .au-ws{width:22px;height:22px;border-radius:6px;font-size:10px}
.app-main{flex:1;min-width:0;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:10px;height:28px;padding-right:96px}
.app-top h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 50%,var(--raised) 100%);background-size:200% 100%;animation:aushim 1.4s linear infinite}
@keyframes aushim{from{background-position:100% 0}to{background-position:-100% 0}}
.app-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.app-card{height:96px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px}
.ph .app-rail{display:none}
.ph .app-main{padding:56px 16px 16px}
.ph .app-cards{grid-template-columns:minmax(0,1fr)}

/* replay control on the transition frame */
.au-replay{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:7}

@media (max-width:760px){
  .au{border-radius:0;border:0}
  .au-scroll{justify-content:flex-start;padding:56px 0 32px}
  .au-card{width:100%;padding:0 20px;border:0;background:transparent}
  .au-in{height:44px;font-size:16px}
  .au-btn{height:46px;font-size:15px}
  .app-rail{display:none}
}
@media (prefers-reduced-motion:reduce){
  .au,.au *{animation:none!important;transition:none!important}
  .au .spin{animation:auspin 1.6s linear infinite!important}
}
</style>

<div class="ds {{themeCls}}" style="width:1440px;height:5700px;padding:64px 80px;display:flex;flex-direction:column;gap:40px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · AUTH</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Auth flow</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>5 screens</span><span>validate on blur</span><span>navy + light</span><span>390 mobile</span><span>logo = transition</span></div>
  </header>

  <div style="display:flex;flex-wrap:wrap;column-gap:40px;row-gap:40px;width:1280px">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="15">
      <figure class="frame" id="{{fx.anchor}}" style="width:{{fx.w}}px">
        <figcaption>{{fx.caption}}<span>{{fx.meta}}</span></figcaption>
        <div class="au {{fx.themeCls}} {{fx.phCls}}" style="height:{{fx.h}}px">
          <div class="bd" aria-hidden="true">
            <div class="bd-glow"></div>
            <div class="bd-grid"></div>
            <svg class="bd-bolt" sc-camel-view-box="0 0 46 39" style="right:-30px;top:60px" overflow="visible"><path d="M50 -5L27 17H38L-4 44" fill="none" stroke="var(--logo)" stroke-width="2" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg>
            <svg class="bd-bolt b2" sc-camel-view-box="0 0 46 39" style="left:-20px;bottom:90px" overflow="visible"><path d="M50 -5L27 17H38L-4 44" fill="none" stroke="var(--logo)" stroke-width="2.5" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg>
            <svg class="bd-bolt b3" sc-camel-view-box="0 0 46 39" style="left:18%;top:36px" overflow="visible"><path d="M50 -5L27 17H38L-4 44" fill="none" stroke="var(--text-3)" stroke-width="3" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg>
          </div>

          <sc-if value="{{fx.showMain}}" hint-placeholder-val="{{true}}">
          <div class="au-scroll">
            <span role="img" aria-label="Lightex" class="wm">Lighte<svg sc-camel-view-box="0 0 46 39" aria-hidden="true" class="wx">
              <mask id="lm-{{fx.id}}" sc-camel-mask-units="userSpaceOnUse" x="-10" y="-10" width="70" height="60"><rect x="-10" y="-10" width="70" height="60" fill="#fff"></rect><path d="M50 -5L27 17H38L-4 44" fill="none" stroke="#000" stroke-width="13.5" stroke-linejoin="miter" stroke-miterlimit="10"></path></mask>
              <clipPath id="lc-{{fx.id}}"><rect width="46" height="39"></rect></clipPath>
              <g clip-path="url(#lc-{{fx.id}})"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="9.5" fill="none" mask="url(#lm-{{fx.id}})"></path><path d="M50 -5L27 17H38L-4 44" stroke="var(--logo)" stroke-width="8.5" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></g>
            </svg></span>

            <div class="au-card">
              <sc-if value="{{fx.showForm}}" hint-placeholder-val="{{true}}">
                <sc-if value="{{fx.isAccept}}" hint-placeholder-val="{{false}}">
                  <div class="au-inv">
                    <span class="au-ws" aria-hidden="true">PT</span>
                    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;navy&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5700}}">
class Component extends DCLogic {
  state = { f: {} };

  componentDidMount() {
    this.tk = setInterval(() => {
      const defs = this.defs || {};
      const all = { ...(this.state.f || {}) };
      let ch = false;
      Object.keys(defs).forEach((id) => {
        const cur = this.fs(id);
        if (cur.phase === 'done' && cur.cd > 0) { all[id] = { ...(all[id] || {}), cd: cur.cd - 1 }; ch = true; }
      });
      if (ch) this.setState({ f: all });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.tk); (this.tm || []).forEach((t) => clearTimeout(t)); }
  later(fn, ms) { this.tm = this.tm || []; this.tm.push(setTimeout(fn, ms)); }

  fs(id) {
    const d = (this.defs || {})[id] || { init: {} };
    const base = { phase: 'form', vals: {}, touched: {}, show: {}, sub: false, banner: false, terms: false, cd: 0, resent: false, ...d.init };
    return { ...base, ...((this.state.f || {})[id] || {}) };
  }
  patch(id, p) {
    const all = { ...(this.state.f || {}) };
    all[id] = { ...(all[id] || {}), ...p };
    this.setState({ f: all });
  }
  reset(id) {
    const all = { ...(this.state.f || {}) };
    delete all[id];
    this.setState({ f: all });
  }

  rules(pw) {
    return [
      { label: '8+ characters', ok: pw.length >= 8 },
      { label: 'A number', ok: /\d/.test(pw) },
      { label: 'Upper + lower', ok: /[a-z]/.test(pw) && /[A-Z]/.test(pw) },
      { label: 'A symbol', ok: /[^A-Za-z0-9]/.test(pw) }
    ];
  }
  score(pw) {
    if (!pw) return 0;
    const r = this.rules(pw);
    let s = r.filter((x) => x.ok).length;
    if (!r[0].ok) s = Math.min(s, 1);
    return Math.max(s, 1);
  }
  errFor(key, v, vals) {
    const t = (v || '').trim();
    if (key === 'name') return t ? '' : 'Enter your name';
    if (key === 'email') { if (!t) return 'Enter your email'; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t) ? '' : 'Enter a valid email'; }
    if (key === 'password') return v ? '' : 'Enter your password';
    if (key === 'newpw') { if (!v) return 'Create a password'; return this.score(v) >= 3 ? '' : 'Use a stronger password'; }
    if (key === 'confirm') { if (!v) return 'Confirm your password'; return v === (vals.newpw || '') ? '' : 'Passwords don’t match'; }
    return '';
  }

  buildFrame(def) {
    const self = this;
    const id = def.id;
    const cur = this.fs(id);
    const kind = def.kind;
    const SPEC = {
      login: [['email', 'Email', 'email', 'email'], ['password', 'Password', 'password', 'current-password']],
      register: [['name', 'Full name', 'text', 'name'], ['email', 'Work email', 'email', 'email'], ['newpw', 'Password', 'password', 'new-password']],
      forgot: [['email', 'Email', 'email', 'email']],
      reset: [['newpw', 'New password', 'password', 'new-password'], ['confirm', 'Confirm password', 'password', 'new-password']],
      accept: [['email', 'Email', 'email', 'email'], ['name', 'Full name', 'text', 'name'], ['newpw', 'Set a password', 'password', 'new-password']]
    }[kind];
    const PH = { email: 'you@team.dev', name: 'First Last', password: '', newpw: '', confirm: '' };
    const fields = SPEC.map(([key, label, type, ac]) => {
      const fid = id + '-' + key;
      const v = cur.vals[key] || '';
      const locked = kind === 'accept' && key === 'email';
      const err = locked ? '' : this.errFor(key, v, cur.vals);
      const errShow = !!err && !!(cur.sub || cur.touched[key]);
      const isPw = key === 'password' || key === 'newpw' || key === 'confirm';
      const shown = !!cur.show[key];
      const meterShow = key === 'newpw';
      const sc = meterShow ? this.score(v) : 0;
      const descParts = [];
      const bannerHit = cur.banner && (key === 'email' || key === 'password');
      if (bannerHit) descParts.push(id + '-banner');
      if (errShow) descParts.push(fid + '-err');
      if (meterShow) descParts.push(fid + '-rules');
      if (locked) descParts.push(fid + '-hint');
      const rl = meterShow ? this.rules(v) : [];
      return {
        key, fid, label, ac, locked,
        type: isPw ? (shown ? 'text' : 'password') : type,
        value: v,
        ph: PH[key] || '',
        icls: (isPw ? 'pr' : '') + (locked ? ' pr' : '') + (def.focusKey === key ? ' fk' : ''),
        invalid: errShow || bannerHit,
        desc: descParts.length ? descParts.join(' ') : undefined,
        err, errShow,
        forgot: key === 'password' && kind === 'login',
        toggleShow: isPw,
        shown, notShown: !shown,
        toggle: () => self.patch(id, { show: { ...cur.show, [key]: !shown } }),
        hintShow: locked, hint: 'From your invite',
        meterShow,
        score: sc,
        scoreLabel: v ? ['', 'Weak', 'Fair', 'Good', 'Strong'][sc] : '',
        scoreCls: 's' + sc,
        segs: [0, 1, 2, 3].map((i) => ({ cls: i < sc ? 's' + sc : '' })),
        rules: rl.map((r) => ({ label: r.label, ok: r.ok, no: !r.ok, cls: r.ok ? 'ok' : '', sr: r.ok ? ', met' : ', not met' })),
        onChange: (e) => {
          if (cur.phase !== 'form' || locked) return;
          const val = e && e.target ? e.target.value : '';
          self.patch(id, { vals: { ...cur.vals, [key]: val }, banner: false });
        },
        onBlur: () => { if (v && !cur.touched[key]) self.patch(id, { touched: { ...cur.touched, [key]: true } }); }
      };
    });
    const termsBad = kind === 'register' && !cur.terms;
    const termsErr = termsBad && cur.sub;
    const LABELS = {
      login: ['Sign in', 'Signing in…'], register: ['Create account', 'Creating account…'], forgot: ['Send reset link', 'Sending…'],
      reset: ['Update password', 'Updating…'], accept: ['Join workspace', 'Joining…']
    }[kind];
    const TITLES = { login: ['Welcome back', ''], register: ['Create your account', ''], forgot: ['Reset your password', 'We’ll email you a link.'], reset: ['Set a new password', ''], accept: ['', ''] }[kind];
    const FOOT = { login: ['New to Lightex?', 'Create account', '#register'], register: ['Have an account?', 'Sign in', '#login'], forgot: ['', 'Back to sign in', '#login'], reset: null, accept: ['Not Taylor?', 'Sign in', '#login'] }[kind];
    const busy = cur.phase === 'busy';
    const submit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (cur.frozen || cur.phase !== 'form') return;
      const firstBad = fields.find((f) => f.err);
      if (firstBad || termsBad) {
        self.patch(id, { sub: true });
        const target = firstBad ? firstBad.fid : id + '-terms';
        setTimeout(() => { try { const el = typeof document !== 'undefined' && document.getElementById(target); if (el) el.focus(); } catch (x) {} }, 0);
        return;
      }
      self.patch(id, { phase: 'busy', sub: true });
      self.later(() => {
        if (kind === 'forgot') self.patch(id, { phase: 'done', cd: 30, resent: false });
        else if (kind === 'reset') self.patch(id, { phase: 'done' });
        else {
          self.patch(id, { phase: 'trans' });
          self.later(() => self.patch(id, { phase: 'app' }), 1300);
        }
      }, 900);
    };
    const showForm = cur.phase === 'form' || busy;
    const showSent = kind === 'forgot' && cur.phase === 'done';
    const showUpdated = kind === 'reset' && cur.phase === 'done';
    const footShow = !!FOOT && (showForm || showSent);
    return {
      id, anchor: def.anchor, caption: def.caption, meta: def.meta, w: def.phone ? 390 : 620, h: def.h,
      themeCls: def.light ? 't-light' : '', phCls: def.phone ? 'ph' : '',
      showMain: cur.phase !== 'trans' && cur.phase !== 'x',
      showForm, showSent, showUpdated,
      isAccept: kind === 'accept', showTitle: kind !== 'accept',
      title: TITLES[0], sub: TITLES[1], subShow: !!TITLES[1],
      showSSO: kind === 'login' || kind === 'register',
      sso: () => {},
      banner: !!cur.banner,
      fields,
      showTerms: kind === 'register', terms: !!cur.terms, termsInvalid: termsErr, termsErr,
      termsDesc: termsErr ? id + '-terms-err' : undefined,
      toggleTerms: () => { if (cur.phase === 'form') self.patch(id, { terms: !cur.terms }); },
      busy, btnLabel: busy ? LABELS[1] : LABELS[0],
      submit,
      email: cur.vals.email || '',
      cdActive: cur.cd > 0, cdDone: !(cur.cd > 0), cdText: '0:' + String(Math.max(0, cur.cd)).padStart(2, '0'),
      resent: !!cur.resent && cur.cd > 0,
      resend: () => { if (cur.cd > 0) return; self.patch(id, { cd: 30, resent: true }); },
      footShow, footText: FOOT ? FOOT[0] : '', footLink: FOOT ? FOOT[1] : '', footHref: FOOT ? FOOT[2] : '#login',
      showTrans: cur.phase === 'trans',
      showApp: cur.phase === 'app',
      showReplay: !!cur.replay,
      replay: () => { self.patch(id, { phase: 'x' }); setTimeout(() => self.patch(id, { phase: 'trans' }), 60); },
      signOut: () => self.reset(id)
    };
  }

  renderVals() {
    const theme = this.props.theme ?? 'navy';
