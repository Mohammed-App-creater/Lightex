.nb-who{position:relative;width:30px;height:30px}
.nb-badge{position:absolute;right:-5px;bottom:-4px;width:17px;height:17px;border-radius:50%;background:var(--surface);border:1px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center}
.nb-sys{width:30px;height:30px;border-radius:8px;background:var(--raised);border:1px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center}
.nb-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.nb-l1{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;line-height:17px;color:var(--text-2);white-space:nowrap;overflow:hidden}
.nb-l1 b{font-weight:600;color:var(--text);transition:color 200ms var(--ease)}
.nb-st{display:inline-flex;align-items:center;gap:5px;color:var(--text)}
.nb-st .tp-g{width:12px;height:12px}
.nb-l2{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;line-height:16px}
.nb-key{font-size:11.5px;color:var(--text-3);flex:none}
.nb-title{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color 200ms var(--ease)}
.nb-row.read .nb-l1 b{color:var(--text-2);font-weight:500}
.nb-row.read .nb-title{color:var(--text-2)}
.nb-time{font-size:11px;color:var(--text-3);transition:opacity 120ms var(--ease)}
.nb-act{position:absolute!important;right:10px;top:50%;margin-top:-15px;display:flex;gap:2px;padding:0;border-radius:8px;background:var(--hover);opacity:0;transform:translateX(4px);transition:opacity 120ms var(--ease),transform 160ms var(--ease);pointer-events:none!important;z-index:2!important}
.nb-row:hover .nb-act,.nb-row:focus-within .nb-act{opacity:1;transform:none;pointer-events:auto!important}
.nb-row.sel .nb-act{background:transparent}
.nb-row:hover .nb-time,.nb-row:focus-within .nb-time{opacity:0}
.nb-ib{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--text-2);cursor:pointer;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.nb-ib:hover{background:var(--raised);color:var(--text)}
.touch .nb-act{display:none}
.touch .nb-row{min-height:68px}
.touch .nb-tab{height:44px}
.nb-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;height:40px;padding:0 6px 0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);font-size:13px;white-space:nowrap;z-index:6;animation:toastin 220ms var(--ease)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.nb-center{height:100%;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.nb-center h3{margin:6px 0 0;font-size:15px;font-weight:600}
.nb-center p{margin:0 0 6px;font-size:13px;color:var(--text-3)}
.nb-emic{position:relative;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ok);animation:tppop 320ms var(--spring)}
.nb-emic::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--spark);box-shadow:0 -34px 0 var(--spark),30px -16px 0 var(--spark),30px 17px 0 var(--spark),0 34px 0 var(--spark),-30px 17px 0 var(--spark),-30px -16px 0 var(--spark);animation:tpspark 640ms var(--ease) 120ms both;pointer-events:none}
@keyframes tppop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes tpspark{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nb-erric{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--danger)}
.nb-skr{display:grid;grid-template-columns:12px 36px minmax(0,1fr) 28px;align-items:center;column-gap:10px;height:60px;padding:8px 14px 8px 10px}
/* preview panel */
.nb-pv{position:relative;flex:none;width:0;overflow:hidden;background:var(--surface);border-left:1px solid var(--line);transition:width 250ms var(--ease)}
.nb-pv.open{width:380px}
.nb-pvi{width:380px;height:100%;display:flex;flex-direction:column}
.nb-pv:not(.open) .nb-pvi{visibility:hidden;transition:visibility 0s 250ms}
.nb-pv.sheet{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:84%;border-left:0;border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;box-shadow:0 -16px 48px rgba(0,0,0,.4);transform:translateY(105%);transition:transform 280ms var(--ease);z-index:8}
.nb-pv.sheet.open{transform:none}
.nb-pv.sheet .nb-pvi{width:auto;height:auto}
.nb-pv.sheet .tp-grab{display:block}
.nb-scrim{position:absolute;inset:0;background:rgba(2,5,14,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:7;animation:fadein 200ms var(--ease)}
.nb-pvh{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px;border-bottom:1px solid var(--line)}
.nb-pvb{flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.nb-pvb h3{margin:0;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em}
.nb-ev{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:10px}
.nb-evh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.nb-evh b{color:var(--text);font-weight:600}
.nb-q{margin:0;font-size:13px;line-height:20px;color:var(--text)}
.nb-move{display:flex;align-items:center;gap:8px;font-size:12.5px}
.nb-pvf{flex:none;display:flex;align-items:center;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
/* settings shell (prefs) */
.st-nav{width:220px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.st-back{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;margin-bottom:10px;border-radius:7px;color:var(--text-2);text-decoration:none;font-weight:500}
.st-back:hover{background:var(--hover);color:var(--text)}
.st-sec{padding:12px 8px 6px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.st-it{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:7px;color:var(--text-2);font-weight:500;text-decoration:none;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.st-it:hover{background:var(--hover);color:var(--text)}
.st-it[aria-current=page]{background:var(--accent-s);color:var(--text)}
.st-it[aria-current=page] svg{color:var(--accent-t)}
.st-it.dng svg{color:var(--danger)}
.st-main{flex:1;min-width:0;overflow-y:auto}
.st-wrap{max-width:900px;padding:28px 40px 40px;display:flex;flex-direction:column;gap:20px}
.st-head{display:flex;align-items:center;gap:12px}
.st-head h2{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.st-saved{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);animation:fadein 160ms var(--ease)}
.pm{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pm-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,108px);align-items:stretch;border-top:1px solid var(--line)}
.pm-row:first-child{border-top:0}
.pm-hd{background:var(--bg)}
.pm-hc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:52px;padding:8px 6px;font-size:12px;font-weight:600;color:var(--text)}
.pm-hc.first{align-items:flex-start;padding-left:16px;color:var(--text-3);font-weight:500}
.pm-soon{font:500 9.5px/1 'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);border:1px dashed var(--line-2);border-radius:5px;padding:3px 5px;white-space:nowrap}
.pm-ev{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 16px;font-weight:500}
.pm-ic{width:26px;height:26px;border-radius:7px;background:var(--raised);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.pm-cell{display:flex;align-items:center;justify-content:center}
.pm-row>.soon{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--raised) 7px 8px)}
.pm-hc.soon{color:var(--text-3)}
.tg-soon{width:32px;height:18px;border-radius:9px;border:1px dashed var(--line-2);position:relative;opacity:.7;cursor:not-allowed}
.tg-soon::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--line-2)}
.pm-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.nb-tab:focus-visible,.nb-hit:focus-visible,.nb-ib:focus-visible,.btn:focus-visible,.tg:focus-visible,.seg button:focus-visible,.st-it:focus-visible,.st-back:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){
  .sb-host,.st-nav{display:none!important}
  .nb-pv.open{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:84%;border-radius:18px 18px 0 0;z-index:8}
  .nb-pv .nb-pvi{width:auto}
  .nb-hide-sm{display:none}
  .nb-row{min-height:68px}
  .nb-act{display:none!important}
  .st-wrap{padding:16px}
  .pm{overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;transition-duration:.001ms!important;transition-delay:0ms!important}.sk{animation:none}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:2700px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="mono" style="font-size:12px;color:var(--text-3);letter-spacing:.04em">SCREENS · NOTIFICATIONS</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Inbox</h1>
    </div>
    <div class="mono" style="display:flex;gap:16px;font-size:12px;color:var(--text-3)"><span>5 event types</span><span>E read / unread</span><span>⇧E mark all</span><span>In-app + Email live</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="6">
      <figure class="frame" style="grid-column:{{fx.col}};grid-row:{{fx.row}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">

          <sc-if value="{{fx.hasSb}}" hint-placeholder-val="{{false}}">
            <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="1">
              <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                  <input class="sb-sinp" type="search" placeholder="Search or jump…" autocomplete="off">
                  <span class="kbd">⌘K</span>
                </label>

                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}">
                  <button class="sb-new" type="button"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span style="flex:1;text-align:left">New task</span><span class="kbd">C</span></button>
                </sc-if>

                <div class="sb-scroll {{fr.maskCls}}">
                  <a class="sb-it {{fr.inboxOn}}" href="#inbox"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="lab">Inbox</span><sc-if value="{{fr.hasInbox}}" hint-placeholder-val="{{true}}"><span class="sb-unread" aria-label="{{fr.inbox}} unread">{{fr.inbox}}</span></sc-if></a>
                  <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}">
                    <a class="sb-it" href="#mine"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg><span class="lab">My tasks</span><span class="sb-count">7</span></a>
                  </sc-if>

                  <div class="sb-sec"><button class="sb-sect" type="button" aria-expanded="{{fr.pinOpen}}" sc-camel-on-click="{{fr.togglePin}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Pinned views</button></div>
                  <div class="sb-col {{fr.pinCls}}"><div>
                    <sc-for list="{{fr.pins}}" as="p" hint-placeholder-count="3">
                      <a class="sb-it" href="#view"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg><span class="lab">{{p.name}}</span><span class="sb-count">{{p.n}}</span></a>
                    </sc-for>
                  </div></div>

                  <div class="sb-sec {{fr.secCls}}">
                    <button class="sb-sect" type="button" aria-expanded="{{fr.projOpen}}" sc-camel-on-click="{{fr.toggleProjSec}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Projects<span style="color:var(--text-3);letter-spacing:0">{{fr.projCount}}</span></button>
                    <sc-if value="{{fr.canProj}}" hint-placeholder-val="{{true}}">
                      <span class="sb-tw"><button class="sb-icb sm" type="button" aria-label="New project"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New project</span></span>
                    </sc-if>
                  </div>
                  <div class="sb-col {{fr.projSecCls}}"><div>
                    <sc-if value="{{fr.showFilter}}" hint-placeholder-val="{{false}}">
                      <input class="sb-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" value="{{fr.filter}}" sc-camel-on-change="{{fr.onFilter}}">
                    </sc-if>
                    <sc-for list="{{fr.projects}}" as="pj" hint-placeholder-count="5">
                      <div>
                        <button class="sb-it {{pj.on}}" type="button" aria-expanded="{{pj.open}}" sc-camel-on-click="{{pj.toggle}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{pj.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{pj.hue}})">{{pj.badge}}</span>
                          <span class="lab">{{pj.name}}</span>
                          <svg class="sb-chev {{pj.chev}}" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                        </button>
                        <div class="sb-col {{pj.colCls}}"><div>
                          <div class="sb-subs" role="list">
                            <span class="sb-ind" style="transform:translateY({{pj.indY}}px);opacity:{{pj.indO}}"></span>
                            <sc-for list="{{pj.subs}}" as="s" hint-placeholder-count="6">
                              <button class="sb-si {{s.on}}" type="button" role="listitem" aria-current="{{s.cur}}" sc-camel-on-click="{{s.pick}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>{{s.name}}</button>
                            </sc-for>
                          </div>
                        </div></div>
                      </div>
                    </sc-for>
                    <sc-if value="{{fr.noMatch}}" hint-placeholder-val="{{false}}"><p style="margin:6px 8px;font-size:12px;color:var(--text-3)">No projects match.</p></sc-if>
                  </div></div>
                </div>

                <div class="sb-foot">

    const open = !!u.open && loaded;
    const pn = items.find((n) => n.id === u.sel) || items[0] || D.N[0];
    const pev = D.EV[pn.type];
    const pp = pn.who ? D.PEOPLE[pn.who] : null;
    const pst = D.ST[pn.st];
    const pfrom = pn.from ? D.ST[pn.from] : pst;
    const pUn = isUnread(pn, rm);
    const pv = {
      key: pn.key, title: pn.title, stGlyph: pn.st, stColor: pst[1], stName: pst[0],
      pri: pn.pri, priColor: D.PRI[pn.pri][1], priName: D.PRI[pn.pri][0],
      due: 'Due ' + pn.due, dueColor: pn.dueSoon ? 'var(--warn)' : 'var(--text-2)',
      hasActor: !!pp, system: !pp, ini: pn.who || '', hue: pp ? pp[1] : 0, icon: pev.icon, color: pev.color,
      actor: pp ? pp[0] : 'Due tomorrow', verb: pp ? (pn.type === 'status' ? 'changed status' : pev.verb) : 'Oct 8',
      time: pn.t + ' ago',
      hasQuote: !!pn.quote, isMention: pn.type === 'mention', quote: pn.quote || '',
      hasMove: pn.type === 'status', fromGlyph: pn.from || pn.st, fromColor: pfrom[1], fromName: pfrom[0],
      readLabel: pUn ? 'Mark read' : 'Mark unread'
    };
    const closePv = () => self.ibSet(id, { open: false });
    return {
      isInbox: true, isPrefs: false,
      touchCls: cfg.touch ? 'touch' : '', phone: !!cfg.phone, notPhone: !cfg.phone,
      unread, hasUnread: unread > 0,
      showMarkAll: unread > 0, allRead: loaded && items.length > 0 && unread === 0,
      markAll,
      mainKey: (e) => {
        if (e.shiftKey && (e.key === 'E' || e.key === 'e')) { e.preventDefault(); markAll(); }
        else if (e.key === 'Escape' && self.ibGet(id).open) closePv();
      },
      tabs, tabW, indX: tIdx * tabW,
      isReady: loaded && list.length > 0, isEmpty: loaded && list.length === 0,
      isLoading: phase === 'loading', isError: phase === 'error',
      groups,
      skRows: [{ w1: 46, w2: 70, dot: 1, r: '50%' }, { w1: 38, w2: 58, dot: 1, r: '50%' }, { w1: 52, w2: 64, dot: 0, r: '50%' }, { w1: 30, w2: 74, dot: 1, r: '8px' }, { w1: 44, w2: 52, dot: 0, r: '50%' }, { w1: 36, w2: 66, dot: 0, r: '50%' }],
      retry: () => { self.ibSet(id, { phase: 'loading' }); self.later(() => self.ibSet(id, { phase: 'ready' }), 1100); },
      toast: !!u.toast, toastText: (u.toast || 0) + ' marked read',
      undo: () => self.ibSet(id, { read: self.ibGet(id).undo || {}, toast: 0 }),
      pv, pvCls: (mode === 'sheet' ? 'sheet ' : '') + (open ? 'open' : ''), pvHidden: open ? 'false' : 'true',
      sheetOpen: mode === 'sheet' && open,
      closePv,
      pvKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); closePv(); } },
      pvToggleRead: () => setRead(pn.id, pUn)
    };
  }
  prefFrame() {
    const self = this;
    const D = this.data();
    const DEF = { assigned: [1, 1], mention: [1, 1], status: [1, 0], comment: [1, 0], due: [1, 1], sprint: [1, 0] };
    const pref = this.state.pref || {};
    const val = (k, c) => (pref[k + '.' + c] === undefined ? !!DEF[k][c] : pref[k + '.' + c]);
    const COLS = [['In-app', false], ['Email', false], ['Telegram', true], ['SMS', true], ['Push', true]];
    const save = () => {
      const tok = Date.now() + Math.random();
      self.setState({ prefSave: 'saving', prefTok: tok });
      self.later(() => { if (self.state.prefTok === tok) self.setState({ prefSave: 'saved' }); }, 550);
      self.later(() => { if (self.state.prefTok === tok) self.setState({ prefSave: '' }); }, 2600);
    };
    const prefRows = ['assigned', 'mention', 'status', 'comment', 'due', 'sprint'].map((k) => ({
      name: D.EV[k].name, icon: D.EV[k].icon, color: D.EV[k].color,
      cells: COLS.map(([cn, soon], c) => ({
        live: !soon, soon, cls: soon ? 'soon' : '',
        on: soon ? false : val(k, c),
        aria: D.EV[k].name + ', ' + cn,
        toggle: () => { const p = { ...(self.state.pref || {}) }; p[k + '.' + c] = !val(k, c); self.setState({ pref: p, prefSave: 'saving', prefTok: 0 }); save(); }
      }))
    }));
    const dg = this.state.digest || 'instant';
    return {
      isInbox: false, isPrefs: true,
      cols: COLS.map(([name, soon]) => ({ name, soon, cls: soon ? 'soon' : '' })),
      prefRows,
      saving: this.state.prefSave === 'saving', saved: this.state.prefSave === 'saved',
      digest: [['instant', 'Instant'], ['hourly', 'Hourly'], ['daily', 'Daily']].map(([k, name]) => ({ name, on: dg === k, pick: () => { self.setState({ digest: k }); save(); } }))
    };
  }
  renderVals() {
    const theme = this.props.theme || 'navy';
    const D = this.data();
    const ibA = this.ibFrame('A', { items: D.N, tabW: 112 });
    const sbA = { ...this.sbFrame('A', { role: 'admin', collapsible: true, active: 'PR', sub: 'none' }), inbox: ibA.unread, hasInbox: ibA.unread > 0, inboxOn: 'on' };
    const frames = [
      { ...ibA, label: 'Inbox', meta: 'click a row · hover for actions · ⇧E', col: '1 / 4', row: '1', w: 1280, h: 820, r: 14, hasSb: true, sbFrames: [sbA] },
      { ...this.prefFrame(), label: 'Notification preferences', meta: 'autosaves · 3 channels coming soon', col: '1 / 4', row: '2', w: 1280, h: 560, r: 14, hasSb: false, sbFrames: [] },
      { ...this.ibFrame('M', { items: D.N, tabW: 121, touch: true, phone: true, sheet: true }), label: 'Mobile', meta: '390 · tap opens sheet', col: '1', row: '3 / 5', w: 390, h: 844, r: 28, hasSb: false, sbFrames: [] },
      { ...this.ibFrame('E', { items: [], tabW: 112 }), label: 'Empty inbox', meta: 'all caught up', col: '2 / 4', row: '3', w: 840, h: 360, r: 14, hasSb: false, sbFrames: [] },
      { ...this.ibFrame('L', { items: D.N, tabW: 112, phase: 'loading', sheet: true }), label: 'Loading', meta: 'skeleton', col: '2', row: '4', w: 400, h: 432, r: 14, hasSb: false, sbFrames: [] },
      { ...this.ibFrame('R', { items: D.N, tabW: 112, phase: 'error', sheet: true }), label: 'Error', meta: 'Retry works', col: '3', row: '4', w: 400, h: 432, r: 14, hasSb: false, sbFrames: [] }
    ];
    const noop = () => {};
    const BASE = { cols: [], digest: [], prefRows: [], saved: false, saving: false, tabs: [], groups: [], skRows: [], pv: {}, unread: 0, hasUnread: false, showMarkAll: false, allRead: false, markAll: noop, mainKey: noop, closePv: noop, pvKey: noop, pvToggleRead: noop, retry: noop, undo: noop, isReady: false, isEmpty: false, isLoading: false, isError: false, phone: false, notPhone: true, sheetOpen: false, toast: false, toastText: '', touchCls: '', pvCls: '', pvHidden: 'true', tabW: 112, indX: 0 };
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      frames: frames.map((f) => ({ ...BASE, ...f }))
    };
  }
}
