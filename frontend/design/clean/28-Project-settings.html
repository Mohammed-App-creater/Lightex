/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;font:500 13px/1 'Inter',system-ui,sans-serif;border:1px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none;background:transparent;color:var(--text-2);transition:background-color 120ms var(--ease),border-color 120ms var(--ease),box-shadow 120ms var(--ease),transform 120ms var(--ease),color 120ms var(--ease)}

.tp-g.review{border:1.5px solid currentColor;padding:2px;background:conic-gradient(currentColor 0 270deg,transparent 0) content-box}
.tp-g.done{background:currentColor}
.tp-g.done::after{content:"";position:absolute;left:4px;top:2px;width:3px;height:6px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.tp-g.fx{animation:tppop 240ms var(--spring)}
.tp-g.cancel{border:1.5px solid currentColor}

/* shell */

.ps-tab:hover{color:var(--text)}
.ps-tab[aria-selected=true]{color:var(--text)}
.ps-tab .n{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.touch .ps-tab{height:46px}
.ps-ind{position:absolute;left:0;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--accent-t);transition:transform 260ms var(--spring),width 220ms var(--ease);pointer-events:none}
.ps-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

.ps-anch{position:relative;display:inline-flex}

.mb-rt{display:flex;flex-direction:column;gap:3px;padding-left:2px;font-size:12.5px;font-weight:500}

.ps-menu{position:absolute;z-index:40;min-width:220px;padding:4px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);animation:pspop 150ms var(--ease)}
.ps-mi{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text);font:500 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left}

.btn:focus-visible,.ps-ib:focus-visible,.ps-tab:focus-visible,.ps-sw:focus-visible,.ps-add:focus-visible,.wf-h:focus-visible,.wf-name:focus-visible,.wf-ib:focus-visible,.ps-cs:focus-visible,.mb-role:focus-visible,.ps-mi:focus-visible,.ps-link:focus-visible,.ps-opt:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}

      newC: lbNew ? colOf(lbNew.col) : '', newColName: lbNew ? lbNew.col : '', newColorOpen, newPopCls: newColorOpen ? 'popon' : '',
      newColors: K.COLORS.map(([cn, cv]) => ({ name: cn, c: cv, on: !!lbNew && lbNew.col === cn, pick: () => set({ lbNew: { ...g().lbNew, col: cn }, pop: null }) })),
      toggleNewColor: () => set({ pop: newColorOpen ? null : { kind: 'ncolor' } }),
      openNew: () => set({ lbNew: { name: '', col: nextCol(), sub: false }, pop: null, edit: null }),
      closeNew: () => set({ lbNew: null, pop: null }),
      onNewName: (e) => set({ lbNew: { ...g().lbNew, name: String(e.target.value || '').slice(0, 24) } }),
      newKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); createLb(); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); set({ lbNew: null, pop: null }); } },
      createLb, labels: lbRows,
      // members
      nTasks: statuses.reduce((a, x) => a + (x.n || 0), 0),
      mbCount: members.length, members: mbRows, addOpen, addQ, addAf: addOpen && !pop.seed,
      toggleAdd: () => set({ pop: addOpen ? null : { kind: 'add', q: '' } }),
      onAddQ: (e) => set({ pop: { ...g().pop, kind: 'add', q: String(e.target.value || '').slice(0, 40) } }),
      addKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); if (poolRaw[0]) addOne(poolRaw[0]); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeAll(); } },
      pool: poolRaw.map((p) => ({ ...p, add: () => addOne(p) })),
      poolNone: poolRaw.length === 0, poolNoneText: poolAll.length ? 'No matches' : 'Everyone’s already in',
      // overlays
      popOpen: !!pop, closePop: closeAll,
      rootKey: (e) => {
        if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(); return; }
        if (e.key === 'Escape') { const v = g(); if (v.pop) { e.preventDefault(); set({ pop: null }); } else if (v.lbNew) set({ lbNew: null }); }
      },
      toastOn, toastText: toastOn ? u.toast.text : '', toastUndo: toastOn && !!u.toast.undo,
      undo: () => { const t = g().toast; if (t && t.undo) set({ ...t.undo, toast: null, live: 'Undone' }); },
      live: u.live || '',
      // dialogs
      dlgArchive: !!dlg && dlg.kind === 'archive', dlgPdel: !!dlg && dlg.kind === 'pdel', dlgSdel: !!sd, dlgLdel: !!ld,
      closeDlg, scrimClick: (e) => { if (e && e.target === e.currentTarget) closeDlg(); },
      dlgKey: (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); closeDlg(); }
        else if (e.key === 'Enter' && dlg && dlg.kind === 'pdel') { e.preventDefault(); confirmPdel(); }
      },
      pdText, pdAf: !!dlg && !dlg.seed, onPdText: (e) => set({ dlg: { ...g().dlg, text: String(e.target.value || '').toUpperCase().slice(0, 8) } }),
      whyText: why[0], whyCls: why[1], pdInpCls: why[1] === 'err' ? 'err' : '',
      pdBlocked: !pdMatch || !!(dlg && dlg.busy), pdBusy: !!(dlg && dlg.busy), confirmPdel,
      sdName: sd ? sd.name : '', sdGlyph: sd ? glyphOf(sd.cat) : 'todo', sdC: sd ? colOf(sd.col) : '',
      sdHasTasks: !!sd && sd.n > 0, sdNoTasks: !!sd && !sd.n, sdCount: sd ? sd.n + (sd.n === 1 ? ' task' : ' tasks') : '',
      sdTargets, sdKey, confirmSdel, sdBtn: sd && sd.n ? 'Delete & move' : 'Delete status',
      ldName: ld ? ld.name : '', ldC: ld ? colOf(ld.col) : '', ldUsed: !!ld && ld.n > 0, ldCount: ld ? ld.n + (ld.n === 1 ? ' task' : ' tasks') : '', confirmLdel
    };
  }
  renderVals() {
    const theme = this.props.theme || 'navy';
    const role = this.props.role || 'admin';
    const prole = role === 'admin' ? 'admin' : role === 'member' ? 'contrib' : 'observer';
    const frames = [
      this.frame('main', { label: 'Project settings', meta: 'role tweak · drag ⠿ or Alt+↑↓ · ⌘S', gc: '1 / 4', gr: '1', w: 1280, h: 860, sb: true, wsRole: role, prole, tab: 'general' }),
      this.frame('wd', { label: 'Workflow · delete status', meta: 'choose where 4 tasks go', gc: '1 / 3', gr: '2', w: 840, h: 640, prole: 'admin', tab: 'workflow', init: { dlg: { kind: 'sdel', id: 's4', to: 's3' } } }),
      this.frame('mob', { label: 'Mobile', meta: '390 · touch drag', gc: '3', gr: '2 / 4', w: 390, h: 844, r: 28, narrow: true, touch: true, prole: 'admin', tab: 'workflow' }),
      this.frame('lb', { label: 'Labels', meta: 'click name to rename · dot to recolor', gc: '1 / 3', gr: '3', w: 840, h: 600, prole: 'admin', tab: 'labels', init: { pop: { kind: 'lcolor', id: 'l3' } } }),
      this.frame('mb', { label: 'Members', meta: 'project roles · add picker', gc: '1 / 3', gr: '4', w: 840, h: 600, prole: 'admin', tab: 'members', init: { pop: { kind: 'add', q: '', seed: true } } }),
      this.frame('ld', { label: 'Loading', meta: 'skeleton', gc: '3', gr: '4', w: 400, h: 600, narrow: true, phase: 'loading' }),
      this.frame('ro', { label: 'Read-only · Observer', meta: 'text values · no danger zone', gc: '1 / 3', gr: '5', w: 840, h: 640, prole: 'observer', tab: 'general' }),
      this.frame('er', { label: 'Error', meta: 'retry', gc: '3', gr: '5', w: 400, h: 400, narrow: true, phase: 'error' }),
      this.frame('em', { label: 'Empty · labels', meta: 'first label', gc: '1', gr: '6', w: 400, h: 500, narrow: true, prole: 'admin', tab: 'labels', noLabels: true }),
      this.frame('pd', { label: 'Delete project', meta: 'type PRJ to unlock', gc: '2 / 4', gr: '6', w: 840, h: 500, prole: 'admin', tab: 'general', init: { dlg: { kind: 'pdel', text: 'PR', seed: true } } })
    ];
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      frames
    };
  }
}
</script>
