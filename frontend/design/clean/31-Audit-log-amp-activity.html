.au-c{min-width:0;padding:0 8px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
.au-c .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.au-time{font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-2)}
.au-key{font:500 12px/1 'JetBrains Mono',monospace;color:var(--text);flex:none}
.au-nm{color:var(--text-2)}
.au-src{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.au-src.api{color:var(--info)}
.au-act{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.au-act svg{flex:none}
.au-chev{width:24px;height:24px;margin-left:2px;border:0;border-radius:5px;background:transparent;color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.au-chev:hover{background:var(--hover);color:var(--text)}
.au-chev svg{transition:transform 220ms var(--ease)}
.au-chev[aria-expanded=true] svg{transform:rotate(90deg);color:var(--accent-t)}
.au-col{display:grid;grid-template-rows:0fr;transition:grid-template-rows 260ms var(--ease)}
.au-col.open{grid-template-rows:1fr}
.au-col>div{overflow:hidden;min-height:0;visibility:hidden;opacity:0;transition:opacity 200ms var(--ease),visibility 0s 260ms}
.au-col.open>div{visibility:visible;opacity:1;transition-delay:0s}
.au-xp{margin:2px 12px 12px 36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.au-dh,.au-dr{display:grid;grid-template-columns:128px minmax(0,1fr) minmax(0,1fr)}
.au-dh{height:28px;align-items:center;border-bottom:1px solid var(--line);font:500 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.au-dh span{padding:0 10px}
.au-dr+.au-dr{border-top:1px solid var(--line)}
.au-df{padding:8px 10px;color:var(--text-3);font-weight:500;font-size:12.5px;line-height:20px}
.au-dv{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;min-width:0;line-height:20px;border-left:1px solid var(--line)}
.au-dv .tx{min-width:0;overflow-wrap:anywhere}
.au-dv .tp-g,.au-dv .tp-bars,.au-dv .tp-av{margin-top:3px}
.au-dv.old{background:var(--danger-s);color:var(--text-2)}
.au-dv.old .tx{text-decoration:line-through;text-decoration-color:var(--danger)}
.au-dv.new{background:var(--ok-s)}
.au-dv.none{color:var(--text-3)}
.au-wd{grid-column:span 2;padding:8px 10px;line-height:21px;white-space:pre-wrap;overflow-wrap:anywhere;border-left:1px solid var(--line)}
.w-del{background:var(--danger-s);color:var(--danger);text-decoration:line-through;border-radius:3px;padding:1px 0}
.w-ins{background:var(--ok-s);color:var(--ok);border-radius:3px;padding:1px 0}
.au-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:7px 10px;border-top:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--text-3)}
.au-meta code{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2)}
.au-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
.au-pg{flex:none;height:44px;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;border-top:1px solid var(--line)}
/* states */
.au-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.au-state h3{margin:0;font-size:15px;font-weight:600}
.au-lock{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.sk{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 45%,var(--raised) 90%);background-size:240% 100%;animation:shim 1.4s linear infinite;flex:none}
.sk.ci{width:20px;height:20px;border-radius:50%}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
/* menus + toast */
.au-catch{position:absolute;inset:0;z-index:55}
.au-menu{position:absolute;z-index:60;max-height:340px;overflow-y:auto;padding:4px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);animation:aupop 150ms var(--ease);scrollbar-width:thin}
@keyframes aupop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.au-mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text);font:500 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left;white-space:nowrap}
.au-mi:hover,.au-mi:focus-visible{background:var(--hover)}
.au-mi.on{background:var(--accent-s)}
.au-mi.sep{margin-top:5px;position:relative}
.au-mi.sep::before{content:"";position:absolute;left:-4px;right:-4px;top:-3px;height:1px;background:var(--line)}
.au-mi svg.ic{flex:none}
.au-mm{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.au-ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--control);display:grid;place-content:center;flex:none}
.au-ck.on{background:var(--accent);border-color:var(--accent)}
.au-ck.on::after{content:"";width:7px;height:3.5px;border:solid #fff;border-width:0 0 1.8px 1.8px;transform:rotate(-45deg);margin-top:-2px}
.au-toast{position:absolute;bottom:58px;z-index:50;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);height:38px;padding:0 6px 0 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font-weight:500;white-space:nowrap;animation:autoast 220ms var(--ease)}
.au-toast .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
@keyframes autoast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.au-spin{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);border-top-color:var(--accent-t);animation:auspin 700ms linear infinite;flex:none;display:inline-block}
@keyframes auspin{to{transform:rotate(360deg)}}
/* activity feed */
.af-wrap{position:absolute;inset:0;padding:16px;background:var(--bg);display:flex;flex-direction:column}
.af{flex:1;min-height:0;display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.af-h{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px 0 16px;flex:none}
.af-h h3{margin:0;font-size:13.5px;font-weight:600}
.af-chips{display:flex;gap:6px;padding:0 14px 12px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.af-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font:500 12.5px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;transition:background-color 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease)}
.af-chip:hover{color:var(--text);border-color:var(--control)}
.af-chip[aria-pressed=true]{background:var(--accent-s);border-color:transparent;color:var(--accent-t)}
.af-chip b{font:500 11px/1 'JetBrains Mono',monospace;opacity:.8}
.af-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.af-day{position:sticky;top:-4px;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 0 8px;background:var(--surface);font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.af-day::after{content:"";flex:1;height:1px;background:var(--line)}
.af-list{list-style:none;margin:0;padding:0;position:relative}
.af-list::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:1px;background:var(--line-2)}
.af-it{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:6px 0;animation:afin 220ms var(--ease) both}
@keyframes afin{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.af-it .tp-av{box-shadow:0 0 0 3px var(--surface);position:relative}
.af-s{font-size:13px;line-height:20px;color:var(--text-2);min-width:0}
.af-s b{color:var(--text);font-weight:600}
.af-s .k{font:500 12px/1 'JetBrains Mono',monospace;color:var(--text);padding:2px 5px;border-radius:4px;background:var(--raised);border:1px solid var(--line)}
.af-s .st{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:500;vertical-align:-2px}
.af-q{display:block;margin-top:4px;padding:6px 10px;border-radius:7px;border-left:2px solid var(--line-2);background:var(--bg);color:var(--text-2);font-size:12.5px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af-t{font:500 11.5px/20px 'JetBrains Mono',monospace;color:var(--text-3)}
.af-more{display:flex;justify-content:center;padding:8px 0 4px}
.af-empty{padding:28px 0;text-align:center;color:var(--text-3)}
/* phone */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.ph-sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 14px/1 'Inter',sans-serif}
.ph-top{height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid var(--line)}
.ph-ib{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--text-2);cursor:pointer}
.ph-ib:hover,.ph-ib[aria-expanded=true]{background:var(--hover);color:var(--text)}
.ph-chips{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.ph-chips .au-fbtn{height:34px;border-radius:17px;padding:0 12px}
.ph-scroll{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 40px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.ph-card{border-radius:10px;border:1px solid var(--line);background:var(--surface);overflow:hidden;flex:none}
.ph-cb{display:flex;flex-direction:column;gap:7px;width:100%;padding:11px 12px;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.ph-r{display:flex;align-items:center;gap:8px;min-width:0}
.ph-dl{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.ph-dl .au-dv{border-left:0;border-radius:6px;padding:6px 8px}
.ph-dl .au-wd{border-left:0;padding:6px 8px;border-radius:6px;background:var(--bg)}
.ph-fl{font:500 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-top:4px}
.ph-home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text-3);opacity:.5;z-index:60}
.au-btn:focus-visible,.au-fbtn:focus-visible,.au-ib:focus-visible,.au-link:focus-visible,.au-chev:focus-visible,.au-mi:focus-visible,.af-chip:focus-visible,.ph-ib:focus-visible,.ph-cb:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){
  .sb-host{display:none!important}
  .au-tbl{--cols:28px 92px minmax(0,1fr) 120px!important;min-width:0}
  .au-tbl .c-ent,.au-tbl .c-src{display:none}
  .au-xp{margin-left:12px}
  .au-dh,.au-dr{grid-template-columns:92px minmax(0,1fr) minmax(0,1fr)}
  .au-mi,.au-fbtn{min-height:40px}
}
@media (prefers-reduced-motion:reduce){.au *,.af *,.ph *,.au-menu,.au-toast,.au-col,.au-col>div,.sk,.au-spin{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:3200px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · ADMIN</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Audit log</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>admins only</span><span>field-level diff</span><span>CSV · JSON</span><span>activity feed</span></div>
  </header>

  <div style="display:flex;flex-direction:column;gap:40px">
    <sc-for list="{{rows}}" as="rx" hint-placeholder-count="4">
      <div style="display:flex;gap:40px;align-items:flex-start">
        <sc-for list="{{rx.cols}}" as="cx" hint-placeholder-count="2">
          <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
            <sc-for list="{{cx.frames}}" as="fx" hint-placeholder-count="1">
              <figure class="frame">
                <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
                <div class="dev" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">

                  <sc-if value="{{fx.desk}}" hint-placeholder-val="{{true}}">
                    <div class="app" sc-camel-on-key-down="{{fx.appKey}}">
                      <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="1">
                        <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                  <input class="sb-sinp" type="search" placeholder="Search or jump…" autocomplete="off">
                  <span class="kbd">⌘K</span>
                </label>

                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}">
                  <button class="sb-new" type="button"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span style="flex:1;text-align:left">New task</span><span class="kbd">C</span></button>
                </sc-if>

                <div class="sb-scroll {{fr.maskCls}}">
                  <a class="sb-it" href="#inbox"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="lab">Inbox</span><span class="sb-unread" aria-label="{{fr.inbox}} unread">{{fr.inbox}}</span></a>
                  <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}">
                    <a class="sb-it" href="#mine"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg><span class="lab">My tasks</span><span class="sb-count">7</span></a>
                  </sc-if>

                  <div class="sb-sec"><button class="sb-sect" type="button" aria-expanded="{{fr.pinOpen}}" sc-camel-on-click="{{fr.togglePin}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Pinned views</button></div>
                  <div class="sb-col {{fr.pinCls}}"><div>
                    <sc-for list="{{fr.pins}}" as="p" hint-placeholder-count="3">
                      <a class="sb-it" href="#view"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg><span class="lab">{{p.name}}</span><span class="sb-count">{{p.n}}</span></a>
                    </sc-for>
                  </div></div>

                  <div class="sb-sec {{fr.secCls}}">
                    <button class="sb-sect" type="button" aria-expanded="{{fr.projOpen}}" sc-camel-on-click="{{fr.toggleProjSec}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Projects<span style="color:var(--text-3);letter-spacing:0">{{fr.projCount}}</span></button>
                    <sc-if value="{{fr.canProj}}" hint-placeholder-val="{{true}}">
                      <span class="sb-tw"><button class="sb-icb sm" type="button" aria-label="New project"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New project</span></span>
                    </sc-if>
                  </div>
                  <div class="sb-col {{fr.projSecCls}}"><div>
                    <sc-if value="{{fr.showFilter}}" hint-placeholder-val="{{false}}">
                      <input class="sb-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" value="{{fr.filter}}" sc-camel-on-change="{{fr.onFilter}}">
                    </sc-if>
                    <sc-for list="{{fr.projects}}" as="pj" hint-placeholder-count="5">

<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;navy&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;member&quot;,&quot;viewer&quot;],&quot;default&quot;:&quot;admin&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3200}}">
class Component extends DCLogic {
  state = { sb: {}, fr: {} };
  //SB-JS-START
  sbGet(id) { return (this.state.sb && this.state.sb[id]) || {}; }
  sbSet(id, patch) { const all = { ...(this.state.sb || {}) }; all[id] = { ...(all[id] || {}), ...patch }; this.setState({ sb: all }); }
  sbFrame(id, cfg) {
    const self = this;
    const u = this.sbGet(id);
    const role = cfg.role || 'admin';
    const viewer = role === 'viewer';
    const ICON = {
      board: 'M2.5 3h3v10h-3zM6.5 3h3v7h-3zM10.5 3h3v5h-3z',
      backlog: 'M2.5 4h11M2.5 8h11M2.5 12h7',
      sprints: 'M12.5 6.5A4.8 4.8 0 004 5M3.5 9.5A4.8 4.8 0 0012 11M3.8 2.8v2.4h2.4M12.2 13.2v-2.4H9.8',
      objectives: 'M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM8 5.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z',
      milestones: 'M4 14V2.5h7.5L10 5.5l1.5 3H4',
      reports: 'M3 13V8M6.5 13V4M10 13V9.5M13.5 13V6'
    };
    const SUBS = [['board', 'Board'], ['backlog', 'Backlog'], ['sprints', 'Sprints'], ['objectives', 'Objectives'], ['milestones', 'Milestones'], ['reports', 'Reports']]
      .filter((s) => !viewer || ['board', 'backlog', 'objectives', 'milestones'].indexOf(s[0]) >= 0);
    const ALL = [
      ['PR', 'Platform Rebuild', 255], ['MO', 'Mobile App', 175], ['IN', 'Infra', 75], ['DS', 'Design System', 300], ['AP', 'Public API', 25],
      ['BI', 'Billing', 140], ['SE', 'Search', 215], ['ON', 'Onboarding', 335], ['DA', 'Data Pipeline', 100], ['QA', 'QA Automation', 50],
      ['SC', 'Security', 5], ['DO', 'Docs', 230], ['GR', 'Growth', 155], ['MK', 'Marketing Site', 285], ['PE', 'Performance', 195], ['AN', 'Analytics', 60]
    ];
    const list = cfg.many ? ALL : (viewer ? ALL.slice(0, 3) : ALL.slice(0, 5));
    const active = u.active || cfg.active || 'PR';
    const openKey = u.open === undefined ? active : u.open;
    const sub = u.sub || cfg.sub || 'board';
    const filter = u.filter || '';

  core(fid, cfg) {

        diffs: e.diffs.map((d) => self.diffView(d)),
        copyReq: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); try { if (navigator.clipboard) navigator.clipboard.writeText(e.req); } catch (err) {} set({ ...self.toastP(fid, { ok: true, text: 'Copied ' + e.req }), live: 'Request id copied' }); }

      vals: {

        hasActors: actorP.length > 0, noActors: actorP.length === 0,

        entityLabel: entity === 'any' ? 'Entity' : K.ENT[entity][0], entIcon: entity === 'any' ? K.IC.project : K.ENT[entity][1], fEntCls: entity === 'any' ? '' : 'on', fEntOpen: pk === 'entity',
        rangeLabel: rg[1], fRangeCls: range === '30d' ? '' : 'on', fRangeOpen: pk === 'range',

        popTop: popOpen ? pop.top : 0, popLeft: popOpen ? pop.left : 0, popW: popOpen ? pop.w : 200,
        closePop: () => set({ pop: null }), popKey: self.popKey(fid),
        toastOn: !!t, toastText: t ? t.text : '', toastOk: !!t && !!t.ok, toastBusy: !!t && !!t.busy, toastDl: !!t && !!t.ex, dlHref, dlName,
        live: u.live || '',

  }
  build(fid, cfg) {
    const self = this;
    const role = cfg.role;

    const total = c.list.length;

      desk: true, feed: false, phone: false, sbFrames,

      noPerm: !admin, showExport: ready,
      reqDone: !!u.req, reqLabel: u.req ? 'Requested' : 'Request access',

  buildFeed(fid, cfg) {

}
