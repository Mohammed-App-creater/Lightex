.ig-pickf{display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ig-none{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 0;color:var(--text-3)}
.ig-p{margin:0;font-size:13px;color:var(--text-2)}
/* development section */
.dv-g{display:flex;align-items:center;gap:7px;margin:12px 0 4px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.dv-g:first-of-type{margin-top:2px}
.dv-row{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;margin:0 -8px;border-radius:6px;transition:background-color 120ms var(--ease)}
.dv-row:hover{background:var(--hover)}
.dv-st{display:inline-flex;align-items:center;gap:5px;height:22px;width:78px;padding:0 6px;border-radius:11px;font-size:11.5px;font-weight:600;flex:none;background:color-mix(in oklab,currentColor 14%,transparent)}
.dv-st.draft svg{stroke-dasharray:2 1.6}
.dv-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-num{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3);flex:none}
.dv-ck{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px 0 6px;border-radius:6px;border:1px solid var(--line);background:transparent;font:600 11.5px/1 'Inter',sans-serif;cursor:pointer;flex:none;transition:background-color 120ms var(--ease),border-color 120ms var(--ease)}
.dv-ck:hover,.dv-ck[aria-expanded=true]{background:var(--raised);border-color:var(--line-2)}
.pass{color:var(--ok)}.fail{color:var(--danger)}.run{color:var(--warn)}
.dv-gl{width:12px!important;height:12px!important;padding:1.5px!important}
.dv-cks{margin:0 0 6px 30px;padding:4px 0 4px 12px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px;animation:fadein 160ms var(--ease)}
.dv-cki{display:flex;align-items:center;gap:8px;height:24px;font-size:12px}
.dv-cki .mono{color:var(--text);font-size:12px}
.dv-ckl{font-size:11.5px;font-weight:600}
.dv-mono{font:500 12.5px/1.3 'JetBrains Mono',monospace}
.dv-sha{font:500 12px/1 'JetBrains Mono',monospace;color:var(--accent-t);flex:none;width:58px}
.dv-ts{font-size:11.5px;color:var(--text-3);flex:none;white-space:nowrap}
.dv-flash{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);animation:fadein 160ms var(--ease)}
.dv-new{width:320px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dv-inrow{display:flex;align-items:center;gap:6px}
.dv-in{flex:1;min-width:0;height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-s);background:var(--surface);color:var(--text);font:500 12.5px/1 'JetBrains Mono',monospace}
.dv-in:focus{outline:none}
.dv-sel{flex:1;height:28px;padding:0 8px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:500 12px/1 'JetBrains Mono',monospace}
.dv-from{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3);white-space:nowrap}
.dv-empty{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:14px;border:1px dashed var(--line-2);border-radius:10px}
.dv-fresh{animation:dvin 320ms var(--ease)}
@keyframes dvin{from{opacity:0;transform:translateY(-4px);background:var(--accent-s)}to{opacity:1;transform:none}}
.dv-sk{display:flex;flex-direction:column;gap:4px}
.dv-sk>div{display:flex;align-items:center;gap:10px;height:36px}
.dv-ck:focus-visible,.dv-sel:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
/* board cards */
.bd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:16px;width:100%;align-content:start}
.bd-col{display:flex;flex-direction:column;gap:8px;min-width:0;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.bd-ch{display:flex;align-items:center;gap:8px;height:26px;padding:0 4px;font-weight:600;font-size:12.5px}
.bd-ch .mono{font-size:11px;color:var(--text-3);font-weight:500}
.bd-card{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg);transition:border-color 120ms var(--ease),transform 160ms var(--spring)}
.bd-card:hover{border-color:var(--control);transform:translateY(-1px)}
.bd-top{display:flex;align-items:center;gap:8px}
.bd-key{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.bd-t{font-size:13px;font-weight:500;line-height:18px}
.bd-f{display:flex;align-items:center;gap:8px;min-height:22px}
.pr-ind{position:relative;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 6px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);font:500 11.5px/1 'Inter',sans-serif;color:var(--text-2);cursor:default}
.pr-ind .mono{font-size:11px}
.pr-st{display:inline-flex;align-items:center;gap:4px;padding-left:6px;margin-left:1px;border-left:1px solid var(--line-2);font-weight:600}
.pr-ind.open{color:var(--ok)}.pr-ind.merged{color:var(--info)}.pr-ind.fail{color:var(--danger)}
.pr-ind .mono{color:var(--text-2)}
.pr-tip{position:absolute;left:-1px;bottom:calc(100% + 6px);padding:6px 8px;border-radius:6px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);color:var(--text);font-size:12px;font-weight:500;white-space:nowrap;opacity:0;transform:translateY(3px);pointer-events:none;transition:opacity 120ms var(--ease),transform 150ms var(--ease);z-index:5}
.pr-ind:hover .pr-tip,.pr-ind:focus-visible .pr-tip{opacity:1;transform:none}
.pr-ind:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){.ig-provs{grid-template-columns:minmax(0,1fr)}.ig-acts{margin-left:0;width:100%}.bd{grid-template-columns:minmax(0,1fr)}.ig-gsel{width:100%}}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.sk{animation:none}}
/*TP-CSS-START*/
.tp{position:absolute;top:0;right:0;bottom:0;width:520px;max-width:100%;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow-modal);z-index:5;transition:width 250ms var(--ease)}
.tp.full{width:100%;border-left:0;box-shadow:none}
.tp.static{position:absolute;inset:0;width:auto;box-shadow:none;border-left:0}
.tp.leaving{animation:tpout 160ms var(--ease) forwards}
.tp.sheet{top:auto;left:0;right:0;bottom:0;width:auto;height:88%;border-left:0;border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;box-shadow:0 -16px 48px rgba(0,0,0,.45);animation:tpsheet 280ms var(--ease)}
@keyframes tpout{to{opacity:0;transform:translateX(24px)}}
@keyframes tpsheet{from{transform:translateY(100%)}to{transform:none}}
.tp-fade{animation:tpfade 160ms var(--ease)}
@keyframes tpfade{from{opacity:0}to{opacity:1}}
.tp-grab{display:none;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0;flex:none}
.sheet .tp-grab{display:block}
.tp-kbd{font:500 11px/1 'JetBrains Mono',ui-monospace,monospace;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:var(--raised);color:var(--text-2)}
.tp-head{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px 0 14px;border-bottom:1px solid var(--line)}
.tp-crumb{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tp-key{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px;border-radius:6px;border:0;background:transparent;color:var(--text-2);font:500 12px/1 'JetBrains Mono',ui-monospace,monospace;cursor:pointer;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.tp-key:hover{background:var(--hover);color:var(--text)}
.tp-ib{width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--text-2);cursor:pointer;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.tp-ib:hover{background:var(--hover);color:var(--text)}
.tp-done{display:inline-flex;align-items:center;gap:7px;height:28px;margin-right:4px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--raised);color:var(--text);font:500 12px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;transition:border-color 120ms var(--ease),background-color 120ms var(--ease),color 120ms var(--ease),transform 120ms var(--ease)}
.tp-done:hover{border-color:var(--ok)}
.tp-done:active{transform:scale(.97)}
.tp-done.is{border-color:transparent;background:rgba(74,222,128,.14);color:var(--ok)}
.tp-ring{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text-3);position:relative;flex:none;display:inline-block}
.is .tp-ring{background:var(--ok);border-color:var(--ok)}
.is .tp-ring::after{content:"";position:absolute;left:3.5px;top:1px;width:3px;height:6px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.tp-ring.fx{animation:tppop 240ms var(--spring)}
.tp-ring.fx::after{animation:tpdraw 180ms var(--ease) 60ms both}
.tp-ring.fx::before,.tp-g.fx::before{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:var(--spark);box-shadow:0 -11px 0 var(--spark),10px -5px 0 var(--spark),10px 6px 0 var(--spark),0 11px 0 var(--spark),-10px 6px 0 var(--spark),-10px -5px 0 var(--spark);animation:tpspark 440ms var(--ease) both;pointer-events:none}
@keyframes tppop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes tpdraw{from{clip-path:inset(0 100% 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes tpspark{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8);opacity:0}}
.tp-scroll{flex:1;min-height:0;overflow:auto}
.tp-body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "props" "main";row-gap:16px;padding:18px 20px 40px;max-width:1200px;margin:0 auto}

.tp-main{grid-area:main;display:flex;flex-direction:column;gap:24px;min-width:0}
.tp-ti{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--text);font:600 22px/30px 'Inter',sans-serif;letter-spacing:-.015em;padding:2px 8px;margin-left:-9px;cursor:text;transition:background-color 120ms var(--ease)}

.tp-tin{width:100%;border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-s);border-radius:7px;background:var(--surface);color:var(--text);font:600 22px/30px 'Inter',sans-serif;letter-spacing:-.015em;padding:1px 7px;margin-left:-9px}

.tp-g{width:14px;height:14px;border-radius:50%;flex:none;position:relative;display:inline-block}

.tp-g.done::after{content:"";position:absolute;left:4px;top:2px;width:3px;height:6px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.tp-g.fx{animation:tppop 240ms var(--spring)}
.tp-g.cancel{border:1.5px solid currentColor}

.tp-bars{display:inline-flex;align-items:flex-end;gap:1.5px;height:12px;flex:none}

.tp-bars i:nth-child(1){height:4px}.tp-bars i:nth-child(2){height:7px}.tp-bars i:nth-child(3){height:10px}.tp-bars i:nth-child(4){height:12px}
.tp-bars.n1 i:nth-child(-n+1),.tp-bars.n2 i:nth-child(-n+2),.tp-bars.n3 i:nth-child(-n+3),.tp-bars.n4 i:nth-child(-n+4){background:currentColor}
.tp-av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--text);flex:none;width:20px;height:20px;font-size:9px}

.tp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}

.tp-fv{font-size:13px;line-height:18px;color:var(--text);font-weight:500;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tp-num:focus{outline:none}
.tp-plan{border:1px solid var(--line);border-radius:10px;background:var(--bg)}

.tp-descb{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;padding:6px 8px;margin:-6px -8px;cursor:text;color:inherit;font:inherit;transition:background-color 120ms var(--ease)}
.tp-descb:hover{background:var(--hover)}
.tp-editor{border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-s);border-radius:8px;background:var(--surface)}
.tp-tbar{display:flex;align-items:center;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line)}
.tp-tbar button{height:26px;min-width:26px;padding:0 6px;border:0;border-radius:5px;background:transparent;color:var(--text-2);font:600 12px/1 'Inter',sans-serif;cursor:pointer}
.tp-tbar button:hover{background:var(--hover);color:var(--text)}
.tp-btn{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:6px;font:500 12px/1 'Inter',sans-serif;border:1px solid transparent;cursor:pointer;white-space:nowrap;background:transparent;color:var(--text-2);transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.tp-btn:hover{background:var(--hover);color:var(--text)}
.tp-btn.pri{background:var(--accent);color:#fff}
.tp-btn.pri:hover{background:var(--accent-h)}
.tp-btn.pri .tp-kbd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.tp-btn.sec{background:var(--raised);border-color:var(--line-2);color:var(--text)}
.tp-bar{height:6px;border-radius:3px;background:var(--raised);border:1px solid var(--line);overflow:hidden;flex:1}
.tp-bar span{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width 300ms var(--ease)}
.tp-srow{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 8px;margin:0 -8px;border-radius:6px}
.tp-srow:hover{background:var(--hover)}
.tp-cb{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border:1.5px solid var(--control);border-radius:4px;background:transparent;display:grid;place-content:center;cursor:pointer;flex:none;transition:background-color 120ms var(--ease),border-color 120ms var(--ease)}
.tp-cb::after{content:"";width:8px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform 150ms var(--spring)}
.tp-cb:checked{background:var(--accent);border-color:var(--accent)}
.tp-cb:checked::after{transform:rotate(-45deg) scale(1)}
.tp-done-t{color:var(--text-3);text-decoration:line-through}
.tp-att{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tp-tile{border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;min-width:0}
.tp-thumb{height:70px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--raised) 0 8px,var(--surface) 8px 16px);font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.tp-cprev{height:70px;padding:8px 10px;border-bottom:1px solid var(--line);font:400 10.5px/15px 'JetBrains Mono',monospace;color:var(--text-2);overflow:hidden;white-space:pre}
.tp-tm{padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tp-tn{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-ts{font-size:11px;color:var(--text-3)}
.tp-dz{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:70px;padding:10px;border:1.5px dashed var(--line-2);border-radius:8px;text-align:center;color:var(--text-2);transition:border-color 120ms var(--ease),background-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.tp-dz.over{border-color:var(--accent);background:var(--accent-s);box-shadow:0 0 0 4px var(--accent-s)}
.tp-dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.tp-up{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tp-up .tp-bar span{background:var(--accent);transition:width 120ms linear}
.tp-up.err{border-color:var(--danger)}
.tp-ext{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font:600 8.5px/1 'JetBrains Mono',monospace;background:var(--raised);border:1px solid var(--line-2);flex:none}
.tp-tabs{position:relative;display:inline-flex;border-bottom:1px solid var(--line);margin-bottom:12px}
.tp-tab{width:112px;height:34px;border:0;background:transparent;color:var(--text-2);font:500 13px/1 'Inter',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tp-tab[aria-selected=true]{color:var(--text)}
.tp-ind{position:absolute;left:0;bottom:-1px;width:112px;height:2px;background:var(--accent);border-radius:2px;transition:transform 200ms var(--spring)}
.tp-cmt{display:flex;gap:12px;padding:8px 0}
.tp-mention{color:var(--accent-t);background:var(--accent-s);padding:0 3px;border-radius:4px;font-weight:500}
.tp-icode{font-family:'JetBrains Mono',monospace;font-size:12px;padding:1px 4px;border-radius:4px;background:var(--raised);border:1px solid var(--line)}
.tp-comp{position:relative;display:flex;gap:10px;align-items:flex-start;padding-top:8px}
.tp-cin{flex:1;min-height:40px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font:400 13px/20px 'Inter',sans-serif;resize:none}
.tp-cin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.tp-tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.tp-tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line-2)}
.tp-tli{position:relative;font-size:13px;line-height:20px;color:var(--text-2)}
.tp-tli::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--control)}
.tp-tli b{color:var(--text);font-weight:500}
.tp-banner{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised)}
.tp-dim{opacity:.55;pointer-events:none;filter:saturate(.6)}
.tp-key:focus-visible,.tp-ib:focus-visible,.tp-done:focus-visible,.tp-ti:focus-visible,.tp-chip:focus-visible,.tp-f:focus-visible,.tp-planh:focus-visible,.tp-pv:focus-visible,.tp-mini:focus-visible,.tp-addp:focus-visible,.tp-mi:focus-visible,.tp-descb:focus-visible,.tp-btn:focus-visible,.tp-tab:focus-visible,.tp-oc button:focus-visible,.tp-dz:focus-within,.tp-cb:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){
  .tp:not(.static){position:fixed;top:auto;left:0;right:0;bottom:0;width:auto!important;height:92vh;border-left:0;border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;animation:tpsheet 280ms var(--ease)}
  .tp:not(.static) .tp-grab{display:block}
}
.sheet .tp-body,.narrow .tp-body{padding:12px 16px 32px}
.sheet .tp-chips{flex-wrap:nowrap;overflow-x:auto}
.sheet .tp-chip{height:36px}
.sheet .tp-crumb{display:none}
@media (max-width:760px){.tp-body,.full .tp-body{grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "props" "main";padding:12px 16px 32px}.full .tp-props{border-left:0;padding-left:0}.tp-chips{flex-wrap:nowrap;overflow-x:auto}.tp-chip{height:36px}}
@media (prefers-reduced-motion:reduce){.tp,.tp *{animation-duration:.001ms!important;transition-duration:.001ms!important}}
/*TP-CSS-END*/
</style>
</helmet>
