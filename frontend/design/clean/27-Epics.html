.ep-sw.mut{opacity:.45}
.ep-swl{width:30px;height:30px;border-radius:8px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:oklch(var(--ep-tl) var(--ep-tc) var(--h));border:1px solid oklch(var(--ep-l) var(--ep-c) var(--h) / .35)}
.ep-swl .ep-sw{width:12px;height:12px}
/* list */
.ep-wrap{padding:18px 18px 40px;display:flex;flex-direction:column;gap:14px}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ep-card{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0;transition:border-color 120ms var(--ease),transform 150ms var(--spring),box-shadow 150ms var(--ease)}
.ep-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.ep-card.new{animation:epnew 420ms var(--spring)}
@keyframes epnew{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.ep-cardb{display:flex;align-items:center;gap:9px;min-width:0;padding:0;border:0;background:transparent;color:var(--text);font:600 14px/18px 'Inter',sans-serif;letter-spacing:-.005em;text-align:left;cursor:pointer}
.ep-cardb::after{content:"";position:absolute;inset:-1px;border-radius:12px}
.ep-cardb:focus-visible{outline:none}
.ep-cardb:focus-visible::after{box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
.ep-cardb .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-row{display:flex;align-items:center;gap:8px;min-width:0}
.ep-ms{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ep-ms svg{flex:none}
.ep-seg{flex:1;display:flex;gap:2px;height:6px;border-radius:3px;background:var(--raised);overflow:hidden;min-width:0}
.ep-seg span{display:block;height:100%;transition:width 600ms var(--ease)}
.ep-cnts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ep-cnts span{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2)}
.ep-sech{display:flex;align-items:center;gap:8px;height:34px;width:100%;margin-top:10px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--text-2);font:600 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.ep-sech:hover{background:var(--hover);color:var(--text)}
.ep-sech .chev{flex:none;color:var(--text-3);transition:transform 200ms var(--ease)}
.ep-sech[aria-expanded=true] .chev{transform:rotate(90deg)}
.ep-col{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease)}
.ep-col.open{grid-template-rows:1fr}
.ep-col>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s 220ms}
.ep-col.open>div{visibility:visible;transition-delay:0s}
.ep-arow{display:grid;grid-template-columns:12px minmax(0,1fr) 120px 60px 20px 84px;gap:12px;align-items:center;min-height:42px;padding:0 10px;border-bottom:1px solid var(--line)}
.ep-arow .tt{color:var(--text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-arow .act{display:flex;justify-content:flex-end}
/* epic open */
.ep-ohead{display:flex;flex-direction:column;gap:14px;padding:22px 24px 18px;border-bottom:1px solid var(--line)}
.ep-otitle{display:flex;align-items:center;gap:12px;min-width:0}
.ep-otitle h2{margin:0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-props{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.ep-prop{display:inline-flex;align-items:center;gap:7px;color:var(--text-2);font-weight:500;white-space:nowrap}
.ep-desc{margin:0;max-width:680px;font-size:13.5px;line-height:21px;color:var(--text-2)}
.ep-oprog{display:flex;align-items:center;gap:12px;max-width:520px}
.ep-groups{padding:6px 18px 40px}
.ep-gh{display:flex;align-items:center;gap:8px;height:36px;width:100%;margin-top:6px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--text);font:600 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left}
.ep-gh:hover{background:var(--hover)}
.ep-gh .chev{flex:none;color:var(--text-3);transition:transform 200ms var(--ease)}
.ep-gh[aria-expanded=true] .chev{transform:rotate(90deg)}
.ep-tr{position:relative;display:grid;grid-template-columns:14px 64px minmax(0,1fr) 14px 20px 26px;gap:12px;align-items:center;min-height:38px;padding:0 8px 0 10px;border-bottom:1px solid var(--line);transition:background-color 100ms var(--ease)}
.ep-tr:hover,.ep-tr:focus-within{background:var(--surface)}
.ep-tr.new{animation:epflash 1.2s var(--ease)}
@keyframes epflash{from{background:var(--accent-s)}to{background:transparent}}
.ep-key{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3);white-space:nowrap}
.ep-tr .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ep-tr.dn .tt{color:var(--text-2)}
.ep-tr .rm{opacity:0;transition:opacity 120ms var(--ease)}
.ep-tr:hover .rm,.ep-tr:focus-within .rm{opacity:1}
/* picker */
.ep-pick{position:absolute;top:46px;right:12px;z-index:30;width:380px;max-width:calc(100% - 24px);display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);animation:eppop 160ms var(--ease)}
@keyframes eppop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.ep-ps{position:relative;padding:8px;border-bottom:1px solid var(--line)}
.ep-ps svg{position:absolute;left:18px;top:50%;margin-top:-8px;color:var(--text-3);pointer-events:none}
.ep-inp{width:100%;height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font:400 13px/1 'Inter',sans-serif;transition:border-color 150ms var(--ease),box-shadow 150ms var(--ease)}
.ep-inp::placeholder{color:var(--text-3)}
.ep-inp:hover{border-color:var(--control)}
.ep-inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.ep-inp.err{border-color:var(--danger)}
.ep-inp.err:focus{box-shadow:0 0 0 3px rgba(255,122,112,.2)}
.ep-ps .ep-inp{padding-left:32px}
.ep-pl{max-height:300px;overflow:auto;padding:4px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.ep-po{display:grid;grid-template-columns:16px 14px 58px minmax(0,1fr) 20px;gap:9px;align-items:center;min-height:34px;padding:0 8px;border-radius:7px;cursor:pointer}
.ep-po:hover{background:var(--hover)}
.ep-po.on{background:var(--accent-s)}
.ep-po .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-pf{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-top:1px solid var(--line)}
.ep-pe{padding:18px 12px;text-align:center;color:var(--text-3);font-size:12.5px}
/* side panel */
.ep-scrim{position:absolute;inset:0;z-index:20;background:rgba(2,5,14,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadein 180ms var(--ease)}
.t-light .ep-scrim{background:rgba(18,18,23,.22)}
.ep-panel{position:absolute;top:0;right:0;bottom:0;z-index:21;width:420px;max-width:100%;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow-modal);animation:epin 240ms var(--ease)}
.ep-panel:focus{outline:none}
@keyframes epin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes epsheet{from{transform:translateY(100%)}to{transform:none}}
.ep-grab{display:none;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0;flex:none}
.ep-phd{display:flex;align-items:center;gap:10px;height:52px;flex:none;padding:0 10px 0 18px;border-bottom:1px solid var(--line)}
.ep-phd h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.ep-pb{flex:1;min-height:0;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px}
.ep-fld{display:flex;flex-direction:column;gap:7px;position:relative}
.ep-lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--text-2)}
.ep-req{color:var(--text-3);font:500 11px/1 'JetBrains Mono',monospace}
.ep-msg{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--danger)}
.ep-ta{width:100%;min-height:92px;padding:9px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font:400 13px/20px 'Inter',sans-serif;resize:vertical;transition:border-color 150ms var(--ease),box-shadow 150ms var(--ease)}
.ep-ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.ep-ta::placeholder{color:var(--text-3)}
.ep-sws{display:flex;gap:8px;flex-wrap:wrap}
.ep-swb{width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:border-color 120ms var(--ease),transform 150ms var(--spring)}
.ep-swb:hover{border-color:var(--control);transform:translateY(-1px)}
.ep-swb .ep-sw{width:16px;height:16px;border-radius:5px;transition:transform 150ms var(--spring)}
.ep-swb[aria-checked=true]{border-color:oklch(var(--ep-l) var(--ep-c) var(--h));box-shadow:0 0 0 3px oklch(var(--ep-l) var(--ep-c) var(--h) / .25)}
.ep-swb[aria-checked=true] .ep-sw{transform:scale(1.15)}
.ep-sel{display:flex;align-items:center;gap:9px;width:100%;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font:500 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left;transition:border-color 120ms var(--ease)}
.ep-sel:hover,.ep-sel[aria-expanded=true]{border-color:var(--control)}
.ep-sel .chev{margin-left:auto;color:var(--text-3);flex:none}
.ep-menu{position:absolute;left:0;right:0;z-index:25;padding:4px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);animation:eppop 150ms var(--ease)}
.ep-mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text);font:500 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left}
.ep-mi:hover{background:var(--hover)}
.ep-mi .h{margin-left:auto;font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.ep-mi[aria-selected=true] .h{color:var(--accent-t)}
.ep-pf2{display:flex;align-items:center;gap:8px;padding:12px 14px 12px 18px;border-top:1px solid var(--line);flex:none}
.ep-prev{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line-2);font-weight:600;min-width:0}
.ep-prev .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-prev .tt.ph{color:var(--text-3);font-weight:500}
/* toast */
.ep-toast{position:absolute;left:16px;bottom:16px;z-index:22;display:flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font-weight:500;animation:eptoast 220ms var(--ease);max-width:calc(100% - 32px)}
@keyframes eptoast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ep-link{height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--accent-t);font:500 12.5px/1 'Inter',sans-serif;cursor:pointer}
.ep-link:hover{background:var(--accent-s)}
/* states */
.ep-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px 24px;text-align:center}
.ep-state h3{margin:0;font-size:15px;line-height:20px;font-weight:600}
.ep-eic{width:52px;height:52px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.ep-eic.err{color:var(--danger)}
.ep-ghost{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(380px,100%);margin-bottom:8px}
.ep-ghost i{display:flex;flex-direction:column;gap:8px;height:64px;padding:12px;border-radius:10px;border:1px dashed var(--line-2)}
.ep-ghost i::before{content:"";width:10px;height:10px;border-radius:3px;background:oklch(var(--ep-l) var(--ep-c) var(--h));opacity:.6}
.ep-ghost i::after{content:"";height:5px;border-radius:3px;background:var(--raised)}
.ep-ghost i:nth-child(2){opacity:.65}.ep-ghost i:nth-child(3){opacity:.35}
.sk{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 45%,var(--raised) 90%);background-size:240% 100%;animation:shim 1.4s linear infinite;flex:none}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.ep-btn:focus-visible,.ep-ib:focus-visible,.ep-sech:focus-visible,.ep-gh:focus-visible,.ep-swb:focus-visible,.ep-sel:focus-visible,.ep-mi:focus-visible,.ep-link:focus-visible,.tp-cb:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}

<div class="ds {{themeCls}}" style="width:1440px;height:4260px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">

<!--SB-START-->

                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>

                    <button class="ep-btn pri" type="button" aria-haspopup="dialog" aria-expanded="{{fx.pk.open}}" sc-camel-on-click="{{fx.pk.toggle}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>Add tasks</button>
                  </sc-if>
                </sc-if>
              </header>

              <!-- LIST -->
              <sc-if value="{{fx.isList}}" hint-placeholder-val="{{true}}">
                <sc-if value="{{fx.st.loading}}" hint-placeholder-val="{{false}}">
                  <div class="ep-wrap" aria-busy="true" aria-label="Loading epics">
                    <div class="ep-grid">
                      <sc-for list="{{fx.skCards}}" as="sk" hint-placeholder-count="3">
                        <div class="ep-card" style="gap:14px"><span style="display:flex;gap:9px;align-items:center"><span class="sk" style="width:12px;height:12px;border-radius:4px"></span><span class="sk" style="width:{{sk.w}}px;height:11px"></span><span style="flex:1"></span><span class="sk" style="width:20px;height:20px;border-radius:50%"></span></span><span class="sk" style="width:96px"></span><span class="sk" style="width:100%;height:6px"></span><span class="sk" style="width:150px;opacity:.6"></span></div>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
                <sc-if value="{{fx.st.error}}" hint-placeholder-val="{{false}}">
                  <div class="ep-state" role="alert">
                    <div class="ep-eic err"><svg width="22" height="22" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5l6 11H2zM8 6.5v3M8 11.5v.1"></path></svg></div>
                    <h3>Couldn’t load epics</h3>
                    <span class="ep-m mut">ERR 503 · nothing was lost</span>
                    <button class="ep-btn sec" type="button" sc-camel-on-click="{{fx.retry}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 11-1.5-3.5M13 2.5v3h-3"></path></svg>Retry</button>
                  </div>
                </sc-if>
                <sc-if value="{{fx.st.empty}}" hint-placeholder-val="{{false}}">
                  <div class="ep-state">
                    <div class="ep-ghost" aria-hidden="true"><i style="--h:255"></i><i style="--h:150"></i><i style="--h:60"></i></div>
                    <h3>No epics yet</h3>
                    <span class="ep-m mut">group related tasks toward a milestone</span>
                    <sc-if value="{{fx.canEdit}}" hint-placeholder-val="{{true}}">
                      <button class="ep-btn pri" type="button" sc-camel-on-click="{{fx.newEpic}}" style="margin-top:4px"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>Create epic</button>
                    </sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{fx.st.ready}}" hint-placeholder-val="{{true}}">
                  <div class="ep-scroll fade">
                    <div class="ep-wrap">
                      <div class="ep-grid">
                        <sc-for list="{{fx.cards}}" as="ec" hint-placeholder-count="4">
                          <article class="ep-card {{ec.cls}}">
                            <div class="ep-row">
                              <button class="ep-cardb" type="button" sc-camel-on-click="{{ec.open}}" aria-label="{{ec.aria}}"><i class="ep-sw" style="--h:{{ec.hue}}"></i><span class="tt">{{ec.name}}</span></button>
                              <span class="ep-sp"></span>
                              <span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{ec.ohue}})" title="Owner: {{ec.oname}}">{{ec.owner}}</span>
                            </div>
                            <div class="ep-row"><span class="ep-ms"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14V2.5h7.5L10 5.5l1.5 3H4"></path></svg>{{ec.ms}}</span><span class="ep-sp"></span><span class="ep-m mut">{{ec.n}} tasks</span></div>
                            <div class="ep-row" style="gap:10px">
                              <span class="ep-seg" role="img" aria-label="{{ec.segAria}}"><sc-for list="{{ec.seg}}" as="sg" hint-placeholder-count="3"><span style="width:{{sg.w}}%;background:{{sg.c}}"></span></sc-for></span>
                              <span class="ep-m" style="width:34px;text-align:right">{{ec.pct}}%</span>
                            </div>
                            <div class="ep-cnts"><sc-for list="{{ec.cnts}}" as="cn" hint-placeholder-count="4"><span title="{{cn.label}}"><i class="tp-g sm {{cn.g}}" style="color:{{cn.c}}"></i>{{cn.n}}</span></sc-for></div>
                          </article>
                        </sc-for>
                      </div>
                      <sc-if value="{{fx.noActive}}" hint-placeholder-val="{{false}}"><div class="ep-state" style="padding:24px"><span class="ep-m mut">All epics archived</span></div></sc-if>

                      <sc-if value="{{fx.hasArch}}" hint-placeholder-val="{{true}}">
                        <section aria-label="Archived epics">
                          <button class="ep-sech" type="button" aria-expanded="{{fx.archOpen}}" sc-camel-on-click="{{fx.toggleArch}}"><svg class="chev" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>Archived<span class="ep-cnt">{{fx.archN}}</span></button>
                          <div class="ep-col {{fx.archCls}}"><div>
                            <div style="padding:4px 0 0">
                              <sc-for list="{{fx.arch}}" as="ar" hint-placeholder-count="2">
                                <div class="ep-arow">
                                  <i class="ep-sw mut" style="--h:{{ar.hue}}"></i>
                                  <span class="tt">{{ar.name}}</span>
                                  <span class="ep-ms ms">{{ar.ms}}</span>
                                  <span class="ep-m mut">{{ar.done}}/{{ar.n}}</span>
                                  <span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{ar.ohue}})">{{ar.owner}}</span>
                                  <span class="act"><sc-if value="{{fx.canEdit}}" hint-placeholder-val="{{true}}"><button class="ep-btn sm" type="button" sc-camel-on-click="{{ar.restore}}"><svg width="13" height="13" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a5 5 0 105-5H5.5M7 1.5L5.2 3 7 4.5"></path></svg>Restore</button></sc-if></span>
                                </div>
                              </sc-for>
                            </div>
                          </div></div>
                        </section>
                      </sc-if>
                    </div>
                  </div>
                </sc-if>
              </sc-if>

              <!-- EPIC OPEN -->
              <sc-if value="{{fx.isOpen}}" hint-placeholder-val="{{false}}">
                <div class="ep-scroll fade">
                  <div class="ep-ohead">
                    <div class="ep-otitle"><span class="ep-swl" style="--h:{{fx.ep.hue}}"><i class="ep-sw" style="--h:{{fx.ep.hue}}"></i></span><h2>{{fx.ep.name}}</h2></div>
                    <div class="ep-props">
                      <span class="ep-prop"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{fx.ep.ohue}})">{{fx.ep.owner}}</span>{{fx.ep.oname}}</span>
                      <span class="ep-prop"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4 14V2.5h7.5L10 5.5l1.5 3H4"></path></svg>{{fx.ep.ms}}<span class="ep-m mut">{{fx.ep.msDate}}</span></span>
                      <span class="ep-cnts"><sc-for list="{{fx.ep.cnts}}" as="cn" hint-placeholder-count="4"><span title="{{cn.label}}"><i class="tp-g sm {{cn.g}}" style="color:{{cn.c}}"></i>{{cn.n}}</span></sc-for></span>
                    </div>
                    <div class="ep-oprog"><span class="ep-seg" style="height:8px;border-radius:4px" role="img" aria-label="{{fx.ep.segAria}}"><sc-for list="{{fx.ep.seg}}" as="sg" hint-placeholder-count="3"><span style="width:{{sg.w}}%;background:{{sg.c}}"></span></sc-for></span><span class="ep-m">{{fx.ep.pct}}%</span><span class="ep-m mut">{{fx.ep.done}}/{{fx.ep.n}}</span></div>
                    <sc-if value="{{fx.ep.hasDesc}}" hint-placeholder-val="{{true}}"><p class="ep-desc">{{fx.ep.desc}}</p></sc-if>
                  </div>
                  <div class="ep-groups">
                    <sc-for list="{{fx.ep.groups}}" as="gp" hint-placeholder-count="4">
                      <section aria-label="{{gp.name}}">
                        <button class="ep-gh" type="button" aria-expanded="{{gp.open}}" sc-camel-on-click="{{gp.toggle}}"><svg class="chev" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg><span class="tp-g {{gp.g}}" style="color:{{gp.c}}"></span>{{gp.name}}<span class="ep-cnt">{{gp.n}}</span></button>
                        <div class="ep-col {{gp.colCls}}"><div>
                          <sc-for list="{{gp.rows}}" as="tr" hint-placeholder-count="2">
                            <div class="ep-tr {{tr.cls}}">
                              <span class="tp-g {{tr.g}}" style="color:{{tr.gc}}"></span>
                              <span class="ep-key">{{tr.k}}</span>
                              <span class="tt">{{tr.t}}</span>
                              <span class="tp-bars {{tr.pc}}" style="color:{{tr.pcol}}" aria-label="{{tr.pl}} priority"><i></i><i></i><i></i><i></i></span>
                              <sc-if value="{{tr.hasA}}" hint-placeholder-val="{{true}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{tr.hue}})">{{tr.a}}</span></sc-if>
                              <sc-if value="{{tr.noA}}" hint-placeholder-val="{{false}}"><span class="tp-avn" aria-label="Unassigned"></span></sc-if>
                              <span><sc-if value="{{fx.canEdit}}" hint-placeholder-val="{{true}}"><button class="ep-ib sm rm" type="button" aria-label="Remove {{tr.k}} from epic" sc-camel-on-click="{{tr.remove}}"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></sc-if></span>
                            </div>
                          </sc-for>
                        </div></div>
                      </section>
                    </sc-for>
                    <sc-if value="{{fx.ep.noTasks}}" hint-placeholder-val="{{false}}">
                      <div class="ep-state" style="padding:40px 16px"><span class="ep-m mut">No tasks in this epic</span><sc-if value="{{fx.canEdit}}" hint-placeholder-val="{{true}}"><button class="ep-btn sec" type="button" sc-camel-on-click="{{fx.pk.toggle}}">Add tasks</button></sc-if></div>
                    </sc-if>
                  </div>
                </div>

                <sc-if value="{{fx.pk.open}}" hint-placeholder-val="{{false}}">
                  <div class="ep-pick" role="dialog" aria-label="Add tasks to {{fx.ep.name}}" sc-camel-on-key-down="{{fx.pk.onKey}}">
                    <div class="ep-ps">
                      <svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                      <input class="ep-inp" type="search" placeholder="Search tasks without an epic…" aria-label="Search tasks" value="{{fx.pk.q}}" sc-camel-on-change="{{fx.pk.onQ}}" autocomplete="off">
                    </div>
                    <div class="ep-pl" role="listbox" aria-multiselectable="true">
                      <sc-for list="{{fx.pk.items}}" as="po" hint-placeholder-count="5">
                        <label class="ep-po {{po.cls}}" role="option" aria-selected="{{po.on}}">
                          <input class="tp-cb" type="checkbox" checked="{{po.on}}" sc-camel-on-change="{{po.toggle}}" aria-label="{{po.k}} {{po.t}}">
                          <span class="tp-g {{po.g}}" style="color:{{po.gc}}"></span>
                          <span class="ep-key">{{po.k}}</span>
                          <span class="tt">{{po.t}}</span>
                          <sc-if value="{{po.hasA}}" hint-placeholder-val="{{true}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{po.hue}})">{{po.a}}</span></sc-if>
                          <sc-if value="{{po.noA}}" hint-placeholder-val="{{false}}"><span class="tp-avn"></span></sc-if>
                        </label>
                      </sc-for>
                      <sc-if value="{{fx.pk.none}}" hint-placeholder-val="{{false}}"><div class="ep-pe">{{fx.pk.noneTxt}}</div></sc-if>
                    </div>
                    <div class="ep-pf">
                      <span class="ep-m mut">{{fx.pk.selN}} selected</span>
                      <span class="ep-sp hide-n"></span>
                      <button class="ep-btn" type="button" sc-camel-on-click="{{fx.pk.close}}">Cancel</button>
                      <button class="ep-btn pri" type="button" disabled="{{fx.pk.disabled}}" sc-camel-on-click="{{fx.pk.add}}">{{fx.pk.addTxt}}</button>
                    </div>
                  </div>
                </sc-if>
              </sc-if>

              <sc-if value="{{fx.toastOn}}" hint-placeholder-val="{{false}}">
                <div class="ep-toast" role="status"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{fx.toastText}}</span><sc-if value="{{fx.toastUndo}}" hint-placeholder-val="{{false}}"><button class="ep-link" type="button" sc-camel-on-click="{{fx.undo}}">Undo</button></sc-if><button class="ep-ib sm" type="button" aria-label="Dismiss" sc-camel-on-click="{{fx.dismiss}}"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></div>
              </sc-if>
              <sc-if value="{{fx.phone}}" hint-placeholder-val="{{false}}"><span class="ep-home"></span></sc-if>
            </div>

            <!-- CREATE / EDIT PANEL -->
            <sc-if value="{{fx.pnOn}}" hint-placeholder-val="{{false}}">
              <div class="ep-scrim" sc-camel-on-click="{{fx.pn.close}}"></div>
              <form class="ep-panel" role="dialog" aria-modal="true" aria-labelledby="{{fx.pn.hid}}" sc-camel-on-submit="{{fx.pn.submit}}" sc-camel-no-validate="{{true}}">
                <span class="ep-grab"></span>
                <div class="ep-phd"><h2 id="{{fx.pn.hid}}">{{fx.pn.heading}}</h2><span class="ep-sp"></span><button class="ep-ib" type="button" aria-label="Close" sc-camel-on-click="{{fx.pn.close}}"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button></div>
                <div class="ep-pb">
                  <div class="ep-prev" aria-hidden="true"><i class="ep-sw" style="--h:{{fx.pn.hue}}"></i><span class="tt {{fx.pn.prevCls}}">{{fx.pn.prevName}}</span><span class="ep-sp"></span><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{fx.pn.ohue}})">{{fx.pn.owner}}</span></div>
                  <div class="ep-fld">
                    <label class="ep-lbl" for="{{fx.pn.tid}}">Title<span class="ep-req">required</span><span class="ep-sp"></span><span class="ep-cnt">{{fx.pn.len}}/60</span></label>
                    <input class="ep-inp {{fx.pn.errCls}}" id="{{fx.pn.tid}}" type="text" sc-camel-max-length="60" placeholder="e.g. Search relevance" value="{{fx.pn.title}}" sc-camel-on-change="{{fx.pn.onTitle}}" sc-camel-on-blur="{{fx.pn.onBlur}}" aria-invalid="{{fx.pn.invalid}}" aria-describedby="{{fx.pn.eid}}" autocomplete="off">
                    <sc-if value="{{fx.pn.hasErr}}" hint-placeholder-val="{{false}}"><span class="ep-msg" id="{{fx.pn.eid}}" role="alert"><svg width="13" height="13" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM8 5.3v3.4M8 10.8v.1"></path></svg>{{fx.pn.err}}</span></sc-if>
                  </div>
                  <div class="ep-fld">
                    <span class="ep-lbl" id="{{fx.pn.cid}}">Color</span>
                    <div class="ep-sws" role="radiogroup" aria-labelledby="{{fx.pn.cid}}">
                      <sc-for list="{{fx.pn.swatches}}" as="sw" hint-placeholder-count="8">
                        <button class="ep-swb" type="button" role="radio" aria-checked="{{sw.on}}" aria-label="{{sw.name}}" style="--h:{{sw.hue}}" sc-camel-on-click="{{sw.pick}}"><i class="ep-sw" style="--h:{{sw.hue}}"></i></button>
                      </sc-for>
                    </div>
                  </div>
                  <div class="ep-fld">
                    <span class="ep-lbl">Owner</span>
                    <button class="ep-sel" type="button" aria-haspopup="listbox" aria-expanded="{{fx.pn.ownOpen}}" sc-camel-on-click="{{fx.pn.toggleOwn}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{fx.pn.ohue}})">{{fx.pn.owner}}</span>{{fx.pn.oname}}<svg class="chev" width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg></button>
                    <sc-if value="{{fx.pn.ownOpen}}" hint-placeholder-val="{{false}}">
                      <div class="ep-menu" role="listbox" aria-label="Owner" style="top:calc(100% + 4px)">
                        <sc-for list="{{fx.pn.people}}" as="pp" hint-placeholder-count="6">
                          <button class="ep-mi" type="button" role="option" aria-selected="{{pp.on}}" sc-camel-on-click="{{pp.pick}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{pp.hue}})">{{pp.ini}}</span>{{pp.name}}<span class="h">{{pp.mark}}</span></button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                  <div class="ep-fld">
                    <span class="ep-lbl">Target milestone</span>
                    <button class="ep-sel" type="button" aria-haspopup="listbox" aria-expanded="{{fx.pn.msOpen}}" sc-camel-on-click="{{fx.pn.toggleMs}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4 14V2.5h7.5L10 5.5l1.5 3H4"></path></svg>{{fx.pn.msName}}<span class="ep-m mut">{{fx.pn.msDate}}</span><svg class="chev" width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg></button>
                    <sc-if value="{{fx.pn.msOpen}}" hint-placeholder-val="{{false}}">
                      <div class="ep-menu" role="listbox" aria-label="Target milestone" style="top:calc(100% + 4px)">
                        <sc-for list="{{fx.pn.mss}}" as="mo" hint-placeholder-count="5">
                          <button class="ep-mi" type="button" role="option" aria-selected="{{mo.on}}" sc-camel-on-click="{{mo.pick}}">{{mo.name}}<span class="h">{{mo.date}}</span></button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                  <div class="ep-fld">
                    <label class="ep-lbl" for="{{fx.pn.did}}">Description</label>
                    <textarea class="ep-ta" id="{{fx.pn.did}}" placeholder="What does done look like?" value="{{fx.pn.desc}}" sc-camel-on-change="{{fx.pn.onDesc}}"></textarea>
                  </div>
                </div>
                <div class="ep-pf2">
                  <sc-if value="{{fx.pn.isEdit}}" hint-placeholder-val="{{false}}"><button class="ep-btn dng" type="button" sc-camel-on-click="{{fx.pn.archive}}">Archive</button></sc-if>
                  <span class="ep-sp"></span>
                  <button class="ep-btn" type="button" sc-camel-on-click="{{fx.pn.close}}">Cancel</button>
                  <button class="ep-btn pri" type="submit">{{fx.pn.cta}}<span class="tp-kbd hide-n" style="background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff">⌘↵</span></button>
                </div>
              </form>
            </sc-if>
          </div>
        </div>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;navy&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;member&quot;,&quot;viewer&quot;],&quot;default&quot;:&quot;admin&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4260}}">
class Component extends DCLogic {
  state = { sb: {}, fr: {} };
//SB-JS-START
  sbGet(id) { return (this.state.sb && this.state.sb[id]) || {}; }
  sbSet(id, patch) { const all = { ...(this.state.sb || {}) }; all[id] = { ...(all[id] || {}), ...patch }; this.setState({ sb: all }); }
  sbFrame(id, cfg) {
    const self = this;
    const u = this.sbGet(id);
    const role = cfg.role || 'admin';
    const viewer = role === 'viewer';
    const ICON = {

    }
    const tst = f.toast;
    const sbFrames = cfg.sb ? [this.sbFrame(id, { role, collapsible: true, active: 'PR', sub: 'none' })] : [];
    return {
      label: cfg.label, meta: cfg.meta, gc: cfg.gc, gr: cfg.gr, w: cfg.w, h: cfg.h, r: cfg.phone ? 30 : 12, phone: !!cfg.phone, sbFrames, canEdit,
      isList: view === 'list', isOpen: view === 'open', activeN: active.length,
      st: { loading, error, empty: !loading && !error && M.epics.length === 0, ready: !loading && !error && M.epics.length > 0 },
      skCards: [{ w: 120 }, { w: 150 }, { w: 96 }, { w: 132 }, { w: 110 }, { w: 140 }],
      retry: () => { set({ err: false, loading: true }); clearTimeout(self._rt); self._rt = setTimeout(() => self.fSet(id, { loading: false }), 900); },
      newEpic: () => set({ panel: { mode: 'create' }, pick: false }),
      cards, noActive: active.length === 0 && archived.length > 0,
      hasArch: archived.length > 0, archN: archived.length, arch, archOpen, archCls: archOpen ? 'open' : '', toggleArch: () => set({ archOpen: !archOpen }),
      ep, pk, pnOn, pn,
      onKey: (e) => {
        if (e.key === 'Escape' && pnOn) { set({ panel: null }); return; }
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && pnOn) { e.preventDefault(); pn.submit(); }
      },
      toastOn: !!tst, toastText: tst ? tst.text : '', toastUndo: !!(tst && tst.undo),
      dismiss: () => set({ toast: null }),
      undo: () => {
        const u = tst && tst.undo; if (!u) return;
        if (u.arch) set({ arch: { ...(f.arch || {}), [u.arch]: false }, toast: null, fresh: u.arch });
        else if (u.task) set({ assign: { ...(f.assign || {}), [u.task]: u.ep }, toast: null, freshTasks: [u.task] });
      }
    };
  }
  renderVals() {
    const theme = this.props.theme || 'navy';
    const role = this.props.role || 'admin';
    const D = this.D();
    const mk = (id, cfg) => this.build(id, { role, ...cfg });
    const frames = [
      mk('main', { label: 'Epics', meta: 'open a card · New epic · Archived below', gc: '1 / -1', gr: '1', w: 1280, h: 800, sb: true }),
      mk('open', { label: 'Epic open', meta: 'grouped by status · Add tasks picker', gc: '1 / -1', gr: '2', w: 1280, h: 700, init: { open: 'board', pick: true, sel: { 'PRJ-78': true, 'PRJ-81': true } } }),
      mk('create', { label: 'Create epic', meta: 'validation on save', gc: '1 / span 3', gr: '3', w: 620, h: 760, init: { archOpen: true, panel: { mode: 'create', tried: true } } }),
      mk('edit', { label: 'Edit epic', meta: 'color · owner · milestone', gc: '4 / span 3', gr: '3', w: 620, h: 760, init: { open: 'sprint', panel: { mode: 'edit', id: 'sprint', msOpen: true } } }),
      mk('empty', { label: 'No epics', meta: 'empty project', gc: '1 / span 3', gr: '4 / span 2', w: 620, h: 598, init: { empty: true } }),
      mk('load', { label: 'Loading', meta: 'skeleton', gc: '4 / span 3', gr: '4', w: 620, h: 260, init: { loading: true } }),
      mk('err', { label: 'Error', meta: 'retry → loads', gc: '4 / span 3', gr: '5', w: 620, h: 260, init: { err: true } }),
      mk('m1', { label: 'Mobile', meta: '390', gc: '1 / span 2', gr: '6', w: 390, h: 780, phone: true, init: { archOpen: true } }),
      mk('m2', { label: 'Mobile epic', meta: 'picker as sheet', gc: '3 / span 2', gr: '6', w: 390, h: 780, phone: true, init: { open: 'auth', pick: true, q: 'rate' } }),
      this.build('m3', { role: 'viewer', label: 'Viewer', meta: 'no create · edit · add', gc: '5 / span 2', gr: '6', w: 390, h: 780, phone: true, init: { open: 'sprint' } })
    ];
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      roleLabel: role,
      palette: D.PAL.map(([hue, name]) => ({ hue, name })),
      frames
    };
  }
}
</script>
