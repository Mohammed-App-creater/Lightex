            self.fSet(fid, { hold: h, bump: (cu.bump || 0) + 1 });
          });
          return;
        }
        patch.bump = bump + 1;
      }
      set(patch);
    };
    const rowOf = (t) => {
      const s = K.ST[t.st], pr = K.PRI[t.pri], pj = K.PROJ[t.proj];
      const isClosed = closed(t);
      const d = this.dueInfo(t.due, isClosed);
      const popOpen = !!pop && pop.tid === t.id;
      return {
        key: t.id, title: t.title, stName: s[0],
        glyph: s[1] + (t.st === 'done' && u.fxId === t.id ? ' fx' : ''), color: s[2],
        cls: [isClosed ? 'done' : '', hold[t.id] ? 'leaving' : '', popOpen ? 'act' : '', !isClosed && d.cls === 'late' ? 'late' : ''].join(' '),
        popOpen: popOpen ? 'true' : 'false',
        openSt: (e) => self.openPop(fid, t.id, e, phone),
        badge: pj[0], projName: pj[1], hue: pj[2],
        bars: pr[1], pcolor: pr[2], priName: pr[0],
        dueTxt: d.txt, dueCls: d.cls
      };
    };
    const colSt = u.col || {};
    const sortT = (a, b) => ((a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : b.pri - a.pri);
    const groups = [];
    if (ready && view === 'list') {
      K.GROUPS.forEach(([id, name, meta]) => {
        const list = openT.filter((t) => self.bucket(t) === id).sort(sortT);
        if (!list.length) return;
        const open = !colSt[id];
        groups.push({ id, name, meta, warn: id === 'overdue', cls: id === 'overdue' ? 'warn' : '', count: list.filter((t) => !hold[t.id]).length, bumpCls: '', open, openCls: open ? 'open' : '', toggle: () => set({ col: { ...colSt, [id]: open } }), rows: list.map(rowOf) });
      });
      if (completed.length) {
        const open = colSt.done === undefined ? false : !colSt.done;
        groups.push({ id: 'done', name: 'Completed recently', meta: '7 days', warn: false, cls: 'cmp', count: completed.length, bumpCls, open, openCls: open ? 'open' : '', toggle: () => set({ col: { ...colSt, done: open } }), rows: completed.map(rowOf) });
      }
    }
    const cols = ready && view === 'board' ? ['backlog', 'todo', 'progress', 'review', 'done'].map((k) => {
      const list = k === 'done' ? completed.filter((t) => t.st === 'done') : openReal.filter((t) => t.st === k).sort(sortT);
      const s = K.ST[k];
      return { name: k === 'done' ? 'Done' : s[0], glyph: s[1], color: s[2], count: list.length, bumpCls: k === 'done' ? bumpCls : '', empty: list.length === 0, cards: list.map(rowOf) };
    }) : [];
    const allClear = ready && view === 'list' && openReal.length === 0 && !Object.keys(hold).some((k) => hold[k]);
    const names = activeP.map((k) => K.PROJ[k][1]);

    let popOpts = [], popHead = '';
    const pt = pop ? tasks.find((t) => t.id === pop.tid) : null;
    if (pt) {
      popHead = pt.id;
      popOpts = K.FLOW.map((k, i) => ({
        label: K.ST[k][0], glyph: K.ST[k][1], color: K.ST[k][2], n: String(i + 1),
        ac: pt.st === k ? 'true' : 'false', tick: pt.st === k, cls: pt.st === k ? 'on' : '', first: i === 0 && !u.noAf,
        pick: () => pick(pt, k)
      }));
    }
    const popOpen = popOpts.length > 0;
    const counts = {};
    tasks.filter((t) => !closed(t)).forEach((t) => { counts[t.proj] = (counts[t.proj] || 0) + 1; });
    const sbFrames = cfg.sb ? [this.sbx(fid, { role: 'admin', collapsible: true, active: 'none', sub: 'none' }, { mineOn: 'on', mineCur: 'page' })] : [];
    const SKW = [[62, 44, 70], [48, 66, 38], [56, 74, 50]];
    return {
      desk: !phone, phone, appCls: phone ? 'ph-app' : '', bodyCls: phone ? 'narrow' : '', sbFrames,
      openCount: ready ? openReal.length : '—',
      isList: ready && view === 'list', isBoard: ready && view === 'board',
      isListP: view === 'list' ? 'true' : 'false', isBoardP: view === 'board' ? 'true' : 'false',
      segX: view === 'board' ? (phone ? 44 : 76) : 0,
      showList: () => set({ view: 'list', pop: null }), showBoard: () => set({ view: 'board', pop: null }),
      chips: loading || isError ? [] : Object.keys(K.PROJ).map((k) => ({ badge: K.PROJ[k][0], name: K.PROJ[k][1], hue: K.PROJ[k][2], n: counts[k] || 0, pressed: pf[k] ? 'true' : 'false', toggle: () => set({ pf: { ...pf, [k]: !pf[k] }, pop: null }) })),
      hasFilter: activeP.length > 0, clearFilter: () => set({ pf: {} }),
      loading, isError,
      skGroups: [{ w: 64, n: 2 }, { w: 44, n: 3 }, { w: 72, n: 3 }].map((g, gi) => ({ w: g.w, rows: Array.from({ length: g.n }, (_, i) => ({ w: SKW[gi][i % 3], p: i % 2 ? 84 : 110 })) })),
      retry: () => { set({ phase: 'loading' }); self.later(fid + ':r', 1100, () => self.fSet(fid, { phase: 'ready' })); },
      groups, cols, allClear,
      clearMeta: names.length ? 'Nothing open in ' + names.join(', ') : completed.length + ' completed recently',
      burstCls: (u.burst || 0) % 2 ? 'bb' : 'ba',
      replay: () => set({ burst: (u.burst || 0) + 1 }),
      popOpen, popOpts, popHead,
      popCls: phone ? 'mt-sheet' : 'ui-menu', catchCls: phone ? 'dim' : '', miH: phone ? 48 : 32,
      popTop: phone || !popOpen ? 'auto' : pop.top + 'px', popLeft: phone || !popOpen ? '0' : pop.left + 'px', popW: phone ? 'auto' : '212px',
      closePop: () => set({ pop: null }),
      popKey: (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); set({ pop: null }); return; }
        const n = parseInt(e.key, 10);
        if (pt && n >= 1 && n <= 6) { e.preventDefault(); pick(pt, K.FLOW[n - 1]); }
      },
      onKey: (e) => { if (e.key === 'Escape' && pop) set({ pop: null }); }
    };
  }
  renderVals() {
    const theme = this.props.theme || 'navy';
    const frames = [
      { ...this.build('main', { sb: true }),
        label: 'My tasks', meta: 'click a status glyph · Done sparks and moves · chips filter', gc: '1 / span 6', gr: '1', w: 1280, h: 900, r: 14 },
      { ...this.build('board', { view: 'board', init: { pf: {} } }),
        label: 'Board layout', meta: 'columns by status across projects', gc: '1 / span 6', gr: '2', w: 1280, h: 640, r: 12 },
      { ...this.build('clear', { clear: true }),
        label: 'All clear', meta: 'tap the mark to replay', gc: '1 / span 3', gr: '3', w: 620, h: 480, r: 12 },
      { ...this.build('load', { state: 'loading' }),
        label: 'Loading', meta: 'skeleton in final positions', gc: '4 / span 3', gr: '3', w: 620, h: 480, r: 12 },
      { ...this.build('pick', { init: { col: { later: true, nodate: true }, pop: { tid: 'IN-11', top: 288, left: 10 }, noAf: true } }),
        label: 'Inline status', meta: '1–6 or click · Done → Completed recently', gc: '1 / span 4', gr: '4', w: 840, h: 440, r: 12 },
      { ...this.build('mob', { phone: true, init: { col: { later: true, nodate: true } } }),
        label: 'Mobile', meta: '390 · status as a sheet · board snaps', gc: '5 / span 2', gr: '4 / span 2', w: 390, h: 844, r: 36 },
      { ...this.build('err', { state: 'error' }),
        label: 'Error', meta: 'retry → skeleton → loaded', gc: '1 / span 4', gr: '5', w: 840, h: 372, r: 12 }
    ];
    return { themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy', frames };
  }
}
</script>
