.ch-or::before,.ch-or::after{content:"";flex:1;height:1px;background:var(--line)}
.ch-code{display:flex;align-items:center;justify-content:center;gap:6px}
.ch-cc{width:30px;height:38px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font:600 16px/1 'JetBrains Mono',monospace;color:var(--text)}
.ch-cc.gap{margin-left:8px}
.ch-code.exp .ch-cc{color:var(--text-3);text-decoration:line-through}
.ch-stat{display:flex;align-items:center;gap:8px;min-height:30px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.ch-wait{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);white-space:nowrap}
.ch-cd{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-2)}
.ch-cd.soon{color:var(--warn)}
.ch-done{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 2px;text-align:center}
.ch-okc{position:relative;width:46px;height:46px;border-radius:50%;background:rgba(74,222,128,.14);color:var(--ok);display:inline-flex;align-items:center;justify-content:center;animation:tppop 320ms var(--spring)}
.ch-okc::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--spark);box-shadow:0 -30px 0 var(--spark),26px -15px 0 var(--spark),26px 15px 0 var(--spark),0 30px 0 var(--spark),-26px 15px 0 var(--spark),-26px -15px 0 var(--spark);animation:tpspark 640ms var(--ease) 120ms both;pointer-events:none}
.ch-actr{display:flex;gap:8px;justify-content:flex-end}
.ch-actr .btn{flex:1}
.ch-ph{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px}
.ch-sent{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{height:50px;width:100%;min-width:0;padding:0;text-align:center;border-radius:8px;border:1px solid var(--control);background:var(--surface);color:var(--text);font:600 20px/1 'JetBrains Mono',monospace;caret-color:var(--accent);transition:border-color 120ms var(--ease),box-shadow 120ms var(--ease),background-color 120ms var(--ease)}
.otp input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.otp input.fill{background:var(--raised);border-color:var(--line-2)}
.otp.err input{border-color:var(--danger);color:var(--danger)}
.otp.err{animation:shake 340ms var(--ease)}
.otp.busy input{opacity:.55}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
/* push */
.ch-comp{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.ch-addr{height:34px;flex:none;display:flex;align-items:center;gap:8px;margin:8px;padding:0 12px;border-radius:17px;background:var(--raised);border:1px solid var(--line);font-size:12px;color:var(--text-2)}
.ch-center{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:150px 16px 16px}
.ch-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ch-badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:10px;font-size:11.5px;font-weight:600;background:color-mix(in oklab,currentColor 14%,transparent);white-space:nowrap}
.ch-badge.ok{color:var(--ok)}.ch-badge.err{color:var(--danger)}.ch-badge.off{color:var(--text-3)}
.ch-bp{position:absolute;left:12px;width:292px;z-index:25;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:10px;animation:bpin 220ms var(--ease);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.ch-bp::before{content:"";position:absolute;top:-6px;left:22px;width:10px;height:10px;background:var(--surface);border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);transform:rotate(45deg)}
@keyframes bpin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ch-bph{font-size:13px;font-weight:600}
.ch-bpr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.ch-bpf{display:flex;justify-content:flex-end;gap:8px}
.ch-bb{height:30px;padding:0 16px;border-radius:15px;border:1px solid var(--line-2);background:transparent;color:var(--accent-t);font:500 13px/1 system-ui,-apple-system,sans-serif;cursor:pointer}
.ch-bb:hover{background:var(--hover)}
/* quiet hours */
.ch-qh{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.ch-qhh{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:52px}
.ch-qb{display:flex;flex-direction:column;gap:16px;padding:16px 14px;border-top:1px solid var(--line);animation:fadein 180ms var(--ease)}
.ch-qg{display:grid;grid-template-columns:120px 120px minmax(0,1fr);gap:12px}
.narrow .ch-qg{grid-template-columns:repeat(2,minmax(0,1fr))}
.narrow .ch-tz{grid-column:1 / -1}
.ch-bar{position:relative;height:26px;border-radius:6px;background:var(--raised);border:1px solid var(--line);overflow:hidden}
.ch-seg{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--accent-s) 0 5px,transparent 5px 9px),var(--accent-s);box-shadow:inset 1px 0 0 var(--accent-t),inset -1px 0 0 var(--accent-t);transition:left 200ms var(--ease),width 200ms var(--ease)}
.ch-ticks{display:flex;justify-content:space-between;margin-top:6px;font:500 10.5px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.ch-days{display:flex;gap:6px;flex-wrap:wrap}
.ch-day{width:40px;height:30px;border-radius:7px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font:500 12px/1 'Inter',sans-serif;cursor:pointer;transition:background-color 120ms var(--ease),border-color 120ms var(--ease),color 120ms var(--ease)}
.ch-day:hover{border-color:var(--control);color:var(--text)}
.ch-day[aria-pressed=true]{background:var(--accent-s);border-color:var(--accent);color:var(--text)}
.touch .ch-day{width:44px;height:40px}
.ch-urg{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
/* preview */
.ch-pv{position:absolute;top:12px;right:12px;width:300px;max-width:calc(100% - 24px);z-index:28;padding:12px 14px;border-radius:16px;background:color-mix(in oklab,var(--raised) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);box-shadow:var(--shadow-modal);display:flex;flex-direction:column;gap:5px;animation:pvin 340ms var(--spring)}
@keyframes pvin{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
.ch-pvh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-3)}
.ch-pvh b{color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.ch-pvi{width:20px;height:20px;border-radius:5px;background:var(--surface);border:1px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.ch-pvt{font-weight:600;font-size:13px}
.ch-pvb{font-size:12.5px;color:var(--text-2);line-height:17px}
.ch-qr:focus-visible,.ch-day:focus-visible,.ch-bb:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){.pm-row{grid-template-columns:minmax(0,1fr) repeat(5,48px)}.pm-ic,.pm-hn svg,.pm-full{display:none}.pm-short{display:inline}.ch-qg{grid-template-columns:repeat(2,minmax(0,1fr))}.ch-tz{grid-column:1 / -1}.ch-acts .btn-ghost.sm:not(.icon){padding:0 8px}}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.sk{animation:none}}
</style>

      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      frames
    };
  }
}
</script>
