.lv-cnt{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}

.lv-ep{width:10px;height:10px;border-radius:3px;flex:none;background:oklch(.66 .13 var(--h))}
.lv-avn{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--control);flex:none}
.lv-ib{width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:var(--text-3);cursor:pointer;text-decoration:none;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.lv-ib:hover{background:var(--hover);color:var(--text)}
.lv-col{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--ease)}
.lv-col.open{grid-template-rows:1fr}
.lv-col>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s 220ms}
.lv-col.open>div{visibility:visible;transition-delay:0s}
.lv-row{position:relative;display:grid;height:36px;border-bottom:1px solid var(--line);transition:background-color 100ms var(--ease)}
.lv-row:hover,.lv-row.hov,.lv-row:focus-within,.lv-row.act{background:var(--surface)}
.lv-row.sel{background:var(--accent-s)}
.lv-row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.lv-c{position:relative;display:flex;align-items:center;min-width:0;padding:0 4px}
.lv-cv{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:28px;padding:0 6px;border:0;border-radius:5px;background:transparent;color:var(--text);font:400 13px/1 'Inter',sans-serif;text-align:left;white-space:nowrap;overflow:hidden}
button.lv-cv{cursor:pointer;transition:background-color 120ms var(--ease),box-shadow 120ms var(--ease)}
button.lv-cv:hover{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line-2)}
.lv-cv.open{background:var(--accent-s);box-shadow:inset 0 0 0 1px var(--accent)}
.lv-t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lv-t.mono{font:500 12px/1 'JetBrains Mono',monospace}
.lv-t.key{color:var(--text-3)}
.lv-t.tt{font-weight:500}
.lv-t.mut{color:var(--text-3)}
.lv-t.late{color:var(--danger)}
.lv-t.soon{color:var(--warn)}
.lv-lab{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:var(--raised);border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--text-2);flex:none}
.lv-more{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);flex:none}
.lv-tin{flex:1;min-width:0;height:28px;padding:0 6px;border-radius:5px;border:1px solid var(--accent);box-shadow:0 0 0 3px var(--accent-s);background:var(--surface);color:var(--text);font:500 13px/1 'Inter',sans-serif}
.lv-tin:focus{outline:none}
.lv-tin::placeholder{color:var(--text-3)}
.lv-acts{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:1px;padding:2px;border-radius:8px;background:var(--raised);border:1px solid var(--line-2);opacity:0;pointer-events:none;transition:opacity 120ms var(--ease)}
.lv-acts .lv-ib{width:24px;height:24px;color:var(--text-2)}
.lv-row:hover .lv-acts,.lv-row.hov .lv-acts,.lv-row:focus-within .lv-acts,.lv-row.act .lv-acts{opacity:1;pointer-events:auto}
.lv-cbx,.lv-gcb{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;padding:0;border:1.5px solid var(--control);border-radius:4px;background:transparent;display:grid;place-content:center;cursor:pointer;flex:none;transition:background-color 120ms var(--ease),border-color 120ms var(--ease),opacity 120ms var(--ease)}
.lv-cbx::after{content:"";width:8px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform 150ms var(--spring)}
.lv-cbx:checked{background:var(--accent);border-color:var(--accent)}
.lv-cbx:checked::after{transform:rotate(-45deg) scale(1)}
.lv-gcb[aria-checked=true],.lv-gcb[aria-checked=mixed]{background:var(--accent);border-color:var(--accent)}
.lv-gcb[aria-checked=true]::after{content:"";width:8px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg);margin-top:-2px}
.lv-gcb[aria-checked=mixed]::after{content:"";width:8px;height:2px;background:#fff;border-radius:1px}
.lv-row .lv-cbx,.lv-gh .lv-gcb{opacity:0}
.lv-row:hover .lv-cbx,.lv-row.hov .lv-cbx,.lv-gh:hover .lv-gcb,.lv-cbx:focus-visible,.lv-gcb:focus-visible,.lv-tbl.selecting .lv-cbx,.lv-tbl.selecting .lv-gcb{opacity:1}
.lv-empty{display:flex;align-items:center;gap:12px;height:40px;border-bottom:1px solid var(--line);color:var(--text-3);font-size:12.5px}
.lv-link{height:24px;padding:0 6px;border:0;border-radius:5px;background:transparent;color:var(--accent-t);font:500 12.5px/1 'Inter',sans-serif;cursor:pointer}
.lv-link:hover{background:var(--accent-s)}
.lv-catch{position:absolute;inset:0;z-index:25}
.lv-menu{position:absolute;z-index:30;padding:4px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);animation:lvmenu 150ms var(--ease)}
@keyframes lvmenu{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.lv-mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text);font:500 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left;white-space:nowrap}
.lv-mi:hover{background:var(--hover)}
.lv-mi.on{background:var(--accent-s)}
.lv-mi.dng{color:var(--danger)}
.lv-mi.sep{margin-top:5px;position:relative}
.lv-mi.sep::before{content:"";position:absolute;left:-4px;right:-4px;top:-3px;height:1px;background:var(--line)}
.lv-mm{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.lv-ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--control);display:grid;place-content:center;flex:none}
.lv-ck.on{background:var(--accent);border-color:var(--accent)}
.lv-ck.on::after{content:"";width:7px;height:3.5px;border:solid #fff;border-width:0 0 1.8px 1.8px;transform:rotate(-45deg);margin-top:-2px}
.lv-bulk{position:absolute;left:50%;bottom:16px;z-index:20;display:flex;align-items:center;gap:2px;height:44px;padding:0 6px 0 8px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-modal);transform:translate(-50%,calc(100% + 28px));opacity:0;visibility:hidden;transition:transform 260ms var(--spring),opacity 160ms var(--ease),visibility 0s 260ms;white-space:nowrap}
.lv-bulk.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}
.lv-bn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;margin-right:4px;border-radius:7px;background:var(--accent-s);color:var(--accent-t);font:600 12.5px/1 'Inter',sans-serif}
.lv-bn b{font:600 12.5px/1 'JetBrains Mono',monospace}
.lv-bn button{width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.lv-bn button:hover{background:var(--accent-s)}
.lv-toast{position:absolute;left:16px;z-index:22;display:flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font-weight:500;animation:lvtoast 220ms var(--ease);transition:bottom 240ms var(--ease)}
@keyframes lvtoast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lv-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:1;padding:40px;text-align:center}
.lv-state h3{margin:0;font-size:15px;font-weight:600}
.sk{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 45%,var(--raised) 90%);background-size:240% 100%;animation:shim 1.4s linear infinite;flex:none}
.sk.ci{width:14px;height:14px;border-radius:50%}
.sk.bx{width:14px;height:14px;border-radius:4px}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.lv-skc{display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0}
.lv-btn:focus-visible,.lv-seg a:focus-visible,.lv-hb:focus-visible,.lv-rz:focus-visible,.lv-gt:focus-visible,.lv-ib:focus-visible,.lv-cv:focus-visible,.lv-cbx:focus-visible,.lv-gcb:focus-visible,.lv-link:focus-visible,.lv-mi:focus-visible,.lv-bn button:focus-visible,.ph-ib:focus-visible,.ph-chip:focus-visible,.ph-gt:focus-visible,.ph-card:focus-visible,.ph-fab:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
/* phone */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.ph-sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:600 14px/1 'Inter',sans-serif}
.ph-top{height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid var(--line)}
.ph-ib{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--text-2);cursor:pointer}
.ph-ib:hover{background:var(--hover);color:var(--text)}
.ph-chips{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.ph-chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font:500 13px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;transition:background-color 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease)}
.ph-chip.on{background:var(--accent-s);border-color:transparent;color:var(--accent-t)}
.ph-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:96px;scrollbar-width:none}
.ph-gh{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.ph-gt{width:100%;height:44px;display:flex;align-items:center;gap:9px;padding:0 16px;border:0;background:transparent;color:var(--text);font:600 14px/1 'Inter',sans-serif;cursor:pointer;text-align:left}
.ph-gt .chev{flex:none;color:var(--text-3);transition:transform 200ms var(--ease)}
.ph-gt[aria-expanded=true] .chev{transform:rotate(90deg)}
.ph-list{display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.ph-card{display:flex;flex-direction:column;gap:7px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;transition:border-color 120ms var(--ease),transform 120ms var(--ease)}
.ph-card:active{transform:scale(.99);border-color:var(--line-2)}
.ph-r{display:flex;align-items:center;gap:8px;min-width:0}
.ph-ttl{font:500 14px/20px 'Inter',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-empty{padding:14px 16px;color:var(--text-3);font-size:13px;border-bottom:1px solid var(--line)}
.ph-fab{position:absolute;right:16px;bottom:30px;width:54px;height:54px;border-radius:16px;border:0;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-pop)}
.ph-home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text-3);opacity:.5}
@media (max-width:760px){.sb-host{display:none!important}.lv-top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:6px}.lv-seg{order:3}}
@media (prefers-reduced-motion:reduce){.lv *,.ph *,.lv-col,.lv-bulk,.lv-menu,.lv-toast,.sk,.tp-g.fx{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:2520px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · PROJECT VIEWS</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">List view</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>9 columns</span><span>4 groupings</span><span>36px rows</span><span>Esc clears</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="6">
      <figure class="frame" style="grid-column:{{fx.gc}};grid-row:{{fx.gr}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">

          <sc-if value="{{fx.desk}}" hint-placeholder-val="{{true}}">
            <div class="app">
              <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="1">
                <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                  <input class="sb-sinp" type="search" placeholder="Search or jump…" autocomplete="off">
                  <span class="kbd">⌘K</span>
                </label>

                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}">
                  <button class="sb-new" type="button"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span style="flex:1;text-align:left">New task</span><span class="kbd">C</span></button>
                </sc-if>

                <div class="sb-scroll {{fr.maskCls}}">
                  <a class="sb-it" href="#inbox"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="lab">Inbox</span><span class="sb-unread" aria-label="{{fr.inbox}} unread">{{fr.inbox}}</span></a>
                  <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}">
                    <a class="sb-it" href="#mine"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg><span class="lab">My tasks</span><span class="sb-count">7</span></a>
                  </sc-if>

                  <div class="sb-sec"><button class="sb-sect" type="button" aria-expanded="{{fr.pinOpen}}" sc-camel-on-click="{{fr.togglePin}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Pinned views</button></div>
                  <div class="sb-col {{fr.pinCls}}"><div>
                    <sc-for list="{{fr.pins}}" as="p" hint-placeholder-count="3">
                      <a class="sb-it" href="#view"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg><span class="lab">{{p.name}}</span><span class="sb-count">{{p.n}}</span></a>
                    </sc-for>
                  </div></div>

                  <div class="sb-sec {{fr.secCls}}">
                    <button class="sb-sect" type="button" aria-expanded="{{fr.projOpen}}" sc-camel-on-click="{{fr.toggleProjSec}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Projects<span style="color:var(--text-3);letter-spacing:0">{{fr.projCount}}</span></button>
                    <sc-if value="{{fr.canProj}}" hint-placeholder-val="{{true}}">
                      <span class="sb-tw"><button class="sb-icb sm" type="button" aria-label="New project"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New project</span></span>
                    </sc-if>
                  </div>
                  <div class="sb-col {{fr.projSecCls}}"><div>
                    <sc-if value="{{fr.showFilter}}" hint-placeholder-val="{{false}}">
                      <input class="sb-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" value="{{fr.filter}}" sc-camel-on-change="{{fr.onFilter}}">
                    </sc-if>
                    <sc-for list="{{fr.projects}}" as="pj" hint-placeholder-count="5">
                      <div>
                        <button class="sb-it {{pj.on}}" type="button" aria-expanded="{{pj.open}}" sc-camel-on-click="{{pj.toggle}}">

class Component extends DCLogic {
  state = { sb: {}, fr: {}, tasks: this.seed() };
//SB-JS-START
  sbGet(id) { return (this.state.sb && this.state.sb[id]) || {}; }
  sbSet(id, patch) { const all = { ...(this.state.sb || {}) }; all[id] = { ...(all[id] || {}), ...patch }; this.setState({ sb: all }); }
  sbFrame(id, cfg) {
    const self = this;
    const u = this.sbGet(id);
    const role = cfg.role || 'admin';
    const viewer = role === 'viewer';
    const ICON = {
      board: 'M2.5 3h3v10h-3zM6.5 3h3v7h-3zM10.5 3h3v5h-3z',
      backlog: 'M2.5 4h11M2.5 8h11M2.5 12h7',
      sprints: 'M12.5 6.5A4.8 4.8 0 004 5M3.5 9.5A4.8 4.8 0 0012 11M3.8 2.8v2.4h2.4M12.2 13.2v-2.4H9.8',
      objectives: 'M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM8 5.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z',
      milestones: 'M4 14V2.5h7.5L10 5.5l1.5 3H4',
      reports: 'M3 13V8M6.5 13V4M10 13V9.5M13.5 13V6'
    };
    const SUBS = [['board', 'Board'], ['backlog', 'Backlog'], ['sprints', 'Sprints'], ['objectives', 'Objectives'], ['milestones', 'Milestones'], ['reports', 'Reports']]
      .filter((s) => !viewer || ['board', 'backlog', 'objectives', 'milestones'].indexOf(s[0]) >= 0);
    const ALL = [
      ['PR', 'Platform Rebuild', 255], ['MO', 'Mobile App', 175], ['IN', 'Infra', 75], ['DS', 'Design System', 300], ['AP', 'Public API', 25],
      ['BI', 'Billing', 140], ['SE', 'Search', 215], ['ON', 'Onboarding', 335], ['DA', 'Data Pipeline', 100], ['QA', 'QA Automation', 50],
      ['SC', 'Security', 5], ['DO', 'Docs', 230], ['GR', 'Growth', 155], ['MK', 'Marketing Site', 285], ['PE', 'Performance', 195], ['AN', 'Analytics', 60]
    ];
    const list = cfg.many ? ALL : (viewer ? ALL.slice(0, 3) : ALL.slice(0, 5));
    const active = u.active || cfg.active || 'PR';
    const openKey = u.open === undefined ? active : u.open;
    const sub = u.sub || cfg.sub || 'board';
    const filter = u.filter || '';
    const q = filter.trim().toLowerCase();
    const shown = list.filter((p) => !q || p[1].toLowerCase().indexOf(q) >= 0 || p[0].toLowerCase() === q);
    const projects = shown.map(([badge, name, hue]) => {
      const isOpen = openKey === badge;
      const subs = SUBS.map(([k, label], i) => ({
        name: label, d: ICON[k], on: active === badge && sub === k ? 'on' : '', cur: active === badge && sub === k ? 'page' : 'false',
        pick: () => self.sbSet(id, { active: badge, sub: k, open: badge })
      }));
      const idx = SUBS.findIndex((s) => s[0] === sub);
      const step = cfg.touch ? 44 : 32;
      return {
        badge, name, hue, open: isOpen, on: active === badge && !isOpen ? 'on' : '',
        chev: isOpen ? 'open' : '', colCls: isOpen ? 'open' : '', subs,
        indY: Math.max(0, idx) * step, indO: active === badge && idx >= 0 ? 1 : 0,
        toggle: () => self.sbSet(id, { open: isOpen ? null : badge })
      };
    });
    const railProjects = list.slice(0, 6).map(([badge, name, hue]) => ({
      badge, name, hue, on: active === badge ? 'on' : '',
      toggle: () => self.sbSet(id, { active: badge, open: badge })
    }));
    const pinOpen = u.pinOpen === undefined ? true : u.pinOpen;
    const projOpen = u.projOpen === undefined ? true : u.projOpen;
    const pct = 65;
    const C = 72.3;
    const WS = [['PT', 'Platform team', 255], ['DG', 'Design guild', 300], ['PE', 'Personal', 155]];
    const wsName = u.ws || 'Platform team';
    const collapsed = u.rail === undefined ? !!cfg.rail : u.rail;
    const curProj = list.find((p) => p[0] === active) || list[0];
    const curSub = SUBS.find((s) => s[0] === sub) || SUBS[0];
    return {
      full: !collapsed, rail: collapsed,
      sbW: collapsed ? 64 : (cfg.width || 264),
      sbwCls: collapsed ? 'israil' : '',
      touchCls: cfg.touch ? 'touch' : '',
      collapsible: !!cfg.collapsible, closable: !!cfg.closable,
      wsName, wsOpen: !!u.wsOpen,
      toggleWs: () => self.sbSet(id, { wsOpen: !u.wsOpen, profOpen: false }),
      workspaces: WS.map(([b, n, h]) => ({ badge: b, name: n, hue: h, cur: n === wsName, pick: () => self.sbSet(id, { ws: n, wsOpen: false }) })),
      canTask: !viewer, showMine: !viewer, canProj: role === 'admin', canAdmin: role === 'admin', canSettings: !viewer,
      roleLabel: role.charAt(0).toUpperCase() + role.slice(1),
      inbox: viewer ? 1 : 3,
      pins: [
        { name: 'My open bugs', n: 4, d: 'M2.5 3.5h11l-4.2 5v4l-2.6 1v-5z' },
        { name: 'Due this week', n: 9, d: 'M3 4.5h10v8.5H3zM3 7h10M5.5 3v3M10.5 3v3' },
        { name: 'Blocked', n: 2, d: 'M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM4.1 4.1l7.8 7.8' }
      ],

        if (canDel) popOpts.push(self.opt({ label: 'Delete', meta: '⌫', cls: 'dng sep', pick: () => self.commit(fid, self.state.tasks.map((y) => (y.id === t.id ? { ...y, del: true } : y)), { pop: null, sel: { ...sel, [t.id]: false }, ...toast('Deleted ' + t.id, [t.id]) }) }));
      } else if (pop.kind === 'group') {
        popLabel = 'Group by';
        popOpts = K.GROUPS.map(([k, name]) => self.radio(by === k, { label: name, pick: () => set({ group: k, pop: null }) }));
      } else if (pop.kind === 'filter') {
        popLabel = 'Filter';
        popOpts = [['mine', 'Assigned to me'], ['week', 'Due this week'], ['high', 'Urgent & high']].map(([k, name]) => self.check(!!filt[k], { label: name, pick: () => set({ filt: { ...filt, [k]: !filt[k] } }) }));
        if (nFilt) popOpts.push(self.opt({ label: 'Clear filters', cls: 'sep', pick: () => set({ filt: {}, pop: null }) }));
      } else if (pop.kind === 'cols') {
        popLabel = 'Columns';
        popOpts = cfg.cols.filter((id) => id !== 'title').map((id) => self.check(!hidden[id], { label: K.COLS[id].label, pick: () => set({ hidden: { ...hidden, [id]: !hidden[id] } }) }));
        popOpts.push(self.opt({ label: 'Reset widths', cls: 'sep', pick: () => set({ widths: {}, pop: null }) }));
      } else if (pop.kind === 'b-asg' && canEdit) {
        popLabel = 'Assign';
        popOpts = K.PEOPLE.map((p) => self.opt({ label: p.name, av: true, ini: p.ini, hue: p.hue, pick: () => bulkApply(() => ({ asg: p.ini }), 'Assigned ' + nSelTxt + ' to ' + p.first) }));
      } else if (pop.kind === 'b-move' && canEdit) {
        popLabel = 'Move to';
        popOpts = K.ST_FLOW.map((k) => self.opt({ label: K.ST[k][0], g: true, glyph: K.ST[k][1], color: K.ST[k][2], pick: () => bulkApply(() => ({ st: k }), 'Moved ' + nSelTxt + ' to ' + K.ST[k][0]) }));
      } else if (pop.kind === 'b-lab' && canEdit) {
        popLabel = 'Add label';
        popOpts = Object.keys(K.LAB).map((l) => self.opt({ label: l, dot: true, dotc: K.LAB[l], pick: () => bulkApply((t2) => ({ labels: t2.labels.indexOf(l) >= 0 ? t2.labels : t2.labels.concat(l) }), 'Labeled ' + nSelTxt + ' ' + l) }));
      }
      popOpts = popOpts.map((o, i) => ({ ...o, first: i === 0 }));
    }
    const popOpen = popOpts.length > 0;
    const pk = popOpen ? pop.kind : '';
    const SKW = { key: [72, 60, 78, 66], title: [82, 60, 92, 54, 74], status: [64, 52, 72], pri: [56, 70], asg: [60, 48, 66], sprint: [70, 58], ms: [74, 60], due: [62, 74], labels: [54, 70, 42] };
    const skGroups = loading ? [{ w: 84, n: 4 }, { w: 56, n: 3 }, { w: 70, n: 3 }].map((g, gi) => ({ w: g.w, rows: Array.from({ length: g.n }, (_, i) => ({ cells: cols.map((c) => ({ w: SKW[c.id][(i + gi) % SKW[c.id].length], lead: c.id === 'status' || c.id === 'asg' })) })) })) : [];
    const toastOn = !!u.toast;
    const bulkOn = canEdit && selIds.length > 0 && !loading;
    const sbFrames = cfg.sb ? [this.sbFrame(fid, { role, collapsible: true, active: 'PR', sub: 'none' })] : [];
    return {
      desk: true, phone: false, sbFrames, showTop: !!cfg.top, canEdit, canDel,
      isError, showList: !isError, loading, noMatch, skGroups,
      retry: () => set({ retried: st }),
      groupLabel: (K.GROUPS.find((g) => g[0] === by) || ['', ''])[1],
      groupOpen: pk === 'group', filterOpen: pk === 'filter', colsOpen: pk === 'cols',
      openGroup: (e) => self.openPop(fid, { kind: 'group' }, e, 4, 180),
      openFilter: (e) => self.openPop(fid, { kind: 'filter' }, e, nFilt ? 4 : 3, 200),
      openCols: (e) => self.openPop(fid, { kind: 'cols', alignRight: true }, e, cfg.cols.length, 196),
      hasFilt: nFilt > 0, nFilt, colCount: cols.length + '/' + cfg.cols.length,
      clearFilters: () => set({ filt: {} }),
      newTask: () => addIn(by === 'status' ? 'todo' : gopts[0].id),
      tblCls: selIds.length ? 'selecting' : '',
      selW, gtc, totalW,
      hcols: cols.map((c) => {
        const on = !!sort && sort.col === c.id;
        return {
          id: c.id, label: c.label, w: c.w, min: c.min,
          ariaSort: on ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none',
          arCls: on ? (sort.dir === 'asc' ? 'on' : 'on desc') : '',
          sortBy: () => set({ sort: on ? { col: c.id, dir: sort.dir === 'asc' ? 'desc' : 'asc' } : { col: c.id, dir: 'asc' } }),
          rzCls: u.rz === c.id ? 'on' : '',
          rzDown: (e) => {
            if (e.button !== undefined && e.button !== 0) return;
            e.preventDefault(); e.stopPropagation();
            let k = 1;
            try { e.currentTarget.setPointerCapture(e.pointerId); const p = e.currentTarget.parentElement; const r = p.getBoundingClientRect(); k = (r.width / (p.offsetWidth || r.width)) || 1; } catch (err) {}
            self._drag = { fid, col: c.id, x: e.clientX, w: c.w, k };
            set({ rz: c.id });
          },
          rzMove: (e) => {
            const d = self._drag;
            if (!d || d.fid !== fid || d.col !== c.id) return;
            const w = Math.max(c.min, Math.min(480, Math.round(d.w + (e.clientX - d.x) / d.k)));
            const cw = self.fGet(fid).widths || {};
            if (cw[c.id] !== w) self.fSet(fid, { widths: { ...cw, [c.id]: w } });
          },
          rzUp: (e) => {
            if (!self._drag || self._drag.fid !== fid) return;
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (err) {}
            self._drag = null;
            set({ rz: null });
          },
          rzKey: (e) => {
            const step = e.shiftKey ? 32 : 8;
            let w = c.w;
            if (e.key === 'ArrowLeft') w -= step; else if (e.key === 'ArrowRight') w += step; else if (e.key === 'Home') w = K.COLS[c.id].w; else return;
            e.preventDefault();
            set({ widths: { ...widths, [c.id]: Math.max(c.min, Math.min(480, w)) } });
          }
        };
      }),
      groups,
      onKey: (e) => {
        if (e.key !== 'Escape') return;
        if (pop) { set({ pop: null }); return; }
        if (selIds.length) set({ sel: {} });
      },
      bulkCls: bulkOn ? 'on' : '', bulkHidden: bulkOn ? 'false' : 'true', selCount: selIds.length,
      bulkKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); set({ sel: {}, pop: null }); } },
      clearSel: () => set({ sel: {}, pop: null }),
      bAsgOpen: pk === 'b-asg', bMoveOpen: pk === 'b-move', bLabOpen: pk === 'b-lab',
      bulkAsg: (e) => self.openPop(fid, { kind: 'b-asg' }, e, 6, 200, true),
      bulkMove: (e) => self.openPop(fid, { kind: 'b-move' }, e, 6, 200, true),
      bulkLab: (e) => self.openPop(fid, { kind: 'b-lab' }, e, 6, 190, true),
      bulkDel: () => { const ids = selIds.slice(); const S = {}; ids.forEach((id) => { S[id] = true; }); self.commit(fid, self.state.tasks.map((t) => (S[t.id] ? { ...t, del: true } : t)), { sel: {}, pop: null, ...toast('Deleted ' + nSelTxt, ids) }); },
      toastOn, toastText: toastOn ? u.toast.text : '', toastUndo: toastOn && !!u.toast.undo, toastY: bulkOn ? 72 : 16,
      undo: () => { const ids = (u.toast && u.toast.undo) || []; self.commit(fid, self.state.tasks.map((t) => (ids.indexOf(t.id) >= 0 ? { ...t, del: false } : t)), { toast: null }); },
      popOpen, popOpts, popLabel, popTop: popOpen ? pop.top : 0, popLeft: popOpen ? pop.left : 0, popW: popOpen ? pop.w : 200,
      closePop: () => set({ pop: null })
    };
  }
  buildPhone(fid, cfg) {
    const self = this, K = this.K();
    const u = { ...(cfg.init || {}), ...this.fGet(fid) };
    const by = u.group || 'status';
    const colState = u.col || {};
    const all = (this.state.tasks || []).filter((t) => !t.del);
    const groups = this.groupOpts(by).map((g) => {
      const list = all.filter((t) => self.groupOf(by, t) === g.id).sort((a, b) => a.n - b.n);
      const ck = by + ':' + g.id;
      const open = !colState[ck];
      return {
        ...g, count: list.length, open, openCls: open ? 'open' : '', empty: list.length === 0, hasCards: list.length > 0,
        toggle: () => self.fSet(fid, { col: { ...colState, [ck]: open } }),
        cards: list.map((t) => {
          const s = K.ST[t.st], p = K.PRI[t.pri], a = t.asg ? K.PBY[t.asg] : null, d = self.dueInfo(t.due, t.st);
          const ep = K.EPICS.find((e) => e[0] === t.ep);
          return { key: t.id, title: t.title || 'Untitled', glyph: s[1], color: s[2], bars: p[1], pcolor: p[2], due: t.due ? d.txt : '', dueCls: 'lv-t ' + d.cls, hasAsg: !!a, noAsg: !a, ini: a ? a.ini : '', hue: a ? a.hue : 0, sub: by === 'epic' ? (t.sp ? 'Sprint ' + t.sp : 'No sprint') : (ep ? ep[1] : '') };
        })
      };
    });
    return {
      desk: false, phone: true, canEdit: cfg.role !== 'viewer', groups, total: all.length + ' tasks',
      gchips: K.GROUPS.map(([k, name]) => ({ label: name, on: by === k ? 'on' : '', pressed: by === k ? 'true' : 'false', pick: () => self.fSet(fid, { group: k }) }))
    };
  }
  renderVals() {
    const K = this.K();
    const role = this.props.role || 'admin';
    const theme = this.props.theme || 'navy';
    const state = this.props.state || 'ready';
    const L7 = ['key', 'title', 'status', 'pri', 'asg', 'due', 'labels'];
    const L5 = ['key', 'title', 'status', 'asg', 'due'];
    const C = (keys) => { const o = {}; keys.forEach((k) => { o[k] = true; }); return o; };
    const frames = [
      { ...this.build('main', { role, cols: K.ALL, sb: true, top: true, state, init: { col: C(['status:cancel']) } }),
        label: 'List view', meta: 'click a cell to edit · drag a header edge · check rows', gc: '1 / span 6', gr: '1', w: 1280, h: 860, r: 14 },
      { ...this.build('sel', { role, cols: L7, init: { col: C(['status:review', 'status:backlog', 'status:done', 'status:cancel']), sel: { 'PRJ-42': true, 'PRJ-44': true, 'PRJ-50': true } } }),
        label: 'Selected rows', meta: '3 selected · Esc clears', gc: '1 / span 4', gr: '2', w: 840, h: 440, r: 12 },
      { ...this.buildPhone('mob', { role, init: { col: C(['status:backlog', 'status:done', 'status:cancel']) } }),
        label: 'Mobile', meta: '390 · rows become cards', gc: '5 / span 2', gr: '2 / span 2', w: 390, h: 844, r: 36 },
      { ...this.build('hov', { role, cols: L7, hover: 'PRJ-42', init: { group: 'epic', col: C(['epic:auth', 'epic:sprint', 'epic:bill']) } }),
        label: 'Hover row actions', meta: 'open · copy key · more', gc: '1 / span 4', gr: '3', w: 840, h: 374, r: 12 },
      { ...this.build('emp', { role, cols: L5, init: { col: C(['status:progress', 'status:todo', 'status:backlog', 'status:done', 'status:cancel']) } }),
        label: 'Empty group', meta: 'In review · 0', gc: '1 / span 3', gr: '4', w: 620, h: 320, r: 12 },
      { ...this.build('load', { role, cols: L5, state: 'loading' }),
        label: 'Loading', meta: 'skeleton in final columns', gc: '4 / span 3', gr: '4', w: 620, h: 320, r: 12 }
    ];
    return { themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy', frames };
  }
}
</script>
