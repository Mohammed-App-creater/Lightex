.tr-c{display:flex;align-items:center;gap:8px;min-width:0;padding:0 8px;white-space:nowrap}
.tr-c.cb{justify-content:center;padding:0}
.tr-ti{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--raised);border:1px solid var(--line);color:var(--text-2)}
.tr-pk{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:none;font:600 10px/1 'JetBrains Mono',monospace;background:oklch(var(--pk-l) var(--pk-c) var(--h));color:oklch(var(--pkt-l) var(--pkt-c) var(--h))}
.tr-pks{width:18px;height:18px;border-radius:5px;font-size:8.5px}
.tr-nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.tr-nm .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-nm .t .k{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3);margin-right:8px}
.tr-nm .s{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);overflow:hidden;text-overflow:ellipsis}
.tr-mut{color:var(--text-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.tr-left{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.tr-left.warn{color:var(--warn)}
.tr-acts{justify-content:flex-end;gap:2px;padding-right:12px}
.tr-tw{position:relative;display:inline-flex}
.tr-tip{position:absolute;right:0;bottom:calc(100% + 6px);padding:5px 8px;border-radius:6px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;opacity:0;transform:translateY(3px);pointer-events:none;transition:opacity 120ms var(--ease),transform 150ms var(--ease);z-index:8}
.tr-tw:hover .tr-tip,.tr-tw:focus-within .tr-tip{opacity:1;transform:none;transition-delay:200ms}
/* states */
.tr-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:56px 20px;text-align:center;animation:fadein 200ms var(--ease)}
.tr-state.fill{flex:1}
.tr-state h3{margin:4px 0 0;font-size:15px;font-weight:600}
.tr-ico{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--raised);border:1px solid var(--line);color:var(--text-2)}
.tr-ico.dng{color:var(--danger)}
.tr-ico.ok{color:var(--ok)}
.tr-skr{display:grid;grid-template-columns:44px minmax(0,1fr) 150px 140px 76px 112px 116px;align-items:center;height:52px;border-bottom:1px solid var(--line)}
.tr-skr>span{display:flex;align-items:center;gap:8px;padding:0 8px}
/* bulk + toast */
.tr-bulk{position:absolute;left:50%;bottom:16px;z-index:20;display:flex;align-items:center;gap:4px;height:46px;padding:0 6px 0 8px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-modal);transform:translate(-50%,calc(100% + 28px));opacity:0;visibility:hidden;transition:transform 260ms var(--spring),opacity 160ms var(--ease),visibility 0s 260ms;white-space:nowrap}
.tr-bulk.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition-delay:0s}
.tr-bn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;margin-right:4px;border-radius:8px;background:var(--accent-s);color:var(--accent-t);font:600 12.5px/1 'Inter',sans-serif}
.tr-bn b{font:600 12.5px/1 'JetBrains Mono',monospace}
.tr-bn button{width:22px;height:22px;border:0;border-radius:5px;background:transparent;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tr-bn button:hover{background:var(--accent-s)}
.touch .tr-bulk{left:12px;right:12px;bottom:24px;transform:translateY(calc(100% + 40px));height:56px;justify-content:space-between}
.touch .tr-bulk.on{transform:none}
.tr-toast{position:absolute;left:16px;z-index:22;display:flex;align-items:center;gap:10px;height:38px;max-width:calc(100% - 32px);padding:0 6px 0 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font-weight:500;white-space:nowrap;animation:toastin 220ms var(--ease);transition:bottom 240ms var(--ease)}
.tr-toast .t{overflow:hidden;text-overflow:ellipsis}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tr-link{height:26px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--accent-t);font:500 12.5px/1 'Inter',sans-serif;cursor:pointer}
.tr-link:hover{background:var(--accent-s)}
/* dialog */
.st-scrim{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,5,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein 200ms var(--ease)}
.st-dlg{width:400px;max-width:100%;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow-modal);animation:dlgin 240ms var(--spring)}
@keyframes dlgin{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.st-dlg h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.st-acts{display:flex;justify-content:flex-end;gap:8px}
.touch .st-acts .btn{height:44px;flex:1}
.dl-list{display:flex;flex-direction:column;gap:4px}
.dl-it{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);min-width:0}
.dl-it .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.dl-more{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);padding-left:4px}
.ps-warn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:color-mix(in srgb,var(--danger) 10%,transparent);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);font-size:12.5px}
.ps-warn svg{color:var(--danger);flex:none}
/* phone */
.ph-chips{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
.ph-chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font:500 13px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background-color 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease)}
.ph-chip .n{font:500 11px/1 'JetBrains Mono',monospace;opacity:.75}
.ph-chip[aria-pressed=true]{background:var(--accent-s);border-color:transparent;color:var(--accent-t)}
.tc-list{display:flex;flex-direction:column;gap:8px;padding:10px 12px 110px}
.tc-card{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.tc-card.sel{border-color:var(--accent);background:var(--accent-s)}
.tc-top{display:flex;align-items:flex-start;gap:10px;min-width:0}
.tc-main{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.tc-nm{font:500 14px/20px 'Inter',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-nm .k{font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);margin-right:6px}
.tc-meta{font-size:12.5px;color:var(--text-3)}
.tc-bot{display:flex;align-items:center;gap:6px}
.tc-cbw{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin:-2px 0 0 -4px}
.tr-lnk{height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--accent-t);font:500 14px/1 'Inter',sans-serif;cursor:pointer}
.tr-lnk:hover{background:var(--accent-s)}
.btn:focus-visible,.tr-ib:focus-visible,.ps-tab:focus-visible,.tp-cb:focus-visible,.tr-bn button:focus-visible,.tr-link:focus-visible,.ph-chip:focus-visible,.tr-lnk:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){.tr-top{padding:0 6px 0 12px}.tr-note.wide{display:none}.ps-tabs{padding:0 12px;overflow-x:auto}}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}.sk{animation:none}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:2960px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="mono" style="font-size:12px;color:var(--text-3);letter-spacing:.04em">SCREENS · WORKSPACE</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Trash</h1>
    </div>
    <div class="mono" style="display:flex;gap:16px;font-size:12px;color:var(--text-3)"><span>Tasks</span><span>Comments</span><span>Projects</span><span>30-day retention</span><span>admin / member / viewer</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="6">
      <figure class="frame" style="grid-column:{{fx.gc}};grid-row:{{fx.gr}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">
          <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="0">
            <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                  <input class="sb-sinp" type="search" placeholder="Search or jump…" autocomplete="off">
                  <span class="kbd">⌘K</span>
                </label>

                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}">
                  <button class="sb-new" type="button"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span style="flex:1;text-align:left">New task</span><span class="kbd">C</span></button>
                </sc-if>

                <div class="sb-scroll {{fr.maskCls}}">
                  <a class="sb-it" href="#inbox"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="lab">Inbox</span><span class="sb-unread" aria-label="{{fr.inbox}} unread">{{fr.inbox}}</span></a>
                  <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}">
                    <a class="sb-it" href="#mine"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg><span class="lab">My tasks</span><span class="sb-count">7</span></a>
                  </sc-if>

                  <div class="sb-sec"><button class="sb-sect" type="button" aria-expanded="{{fr.pinOpen}}" sc-camel-on-click="{{fr.togglePin}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Pinned views</button></div>
                  <div class="sb-col {{fr.pinCls}}"><div>
                    <sc-for list="{{fr.pins}}" as="p" hint-placeholder-count="3">
                      <a class="sb-it" href="#view"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg><span class="lab">{{p.name}}</span><span class="sb-count">{{p.n}}</span></a>
                    </sc-for>
                  </div></div>

                  <div class="sb-sec {{fr.secCls}}">
                    <button class="sb-sect" type="button" aria-expanded="{{fr.projOpen}}" sc-camel-on-click="{{fr.toggleProjSec}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Projects<span style="color:var(--text-3);letter-spacing:0">{{fr.projCount}}</span></button>
                    <sc-if value="{{fr.canProj}}" hint-placeholder-val="{{true}}">
                      <span class="sb-tw"><button class="sb-icb sm" type="button" aria-label="New project"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New project</span></span>
                    </sc-if>
                  </div>
                  <div class="sb-col {{fr.projSecCls}}"><div>
                    <sc-if value="{{fr.showFilter}}" hint-placeholder-val="{{false}}">
                      <input class="sb-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" value="{{fr.filter}}" sc-camel-on-change="{{fr.onFilter}}">
                    </sc-if>
                    <sc-for list="{{fr.projects}}" as="pj" hint-placeholder-count="5">
                      <div>
                        <button class="sb-it {{pj.on}}" type="button" aria-expanded="{{pj.open}}" sc-camel-on-click="{{pj.toggle}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{pj.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{pj.hue}})">{{pj.badge}}</span>
                          <span class="lab">{{pj.name}}</span>
                          <svg class="sb-chev {{pj.chev}}" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                        </button>
                        <div class="sb-col {{pj.colCls}}"><div>
                          <div class="sb-subs" role="list">
                            <span class="sb-ind" style="transform:translateY({{pj.indY}}px);opacity:{{pj.indO}}"></span>
                            <sc-for list="{{pj.subs}}" as="s" hint-placeholder-count="6">
                              <button class="sb-si {{s.on}}" type="button" role="listitem" aria-current="{{s.cur}}" sc-camel-on-click="{{s.pick}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>{{s.name}}</button>
                            </sc-for>
                          </div>
                        </div></div>
                      </div>
                    </sc-for>
                    <sc-if value="{{fr.noMatch}}" hint-placeholder-val="{{false}}"><p style="margin:6px 8px;font-size:12px;color:var(--text-3)">No projects match.</p></sc-if>
                  </div></div>
                </div>

                <div class="sb-foot">
                  <button class="sb-spr" type="button" sc-camel-on-click="{{fr.openBoard}}" aria-label="Sprint 14, {{fr.sprPct}} percent, 7 days left. Open board">
                    <svg width="30" height="30" sc-camel-view-box="0 0 30 30" fill="none" aria-hidden="true"><circle cx="15" cy="15" r="11.5" stroke="var(--raised)" stroke-width="3.5"></circle><circle class="sb-rg" cx="15" cy="15" r="11.5" stroke="var(--accent-t)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="72.3" style="stroke-dashoffset:{{fr.sprOff}}" transform="rotate(-90 15 15)"></circle></svg>
                    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;font-size:13px;line-height:16px">Sprint 14</span><span class="mono" style="font-size:11px;line-height:14px;color:var(--text-3)">{{fr.sprPct}}% · 7d left</span></span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                  </button>
                  <div class="sb-row">
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <a class="sb-it" href="#members"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7.5a2.3 2.3 0 100-4.6 2.3 2.3 0 000 4.6zM2 13c.5-2.2 2-3.5 4-3.5s3.5 1.3 4 3.5M10.5 3.2a2.2 2.2 0 010 4.2M12 9.8c1 .5 1.7 1.6 2 3.2"></path></svg><span class="lab">Members &amp; roles</span></a>

    const sbFrames = cfg.sb ? [this.sbFrame(id, { role, collapsible: true, active: 'PR', sub: 'none' })] : [];
    return {
      id, label: cfg.label, meta: cfg.meta, gc: cfg.gc, gr: cfg.gr, w: cfg.w, h: cfg.h, r: cfg.r || 14,
      sbFrames, narrow, wide: !narrow, layCls: (narrow ? 'narrow' : 'wide') + (touch ? ' touch' : ''),
      total: alive.length, showTotal: ready && alive.length > 0,
      scopeChip: member && phase !== 'denied', wideNote: !narrow && phase !== 'denied',
      phSelectBtn: narrow && ready && alive.length > 0, selecting: narrow && selecting ? 'true' : 'false', selectLabel: narrow && selecting ? 'Done' : 'Select',
      toggleSelecting: () => { const v = g(); set({ selecting: !v.selecting, sel: v.selecting ? {} : v.sel }); },
      isDenied: phase === 'denied', isError: phase === 'error', isLoading: phase === 'loading',
      showBody: phase === 'ready' || phase === 'loading',
      retry: () => { set({ phase: 'loading' }); self.later(() => self.fSet(id, { phase: 'ready' }), 900); },
      tabs, indX: curTab.x + 8, indW: curTab.w - 16,
      skRows,
      isEmpty, emptyTitle: emptyAll ? 'Trash is empty' : 'No deleted ' + TYPE_NAME[tab],
      emptyMeta: emptyAll ? 'Deleted items stay 30 days' : alive.length + ' in other types',
      emptyIcon: emptyAll ? 'M3.5 8.5l3 3 6-7' : 'M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5', emptyIcoCls: emptyAll ? 'ok' : '',
      emptyShowAll: !emptyAll && tab !== 'all', showAll: () => set({ tab: 'all' }),
      showTable: ready && !narrow && visible.length > 0, showCards: ready && narrow && visible.length > 0,
      rows, allState,
      toggleAll: () => { const s2 = { ...(g().sel || {}) }; const on = allState !== 'true'; selectable.forEach((x) => { s2[x.id] = on; }); set({ sel: s2 }); },
      nSel, bulkCls: bulkOn ? 'on' : '', bulkHidden: bulkOn ? 'false' : 'true',
      clearSel: () => set({ sel: {} }),
      bulkRestore: () => { if (selIds.length) restore(selIds.slice()); },
      bulkDel: () => { if (selIds.length) askDel(selIds.slice()); },
      toastOn, toastText: toastOn ? u.toast.text : '', toastUndo: toastOn && !!u.toast.undo, toastOk: toastOn && !!u.toast.ok, toastY: bulkOn ? (touch ? 92 : 74) : 16,
      undo, live: u.live || '',
      rootKey: (e) => { if (e.key === 'Escape' && !g().dlg && Object.keys(g().sel || {}).some((k) => g().sel[k])) { e.preventDefault(); set({ sel: {} }); } },
      dlgOpen: !!dlg && dItems.length > 0,
      dlgTitle: dItems.length > 1 ? 'Delete ' + dItems.length + ' items forever?' : 'Delete forever?',
      dlgItems: dItems.slice(0, 3).map((x) => ({ label: x.type === 'comment' ? '“' + x.name + '”' : labelOf(x), icon: K.ICON[x.type], isProject: x.type === 'project', notProject: x.type !== 'project', key: x.key || '', hue: x.hue || 0 })),
      dlgMore: dItems.length > 3, dlgMoreN: Math.max(0, dItems.length - 3),
      dlgWarn: dItems.some((x) => x.type === 'project') ? 'Can’t be undone · includes its tasks' : 'Can’t be undone',
      dlgAf: !!dlg && !dlg.seed, dlgBusy: !!dlg && !!dlg.busy,
      closeDlg, confirmDel,
      scrimClick: (e) => { if (e && e.target === e.currentTarget) closeDlg(); },
      dlgKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeDlg(); } }
    };
  }
  renderVals() {
    const theme = this.props.theme || 'navy';
    const role = this.props.role || 'admin';
    const frames = [
      this.frame('main', { label: 'Trash', meta: 'role tweak · restore has undo', gc: '1 / 4', gr: '1', w: 1280, h: 860, sb: true, role }),
      this.frame('bulk', { label: 'Bulk selected', meta: 'restore or delete 3', gc: '1 / 3', gr: '2', w: 840, h: 600, init: { sel: { t2: true, t4: true, c3: true } } }),
      this.frame('cfm', { label: 'Delete forever', meta: 'confirm', gc: '3', gr: '2', w: 400, h: 600, narrow: true, init: { dlg: { ids: ['t5'], seed: true } } }),
      this.frame('empty', { label: 'Empty trash', meta: 'nothing deleted', gc: '1 / 3', gr: '3', w: 840, h: 460, empty: true }),
      this.frame('mob', { label: 'Mobile', meta: '390 · Select for bulk', gc: '3', gr: '3 / 5', w: 390, h: 844, r: 28, narrow: true, touch: true }),
      this.frame('load', { label: 'Loading', meta: 'skeleton rows', gc: '1 / 3', gr: '4', w: 840, h: 460, phase: 'loading' }),
      this.frame('deny', { label: 'Permission denied', meta: 'viewer', gc: '1 / 3', gr: '5', w: 840, h: 420, role: 'viewer' }),
      this.frame('err', { label: 'Error', meta: 'retry', gc: '3', gr: '5', w: 400, h: 420, narrow: true, phase: 'error' })
    ];
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      frames
    };
  }
}
