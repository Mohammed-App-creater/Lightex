.tc-catch{position:absolute;inset:0;z-index:35}
.tc-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:1;padding:24px;text-align:center}
.tc-state h3{margin:0;font-size:15px;font-weight:600}
.tc-eic{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--text-3)}
.tc-mm{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.sk{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 45%,var(--raised) 90%);background-size:240% 100%;animation:shim 1.4s linear infinite;flex:none}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
/* timeline */
.tl{--lab:220px;position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.tl.nar{--lab:176px}
.tl.xs{--lab:112px}
.tl-head{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);flex:none;border-bottom:1px solid var(--line)}
.tl-hl{display:flex;align-items:flex-end;padding:0 12px 9px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-right:1px solid var(--line)}
.tl-ax{position:relative;height:52px;overflow:hidden}
.tl-t1,.tl-t2{position:absolute;left:0;right:0;height:26px}
.tl-t1{top:0}
.tl-t2{top:26px;border-top:1px solid var(--line)}
.tl-tk{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding-left:8px;border-left:1px solid var(--line);font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);white-space:nowrap;overflow:hidden;transition:left 280ms var(--ease),width 280ms var(--ease)}
.tl-t1 .tl-tk{color:var(--text-2);font-weight:600;border-left-color:var(--line-2)}
.tl-tk.c{justify-content:center;padding-left:0}
.tl-tk.we{background:rgba(128,140,170,.06)}
.tl-tk.td{color:var(--accent-t);font-weight:600}
.tl-tdy{position:absolute;top:4px;transform:translateX(-50%);height:18px;padding:0 6px;border-radius:5px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--accent-t);color:var(--accent-t);font:600 10.5px/18px 'JetBrains Mono',monospace;z-index:2;white-space:nowrap;transition:left 280ms var(--ease)}
.tl-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.tl-body{position:relative;padding-bottom:20px;min-height:100%}
.tl-ov{position:absolute;top:0;bottom:0;left:var(--lab);right:0;pointer-events:none;overflow:hidden}
.tl-gl{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line);transition:left 280ms var(--ease)}
.tl-gl.mj{border-left-color:var(--line-2)}
.tl-we{position:absolute;top:0;bottom:0;background:rgba(128,140,170,.05);transition:left 280ms var(--ease),width 280ms var(--ease)}
.tl-mg{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line-2);transition:left 280ms var(--ease)}
.tl-now{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent-t);opacity:.85;transition:left 280ms var(--ease)}
.tl-row{position:relative;display:grid;grid-template-columns:var(--lab) minmax(0,1fr);height:44px;border-bottom:1px solid var(--line)}
.tl-row.tk{height:32px}
.tl-row.ms{height:40px}
.tl-row.act{z-index:5}
.tl-lc{display:flex;align-items:center;gap:8px;min-width:0;padding:0 10px 0 12px;border-right:1px solid var(--line)}
.tl-lc.tk{padding-left:34px;gap:7px}
.tl-tr{position:relative;min-width:0;overflow-x:clip;overflow-y:visible}
.tl-eb{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:30px;padding:0 6px;margin-left:-6px;border:0;border-radius:6px;background:transparent;color:var(--text);font:600 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left;transition:background-color 120ms var(--ease)}
.tl-eb:hover{background:var(--hover)}
.tl-eb .chev{flex:none;color:var(--text-3);transition:transform 200ms var(--ease)}
.tl-eb[aria-expanded=true] .chev{transform:rotate(90deg)}
.tl-sq{width:10px;height:10px;border-radius:3px;flex:none;background:oklch(var(--es-l) var(--es-c) var(--h))}
.tl-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-cnt{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);flex:none}
.tl-key{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3);flex:none}
.tl-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--text-2)}
.tl-col{display:grid;grid-template-rows:0fr;transition:grid-template-rows 240ms var(--ease)}
.tl-col.open{grid-template-rows:1fr}
.tl-col>div{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s 240ms}
.tl-col.open>div{visibility:visible;transition-delay:0s}
.tl-bar{position:absolute;top:50%;height:24px;margin-top:-12px;min-width:6px;border-radius:6px;background:oklch(var(--eb-l) var(--eb-c) var(--h));box-shadow:inset 0 0 0 1px oklch(var(--es-l) var(--es-c) var(--h) / .45);touch-action:none;user-select:none;-webkit-user-select:none;transition:left 280ms var(--ease),width 280ms var(--ease),box-shadow 120ms var(--ease);z-index:2}
.tl-bar.tk{height:12px;margin-top:-6px;border-radius:4px}
.tl-bar.ed{cursor:grab}
.tl-bar.drag{cursor:grabbing;transition:box-shadow 120ms var(--ease);box-shadow:inset 0 0 0 1px var(--accent-t),0 6px 18px rgba(0,0,0,.35)}
.tl-bar:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
.tl-in{position:absolute;inset:0;border-radius:inherit;overflow:hidden;display:flex;align-items:center}
.tl-fill{position:absolute;left:0;top:0;bottom:0;background:oklch(var(--ef-l) var(--ef-c) var(--h));transition:width 600ms var(--ease)}
.tl-bar.tk .tl-fill{background:oklch(var(--es-l) var(--es-c) var(--h));opacity:.75}
.tl-pct{position:relative;margin-left:8px;font:600 11px/1 'JetBrains Mono',monospace;color:var(--text);white-space:nowrap}
.tl-grip{position:absolute;top:0;bottom:0;width:9px;z-index:3;display:flex;align-items:center;justify-content:center;cursor:ew-resize}
.tl-grip.l{left:0}
.tl-grip.r{right:0}
.tl-grip::after{content:"";width:2px;height:10px;border-radius:1px;background:var(--text);opacity:0;transition:opacity 120ms var(--ease)}
.tl-bar.tk .tl-grip::after{height:6px}
.tl-bar.ed:hover .tl-grip::after,.tl-bar:focus-visible .tl-grip::after{opacity:.55}
.tl-grip.on::after{opacity:1!important;background:var(--accent-t)}
.tl-tip{position:absolute;bottom:calc(100% + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:7px;height:26px;padding:0 9px;border-radius:7px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2);white-space:nowrap;z-index:6;pointer-events:none;animation:fadein 120ms var(--ease)}
.tl-bar.tk .tl-tip{bottom:auto;top:50%;left:calc(100% + 10px)!important;transform:translateY(-50%)}
.tl-tip .hi{color:var(--accent-t);font-weight:600}
.tl-tip .d{color:var(--text-3);padding-left:7px;border-left:1px solid var(--line-2)}
.tl-mw{position:absolute;top:0;bottom:0;width:0;padding:0;border:0;background:transparent;color:inherit;font:inherit;cursor:default;transition:left 280ms var(--ease)}
.tl-md{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);border-radius:2px;background:var(--bg);border:2px solid var(--accent-t)}
.tl-md.done{background:var(--ok);border-color:var(--ok)}
.tl-ml{position:absolute;top:50%;left:12px;margin-top:-6px;font:500 11px/12px 'JetBrains Mono',monospace;color:var(--text-2);white-space:nowrap}
.tl-mt{position:absolute;bottom:calc(50% + 12px);left:0;transform:translateX(-50%);padding:4px 7px;border-radius:6px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font:500 11px/1 'JetBrains Mono',monospace;color:var(--text);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms var(--ease)}
.tl-mw:hover .tl-mt,.tl-mw:focus-visible .tl-mt{opacity:1}
.tl-mw:focus-visible{outline:none}
.tl-mw:focus-visible .tl-md{box-shadow:0 0 0 3px var(--ring)}
/* calendar */
.cl{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.cl-dh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:none;border-bottom:1px solid var(--line)}
.cl-dh span{height:30px;display:flex;align-items:center;padding:0 10px;font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase}
.cl-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cl-cell{position:relative;display:flex;flex-direction:column;gap:2px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;min-height:0;transition:background-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.cl-cell:nth-child(7n){border-right:0}
.cl-cell.we{background:rgba(128,140,170,.05)}
.cl-cell.out .cl-dn{opacity:.45}
.cl-cell.drop{background:var(--accent-s);box-shadow:inset 0 0 0 1px var(--accent)}
.cl-dn{align-self:flex-start;min-width:22px;height:22px;padding:0 5px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2);flex:none}
.cl-cell.we .cl-dn,.cl-wh.we{color:var(--text-3)}
.cl-cell.td .cl-dn{background:var(--accent-s);color:var(--accent-t);font-weight:600}
.cl-chip{position:relative;display:flex;align-items:center;gap:5px;height:22px;flex:none;padding:0 6px;border-radius:5px;background:var(--surface);border:1px solid var(--line);font:500 12px/1 'Inter',sans-serif;color:var(--text);min-width:0;touch-action:none;user-select:none;-webkit-user-select:none;transition:background-color 120ms var(--ease),border-color 120ms var(--ease),opacity 150ms var(--ease)}
.cl-cell.we .cl-chip{opacity:.86}
.cl-chip.ed{cursor:grab}
.cl-chip:hover{background:var(--raised);border-color:var(--line-2);opacity:1}
.cl-chip.drag{z-index:50;cursor:grabbing;transition:none;opacity:1;background:var(--raised);border-color:var(--accent);box-shadow:var(--shadow-pop)}
.cl-chip.land{animation:clland 320ms var(--spring)}
@keyframes clland{0%{transform:scale(.92);opacity:.4}100%{transform:none;opacity:1}}
.cl-chip:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
.cl-chip.dn .cl-tt{color:var(--text-3)}
.cl-key{font:500 10.5px/1 'JetBrains Mono',monospace;color:var(--text-3);flex:none}
.cl-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-sync{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);border-top-color:var(--accent-t);flex:none;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl-more{align-self:flex-start;height:20px;padding:0 6px;border:0;border-radius:5px;background:transparent;color:var(--text-2);font:500 11.5px/1 'Inter',sans-serif;cursor:pointer;flex:none}
.cl-more:hover,.cl-more[aria-expanded=true]{background:var(--hover);color:var(--text)}
.cl-pop{position:absolute;top:-6px;left:-6px;width:248px;z-index:40;padding:6px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:4px;animation:clpop 150ms var(--ease)}
.cl-pop.r{left:auto;right:-6px}
.cl-pop.u{top:auto;bottom:-6px}
@keyframes clpop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cl-poph{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 4px 6px;font:600 12.5px/1 'Inter',sans-serif}
.cl-pop .cl-chip{height:26px;background:var(--surface)}
.cl-wk{flex:1;min-height:0;display:flex;flex-direction:column}
.cl-whs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:none;border-bottom:1px solid var(--line)}
.cl-wh{display:flex;align-items:baseline;gap:6px;height:44px;padding:0 10px;align-items:center;color:var(--text-2);font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;border-right:1px solid var(--line)}
.cl-wh:last-child{border-right:0}
.cl-wh b{font:600 18px/1 'Inter',sans-serif;letter-spacing:-.02em;color:var(--text);text-transform:none}
.cl-wh.we b{color:var(--text-3)}
.cl-wh.td b{color:var(--accent-t)}
.cl-wh.td{box-shadow:inset 0 -2px 0 var(--accent-t)}
.cl-wb{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cl-wc{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-right:1px solid var(--line);min-width:0;transition:background-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.cl-wc:last-child{border-right:0}
.cl-wc.we{background:rgba(128,140,170,.05)}
.cl-wc.td{background:color-mix(in oklab,var(--accent-s) 45%,transparent)}
.cl-wc.drop{background:var(--accent-s);box-shadow:inset 0 0 0 1px var(--accent)}
.cl-chip.lg{height:auto;flex-direction:column;align-items:stretch;gap:7px;padding:8px}
.cl-chip.lg .cl-tt{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;line-height:17px}
.cl-r{display:flex;align-items:center;gap:6px;min-width:0}
.cl-empty{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);padding:4px 4px}
.tc-btn:focus-visible,.seg-it:focus-visible,.tc-ib:focus-visible,.tl-eb:focus-visible,.cl-more:focus-visible,.ph-ib:focus-visible,.ph-day:focus-visible,.ph-card:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
/* phone */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.ph-sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font:600 14px/1 'Inter',sans-serif}
.ph-top{height:52px;flex:none;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid var(--line)}
.ph-ib{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:transparent;color:var(--text-2);cursor:pointer}
.ph-ib:hover{background:var(--hover);color:var(--text)}
.ph-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:8px 8px 10px;border-bottom:1px solid var(--line);flex:none}
.ph-day{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;border-radius:12px;background:transparent;color:var(--text-2);font:500 11px/1 'JetBrains Mono',monospace;cursor:pointer;transition:background-color 150ms var(--ease),color 150ms var(--ease)}
.ph-day b{font:600 16px/1 'Inter',sans-serif;color:var(--text)}
.ph-day.we b{color:var(--text-3)}
.ph-day.td b{color:var(--accent-t)}
.ph-day.on{background:var(--accent-s)}
.ph-day i{width:4px;height:4px;border-radius:50%;background:var(--text-3)}
.ph-day i.no{background:transparent}
.ph-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:96px;scrollbar-width:none}
.ph-gh{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:8px;height:38px;padding:0 16px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line);font:600 13.5px/1 'Inter',sans-serif}
.ph-gh .tc-mm{margin-left:auto}
.ph-gh.td{color:var(--accent-t)}
.ph-list{display:flex;flex-direction:column;gap:8px;padding:10px 12px 14px}
.ph-card{display:flex;flex-direction:column;gap:7px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;transition:border-color 120ms var(--ease),transform 120ms var(--ease)}
.ph-card:active{transform:scale(.99);border-color:var(--line-2)}
.ph-r{display:flex;align-items:center;gap:8px;min-width:0}
.ph-ttl{font:500 14px/20px 'Inter',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-none{padding:12px 16px 14px;color:var(--text-3);font-size:13px}
.ph-fab{position:absolute;right:16px;bottom:30px;width:54px;height:54px;border-radius:16px;border:0;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-pop)}
.ph-home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text-3);opacity:.5}
.tp-av.s{width:18px;height:18px;font-size:8.5px}
@media (max-width:760px){.sb-host{display:none!important}.tc-top{flex-wrap:wrap;height:auto;padding:8px 12px;gap:6px}.tc-crumb{display:none}.tl{--lab:120px}.cl-key{display:none}}
@media (prefers-reduced-motion:reduce){.tc *,.ph *,.seg-ind,.tl-col,.tl-bar,.tl-tk,.tl-gl,.tl-we,.tl-mg,.tl-now,.tl-mw,.tl-tdy,.cl-chip,.cl-pop,.tc-toast,.sk,.cl-sync{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:3340px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · PROJECT VIEWS</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Timeline &amp; calendar</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>week · month · quarter</span><span>drag snaps to days</span><span>⇧← → resize</span><span>⌥← → reschedule</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="9">
      <figure class="frame" style="grid-column:{{fx.gc}};grid-row:{{fx.gr}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">

          <sc-if value="{{fx.desk}}" hint-placeholder-val="{{true}}">
            <div class="app">
              <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="1">
                <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;navy&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;member&quot;,&quot;viewer&quot;],&quot;default&quot;:&quot;admin&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3340}}">
class Component extends DCLogic {
  state = { sb: {}, fr: {} };
//SB-JS-START
  sbGet(id) { return (this.state.sb && this.state.sb[id]) || {}; }
  sbSet(id, patch) { const all = { ...(this.state.sb || {}) }; all[id] = { ...(all[id] || {}), ...patch }; this.setState({ sb: all }); }
  sbFrame(id, cfg) {
    const self = this;
    const u = this.sbGet(id);
    const role = cfg.role || 'admin';
    const viewer = role === 'viewer';
    const ICON = {
      board: 'M2.5 3h3v10h-3zM6.5 3h3v7h-3zM10.5 3h3v5h-3z',
      backlog: 'M2.5 4h11M2.5 8h11M2.5 12h7',
      sprints: 'M12.5 6.5A4.8 4.8 0 004 5M3.5 9.5A4.8 4.8 0 0012 11M3.8 2.8v2.4h2.4M12.2 13.2v-2.4H9.8',
      objectives: 'M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM8 5.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z',
      milestones: 'M4 14V2.5h7.5L10 5.5l1.5 3H4',
      reports: 'M3 13V8M6.5 13V4M10 13V9.5M13.5 13V6'
    };
    const SUBS = [['board', 'Board'], ['backlog', 'Backlog'], ['sprints', 'Sprints'], ['objectives', 'Objectives'], ['milestones', 'Milestones'], ['reports', 'Reports']]
      .filter((s) => !viewer || ['board', 'backlog', 'objectives', 'milestones'].indexOf(s[0]) >= 0);
    const ALL = [
      ['PR', 'Platform Rebuild', 255], ['MO', 'Mobile App', 175], ['IN', 'Infra', 75], ['DS', 'Design System', 300], ['AP', 'Public API', 25],
      ['BI', 'Billing', 140], ['SE', 'Search', 215], ['ON', 'Onboarding', 335], ['DA', 'Data Pipeline', 100], ['QA', 'QA Automation', 50],
      ['SC', 'Security', 5], ['DO', 'Docs', 230], ['GR', 'Growth', 155], ['MK', 'Marketing Site', 285], ['PE', 'Performance', 195], ['AN', 'Analytics', 60]
    ];
    const list = cfg.many ? ALL : (viewer ? ALL.slice(0, 3) : ALL.slice(0, 5));
    const active = u.active || cfg.active || 'PR';
    const openKey = u.open === undefined ? active : u.open;
    const sub = u.sub || cfg.sub || 'board';
    const filter = u.filter || '';
    const q = filter.trim().toLowerCase();
    const shown = list.filter((p) => !q || p[1].toLowerCase().indexOf(q) >= 0 || p[0].toLowerCase() === q);
    const projects = shown.map(([badge, name, hue]) => {
      const isOpen = openKey === badge;
      const subs = SUBS.map(([k, label], i) => ({
        name: label, d: ICON[k], on: active === badge && sub === k ? 'on' : '', cur: active === badge && sub === k ? 'page' : 'false',
        pick: () => self.sbSet(id, { active: badge, sub: k, open: badge })
      }));
      const idx = SUBS.findIndex((s) => s[0] === sub);
      const step = cfg.touch ? 44 : 32;
      return {

          const m = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -step, ArrowDown: step }[ev.key];
          if (!m) return;
          ev.preventDefault();
          self.moveTask(fid, t, t.due, t.due + m, true);
        }
      };
    };
    const TODAY = K.TODAY;
    if (mode === 'week') {
      const wsd = K.dI('2026-10-05') + 7 * (u.wo || 0);
      const cols = Array.from({ length: 7 }, (_, j) => {
        const i = wsd + j, wd = K.dow(i), list = byDay[i] || [];
        return {
          dw: K.DOW[wd], n: K.dD(i).getUTCDate(), aria: fmtD(i) + ', ' + list.length + ' tasks',
          cls: (wd === 0 || wd === 6 ? 'we' : '') + (i === TODAY ? ' td' : '') + (cd && cd.over === i && cd.over !== (tasks.find((x) => x.id === cd.id) || {}).due ? ' drop' : ''),
          chips: list.map((t) => chip(t, 7)), none: list.length === 0
        };
      });
      return { mode, start: wsd, rows: 1, cols, period: K.fmt(wsd) + ' – ' + K.fmt(wsd + 6), popAny: false };
    }
    const mo = 9 + (u.mo || 0), yy = 2026 + Math.floor(mo / 12), mm = ((mo % 12) + 12) % 12;
    const first = Math.round((Date.UTC(yy, mm, 1) - K.DAY0) / 864e5);
    const dim = Math.round((Date.UTC(yy, mm + 1, 1) - Date.UTC(yy, mm, 1)) / 864e5);
    const lead = (K.dow(first) + 6) % 7, start = first - lead, rows = Math.ceil((lead + dim) / 7);
    const cap = cfg.cap || 3, pop = u.pop;
    const dragFrom = cd ? (tasks.find((x) => x.id === cd.id) || {}).due : null;
    const cells = Array.from({ length: rows * 7 }, (_, j) => {
      const i = start + j, wd = K.dow(i), list = byDay[i] || [], out = i < first || i >= first + dim;
      const over = list.length > cap;
      const vis = over ? list.slice(0, cap - 1) : list;
      const shown = cd && list.some((t) => t.id === cd.id) && !vis.some((t) => t.id === cd.id) ? vis.concat(list.filter((t) => t.id === cd.id)) : vis;
      const popOpen = pop === i;
      return {
        n: K.dD(i).getUTCDate() === 1 ? K.fmt(i) : K.dD(i).getUTCDate(),
        cls: (wd === 0 || wd === 6 ? 'we' : '') + (out ? ' out' : '') + (i === TODAY ? ' td' : '') + (cd && cd.over === i && i !== dragFrom ? ' drop' : ''),
        aria: fmtD(i) + ', ' + list.length + ' tasks',
        chips: (popOpen ? vis : shown).map((t) => chip(t, 7)), more: over, moreN: list.length - (cap - 1), popOpen,
        popCls: (j % 7 >= 5 ? 'r' : '') + (j / 7 >= rows - 2 ? ' u' : ''), popT: fmtD(i),
        all: popOpen ? list.map((t) => chip(t, 7)) : [],
        openPop: () => set({ pop: popOpen ? null : i })
      };
    });
    return { mode, start, rows, cells, period: K.MON[mm] + ' ' + yy, popAny: pop !== undefined && pop !== null, dows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((t) => ({ t })) };
  }
  moveTask(fid, t, from, to, kbd) {
    const K = this.K(), u = this.fGet(fid);
    const due = { ...(u.due || {}) }; due[t.id] = to;
    const pend = { ...(u.pend || {}) }; pend[t.id] = true;
    if (kbd) this._focus = fid + t.id;
    const lab = K.DOW[K.dow(to)] + ' ' + K.fmt(to);
    this.fSet(fid, { due, pend, cdrag: null, pop: null, land: t.id, live: t.id + ' moved to ' + lab,
      toast: this.toast(fid, { k: t.id, msg: '→ ' + lab, undo: { t: 'due', id: t.id, prev: from } }) });
    this.later('p' + fid + t.id, 700, () => { const p = { ...(this.fGet(fid).pend || {}) }; delete p[t.id]; this.fSet(fid, { pend: p }); });
    this.later('l' + fid, 400, () => this.fSet(fid, { land: null }));
  }
  build(fid, cfg) {
    const self = this, K = this.K(), u = this.fGet(fid), set = (p) => this.fSet(fid, p);
    const role = cfg.role, canEdit = role !== 'viewer';
    const view = u.view || cfg.view || 'timeline';
    const st = u.st || cfg.state || 'ready';
    const ready = st === 'ready';
    const VW = [['board', 'Board', 74, '#board'], ['list', 'List', 60, 'List-View.dc.html'], ['backlog', 'Backlog', 86, '#backlog'], ['timeline', 'Timeline', 90, null], ['calendar', 'Calendar', 92, null]];
    const views = VW.map(([k, label, w, href]) => ({
      label, w, d: K.ICON[k], link: !!href, btn: !href, href: href || '', cur: view === k ? 'page' : 'false',
      pick: () => set({ view: k, pop: null, toast: null })
    }));
    const isTl = ready && view === 'timeline', isCal = ready && view === 'calendar';
    const tl = isTl ? this.buildTl(fid, cfg, u, canEdit) : null;
    const cal = isCal ? this.buildCal(fid, cfg, u, canEdit) : null;
    const ZM = [['week', 'Week', 58], ['month', 'Month', 64], ['quarter', 'Quarter', 74]];
    const CM = [['month', 'Month', 64], ['week', 'Week', 58]];
    const zoom = u.zoom || cfg.zoom || 'month', calMode = u.cal || cfg.cal || 'month';
    const MM = view === 'calendar' ? CM : ZM, mcur = view === 'calendar' ? calMode : zoom;
    const modes = MM.map(([k, label, w]) => ({ label, w, on: k === mcur, pick: () => set(view === 'calendar' ? { cal: k, pop: null } : { zoom: k, pan: 0, drag: null }) }));
    const STEP = { week: 7, month: 28, quarter: 91 };
    const shift = (dir) => {
      if (view === 'calendar') { if (calMode === 'week') set({ wo: (u.wo || 0) + dir, pop: null }); else set({ mo: (u.mo || 0) + dir, pop: null }); }
      else set({ pan: (u.pan || 0) + dir * STEP[zoom] });
    };
    const undo = () => {
      const tt = self.fGet(fid).toast; if (!tt || !tt.undo) return;
      if (tt.undo.t === 'dates') { const nd = { ...(self.fGet(fid).dates || {}) }; nd[tt.undo.id] = tt.undo.prev; set({ dates: nd, toast: null, live: 'Undone' }); }
      else { const nd = { ...(self.fGet(fid).due || {}) }; nd[tt.undo.id] = tt.undo.prev; set({ due: nd, toast: null, land: tt.undo.id, live: 'Undone' }); }
    };
    const sbFrames = cfg.sb ? [this.sbFrame(fid, { role, collapsible: true, active: 'PR', sub: 'none' })] : [];
    const toast = u.toast || null;
    return {
      desk: true, phone: false, sbFrames, showTop: !!cfg.top, full: !!cfg.sb, showNew: !!cfg.sb && canEdit, canEdit,
      aria: view === 'calendar' ? 'Calendar' : 'Timeline',
      views, vInd: this.segInd(VW, view), modes, mInd: this.segInd(MM, mcur), modeAria: view === 'calendar' ? 'Calendar mode' : 'Zoom',
      isLoading: st === 'loading', isEmpty: st === 'empty', isError: st === 'error',
      isTl, isCal, isMonth: isCal && cal.mode === 'month', isWeek: isCal && cal.mode === 'week',
      tlCls: cfg.tlCls || '', tl: tl || { t1: [], t2: [], gl: [], we: [], ms: [], epics: [], now: 0, nowOn: false },
      cal: cal || { cells: [], cols: [], dows: [], rows: 1, start: 0 }, period: cal ? cal.period : '',
      popAny: !!(cal && cal.popAny), closePop: () => set({ pop: null }),
      popKey: (ev) => { if (ev.key === 'Escape' && self.fGet(fid).pop !== undefined && self.fGet(fid).pop !== null) { ev.preventDefault(); set({ pop: null }); } },
      prev: () => shift(-1), next: () => shift(1),
      goToday: () => set(view === 'calendar' ? { mo: 0, wo: 0, pop: null } : { pan: 0 }),
      skRows: [{ lw: 96, l: 4, w: 46 }, { lw: 120, l: 22, w: 52 }, { lw: 84, l: 0, w: 66 }, { lw: 72, l: 2, w: 88 }, { lw: 104, l: 30, w: 40 }],
      retry: () => { set({ st: 'loading' }); self.later('r' + fid, 1100, () => self.fSet(fid, { st: 'ready' })); },
      toastOn: !!toast, toast: toast || { k: '', msg: '' }, undo, live: u.live || ''
    };
  }
  buildPhone(fid, cfg) {
    const self = this, K = this.K(), u = this.fGet(fid), set = (p) => this.fSet(fid, p);
    const sel = u.day !== undefined ? u.day : K.TODAY;
    const ws = K.dI('2026-10-05');
    const byDay = {};
    K.TASKS.forEach((t) => { (byDay[t.due] = byDay[t.due] || []).push(t); });
    const epHue = {}, epName = {}; K.EPICS.forEach((e) => { epHue[e.id] = e.hue; epName[e.id] = e.name; });
    const mdays = Array.from({ length: 7 }, (_, j) => {
      const i = ws + j, wd = K.dow(i), on = i === sel;
      return { dw: K.DOW[wd].charAt(0), n: K.dD(i).getUTCDate(), on, dot: (byDay[i] || []).length ? '' : 'no',
        cls: (on ? 'on' : '') + (wd === 0 || wd === 6 ? ' we' : '') + (i === K.TODAY ? ' td' : ''),
        aria: K.DOW[wd] + ' ' + K.fmt(i) + ', ' + (byDay[i] || []).length + ' tasks', pick: () => set({ day: i }) };
    });
    const agenda = [];
    for (let i = sel; i < sel + 21 && agenda.length < 4; i++) {
      const list = (byDay[i] || []).slice().sort((a, b) => (K.SO[a.st] - K.SO[b.st]) || (b.pri - a.pri));
      if (!list.length && i !== sel) continue;
      agenda.push({
        label: (i === K.TODAY ? 'Today · ' : '') + K.DOW[K.dow(i)] + ', ' + K.fmt(i), cls: i === K.TODAY ? 'td' : '', count: list.length || '',
        none: !list.length, has: list.length > 0,
        cards: list.map((t) => ({ key: t.id, title: t.title, glyph: t.st, sc: K.SC[t.st], bars: 'n' + t.pri, pc: K.PC[t.pri], hue: K.P[t.asg][1], ini: t.asg, ehue: epHue[t.ep], epic: epName[t.ep] }))
      });
    }
    return { desk: false, phone: true, canEdit: cfg.role !== 'viewer', mdays, agenda, mToday: () => set({ day: K.TODAY }) };
  }
  renderVals() {
    const K = this.K();
    const role = this.props.role || 'admin';
    const theme = this.props.theme || 'navy';
    const ep = K.EPICS.find((e) => e.id === 'sprint');
    const frames = [
      { ...this.build('main', { role, sb: true, top: true, view: 'timeline', zoom: 'month', cap: 4, open: { board: true } }),
        label: 'Timeline', meta: 'drag a bar · edges resize · switch to Calendar', gc: '1 / span 6', gr: '1', w: 1280, h: 860, r: 14 },
      { ...this.build('tq', { role, top: true, view: 'timeline', zoom: 'quarter', tlCls: 'nar' }),
        label: 'Timeline · quarter', meta: 'Q3 → Q1 · short milestone labels', gc: '1 / span 4', gr: '2', w: 840, h: 420, r: 12 },
      { ...this.buildPhone('mob', { role }),
        label: 'Mobile', meta: '390 · agenda by day', gc: '5 / span 2', gr: '2 / span 2', w: 390, h: 844, r: 36 },
      { ...this.build('drag', { role, view: 'timeline', zoom: 'month', tlCls: 'nar', drag: role === 'viewer' ? null : { id: 'sprint', mode: 'r', s: ep.s, e: ep.e + 12 }, open: { sprint: true } }),
        label: 'Resizing', meta: 'right edge · snaps to days · live dates', gc: '1 / span 4', gr: '3', w: 840, h: 384, r: 12 },
      { ...this.build('cm', { role, top: true, view: 'calendar', cal: 'month', cap: 3 }),
        label: 'Calendar · month', meta: 'drag a chip to another day · +N more', gc: '1 / span 4', gr: '4 / span 2', w: 840, h: 600, r: 12 },
      { ...this.build('load', { role, view: 'timeline', state: 'loading', tlCls: 'xs' }),
        label: 'Loading', meta: 'skeleton in bar lanes', gc: '5 / span 2', gr: '4', w: 400, h: 260, r: 12 },
      { ...this.build('emp', { role, view: 'timeline', state: 'empty' }),
        label: 'Empty', meta: 'no dated tasks', gc: '5 / span 2', gr: '5', w: 400, h: 260, r: 12 },
      { ...this.build('cw', { role, top: true, view: 'calendar', cal: 'week' }),
        label: 'Calendar · week', meta: 'Oct 5 – 11 · ⌥← → moves a day', gc: '1 / span 4', gr: '6', w: 840, h: 440, r: 12 },
      { ...this.build('err', { role, view: 'timeline', state: 'error', tlCls: 'xs' }),
        label: 'Error', meta: 'retry reloads', gc: '5 / span 2', gr: '6', w: 400, h: 260, r: 12 }
    ];
    return { themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy', frames };
  }
}
