.cf-sw{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);cursor:pointer}
.cf-sw:hover{border-color:var(--control)}
.cf-sw i{width:10px;height:10px;border-radius:50%;display:block}
.cf-opt .cf-inp{height:30px}
.cf-pal{position:absolute;top:34px;left:0;z-index:30;display:grid;grid-template-columns:repeat(4,28px);gap:4px;padding:6px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);animation:tpmenu 150ms var(--ease)}
.cf-pal button{width:28px;height:28px;border:0;border-radius:6px;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cf-pal button:hover,.cf-pal button[aria-checked=true]{background:var(--hover)}
.cf-pal i{width:12px;height:12px;border-radius:50%;display:block}
.cf-pal button[aria-checked=true] i{box-shadow:0 0 0 2px var(--raised),0 0 0 3.5px currentColor}
.cf-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.cf-toggle small{display:block;font-size:12px;color:var(--text-3);margin-top:3px}
.tg{appearance:none;-webkit-appearance:none;width:32px;height:18px;margin:0;border-radius:9px;border:1px solid var(--control);background:var(--raised);position:relative;cursor:pointer;flex:none;transition:background-color 150ms var(--ease),border-color 150ms var(--ease)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text-2);transition:transform 180ms var(--spring),background-color 150ms var(--ease)}
.tg:checked{background:var(--accent);border-color:var(--accent)}
.tg:checked::after{transform:translateX(14px);background:#fff}
.cf-warn{display:flex;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid rgba(245,183,59,.35);background:rgba(245,183,59,.08);font-size:12.5px;line-height:18px;color:var(--text)}
.cf-warn svg{flex:none;color:var(--warn);margin-top:1px}
.cf-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);font-weight:500;white-space:nowrap;animation:tpmenu 200ms var(--ease)}
.cf-mock{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;gap:10px}
.cf-mock i{display:block;height:44px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.narrow .cf-nav{display:none}
.narrow .cf-main{padding:18px 16px 28px}
.narrow .cf-lh{display:none}
.narrow .cf-row{grid-template-columns:24px minmax(0,1fr) 64px 30px}
.narrow .cf-row .cf-type{display:none}
.narrow .cf-row.ro{grid-template-columns:minmax(0,1fr) 64px}
.narrow .cf-types{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.cf-nav{display:none}.cf-main{padding:18px 16px 28px}.cf-lh{display:none}.cf-row{grid-template-columns:24px minmax(0,1fr) 64px 30px}.cf-row .cf-type{display:none}.cf-types{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cf-ni:focus-visible,.cf-h:focus-visible,.cf-ib:focus-visible,.cf-tt:focus-visible,.cf-sw:focus-visible,.cf-pal button:focus-visible,.tg:focus-visible,.cf-toggle:focus-within{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
/* ---- board cards ---- */
.bd-col{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.bd-colh{display:flex;align-items:center;gap:8px;height:28px;padding:0 4px;font-weight:600}
.bd-card{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:grab;text-align:left;font:inherit;color:inherit;transition:transform 150ms var(--spring),box-shadow 150ms var(--ease),border-color 120ms var(--ease)}
.bd-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow-pop)}
.bd-card.blk{border-color:rgba(255,122,112,.3)}
.bd-tt{margin:0;font-size:13px;line-height:20px;font-weight:500}
.bd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:22px}
.bd-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;background:rgba(255,122,112,.12);color:var(--danger);font:600 11.5px/1 'Inter',sans-serif}
.bd-timer{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px;border-radius:6px;border:0;background:var(--accent-s);color:var(--accent-t);font:500 11.5px/1 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color 120ms var(--ease)}
.bd-timer.off{background:var(--raised);color:var(--text-2)}
.bd-timer:hover{filter:brightness(1.15)}
.bd-ent{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:6px;background:var(--raised);border:1px solid var(--line);font-size:11.5px;color:var(--text-2)}
.bd-timer:focus-visible,.bd-card:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
/* ---- timesheet ---- */
.ts{position:absolute;inset:0;overflow:auto;padding:22px 24px 28px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.ts-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ts-head h2{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em;margin-right:auto}
.ts-sel{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--raised);color:var(--text);font:500 13px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.ts-sel:hover,.ts-sel[aria-expanded=true]{background:var(--hover);border-color:var(--control)}
.ts-rel{position:relative}
.ts-wk{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 2px;border-radius:7px;border:1px solid var(--line-2);background:var(--raised)}
.ts-wk span{font:500 12px/1 'JetBrains Mono',monospace;padding:0 6px;white-space:nowrap}
.ts-wkb{width:26px;height:26px;border:0;border-radius:5px;background:transparent;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ts-wkb:hover{background:var(--hover);color:var(--text)}
.ts-card{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ts-scroll{overflow-x:auto;border-radius:12px}
.ts-grid{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(7,minmax(54px,1fr)) minmax(64px,1fr);min-width:640px}
.ts-th{height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3);border-bottom:1px solid var(--line)}
.ts-th b{font-weight:500;color:var(--text-2)}
.ts-th.first{align-items:flex-start;padding-left:14px}
.ts-th.today b{color:var(--accent-t)}
.ts-th.today{box-shadow:inset 0 -2px 0 var(--accent)}
.ts-p{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-bottom:1px solid var(--line);font-weight:500;min-width:0;white-space:nowrap;overflow:hidden}
.ts-c{position:relative;height:44px;padding:3px;border-bottom:1px solid var(--line)}
.ts-cell{width:100%;height:100%;border:0;border-radius:6px;display:flex;align-items:center;justify-content:center;font:500 12px/1 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;color:var(--text);cursor:default;transition:filter 120ms var(--ease),box-shadow 120ms var(--ease)}
.t-navy .ts-cell.hi,.t-dark .ts-cell.hi{color:#fff}
.ts-cell.zero{color:var(--text-3)}
.ts-cell.fut{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--raised) 5px 6px)}
.ts-cell:hover,.ts-cell.on{box-shadow:0 0 0 1.5px var(--text-2)}
.ts-tot{display:flex;align-items:center;justify-content:flex-end;height:44px;padding:0 14px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font:600 12px/1 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.ts-tot.th{height:40px;font-weight:500;font-size:11px;color:var(--text-3)}
.ts-foot{display:flex;align-items:center;justify-content:center;height:40px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-2);background:var(--raised);font-variant-numeric:tabular-nums}
.ts-foot.first{justify-content:flex-start;padding-left:14px;font-family:'Inter',sans-serif;font-weight:600;color:var(--text);border-bottom-left-radius:12px}
.ts-foot.last{justify-content:flex-end;padding-right:14px;color:var(--text);font-weight:600;border-left:1px solid var(--line);border-bottom-right-radius:12px}
.ts-tip{position:absolute;left:50%;transform:translateX(-50%);z-index:8;min-width:170px;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:5px;white-space:nowrap;pointer-events:none;animation:tpfade 120ms var(--ease);text-align:left}
.ts-tip.dn{top:calc(100% + 2px)}
.ts-tip.up{bottom:calc(100% + 2px)}
.ts-tip.r{left:auto;right:0;transform:none}
.ts-tiph{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.ts-tipr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.ts-tipr b{margin-left:auto;font:600 12px/1 'JetBrains Mono',monospace;color:var(--text)}
.ts-leg{display:flex;align-items:center;gap:6px;font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.ts-leg i{width:18px;height:10px;border-radius:3px;display:block}
.ts-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;padding:24px;text-align:center}
.ts-state b{font-size:14px;font-weight:600}
.ts-skr{display:grid;grid-template-columns:1.6fr repeat(8,minmax(0,1fr));gap:6px;padding:8px 12px}
.narrow .ts{padding:16px}
.narrow .ts-head h2{font-size:17px;width:100%}
.ts-sel:focus-visible,.ts-wkb:focus-visible,.ts-cell:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){.ts{padding:16px}.ts-head h2{font-size:17px;width:100%}}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}.sk,.tx-pulse{animation:none}}

</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:5660px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · TASK DETAIL EXTENSIONS</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Fields, dependencies, time</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>5 field types</span><span>blocks / blocked by</span><span>timer + log</span><span>timesheet</span><span>role: {{role}}</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="6">
      <figure class="frame" style="grid-column:{{fx.col}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev {{fx.devCls}}" style="height:{{fx.h}}px;border-radius:{{fx.r}}px;width:{{fx.w}}">

          <sc-if value="{{fx.isPanel}}" hint-placeholder-val="{{true}}">
            <sc-if value="{{fx.phone}}" hint-placeholder-val="{{false}}"><div class="mockbg"><i></i><i></i><i></i><i></i></div><div class="scrim"></div></sc-if>
            <sc-for list="{{fx.panels}}" as="p" hint-placeholder-count="1">
<!--TP-START-->
            <aside class="tp {{p.cls}}" aria-label="Task {{p.key}}" sc-camel-on-key-down="{{p.onKey}}">
              <span class="tp-grab" aria-hidden="true"></span>
              <div class="tp-head">
                <span class="tp-crumb">{{p.crumb}}</span><span style="color:var(--text-3);margin:0 2px">/</span>
                <button class="tp-key" type="button" sc-camel-on-click="{{p.copyKey}}" aria-label="Copy task key {{p.key}}">{{p.key}}<svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"></rect><path d="M2 8V3a1 1 0 011-1h5" stroke-linecap="round"></path></svg></button>
                <sc-if value="{{p.copied}}" hint-placeholder-val="{{false}}"><span role="status" style="font-size:12px;color:var(--ok)">Copied</span></sc-if>
                <span style="flex:1"></span>
                <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}">
                  <button class="tp-done {{p.doneCls}}" type="button" aria-pressed="{{p.isDone}}" sc-camel-on-click="{{p.markDone}}" title="{{p.doneTitle}}"><span class="tp-ring {{p.ringFx}}"></span>{{p.doneLabel}}</button>
                </sc-if>
                <sc-if value="{{p.showExpand}}" hint-placeholder-val="{{true}}">
                  <button class="tp-ib" type="button" sc-camel-on-click="{{p.toggleFull}}" aria-label="{{p.fullLabel}}" title="{{p.fullLabel}} (⌘⇧F)">
                    <sc-if value="{{p.isFull}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2L8.5 5.5M8.5 2.5v3h3M2 12l3.5-3.5M5.5 11.5v-3h-3"></path></svg></sc-if>
                    <sc-if value="{{p.notFull}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 2h3.5v3.5M5.5 12H2V8.5M12 2L8 6M2 12l4-4"></path></svg></sc-if>
                  </button>
                </sc-if>
                <span class="tp-rel">
                  <button class="tp-ib" type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="{{p.moreOpen}}" sc-camel-on-click="{{p.toggleMore}}"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3"></circle><circle cx="8" cy="8" r="1.3"></circle><circle cx="12.5" cy="8" r="1.3"></circle></svg></button>
                  <sc-if value="{{p.moreOpen}}" hint-placeholder-val="{{false}}">
                    <div class="tp-menu" role="menu" style="top:36px;right:0">
                      <button class="tp-mi" type="button" role="menuitem" sc-camel-on-click="{{p.copyLink}}"><span style="flex:1">Copy link</span><span class="tp-kbd">⌘L</span></button>
                      <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-mi" type="button" role="menuitem"><span style="flex:1">Duplicate</span><span class="tp-kbd">⌘D</span></button></sc-if>
                      <sc-if value="{{p.canDelete}}" hint-placeholder-val="{{true}}"><div class="tp-sep"></div><button class="tp-mi dng" type="button" role="menuitem" sc-camel-on-click="{{p.deleteTask}}"><span style="flex:1">Delete task</span><span class="tp-kbd">⌫</span></button></sc-if>
                    </div>
                  </sc-if>
                </span>
                <sc-if value="{{p.showClose}}" hint-placeholder-val="{{true}}">
                  <button class="tp-ib" type="button" sc-camel-on-click="{{p.closePanel}}" aria-label="Close" title="Close (Esc)"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"></path></svg></button>
                </sc-if>
              </div>

              <div class="tp-scroll tp-fade">
                <sc-if value="{{p.isDeleted}}" hint-placeholder-val="{{false}}">
                  <div style="padding:14px 20px 0"><div class="tp-banner" role="status">
                    <svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--danger)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"></path></svg>
                    <span style="flex:1;font-weight:600">Deleted <span style="font-weight:400;color:var(--text-3)">· restorable for 30 days</span></span>
                    <button class="tp-btn sec" type="button" sc-camel-on-click="{{p.restore}}">Restore</button>
                  </div></div>
                </sc-if>
                <div class="tp-body {{p.bodyCls}}">

                  <div class="tp-title">
                    <sc-if value="{{p.titleEditing}}" hint-placeholder-val="{{false}}">
                      <input class="tp-tin" type="text" aria-label="Task title" value="{{p.draftTitle}}" sc-camel-on-change="{{p.onDraftTitle}}" sc-camel-on-key-down="{{p.onTitleKey}}" sc-camel-on-blur="{{p.saveTitle}}" sc-camel-auto-focus="{{true}}">
                    </sc-if>
                    <sc-if value="{{p.titleStatic}}" hint-placeholder-val="{{true}}">
                      <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-ti" type="button" sc-camel-on-click="{{p.startTitle}}">{{p.title}}</button></sc-if>
                      <sc-if value="{{p.cannotEdit}}" hint-placeholder-val="{{false}}"><h2 style="margin:0;font:600 22px/30px 'Inter',sans-serif;letter-spacing:-.015em">{{p.title}}</h2></sc-if>
                    </sc-if>
                    <sc-if value="{{p.isViewer}}" hint-placeholder-val="{{false}}">
                      <div class="tp-note"><svg width="14" height="14" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M1.5 7S3.5 3 7 3s5.5 4 5.5 4-2 4-5.5 4-5.5-4-5.5-4z"></path><circle cx="7" cy="7" r="1.6"></circle></svg>View only</div>
                    </sc-if>
                  </div>

                  <div class="tp-props">
                    <div class="tp-chips">
                      <span class="tp-rel">
                        <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-chip" type="button" aria-haspopup="listbox" aria-expanded="{{p.statusOpen}}" sc-camel-on-click="{{p.toggleStatus}}" aria-label="Status: {{p.st.name}}"><span class="tp-g {{p.st.glyph}}" style="color:{{p.st.color}}"></span>{{p.st.name}}</button></sc-if>
                        <sc-if value="{{p.cannotEdit}}" hint-placeholder-val="{{false}}"><span class="tp-chip ro"><span class="tp-g {{p.st.glyph}}" style="color:{{p.st.color}}"></span>{{p.st.name}}</span></sc-if>
                        <sc-if value="{{p.statusOpen}}" hint-placeholder-val="{{false}}">
                          <div class="tp-menu" role="listbox" aria-label="Status" style="top:34px;left:0">
                            <sc-for list="{{p.statusOpts}}" as="o" hint-placeholder-count="6"><button class="tp-mi {{o.on}}" type="button" role="option" aria-selected="{{o.sel}}" sc-camel-on-click="{{o.pick}}"><span class="tp-g {{o.glyph}}" style="color:{{o.color}}"></span><span style="flex:1">{{o.name}}</span><span class="tp-kbd">{{o.n}}</span></button></sc-for>
                          </div>
                        </sc-if>
                      </span>
                      <span class="tp-rel">
                        <sc-if value="{{p.priSet}}" hint-placeholder-val="{{true}}">
                          <sc-if value="{{p.canEdit}}" hint-placeholder-val="{{true}}"><button class="tp-chip" type="button" aria-haspopup="listbox" aria-expanded="{{p.priOpen}}" sc-camel-on-click="{{p.togglePri}}" aria-label="Priority: {{p.pri.name}}"><span class="tp-bars {{p.pri.cls}}" style="color:{{p.pri.color}}"><i></i><i></i><i></i><i></i></span>{{p.pri.name}}</button></sc-if>
                          <sc-if value="{{p.cannotEdit}}" hint-placeholder-val="{{false}}"><span class="tp-chip ro"><span class="tp-bars {{p.pri.cls}}" style="color:{{p.pri.color}}"><i></i><i></i><i></i><i></i></span>{{p.pri.name}}</span></sc-if>
                        </sc-if>
                        <sc-if value="{{p.priGhost}}" hint-placeholder-val="{{false}}"><button class="tp-chip ghost" type="button" aria-haspopup="listbox" aria-expanded="{{p.priOpen}}" sc-camel-on-click="{{p.togglePri}}">+ Priority</button></sc-if>
                        <sc-if value="{{p.priOpen}}" hint-placeholder-val="{{false}}">
                          <div class="tp-menu" role="listbox" aria-label="Priority" style="top:34px;left:0">
                            <sc-for list="{{p.priOpts}}" as="o" hint-placeholder-count="5"><button class="tp-mi {{o.on}}" type="button" role="option" aria-selected="{{o.sel}}" sc-camel-on-click="{{o.pick}}"><span class="tp-bars {{o.cls}}" style="color:{{o.color}}"><i></i><i></i><i></i><i></i></span><span style="flex:1">{{o.name}}</span><span class="tp-kbd">{{o.n}}</span></button></sc-for>
                          </div>
                        </sc-if>
                      </span>
                      <span class="tp-rel">

      timeEst: 360, entries: ENT
    };
    const OVER = { ...FULL, entries: ENT.concat({ id: 'e4', who: 'RC', mins: 150, date: '2026-10-06', note: 'Cross-browser pass', src: 'manual' }) };
    const tasksSt = this._tasks || this.state.tasks || {};
    const task = (fid, base) => ({ ...base, ...(tasksSt[fid] || {}) });
    const onChange = (fid) => (patch) => { const all = { ...(self._tasks || self.state.tasks || {}) }; all[fid] = { ...(all[fid] || {}), ...patch }; self._tasks = all; self.setState({ tasks: all }); };
    const P = (fid, base, cfg) => [this.tpBuild(fid, { task: task(fid, base), onChange: onChange(fid), static: true, showClose: false, role, cfDefs: defs, ...cfg })];
    const blank = { isPanel: false, isSettings: false, isDialogFrame: false, isBoard: false, isTs: false, phone: false, devCls: '', panels: [], s: {}, b: {}, t: {}, d: {}, c: {}, dlgOpen: false, confirmOpen: false, toastOn: false, toast: '', undoOn: false, undo: () => {}, r: 14, w: '100%', col: 'auto' };
    const SF = (id, cfg) => ({ ...blank, isSettings: !cfg.dialogOnly, isDialogFrame: !!cfg.dialogOnly, ...this.sframe(id, { role, ...cfg }), devCls: cfg.narrow ? 'narrow' : '' });
    const TF = (id, cfg) => ({ ...blank, isTs: true, t: this.tframe(id, { role, ...cfg }), devCls: cfg.narrow ? 'narrow' : '' });
    const taskA = task('a', FULL);
    const mobile = { ...blank, isPanel: true, phone: true, w: '390px', r: 28, label: 'Mobile', meta: '390 · timer running · over estimate', h: 844, panels: P('m', OVER, { sheet: true }) };
    mobile.panels[0].cls = 'sheet';
    const frames = [
      { ...blank, isPanel: true, col: '1 / 4', label: 'Panel', meta: 'custom fields · dependencies · time · try the timer and Log time', h: 1560, panels: P('a', FULL, { full: true }) },
      mobile,
      { ...blank, isBoard: true, label: 'Board cards', meta: 'blocked · running timer · field chip', h: 844, b: this.board(taskA, defs) },
      { ...SF('D', { dialogOnly: true, alwaysOpen: true, dlgInit: { name: 'Environment', type: 'select', opts: [{ id: 'k1', name: 'Production', color: 'var(--danger)' }, { id: 'k2', name: 'Staging', color: 'var(--warn)' }, { id: 'k3', name: 'Preview', color: 'var(--low)' }], required: false, tried: false, pal: null, focusOpt: null } }), label: 'Create field dialog', meta: 'select with colored options', h: 844 },
      { ...SF('S', {}), col: '1 / 3', label: 'Custom fields settings', meta: 'drag or Alt+↑↓ · delete warns · Undo', h: 640 },
      { ...SF('E', { local: true, narrow: true, init: { defs: [] } }), label: 'Empty', meta: 'no fields yet', h: 640 },
      { ...TF('T', {}), col: '1 / 3', label: 'Timesheet', meta: 'hover a cell · week nav · Export CSV', h: 600 },
      { ...TF('TE', { narrow: true, init: { phase: 'empty', wk: -1 } }), label: 'Empty week', meta: 'nothing logged', h: 600 },
      { ...SF('SL', { narrow: true, init: { phase: 'loading' } }), label: 'Fields loading', meta: 'skeleton', h: 420 },
      { ...SF('SX', { narrow: true, init: { phase: 'error' } }), label: 'Fields failed', meta: 'Retry works', h: 420 },
      { ...TF('TL', { narrow: true, init: { phase: 'loading' } }), label: 'Timesheet loading', meta: 'skeleton', h: 420 },
      { ...TF('TX', { narrow: true, init: { phase: 'error' } }), label: 'Timesheet failed', meta: 'Retry works', h: 420 },
      { ...blank, isPanel: true, col: '2 / 4', label: 'Viewer', meta: 'read-only · timer, editors, remove hidden', h: 900, panels: P('v', FULL, { role: 'viewer' }) }
    ];
    return { themeCls, role, frames };
  }
}
