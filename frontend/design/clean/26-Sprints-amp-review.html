.sp-nmeta{display:flex;gap:8px}
.sp-goal{white-space:normal}
.sp-bhead{padding:10px 14px;gap:10px}
.sp-bprog{width:100%}
.sp-cols{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 14px 40px}
.sp-bc{flex:0 0 86%;scroll-snap-align:center}
.sp-modal{left:0;right:0;top:auto;bottom:0;width:auto;max-height:92%;transform:none;border-radius:18px 18px 0 0;border-bottom:0;animation:spsheet 280ms var(--ease)}
.sp-grab{display:block}
.sp-mh{padding:8px 8px 10px 16px}
.sp-steps .t{display:none}
.sp-mb{padding:14px 16px 18px}
.sp-mf{padding:10px 12px 26px 16px;flex-wrap:wrap}
.sp-mf .sp-m{width:100%;order:-1;margin-bottom:4px}
.sp-mf .sp-btn{height:44px;flex:1;justify-content:center}
.sp-mf .sp-sp{display:none}
.sp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.sp-two{grid-template-columns:minmax(0,1fr)}
.sp-dsts{grid-template-columns:minmax(0,1fr)}
.sp-tk{grid-template-columns:16px 14px minmax(0,1fr) auto;min-height:48px}
.sp-tk .sp-key,.sp-tk .sp-pts,.sp-tk .tp-av,.sp-tk .tp-avn{display:none}
.sp-sa{grid-template-columns:auto minmax(0,1fr) auto 20px}
.sp-sa .sp-key,.sp-sa .d{display:none}
}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important;transition-delay:0ms!important}.sk{animation:none}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:4220px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · PLANNING</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Sprints</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>active · planned · completed</span><span>3-step close</span><span>role: {{roleLabel}}</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="10">
      <figure class="frame" style="grid-column:{{fx.gc}};grid-row:{{fx.gr}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">
          <div class="sp-app">
            <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="1">
              <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                  <input class="sb-sinp" type="search" placeholder="Search or jump…" autocomplete="off">
                  <span class="kbd">⌘K</span>
                </label>

                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}">
                  <button class="sb-new" type="button"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span style="flex:1;text-align:left">New task</span><span class="kbd">C</span></button>
                </sc-if>

                <div class="sb-scroll {{fr.maskCls}}">
                  <a class="sb-it" href="#inbox"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="lab">Inbox</span><span class="sb-unread" aria-label="{{fr.inbox}} unread">{{fr.inbox}}</span></a>
                  <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}">
                    <a class="sb-it" href="#mine"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg><span class="lab">My tasks</span><span class="sb-count">7</span></a>
                  </sc-if>

                  <div class="sb-sec"><button class="sb-sect" type="button" aria-expanded="{{fr.pinOpen}}" sc-camel-on-click="{{fr.togglePin}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Pinned views</button></div>
                  <div class="sb-col {{fr.pinCls}}"><div>
                    <sc-for list="{{fr.pins}}" as="p" hint-placeholder-count="3">
                      <a class="sb-it" href="#view"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg><span class="lab">{{p.name}}</span><span class="sb-count">{{p.n}}</span></a>
                    </sc-for>
                  </div></div>

                  <div class="sb-sec {{fr.secCls}}">
                    <button class="sb-sect" type="button" aria-expanded="{{fr.projOpen}}" sc-camel-on-click="{{fr.toggleProjSec}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Projects<span style="color:var(--text-3);letter-spacing:0">{{fr.projCount}}</span></button>
                    <sc-if value="{{fr.canProj}}" hint-placeholder-val="{{true}}">
                      <span class="sb-tw"><button class="sb-icb sm" type="button" aria-label="New project"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New project</span></span>
                    </sc-if>
                  </div>
                  <div class="sb-col {{fr.projSecCls}}"><div>
                    <sc-if value="{{fr.showFilter}}" hint-placeholder-val="{{false}}">
                      <input class="sb-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" value="{{fr.filter}}" sc-camel-on-change="{{fr.onFilter}}">
                    </sc-if>
                    <sc-for list="{{fr.projects}}" as="pj" hint-placeholder-count="5">
                      <div>
                        <button class="sb-it {{pj.on}}" type="button" aria-expanded="{{pj.open}}" sc-camel-on-click="{{pj.toggle}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{pj.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{pj.hue}})">{{pj.badge}}</span>
                          <span class="lab">{{pj.name}}</span>
                          <svg class="sb-chev {{pj.chev}}" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                        </button>
                        <div class="sb-col {{pj.colCls}}"><div>
                          <div class="sb-subs" role="list">
                            <span class="sb-ind" style="transform:translateY({{pj.indY}}px);opacity:{{pj.indO}}"></span>
                            <sc-for list="{{pj.subs}}" as="s" hint-placeholder-count="6">
                              <button class="sb-si {{s.on}}" type="button" role="listitem" aria-current="{{s.cur}}" sc-camel-on-click="{{s.pick}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>{{s.name}}</button>
                            </sc-for>
                          </div>
                        </div></div>
                      </div>
                    </sc-for>
                    <sc-if value="{{fr.noMatch}}" hint-placeholder-val="{{false}}"><p style="margin:6px 8px;font-size:12px;color:var(--text-3)">No projects match.</p></sc-if>
                  </div></div>
                </div>

                <div class="sb-foot">
                  <button class="sb-spr" type="button" sc-camel-on-click="{{fr.openBoard}}" aria-label="Sprint 14, {{fr.sprPct}} percent, 7 days left. Open board">
                    <svg width="30" height="30" sc-camel-view-box="0 0 30 30" fill="none" aria-hidden="true"><circle cx="15" cy="15" r="11.5" stroke="var(--raised)" stroke-width="3.5"></circle><circle class="sb-rg" cx="15" cy="15" r="11.5" stroke="var(--accent-t)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="72.3" style="stroke-dashoffset:{{fr.sprOff}}" transform="rotate(-90 15 15)"></circle></svg>
                    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;font-size:13px;line-height:16px">Sprint 14</span><span class="mono" style="font-size:11px;line-height:14px;color:var(--text-3)">{{fr.sprPct}}% · 7d left</span></span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                  </button>
                  <div class="sb-row">
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <a class="sb-it" href="#members"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7.5a2.3 2.3 0 100-4.6 2.3 2.3 0 000 4.6zM2 13c.5-2.2 2-3.5 4-3.5s3.5 1.3 4 3.5M10.5 3.2a2.2 2.2 0 010 4.2M12 9.8c1 .5 1.7 1.6 2 3.2"></path></svg><span class="lab">Members &amp; roles</span></a>
                      </sc-if>
                      <sc-if value="{{fr.canSettings}}" hint-placeholder-val="{{true}}">
                        <a class="sb-it" href="#settings"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8zM8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M3.6 12.4l1.2-1.2M11.2 4.8l1.2-1.2"></path></svg><span class="lab">Settings</span><span class="sb-count">⌘,</span></a>
                      </sc-if>
                    </div>
                    <span class="sb-tw" style="align-self:flex-end"><button class="sb-icb" type="button" aria-label="Keyboard shortcuts"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM6.4 6.4a1.7 1.7 0 113 1.1c-.6.4-1.4.8-1.4 1.6M8 11.1v.1"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Shortcuts <span class="kbd">?</span></span></span>
                  </div>
                  <div style="position:relative" sc-camel-on-key-down="{{fr.profKey}}">
                    <sc-if value="{{fr.profOpen}}" hint-placeholder-val="{{false}}">
                      <div class="sb-menu up" role="menu" aria-label="Account" style="left:0;right:0;bottom:calc(100% + 6px)">
                        <div style="padding:8px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column;gap:2px"><span style="font-weight:600">Alex Kim</span><span style="font-size:12px;color:var(--text-3)">alex@team.dev</span></div>
                        <a class="sb-mi" role="menuitem" href="#profile"><span style="flex:1">Profile</span><span class="kbd">G P</span></a>
                        <a class="sb-mi" role="menuitem" href="#prefs"><span style="flex:1">Preferences</span></a>
                        <div class="sb-sep"></div>
                        <a class="sb-mi" role="menuitem" href="#signout">Sign out</a>
                      </div>
                    </sc-if>
                    <button class="sb-prof" type="button" aria-haspopup="menu" aria-expanded="{{fr.profOpen}}" aria-label="Account: Alex Kim" sc-camel-on-click="{{fr.toggleProf}}">
                      <span class="sb-av" style="background:oklch(var(--av-l) var(--av-c) 285)">AK<span class="sb-pres"></span></span>
                      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:13px;line-height:16px">Alex Kim</span><span style="font-size:11px;line-height:14px;color:var(--text-3)">{{fr.roleLabel}} · {{fr.wsName}}</span></span>
                      <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6L8 2.8 11.5 6M4.5 10L8 13.2l3.5-3.2"></path></svg>
                    </button>
                  </div>
                </div>
              </nav>
            </sc-if>

            <sc-if value="{{fr.rail}}" hint-placeholder-val="{{false}}">
              <nav class="sb-rail fade" aria-label="Main navigation (collapsed)">
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Workspace: {{fr.wsName}}" sc-camel-on-click="{{fr.toggleRail}}"><span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span></button><span class="sb-tip" role="tooltip">{{fr.wsName}}</span></span>
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Search"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg></button><span class="sb-tip" role="tooltip">Search <span class="kbd">⌘K</span></span></span>
                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}"><span class="sb-tw"><button class="sb-ri" type="button" aria-label="New task" style="border:1px solid var(--line-2);background:var(--raised)"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New task <span class="kbd">C</span></span></span></sc-if>
                <div class="sb-rsep"></div>
                <span class="sb-tw"><a class="sb-ri" href="#inbox" aria-label="Inbox, {{fr.inbox}} unread"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="sb-dot"></span></a><span class="sb-tip {{fr.tipDemo}}" role="tooltip">Inbox <span class="mono" style="color:var(--accent-t)">{{fr.inbox}}</span><span class="kbd">G I</span></span></span>
                <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}"><span class="sb-tw"><a class="sb-ri" href="#mine" aria-label="My tasks"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg></a><span class="sb-tip" role="tooltip">My tasks <span class="kbd">G M</span></span></span></sc-if>
                <div class="sb-rsep"></div>
                <sc-for list="{{fr.railProjects}}" as="pj" hint-placeholder-count="4">
                  <span class="sb-tw"><button class="sb-ri {{pj.on}}" type="button" aria-label="{{pj.name}}" sc-camel-on-click="{{pj.toggle}}"><span class="sb-pk" style="width:22px;height:22px;font-size:10px;background:oklch(var(--pk-l) var(--pk-c) {{pj.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{pj.hue}})">{{pj.badge}}</span></button><span class="sb-tip" role="tooltip">{{pj.name}}</span></span>
                </sc-for>
                <div style="flex:1"></div>
                <span class="sb-tw"><button class="sb-ri" type="button" sc-camel-on-click="{{fr.openBoard}}" aria-label="Sprint 14, {{fr.sprPct}} percent"><svg width="24" height="24" sc-camel-view-box="0 0 30 30" fill="none" aria-hidden="true"><circle cx="15" cy="15" r="11.5" stroke="var(--raised)" stroke-width="4"></circle><circle class="sb-rg" cx="15" cy="15" r="11.5" stroke="var(--accent-t)" stroke-width="4" stroke-linecap="round" stroke-dasharray="72.3" style="stroke-dashoffset:{{fr.sprOff}}" transform="rotate(-90 15 15)"></circle></svg></button><span class="sb-tip" role="tooltip">Sprint 14 · {{fr.sprPct}}% · 7d left</span></span>
                <sc-if value="{{fr.canSettings}}" hint-placeholder-val="{{true}}"><span class="sb-tw"><a class="sb-ri" href="#settings" aria-label="Settings"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8zM8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M3.6 12.4l1.2-1.2M11.2 4.8l1.2-1.2"></path></svg></a><span class="sb-tip" role="tooltip">Settings <span class="kbd">⌘,</span></span></span></sc-if>
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Expand sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M9 6.5L10.5 8 9 9.5"></path></svg></button><span class="sb-tip" role="tooltip">Expand <span class="kbd">⌘B</span></span></span>
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Account: Alex Kim" style="height:40px"><span class="sb-av" style="width:28px;height:28px;font-size:10px;background:oklch(var(--av-l) var(--av-c) 285)">AK<span class="sb-pres"></span></span></button><span class="sb-tip" role="tooltip">Alex Kim · {{fr.roleLabel}}</span></span>
              </nav>
            </sc-if>
<!--SB-END-->
              </div>
            </sc-for>

            <div class="sp-main">
              <sc-if value="{{fx.phone}}" hint-placeholder-val="{{false}}">
                <div class="sp-psb"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="17" height="11" sc-camel-view-box="0 0 17 11" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1"></rect><rect x="4.5" y="5" width="3" height="6" rx="1"></rect><rect x="9" y="2.5" width="3" height="8.5" rx="1"></rect><rect x="13.5" y="0" width="3" height="11" rx="1"></rect></svg><svg width="24" height="11" sc-camel-view-box="0 0 24 11" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="21" height="10" rx="3" stroke="currentColor" opacity=".5"></rect><rect x="2" y="2" width="15" height="7" rx="1.5" fill="currentColor"></rect></svg></span></div>
              </sc-if>

              <header class="sp-top">
                <sc-if value="{{fx.isList}}" hint-placeholder-val="{{true}}">
                  <button class="sp-ib only-n" type="button" aria-label="Open navigation" style="width:44px;height:44px"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"></path></svg></button>
                  <div class="sp-crumb"><span class="sp-pk hide-n">PR</span><span class="mut hide-n">Platform Rebuild</span><span class="sep hide-n">/</span><span>Sprints</span></div>
                  <span class="sp-sp"></span>
                  <sc-if value="{{fx.canNew}}" hint-placeholder-val="{{true}}">
                    <button class="sp-btn pri" type="button" sc-camel-on-click="{{fx.newSprint}}" aria-label="New sprint"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span class="hide-n">New sprint</span></button>
                  </sc-if>
                </sc-if>
                <sc-if value="{{fx.isBoard}}" hint-placeholder-val="{{false}}">
                  <button class="sp-btn" type="button" sc-camel-on-click="{{fx.bd.back}}" aria-label="Back to sprints" style="padding:0 8px 0 6px"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4.5L6 8l3.5 3.5"></path></svg><span class="hide-n">Sprints</span></button>
                  <span class="hide-n" style="width:1px;height:20px;background:var(--line)"></span>
                  <div class="sp-crumb" style="margin-left:4px"><span>{{fx.bd.name}}</span><span class="sp-tag {{fx.bd.tagCls}}">{{fx.bd.tag}}</span><span class="sp-m mut hide-n">{{fx.bd.dates}}</span></div>
                  <span class="sp-sp"></span>
                  <sc-if value="{{fx.bd.canComplete}}" hint-placeholder-val="{{true}}">
                    <button class="sp-btn pri" type="button" sc-camel-on-click="{{fx.bd.complete}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg>Complete<span class="hide-n">&nbsp;sprint</span></button>
                  </sc-if>
                </sc-if>
              </header>

              <!-- LIST -->
              <sc-if value="{{fx.isList}}" hint-placeholder-val="{{true}}">
                <sc-if value="{{fx.st.loading}}" hint-placeholder-val="{{false}}">
                  <div class="sp-list" aria-busy="true" aria-label="Loading sprints">
                    <div class="sp-gr sp-hdr"><span>Sprint</span><span class="c-dates">Dates</span><span>Time</span><span>Progress</span><span>Velocity</span><span></span></div>
                    <sc-for list="{{fx.skRows}}" as="sk" hint-placeholder-count="4">
                      <div class="sp-gr sp-skr">
                        <span style="display:flex;align-items:center;gap:12px"><span class="sk" style="width:20px;height:20px;border-radius:50%"></span><span style="display:flex;flex-direction:column;gap:7px"><span class="sk" style="width:{{sk.w1}}px"></span><span class="sk" style="width:{{sk.w2}}px;opacity:.6"></span></span></span>
                        <span class="sk c-dates" style="width:76px"></span><span class="sk c-when" style="width:52px"></span><span class="sk c-prog" style="width:100%"></span><span class="sk c-vel" style="width:44px"></span><span></span>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{fx.st.error}}" hint-placeholder-val="{{false}}">
                  <div class="sp-state" role="alert">
                    <div class="sp-eic err"><svg width="22" height="22" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5l6 11H2zM8 6.5v3M8 11.5v.1"></path></svg></div>
                    <h3>Couldn’t load sprints</h3>
                    <span class="sp-m mut">ERR 503 · retrying won’t lose work</span>
                    <button class="sp-btn sec" type="button" sc-camel-on-click="{{fx.retry}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 11-1.5-3.5M13 2.5v3h-3"></path></svg>Retry</button>
                  </div>
                </sc-if>
                <sc-if value="{{fx.st.empty}}" hint-placeholder-val="{{false}}">
                  <div class="sp-state">
                    <div class="sp-ghost" aria-hidden="true"><i></i><i></i><i></i></div>
                    <div class="sp-eic"><svg width="22" height="22" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 6.5A4.8 4.8 0 004 5M3.5 9.5A4.8 4.8 0 0012 11M3.8 2.8v2.4h2.4M12.2 13.2v-2.4H9.8"></path></svg></div>
                    <h3>No sprints yet</h3>
                    <span class="sp-m mut">time-box work into 1–4 week cycles</span>
                    <sc-if value="{{fx.canNew}}" hint-placeholder-val="{{true}}">
                      <div style="display:flex;gap:8px;margin-top:4px"><button class="sp-btn pri" type="button" sc-camel-on-click="{{fx.newSprint}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>Create sprint</button><a class="sp-btn" href="#backlog">Open backlog</a></div>
                    </sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{fx.st.ready}}" hint-placeholder-val="{{true}}">
                  <div class="sp-scroll fade">
                    <div class="sp-list">
                      <div class="sp-gr sp-hdr"><span>Sprint</span><span class="c-dates">Dates</span><span>Time</span><span>Progress</span><span>Velocity · pts</span><span></span></div>
                      <sc-for list="{{fx.sections}}" as="sec" hint-placeholder-count="3">
                        <section aria-label="{{sec.name}} sprints">
                          <button class="sp-sech" type="button" aria-expanded="{{sec.open}}" sc-camel-on-click="{{sec.toggle}}"><svg class="chev" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>{{sec.name}}<span class="sp-cnt">{{sec.count}}</span></button>
                          <div class="sp-col {{sec.colCls}}"><div>
                            <div class="sp-rows">
                              <sc-for list="{{sec.rows}}" as="rw" hint-placeholder-count="2">
                                <div class="sp-row sp-gr {{rw.cls}}">
                                  <button class="sp-rowb" type="button" sc-camel-on-click="{{rw.open}}" aria-label="{{rw.aria}}">
                                    <span class="sp-si">
                                      <sc-if value="{{rw.isActive}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" sc-camel-view-box="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke="var(--raised)" stroke-width="3"></circle><circle class="sp-rg" cx="10" cy="10" r="7" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-dasharray="43.98" style="stroke-dashoffset:{{rw.off}}" transform="rotate(-90 10 10)"></circle></svg></sc-if>
                                      <sc-if value="{{rw.isPlanned}}" hint-placeholder-val="{{false}}"><span class="tp-g backlog" style="color:var(--text-3);width:16px;height:16px"></span></sc-if>
                                      <sc-if value="{{rw.isDone}}" hint-placeholder-val="{{true}}"><span class="tp-g done" style="color:var(--ok);width:16px;height:16px"></span></sc-if>
                                    </span>
                                    <span class="sp-rn"><b>{{rw.name}}</b><span class="sp-goal">{{rw.goal}}</span><span class="sp-nmeta"><span class="sp-m mut">{{rw.dates}}</span><span class="sp-m {{rw.whenCls}}">{{rw.when}}</span></span></span>
                                  </button>
                                  <span class="sp-m mut c-dates">{{rw.dates}}</span>
                                  <span class="sp-m {{rw.whenCls}} c-when">{{rw.when}}</span>
                                  <span class="sp-prog c-prog"><span class="sp-bar"><span style="width:{{rw.pct}}%"></span></span><span class="sp-m" style="width:34px;text-align:right">{{rw.pct}}%</span></span>
                                  <span class="sp-m sp-vel c-vel"><b>{{rw.dp}}</b>/{{rw.total}}</span>
                                  <span class="sp-act"><sc-if value="{{rw.canComplete}}" hint-placeholder-val="{{false}}"><button class="sp-btn sec sm" type="button" sc-camel-on-click="{{rw.complete}}">Complete sprint</button></sc-if><sc-if value="{{rw.canStart}}" hint-placeholder-val="{{false}}"><button class="sp-btn sec sm" type="button" sc-camel-on-click="{{rw.start}}"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.5l8 4.5-8 4.5z"></path></svg>Start</button></sc-if></span>
                                </div>
                              </sc-for>
                              <sc-if value="{{sec.none}}" hint-placeholder-val="{{false}}"><div class="sp-none"><span class="tp-g backlog" style="color:var(--line-2)"></span>None</div></sc-if>
                            </div>
                          </div></div>
                        </section>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
              </sc-if>

              <!-- BOARD -->
              <sc-if value="{{fx.isBoard}}" hint-placeholder-val="{{false}}">
                <div class="sp-bhead fade">
                  <span class="sp-goalb"><svg width="15" height="15" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM8 5.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z"></path></svg>{{fx.bd.goal}}</span>
                  <span class="sp-sp hide-n"></span>
                  <span class="sp-m {{fx.bd.whenCls}}">{{fx.bd.when}}</span>
                  <span class="sp-bprog"><span class="sp-bar"><span style="width:{{fx.bd.pct}}%"></span></span><span class="sp-m">{{fx.bd.pct}}%</span></span>
                  <span class="sp-m sp-vel"><b>{{fx.bd.dp}}</b>/{{fx.bd.total}} pts</span>
                </div>
                <div class="sp-cols" role="list" aria-label="{{fx.bd.name}} board">
                  <sc-for list="{{fx.bd.cols}}" as="col" hint-placeholder-count="4">
                    <section class="sp-bc" role="listitem" aria-label="{{col.name}}">
                      <div class="sp-bch"><span class="tp-g {{col.g}}" style="color:{{col.c}}"></span>{{col.name}}<span class="sp-cnt">{{col.n}}</span><span class="sp-sp"></span><span class="sp-cnt">{{col.pts}} pts</span></div>
                      <div class="sp-cards">
                        <sc-for list="{{col.cards}}" as="cd" hint-placeholder-count="3">
                          <article class="sp-card {{cd.cls}}" tabindex="0" aria-label="{{cd.k}} {{cd.t}}">
                            <div class="sp-cr"><span class="sp-key">{{cd.k}}</span><sc-if value="{{cd.added}}" hint-placeholder-val="{{false}}"><span class="sp-add" title="Added mid-sprint"><svg width="10" height="10" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>{{cd.addD}}</span></sc-if><span class="sp-sp"></span><sc-if value="{{cd.hasA}}" hint-placeholder-val="{{true}}"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{cd.hue}})">{{cd.a}}</span></sc-if><sc-if value="{{cd.noA}}" hint-placeholder-val="{{false}}"><span class="tp-avn" aria-label="Unassigned"></span></sc-if></div>
                            <div class="ttl">{{cd.t}}</div>
                            <div class="sp-cr"><span class="tp-bars {{cd.pc}}" style="color:{{cd.pcol}}" aria-label="{{cd.pl}} priority"><i></i><i></i><i></i><i></i></span><span class="sp-sp"></span><span class="sp-pts">{{cd.pts}}</span></div>
                          </article>
                        </sc-for>
                        <sc-if value="{{col.empty}}" hint-placeholder-val="{{false}}"><div class="sp-cempty">No tasks</div></sc-if>
                      </div>
                    </section>
                  </sc-for>
                </div>
              </sc-if>

              <sc-if value="{{fx.phone}}" hint-placeholder-val="{{false}}"><span class="sp-home"></span></sc-if>
            </div>

            <!-- SPRINT REVIEW FLOW -->
            <sc-if value="{{fx.modalOn}}" hint-placeholder-val="{{false}}">
              <div class="sp-scrim" sc-camel-on-click="{{fx.rv.close}}"></div>
              <div class="sp-modal" role="dialog" aria-modal="true" aria-label="{{fx.rv.title}}" tabindex="-1" sc-camel-on-key-down="{{fx.rv.onKey}}">
                <span class="sp-grab"></span>
                <div class="sp-mh">
                  <h2>{{fx.rv.title}}</h2>
                  <span class="sp-sp"></span>
                  <ol class="sp-steps" aria-label="Steps" style="margin:0;padding:0;list-style:none">
                    <sc-for list="{{fx.rv.steps}}" as="sx" hint-placeholder-count="3">
                      <li style="display:contents"><sc-if value="{{sx.line}}" hint-placeholder-val="{{false}}"><span class="sp-stepl" aria-hidden="true"></span></sc-if><span class="sp-step {{sx.cls}}" aria-current="{{sx.cur}}"><i>{{sx.n}}</i><span class="t">{{sx.label}}</span></span></li>
                    </sc-for>
                  </ol>
                  <button class="sp-ib" type="button" aria-label="Close" sc-camel-on-click="{{fx.rv.close}}" style="margin-left:6px"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                </div>

                <div class="sp-mb">
                  <!-- step 1: summary -->
                  <sc-if value="{{fx.rv.s1}}" hint-placeholder-val="{{true}}">
                    <div class="sp-stats">
                      <sc-for list="{{fx.rv.stats}}" as="st" hint-placeholder-count="4">
                        <div class="sp-stat"><span class="l">{{st.l}}</span><span class="v">{{st.v}}<small>{{st.u}}</small></span></div>
                      </sc-for>
                    </div>
                    <div class="sp-blk">
                      <div class="sp-h3">Completed vs carried over<span class="sp-sp"></span><span class="rp-leg"><span><i class="lk-rect" style="background:var(--c1)"></i>{{fx.rv.doneN}} done</span><span><i class="lk-rect" style="background:var(--c2)"></i>{{fx.rv.openN}} open</span></span></div>
                      <div class="sp-stack" role="img" aria-label="{{fx.rv.splitAria}}"><span style="width:{{fx.rv.donePct}}%;background:var(--c1)"></span><span style="flex:1;background:var(--c2)"></span></div>
                    </div>
                    <div class="sp-two">
                      <section class="sp-pnl" aria-label="Burndown">
                        <div class="sp-h3">Burndown<span class="sp-sp"></span><span class="rp-leg"><span><i class="lk-line"></i>Left</span><span><i class="lk-dash"></i>Ideal</span></span></div>
                        <div class="rp-chart">
                          <div class="rp-ylab"><sc-for list="{{fx.rv.b.grid}}" as="yg" hint-placeholder-count="3"><span style="top:{{yg.top}}%">{{yg.t}}</span></sc-for></div>
                          <div class="rp-plot" style="height:120px">
                            <sc-for list="{{fx.rv.b.grid}}" as="yg" hint-placeholder-count="3"><i class="rp-gl {{yg.cls}}" style="top:{{yg.top}}%"></i></sc-for>
                            <i class="rp-today" style="left:{{fx.rv.b.endX}}%"></i>
                            <svg sc-camel-view-box="0 0 300 120" sc-camel-preserve-aspect-ratio="none" role="img" aria-label="{{fx.rv.b.aria}}">
                              <path class="rp-area" d="{{fx.rv.b.areaD}}"></path>
                              <path class="rp-ideal" d="{{fx.rv.b.idealD}}"></path>
                              <path class="rp-line" d="{{fx.rv.b.lineD}}"></path>
                            </svg>
                            <span class="rp-dot" style="left:{{fx.rv.b.endX}}%;top:{{fx.rv.b.endY}}%"></span>
                            <div class="rp-hits">
                              <sc-for list="{{fx.rv.b.hits}}" as="bh" hint-placeholder-count="14">
                                <button class="rp-hit {{bh.on}}" type="button" aria-label="{{bh.aria}}" sc-camel-on-mouse-enter="{{bh.show}}" sc-camel-on-focus="{{bh.show}}" sc-camel-on-mouse-leave="{{fx.rv.b.hide}}" sc-camel-on-blur="{{fx.rv.b.hide}}">
                                  <sc-if value="{{bh.tipOn}}" hint-placeholder-val="{{false}}">
                                    <span class="rp-xh"></span>
                                    <sc-if value="{{bh.hasV}}" hint-placeholder-val="{{true}}"><span class="rp-dot" style="left:50%;top:{{bh.y}}%"></span></sc-if>
                                    <span class="rp-tip {{bh.side}}" aria-hidden="true"><span class="rp-tiph">{{bh.head}}</span><sc-for list="{{bh.rows}}" as="tr" hint-placeholder-count="2"><span class="rp-tipr"><i class="rp-k {{tr.k}}" style="background:{{tr.c}}"></i><b>{{tr.v}}</b>{{tr.n}}</span></sc-for></span>
                                  </sc-if>
                                </button>
                              </sc-for>
                            </div>
                          </div>
                          <div class="rp-xlab"><sc-for list="{{fx.rv.b.xl}}" as="xl" hint-placeholder-count="3"><span class="{{xl.cls}}" style="left:{{xl.left}}%">{{xl.t}}</span></sc-for></div>
                        </div>
                      </section>
                      <section class="sp-pnl" aria-label="Contributors">
                        <div class="sp-h3">Contributors<span class="sp-cnt">{{fx.rv.ctrN}}</span><span class="sp-sp"></span><span class="sp-cnt">tasks · pts</span></div>
                        <div>
                          <sc-for list="{{fx.rv.ctr}}" as="ct" hint-placeholder-count="5">
                            <div class="sp-ctr"><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{ct.hue}})">{{ct.ini}}</span><span class="nm">{{ct.name}}</span><span class="sp-ctrk"><span style="width:{{ct.w}}%"></span></span><span class="sp-m" style="text-align:right">{{ct.n}} · {{ct.pts}}</span></div>
                          </sc-for>
                        </div>
                      </section>
                    </div>
                    <section class="sp-blk" aria-label="Scope added mid-sprint">
                      <div class="sp-h3">Scope added mid-sprint<span class="sp-cnt">{{fx.rv.saN}}</span><span class="sp-sp"></span><span class="sp-m" style="color:var(--info)">{{fx.rv.saPts}}</span></div>
                      <div>
                        <sc-for list="{{fx.rv.sa}}" as="sa" hint-placeholder-count="3">
                          <div class="sp-sa"><span class="tp-g {{sa.g}}" style="color:{{sa.gc}}"></span><span class="sp-key">{{sa.k}}</span><span class="ttl">{{sa.t}}</span><span class="sp-add">+{{sa.pts}}</span><span class="sp-m mut d">{{sa.d}}</span><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{sa.hue}})" title="Added by {{sa.byName}}">{{sa.by}}</span></div>
                        </sc-for>
                        <sc-if value="{{fx.rv.saNone}}" hint-placeholder-val="{{false}}"><div class="sp-none" style="padding:0">No scope change</div></sc-if>
                      </div>
                    </section>
                  </sc-if>

                  <!-- step 2: carry over -->
                  <sc-if value="{{fx.rv.s2}}" hint-placeholder-val="{{false}}">
                    <div class="sp-blk">
                      <div class="sp-h3">Move checked tasks to</div>
                      <div class="sp-dsts" role="radiogroup" aria-label="Destination for checked tasks">
                        <sc-for list="{{fx.rv.dests}}" as="dt" hint-placeholder-count="2">
                          <button class="sp-dst" type="button" role="radio" aria-checked="{{dt.on}}" sc-camel-on-click="{{dt.pick}}">

    };
    const sections = [
      mkSec('active', 'Active', L.filter((s) => s.st === 'active')),
      mkSec('planned', 'Planned', L.filter((s) => s.st === 'planned').sort((x, y) => x.a - y.a)),
      mkSec('completed', 'Completed', L.filter((s) => s.st === 'completed').sort((x, y) => y.a - x.a))
    ];

    // board
    let bd = { cols: [], name: '', tag: '', tagCls: '', dates: '', goal: '', pct: 0, dp: 0, total: 0, when: '', whenCls: '', canComplete: false, complete: () => {}, back: () => {} };
    const bs = L.find((s) => s.id === f.open);
    if (view === 'board' && bs) {
      const st = this.stat(bs); const w = this.when(bs);
      const COLS = [['todo', ['todo', 'backlog']], ['progress', ['progress']], ['review', ['review']], ['done', ['done']]];
      bd = {
        name: 'Sprint ' + bs.n, tag: bs.st === 'active' ? 'Active' : bs.st === 'planned' ? 'Planned' : 'Completed', tagCls: bs.st === 'active' ? 'live' : '',
        dates: this.range(bs), goal: bs.goal || 'No goal', pct: st.pct, dp: st.dp, total: st.total, when: w.t, whenCls: w.cls,
        canComplete: bs.st === 'active' && canEdit, complete: () => openReview(bs.id),
        back: () => set({ view: 'list', step: 0 }),
        cols: COLS.map(([k, sts]) => {
          const ts = bs.tasks.filter((t) => sts.indexOf(t.st) >= 0);
          return {
            name: D.ST[k][0], g: D.ST[k][1], c: D.ST[k][2], n: ts.length, pts: this.sum(ts), empty: ts.length === 0,
            cards: ts.map((t) => ({
              k: t.k, t: t.t, pts: t.pts, a: t.a || '', hue: t.a ? D.P[t.a][1] : 0, hasA: !!t.a, noA: !t.a,
              pc: D.PRI[t.pri][1], pcol: D.PRI[t.pri][2], pl: D.PRI[t.pri][0], added: !!t.add, addD: t.add ? t.add.d : '', cls: t.st === 'done' ? 'dn' : ''
            }))
          };
        })
      };
    }

    // review flow
    const step = canEdit ? (f.step || 0) : 0;
    const rs = L.find((s) => s.id === f.open);
    let rv = { title: '', steps: [], s1: false, s2: false, s3: false, stats: [], b: { grid: [], hits: [], xl: [], hide: () => {} }, ctr: [], sa: [], dests: [], carry: [], res: {}, foot: '' };
    const modalOn = step > 0 && !!rs;
    if (modalOn) {
      const close = () => set({ step: 0, tip: null });
      const finish = () => set({ step: 0, view: 'list' });
      rv = {
        title: step === 3 ? (f.result ? f.result.name : '') : 'Complete Sprint ' + rs.n,
        s1: step === 1, s2: step === 2, s3: step === 3,
        steps: [['Review', 1], ['Carry over', 2], ['Done', 3]].map(([label, n], i) => ({ label, n: step > n || step === 3 ? '✓' : String(n), line: i > 0, cls: step === n && n !== 3 ? 'on' : step > n || step === 3 ? 'ok' : '', cur: step === n ? 'step' : 'false' })),
        close: step === 3 ? finish : close, finish,
        onKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); (step === 3 ? finish : close)(); } },
        next: () => set({ step: 2, tip: null }), back: () => set({ step: 1 }),
        confirm: () => set(self.closePatch(f)),
        startNext: () => { const r = f.result || {}; set({ step: 0, view: 'list', started: r.nextId ? { ...(f.started || {}), [r.nextId]: true } : (f.started || {}) }); },
        res: {}, foot: '', b: { grid: [], hits: [], xl: [], hide: () => {} }, stats: [], ctr: [], sa: [], dests: [], carry: []
      };
      if (step === 1 || step === 2) {
        const st = this.stat(rs);
        const next = this.nextOf(L);
        if (step === 1) {
          const added = rs.tasks.filter((t) => t.add);
          const addPts = this.sum(added);
          rv.stats = [
            { l: 'Completed', v: String(st.doneN), u: 'tasks' },
            { l: 'Velocity', v: String(st.dp), u: '/' + st.total + ' pts' },
            { l: 'Carried over', v: String(st.openN), u: st.op + ' pts' },
            { l: 'Scope added', v: '+' + addPts, u: 'pts' }
          ];
          rv.doneN = st.doneN; rv.openN = st.openN;
          rv.donePct = st.doneN + st.openN ? (st.doneN / (st.doneN + st.openN) * 100).toFixed(1) : 0;
          rv.splitAria = st.doneN + ' tasks completed, ' + st.openN + ' carried over';
          // burndown
          const N = rs.b - rs.a + 1, rem = rs.burn || [st.total, st.op], start = rem[0], today = rem.length - 1;
          const bMax = Math.max(10, Math.ceil(Math.max.apply(null, rem) / 10) * 10);
          const W = 300, H = 120;
          const bx = (i) => (i + 0.5) / N * W, by = (v) => (1 - v / bMax) * H;
          const ideal = (i) => Math.round(start * (1 - i / (N - 1)));
          const tip = f.tip;
          const line = rem.map((v, i) => (i ? 'L' : 'M') + bx(i).toFixed(1) + ' ' + by(v).toFixed(1)).join(' ');
          rv.b = {
            grid: [bMax, bMax / 2, 0].map((v) => ({ t: String(v), top: ((1 - v / bMax) * 100).toFixed(2), cls: v === 0 ? 'base' : '' })),
            lineD: line,
            areaD: line + ' L' + bx(today).toFixed(1) + ' ' + H + ' L' + bx(0).toFixed(1) + ' ' + H + ' Z',
            idealD: 'M' + bx(0).toFixed(1) + ' ' + by(start).toFixed(1) + ' L' + bx(N - 1).toFixed(1) + ' ' + by(0).toFixed(1),
            endX: ((today + 0.5) / N * 100).toFixed(2), endY: (by(rem[today]) / H * 100).toFixed(2),
            aria: 'Burndown: ' + rem[today] + ' of ' + start + ' points left on ' + this.fd(rs.a + today) + ', ideal ' + ideal(today),
            xl: [{ t: this.fd(rs.a), left: (0.5 / N * 100).toFixed(2), cls: '' }, { t: 'Today', left: ((today + 0.5) / N * 100).toFixed(2), cls: 'today' }, { t: this.fd(rs.b), left: ((N - 0.5) / N * 100).toFixed(2), cls: '' }],
            hide: () => { if (self.fGet(id).tip !== null) set({ tip: null }); },
            hits: Array.from({ length: N }, (_, i) => {
              const has = i < rem.length, day = this.fd(rs.a + i);
              const added = rs.tasks.filter((t) => t.add && t.add.d === day);
              const rows = (has ? [{ v: rem[i], n: 'pts left', c: 'var(--c1)', k: '' }] : []).concat([{ v: ideal(i), n: 'ideal', c: 'transparent', k: 'dash' }]);
              if (has && added.length) rows.push({ v: '+' + this.sum(added), n: 'added', c: 'var(--info)', k: '' });
              return {
                on: tip === i ? 'on' : '', tipOn: tip === i, hasV: has, y: has ? (by(rem[i]) / H * 100).toFixed(2) : 0,
                side: (i + 0.5) / N > 0.55 ? 'l' : '', head: day + (i === today ? ' · today' : ''), rows,
                aria: day + ': ' + (has ? rem[i] + ' points left, ' : 'not reached, ') + 'ideal ' + ideal(i),
                show: () => { if (self.fGet(id).tip !== i) set({ tip: i }); }
              };
            })
          };
          // contributors
          const C = {};
          st.done.forEach((t) => { if (!t.a) return; C[t.a] = C[t.a] || { n: 0, pts: 0 }; C[t.a].n++; C[t.a].pts += t.pts; });
          const cl = Object.keys(C).map((ini) => ({ ini, name: D.P[ini][0], hue: D.P[ini][1], n: C[ini].n, pts: C[ini].pts })).sort((x, y) => y.pts - x.pts || y.n - x.n);
          const cmax = cl.reduce((m, c) => Math.max(m, c.pts), 1);
          rv.ctr = cl.map((c) => ({ ...c, w: (c.pts / cmax * 100).toFixed(1) }));
          rv.ctrN = cl.length;
          rv.sa = added.map((t) => ({ k: t.k, t: t.t, pts: t.pts, d: t.add.d, by: t.add.by, byName: D.P[t.add.by][0], hue: D.P[t.add.by][1], g: D.ST[t.st][1], gc: D.ST[t.st][2] }));
          rv.saN = added.length; rv.saPts = '+' + addPts + ' pts'; rv.saNone = added.length === 0;
          rv.foot = st.openN ? st.openN + ' unfinished to place next' : 'all tasks done';
        }
        if (step === 2) {
          const dest = next ? (f.dest || 'next') : 'backlog';
          const keep = this.keepMap(f, rs);
          const nextName = next ? 'Sprint ' + next.n : '';
          const destName = dest === 'next' ? nextName : 'Backlog';
          const otherName = dest === 'next' ? 'Backlog' : (nextName || 'Backlog');
          rv.destName = destName; rv.otherName = otherName;
          const items = st.open.slice().sort((x, y) => y.pri - x.pri);
          const nOn = items.filter((t) => keep[t.k]).length;
          rv.carryN = items.length;
          rv.allState = nOn === items.length ? 'true' : nOn === 0 ? 'false' : 'mixed';
          rv.toggleAll = () => { const k = {}; items.forEach((t) => { k[t.k] = nOn !== items.length; }); set({ keep: { ...(f.keep || {}), ...k } }); };
          rv.dests = (next ? [{ id: 'next', name: nextName, meta: this.range(next), icon: 'M12.5 6.5A4.8 4.8 0 004 5M3.5 9.5A4.8 4.8 0 0012 11M3.8 2.8v2.4h2.4M12.2 13.2v-2.4H9.8' }] : [])
            .concat([{ id: 'backlog', name: 'Backlog', meta: 'unscheduled', icon: 'M2.5 4h11M2.5 8h11M2.5 12h7' }])
            .map((d) => ({ ...d, on: dest === d.id ? 'true' : 'false', pick: () => set({ dest: d.id }) }));
          let toNext = 0;
          rv.carry = items.map((t) => {
            const on = !!keep[t.k];
            const goesNext = !!next && ((dest === 'next') === on);
            if (goesNext) toNext++;
            return {
              k: t.k, t: t.t, pts: t.pts, a: t.a || '', hue: t.a ? D.P[t.a][1] : 0, hasA: !!t.a, noA: !t.a, g: D.ST[t.st][1], gc: D.ST[t.st][2],
              on, cls: on ? '' : 'off', to: goesNext ? nextName : 'Backlog', toCls: goesNext ? '' : 'bk',
              toggle: () => set({ keep: { ...(self.fGet(id).keep || f.keep || {}), [t.k]: !on } })
            };
          });
          rv.foot = (next ? toNext + ' → ' + nextName + ' · ' : '') + (items.length - toNext) + ' → Backlog';
        }
      }
      if (step === 3 && f.result) {
        const r = f.result;
        rv.res = { ...r, hasNext: !!r.nextId && canEdit };
        rv.foot = '';
      }
    }

    const sbFrames = cfg.sb ? [this.sbFrame(id, { role: cfg.role, collapsible: true, active: 'PR', sub: 'sprints' })] : [];
    return {
      label: cfg.label, meta: cfg.meta, gc: cfg.gc, gr: cfg.gr, w: cfg.w, h: cfg.h, r: cfg.phone ? 30 : 12, phone: !!cfg.phone, sbFrames,
      isList: view !== 'board', isBoard: view === 'board' && !!bs, canNew: canEdit,
      st: { loading, error, empty: !loading && !error && L.length === 0, ready: !loading && !error && L.length > 0 },
      skRows: [[132, 210], [110, 180], [124, 160], [98, 200]].map(([w1, w2]) => ({ w1, w2 })),
      retry: () => { set({ err: false, loading: true }); clearTimeout(self._rt); self._rt = setTimeout(() => self.fSet(id, { loading: false }), 900); },
      newSprint, sections, bd, modalOn, rv
    };
  }
  renderVals() {
    const theme = this.props.theme || 'navy';
    const role = this.props.role || 'admin';
    const canEdit = role !== 'viewer';
    const mk = (id, cfg) => this.build(id, { role, canEdit, ...cfg });
    const closeBase = { view: 'board', open: 's14' };
    const closeInit = { ...closeBase, ...this.closePatch(closeBase) };
    const frames = [
      mk('main', { label: 'Sprints', meta: 'click a row · Complete sprint · ⌘B', gc: '1 / -1', gr: '1', w: 1280, h: 800, sb: true }),
      mk('board', { label: 'Sprint board', meta: 'Sprint 14 · back returns to list', gc: '1 / -1', gr: '2', w: 1280, h: 600, init: { view: 'board', open: 's14' } }),
      mk('review', { label: 'Sprint review summary', meta: 'step 1 · hover burndown', gc: '1 / span 3', gr: '3', w: 620, h: 820, init: { view: 'board', open: 's14', step: 1 } }),
      mk('carry', { label: 'Carry-over step', meta: 'step 2 · per-task', gc: '4 / span 3', gr: '3', w: 620, h: 820, init: { view: 'board', open: 's14', step: 2 } }),
      mk('empty', { label: 'No sprints', meta: 'empty project', gc: '1 / span 3', gr: '4 / span 2', w: 620, h: 598, init: { empty: true } }),
      mk('load', { label: 'Loading', meta: 'skeleton', gc: '4 / span 3', gr: '4', w: 620, h: 260, init: { loading: true } }),
      mk('err', { label: 'Error', meta: 'retry → loads', gc: '4 / span 3', gr: '5', w: 620, h: 260, init: { err: true } }),
      mk('m1', { label: 'Mobile', meta: '390', gc: '1 / span 2', gr: '6', w: 390, h: 780, phone: true }),
      mk('m2', { label: 'Mobile board', meta: 'swipe columns', gc: '3 / span 2', gr: '6', w: 390, h: 780, phone: true, init: { view: 'board', open: 's14' } }),
      mk('m3', { label: 'Sprint completed', meta: 'step 3 · spark', gc: '5 / span 2', gr: '6', w: 390, h: 780, phone: true, init: closeInit })
    ];
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      roleLabel: role,
      frames
    };
  }
}
</script>
