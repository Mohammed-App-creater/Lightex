.ob.mob .ob-2{grid-template-columns:minmax(0,1fr) 84px}
.ob.mob .ob-tpls{grid-template-columns:minmax(0,1fr)}
.ob.mob .ob-tpl{flex-direction:row;align-items:center}
.ob.mob .ob-tpl .ob-art{width:64px;height:40px}
.ob.mob .ob-act{padding:12px 16px 24px;border-top:1px solid var(--line);background:var(--surface)}
.ob.mob .ob-act>span{display:none}
.ob.mob .ob-act .btn{height:44px}
.ob.mob .ob-act .btn-primary{flex:1}
.ob.mob .in{height:44px}
.phone-bar{height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 12px/1 'JetBrains Mono',monospace;color:var(--text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
  .ob-top{padding:0 8px 0 14px}
  .ob-prog{width:auto;margin:0 16px}
  .ob-pl span{display:none}
  .ob-main{padding:24px 16px}
  .ob-tpls{grid-template-columns:minmax(0,1fr)}
  .ob-act{padding:12px 16px 24px;border-top:1px solid var(--line)}
  .ob-act>span{display:none}
  .ob-act .btn-primary{flex:1;height:44px}
  .in{height:44px}
}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:2720px;padding:64px 80px;display:flex;flex-direction:column;gap:40px;overflow:hidden">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="lxs" sc-camel-view-box="0 0 46 39">
        <mask id="lxsm" sc-camel-mask-units="userSpaceOnUse" x="-10" y="-10" width="70" height="60"><rect x="-10" y="-10" width="70" height="60" fill="#fff"></rect><path d="M50 -5L27 17H38L-4 44" fill="none" stroke="#000" stroke-width="13.5" stroke-linejoin="miter" stroke-miterlimit="10"></path></mask>
        <clipPath id="lxsc"><rect width="46" height="39"></rect></clipPath>
        <g clip-path="url(#lxsc)"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="9.5" fill="none" mask="url(#lxsm)"></path><path d="M50 -5L27 17H38L-4 44" stroke="var(--logo)" stroke-width="8.5" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></g>
      </symbol>
    </defs>
  </svg>

  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · EDGE + FIRST RUN</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Edge screens and onboarding</h1>
    </div>
    <div style="display:flex;gap:16px;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)"><span>404 · 403 · 500</span><span>offline</span><span>session</span><span>3-step setup</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px">

    <!-- 404 -->
    <figure class="frame">
      <figcaption>Not found<span>404</span></figcaption>
      <div class="dev" style="height:460px">
        <div class="ed">
          <div class="ed-bar"><span class="logo" role="img" aria-label="Lightex" style="font-size:16px">Lighte<svg class="lx" sc-camel-view-box="0 0 46 39" aria-hidden="true"><use href="#lxs" width="100%" height="100%"></use></svg></span></div>
          <div class="ed-c">
            <div class="ed-code" aria-hidden="true">4<svg sc-camel-view-box="0 0 46 39" style="width:54px;height:46px;margin:0 6px;opacity:.9"><use href="#lxs" width="100%" height="100%"></use></svg>4</div>
            <h2>Page not found</h2>
            <span class="ed-meta">/platform/tasks/PRJ-999</span>
            <div class="ed-row" style="margin-top:6px">
              <button class="btn btn-primary" type="button">Go to My work</button>
              <button class="btn btn-sec" type="button">Search <span class="tp-kbd">⌘K</span></button>
            </div>
          </div>
        </div>
      </div>
    </figure>

    <!-- 403 -->
    <figure class="frame">
      <figcaption>Permission denied<span>403 · interactive</span></figcaption>
      <div class="dev" style="height:460px">
        <div class="ed">
          <div class="ed-bar"><span class="logo" role="img" aria-label="Lightex" style="font-size:16px">Lighte<svg class="lx" sc-camel-view-box="0 0 46 39" aria-hidden="true"><use href="#lxs" width="100%" height="100%"></use></svg></span><span class="ed-meta" style="margin-left:6px">/ Infra</span></div>
          <div class="ed-c">
            <span class="ed-ico"><svg width="20" height="20" sc-camel-view-box="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="9" width="12" height="8.5" rx="2"></rect><path d="M6.5 9V6.5a3.5 3.5 0 017 0V9"></path></svg></span>
            <h2>You’re not a member of this project</h2>
            <div class="ed-row"><span class="badge" style="--h:60">IN</span><span style="font-weight:500">Infra</span><span class="ed-meta">· admin</span><span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) 60)">MD</span><span style="color:var(--text-2)">Morgan Diaz</span></div>
            <div class="ed-row" style="margin-top:6px;min-height:32px" aria-live="polite">
              <sc-if value="{{reqIdle}}" hint-placeholder-val="{{true}}">
                <button class="btn btn-primary" type="button" sc-camel-on-click="{{requestAccess}}">Request access</button>
                <button class="btn btn-ghost" type="button">Back to My work</button>
              </sc-if>
              <sc-if value="{{reqBusy}}" hint-placeholder-val="{{false}}">
                <button class="btn btn-primary" type="button" aria-busy="true"><span class="spin"></span>Sending</button>
              </sc-if>
              <sc-if value="{{reqSent}}" hint-placeholder-val="{{false}}">
                <span class="ed-pill ok" role="status"><span class="tp-g done" style="color:var(--ok)"></span>Request sent</span>
                <button class="btn btn-ghost sm" type="button" sc-camel-on-click="{{withdraw}}">Withdraw</button>
              </sc-if>
            </div>
            <sc-if value="{{reqSent}}" hint-placeholder-val="{{false}}"><span class="ed-meta">Morgan Diaz notified · just now</span></sc-if>
          </div>
        </div>
      </div>
    </figure>

    <!-- 500 -->
    <figure class="frame">
      <figcaption>Server error<span>500 · retry → still failing</span></figcaption>
      <div class="dev" style="height:460px">
        <div class="ed">
          <div class="ed-bar"><span class="logo" role="img" aria-label="Lightex" style="font-size:16px">Lighte<svg class="lx" sc-camel-view-box="0 0 46 39" aria-hidden="true"><use href="#lxs" width="100%" height="100%"></use></svg></span><span class="ed-meta" style="margin-left:6px">/ Platform Rebuild / Board</span></div>
          <div class="ed-c">
            <span class="ed-ico dng"><svg width="20" height="20" sc-camel-view-box="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l7.5 13h-15z"></path><path d="M10 8v3.5M10 14v.1"></path></svg></span>
            <h2>Something went wrong</h2>
            <span class="ed-meta">GET /boards/prj · 500</span>
            <div class="ed-row" style="margin-top:6px" aria-live="polite">
              <sc-if value="{{errBusy}}" hint-placeholder-val="{{false}}"><button class="btn btn-primary" type="button" aria-busy="true"><span class="spin"></span>Retrying</button></sc-if>
              <sc-if value="{{errReady}}" hint-placeholder-val="{{true}}"><button class="btn btn-primary" type="button" sc-camel-on-click="{{retry}}">{{retryLabel}}</button></sc-if>
              <button class="btn btn-ghost" type="button">Status page</button>
            </div>
            <sc-if value="{{errFail}}" hint-placeholder-val="{{false}}">
              <div class="ed-row" role="status">
                <span class="ed-pill dng"><svg width="13" height="13" sc-camel-view-box="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5.5"></circle><path d="M7 4v3.5M7 9.8v.1"></path></svg>Still failing · attempt {{errTries}}</span>
                <span class="ed-ref">Ref 7F3A-91C2<button class="ib" type="button" style="width:24px;height:24px" sc-camel-on-click="{{copyRef}}" aria-label="Copy reference id"><sc-if value="{{refCopied}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="var(--ok)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></sc-if><sc-if value="{{refNotCopied}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2"></rect><path d="M2 8V3a1 1 0 011-1h5" stroke-linecap="round"></path></svg></sc-if></button></span>
              </div>
            </sc-if>
          </div>
        </div>
      </div>
    </figure>

    <!-- Session expired -->
    <figure class="frame">
      <figcaption>Session expired<span>modal · inline validation</span></figcaption>
      <div class="dev" style="height:460px">
        <div class="ed">
          <div class="ed-bar"><span class="logo" role="img" aria-label="Lightex" style="font-size:16px">Lighte<svg class="lx" sc-camel-view-box="0 0 46 39" aria-hidden="true"><use href="#lxs" width="100%" height="100%"></use></svg></span><span class="ed-meta" style="margin-left:6px">/ PRJ-42</span><span style="flex:1"></span><sc-if value="{{sessIn}}" hint-placeholder-val="{{false}}"><button class="btn btn-ghost sm" type="button" sc-camel-on-click="{{expire}}">Expire session</button></sc-if></div>
          <div class="mk-body">
            <div style="font-size:18px;font-weight:600;letter-spacing:-.01em;padding:6px 4px 12px">Fix flaky board reflow on column resize</div>
            <div style="display:flex;flex-direction:column;gap:8px;padding:0 4px"><span style="height:10px;width:92%;border-radius:4px;background:var(--raised)"></span><span style="height:10px;width:84%;border-radius:4px;background:var(--raised)"></span><span style="height:10px;width:60%;border-radius:4px;background:var(--raised)"></span></div>
            <div style="margin-top:18px;padding:10px 12px;border:1px solid var(--accent);border-radius:8px;box-shadow:0 0 0 3px var(--accent-s);color:var(--text-2)">Repro’d on Safari too. Looks like will-change…</div>
          </div>
        </div>
        <sc-if value="{{sessOpen}}" hint-placeholder-val="{{true}}">
          <div class="scrim">
            <form class="modal" role="dialog" aria-modal="true" aria-labelledby="se-t" sc-camel-on-submit="{{signIn}}" sc-camel-no-validate="{{true}}">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="ed-ico" style="width:36px;height:36px;border-radius:9px"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.3 1.5"></path></svg></span>
                <div style="display:flex;flex-direction:column;gap:3px;text-align:left"><h3 id="se-t" style="margin:0;font-size:16px;line-height:22px;font-weight:600">Session expired</h3><span style="font-size:12.5px;color:var(--text-2)">Your unsaved edits are kept.</span></div>
              </div>
              <div class="fld"><label class="lbl" for="se-e">Email</label><input class="in" id="se-e" type="email" value="alex@team.dev" sc-camel-read-only="{{true}}"></div>
              <div class="fld"><label class="lbl" for="se-p">Password</label><input class="in {{pwCls}}" id="se-p" type="password" sc-camel-auto-complete="current-password" value="{{pw}}" sc-camel-on-change="{{onPw}}" aria-invalid="{{pwBad}}" aria-describedby="se-err"><sc-if value="{{pwBad}}" hint-placeholder-val="{{false}}"><span class="ferr" id="se-err" role="alert">{{pwErr}}</span></sc-if></div>
              <div style="display:flex;gap:8px;justify-content:flex-end">
                <button class="btn btn-ghost" type="button">Use SSO</button>
                <sc-if value="{{sessBusy}}" hint-placeholder-val="{{false}}"><button class="btn btn-primary" type="button" aria-busy="true"><span class="spin"></span>Signing in</button></sc-if>
                <sc-if value="{{sessIdle}}" hint-placeholder-val="{{true}}"><button class="btn btn-primary" type="submit">Sign in again <span class="tp-kbd">↵</span></button></sc-if>
              </div>
            </form>
          </div>
        </sc-if>
        <sc-if value="{{sessIn}}" hint-placeholder-val="{{false}}"><div class="toast" role="status"><span class="tp-g done" style="color:var(--ok)"></span>Signed in · draft restored</div></sc-if>
      </div>
    </figure>

    <!-- Offline -->
    <figure class="frame">
      <figcaption>Offline banner<span>queue · reconnect</span></figcaption>
      <div class="dev" style="height:460px">
        <div class="ed">
          <div class="ed-bar"><span class="logo" role="img" aria-label="Lightex" style="font-size:16px">Lighte<svg class="lx" sc-camel-view-box="0 0 46 39" aria-hidden="true"><use href="#lxs" width="100%" height="100%"></use></svg></span><span class="ed-meta" style="margin-left:6px">/ Platform Rebuild / My work</span><span style="flex:1"></span><sc-if value="{{offIdle}}" hint-placeholder-val="{{false}}"><button class="btn btn-ghost sm" type="button" sc-camel-on-click="{{goOffline}}">Go offline</button></sc-if><span class="tp-av" style="width:24px;height:24px;font-size:10px;background:oklch(var(--av-l) var(--av-c) 285)">AK</span></div>
          <sc-if value="{{banShow}}" hint-placeholder-val="{{true}}">
            <div class="ob-ban {{banCls}}" role="status" aria-live="polite">
              <sc-if value="{{offOff}}" hint-placeholder-val="{{true}}">
                <svg class="wifi" width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1.5 5.5a9.5 9.5 0 0113 0M3.8 8.2a6 6 0 018.4 0M6.1 10.8a2.6 2.6 0 013.8 0M8 13.3v.1M2 2l12 12"></path></svg>
                <span>Offline</span><span class="mono" style="font-size:11.5px;opacity:.85">· 3 changes queued</span><span style="flex:1"></span>
                <button class="btn btn-ghost sm" type="button" sc-camel-on-click="{{reconnect}}" style="color:inherit">Retry now</button>
              </sc-if>
              <sc-if value="{{offTrying}}" hint-placeholder-val="{{false}}">
                <span class="spin" style="width:14px;height:14px"></span><span>Reconnecting</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span style="flex:1"></span><span class="mono" style="font-size:11.5px;opacity:.85">3 queued</span>
              </sc-if>
              <sc-if value="{{offOn}}" hint-placeholder-val="{{false}}">
                <span class="tp-g done" style="color:var(--ok)"></span><span>Back online</span><span class="mono" style="font-size:11.5px;opacity:.85">· 3 changes synced</span>
              </sc-if>
            </div>
          </sc-if>
          <div class="mk-body">
            <sc-for list="{{offRows}}" as="wr" hint-placeholder-count="6">
              <div class="mk-row"><span class="tp-g {{wr.glyph}}" style="color:{{wr.color}}"></span><span class="mk-key">{{wr.key}}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{wr.title}}</span>
                <sc-if value="{{wr.queued}}" hint-placeholder-val="{{false}}"><span class="mk-q" title="Queued"><svg width="11" height="11" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.5"></circle><path d="M6 3.5V6l1.6 1"></path></svg>queued</span></sc-if>
                <sc-if value="{{wr.synced}}" hint-placeholder-val="{{false}}"><span class="mk-q ok"><svg width="11" height="11" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg>synced</span></sc-if>
                <span class="tp-av" style="background:oklch(var(--av-l) var(--av-c) {{wr.hue}})">{{wr.ini}}</span></div>
            </sc-for>
          </div>
        </div>
      </div>
    </figure>

    <!-- App loading -->
    <figure class="frame">
      <figcaption>App loading<span>logo animation · ~1s</span></figcaption>
      <div class="dev" style="height:460px">
        <div class="ld {{playCls}}" role="status" aria-label="Loading Lightex">
          <span class="logo" style="font-size:64px" aria-hidden="true">
            <span class="a-word" style="display:inline-block">Lighte</span><svg class="lx a-x sv" sc-camel-view-box="0 0 46 39" overflow="visible">
              <mask id="ldm" sc-camel-mask-units="userSpaceOnUse" x="-10" y="-10" width="70" height="60"><rect x="-10" y="-10" width="70" height="60" fill="#fff"></rect><path d="M50 -5L27 17H38L-4 44" fill="none" stroke="#000" stroke-width="13.5" stroke-linejoin="miter" stroke-miterlimit="10"></path></mask>
              <clipPath id="ldc"><rect width="46" height="39"></rect></clipPath>
              <circle class="sv a-flash" cx="23" cy="19.5" r="24" fill="none" stroke="var(--spark)" stroke-width="1.5" opacity="0"></circle>
              <g clip-path="url(#ldc)"><path class="a-bar" d="M-4 -4L50 43" stroke="var(--text)" stroke-width="9.5" fill="none" mask="url(#ldm)"></path><path class="sv a-bolt" d="M50 -5L27 17H38L-4 44" stroke="var(--logo)" stroke-width="8.5" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></g>
            </svg>
          </span>
          <div class="ld-track" aria-hidden="true"><i></i></div>
        </div>
        <button class="btn btn-ghost sm" type="button" sc-camel-on-click="{{replay}}" style="position:absolute;right:12px;bottom:12px"><svg width="12" height="12" sc-camel-view-box="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6a4 4 0 106.8-2.8M9 1.5v2.2H6.8"></path></svg>Replay</button>
      </div>
    </figure>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:40px;align-items:start">
    <sc-for list="{{obFrames}}" as="fx" hint-placeholder-count="2">
      <figure class="frame">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev" style="height:800px;border-radius:{{fx.r}}px;display:flex;flex-direction:column">
          <sc-if value="{{fx.phone}}" hint-placeholder-val="{{false}}"><div class="phone-bar" aria-hidden="true"><span>9:41</span><span>5G</span></div></sc-if>
          <div style="position:relative;flex:1;min-height:0">
          <sc-for list="{{fx.obs}}" as="o" hint-placeholder-count="1">
            <div class="ob {{o.cls}}">
              <div class="ob-top">
                <span class="logo" role="img" aria-label="Lightex" style="font-size:17px">Lighte<svg class="lx" sc-camel-view-box="0 0 46 39" aria-hidden="true"><use href="#lxs" width="100%" height="100%"></use></svg></span>
                <span style="flex:1"></span>
                <sc-if value="{{o.canSkip}}" hint-placeholder-val="{{true}}"><button class="btn btn-ghost sm" type="button" sc-camel-on-click="{{o.skip}}">Skip for now</button></sc-if>
              </div>
              <div class="ob-prog" role="progressbar" aria-label="Setup progress" aria-valuemin="0" aria-valuemax="3" aria-valuenow="{{o.stepNum}}" aria-valuetext="{{o.progText}}">
                <sc-for list="{{o.segs}}" as="sg" hint-placeholder-count="3">
                  <div class="ob-ps">
                    <div class="ob-track {{sg.fin}}"><i style="width:{{sg.w}}%"></i></div>
                    <div class="ob-pl {{sg.cls}}">
                      <sc-if value="{{sg.done}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" sc-camel-view-box="0 0 12 12" fill="none" stroke="var(--ok)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5"></path></svg></sc-if>
                      <sc-if value="{{sg.notDone}}" hint-placeholder-val="{{true}}"><b>{{sg.n}}</b></sc-if>
                      <span>{{sg.label}}</span>
                    </div>
                  </div>
                </sc-for>
              </div>
              <div class="ob-main">
                <div class="ob-card">

                  <sc-if value="{{o.s0}}" hint-placeholder-val="{{true}}">
                    <div class="ob-step {{o.dirCls}}">
                      <h2 class="ob-h">Create your workspace</h2>
                      <div class="fld">
                        <label class="lbl" for="{{o.id}}-ws">Workspace name</label>
                        <input class="in {{o.wsCls}}" id="{{o.id}}-ws" type="text" sc-camel-max-length="40" placeholder="Platform team" value="{{o.ws}}" sc-camel-on-change="{{o.onWs}}" sc-camel-on-blur="{{o.blurWs}}" sc-camel-on-key-down="{{o.enterNext}}" aria-invalid="{{o.wsBad}}" sc-camel-auto-focus="{{o.af}}">
                        <sc-if value="{{o.wsBad}}" hint-placeholder-val="{{false}}"><span class="ferr" role="alert">{{o.wsErr}}</span></sc-if>
                        <div class="ob-slug" aria-label="Workspace URL">lightex.app/<b>{{o.slugShow}}</b></div>
                      </div>
                    </div>
                  </sc-if>

                  <sc-if value="{{o.s1}}" hint-placeholder-val="{{false}}">
                    <div class="ob-step {{o.dirCls}}">
                      <h2 class="ob-h">Create your first project</h2>
                      <div class="ob-2">
                        <div class="fld">
                          <label class="lbl" for="{{o.id}}-pn">Project name</label>
                          <input class="in {{o.projCls}}" id="{{o.id}}-pn" type="text" sc-camel-max-length="60" placeholder="Platform Rebuild" value="{{o.proj}}" sc-camel-on-change="{{o.onProj}}" sc-camel-on-blur="{{o.blurProj}}" sc-camel-on-key-down="{{o.enterNext}}" aria-invalid="{{o.projBad}}" sc-camel-auto-focus="{{o.af}}">
                        </div>
                        <div class="fld">
                          <label class="lbl" for="{{o.id}}-pk">Key</label>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;navy&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2720}}">
class Component extends DCLogic {
  state = { ob: {}, req: 'idle', err: 'idle', errTries: 0, refCopied: false, off: 'off', sess: 'open', pw: '', pwTouched: false, play: true };

  slugify(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32); }
  deriveKey(s) {
    const w = String(s || '').replace(/[^A-Za-z\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
    if (!w.length) return '';

  }
  obBuild(id, cfg) {
    const self = this;
    const u = { ...(cfg.init || {}), ...this.obGet(id) };
    const set = (patch) => self.obSet(id, patch);
    const step = u.step || 0;
    const ws = u.ws != null ? u.ws : '';
    const proj = u.proj != null ? u.proj : '';
    const key = u.keyEdited ? (u.key || '') : self.deriveKey(proj);
    const tpl = u.tpl || 'kanban';
    const emails = u.emails || [];
    const draft = u.draft || '';
    const role = u.role || 'member';
    const t = u.touched || {};
    const RESERVED = ['admin', 'lightex', 'api', 'app'];
    const EM = /^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/;
    const slug = self.slugify(ws);
    const wsErr = ws.trim().length < 2 ? 'Use at least 2 characters' : (RESERVED.indexOf(slug) >= 0 ? 'lightex.app/' + slug + ' is taken' : '');
    const projErr = proj.trim().length < 2 ? 'Name the project (2+ characters)' : '';
    const keyErr = !/^[A-Z]{2,5}$/.test(key) ? 'Key: 2–5 letters' : '';
    const badEmails = emails.filter((e) => !EM.test(e));
    const invErr = badEmails.length ? (badEmails.length === 1 ? '“' + badEmails[0] + '” isn’t an email' : badEmails.length + ' emails need fixing') : '';
    const addEmails = (list, rest) => {
      const cur = (self.obGet(id).emails || (cfg.init && cfg.init.emails) || []).slice();
      list.map((x) => x.trim()).filter(Boolean).forEach((x) => { if (cur.indexOf(x) < 0 && cur.length < 20) cur.push(x.slice(0, 80)); });
      set({ emails: cur, draft: rest || '' });
      return cur;
    };
    const go = (n, dir) => set({ step: n, dir: dir || 'fwd', af: !cfg.noFocus });
    const next = () => {
      if (step === 0) { if (wsErr) { set({ touched: { ...t, ws: true } }); return; } set({ done0: true }); go(1); }
      else if (step === 1) { if (projErr || keyErr) { set({ touched: { ...t, proj: true, key: true } }); return; } set({ done1: true }); go(2); }
      else if (step === 2) {
        let list = emails;
        if (draft.trim()) list = addEmails([draft]);
        if (list.some((e) => !EM.test(e))) { set({ touched: { ...t, inv: true } }); return; }
        set({ done2: true });
        go(3);
      }
      else if (step === 3) { if (cfg.onOpen) cfg.onOpen(); }
    };
    const LABELS = ['Workspace', 'Project', 'Team'];
    const segs = LABELS.map((l, i) => ({
      label: l, n: String(i + 1), done: step > i, notDone: step <= i,
      w: step > i ? 100 : (step === i ? 45 : 0), fin: step === 3 ? 'fin' : '',
      cls: step === i ? 'cur' : (step > i ? 'done' : '')
    }));
    const TPL = [['kanban', 'Kanban'], ['scrum', 'Scrum'], ['bugs', 'Bug tracking']];
    const hues = [200, 20, 150, 60, 330, 285];
    const chips = emails.map((e, i) => {
      const ok = EM.test(e);
      return { email: e, cls: ok ? '' : 'bad', ini: ok ? e.charAt(0).toUpperCase() : '!', hue: hues[i % hues.length], remove: () => { const cur = (self.obGet(id).emails || emails).filter((x) => x !== e); set({ emails: cur }); } };
    });
    const sum = [];
    if (u.done0 && ws.trim() && !wsErr) sum.push({ l: 'Workspace', v: 'lightex.app/' + slug, cls: 'mono', badge: false, key: '' });
    if (u.done1 && proj.trim() && !projErr && !keyErr) sum.push({ l: 'Project', v: proj.trim(), cls: '', badge: true, key: key });
    if (u.done2 && emails.length && !invErr) sum.push({ l: 'Invites', v: emails.length + (emails.length === 1 ? ' person · ' : ' people · ') + role.charAt(0).toUpperCase() + role.slice(1), cls: '', badge: false, key: '' });
    const nextLabel = step === 3 ? 'Open board' : (step === 2 ? (emails.length ? 'Send ' + emails.length + (emails.length === 1 ? ' invite' : ' invites') : 'Continue') : 'Continue');
    return {
      id, cls: cfg.mobile ? 'mob' : '',
      stepNum: step, progText: step === 3 ? 'Setup complete' : 'Step ' + (step + 1) + ' of 3',
      segs, s0: step === 0, s1: step === 1, s2: step === 2, s3: step === 3,
      dirCls: u.dir === 'back' ? 'back' : '', af: !!u.af,
      canSkip: step < 3, canBack: step > 0 && step < 3, isDone: step === 3, showEnter: !cfg.mobile,
      skip: () => set({ step: 3, dir: 'fwd', skipped: true }),
      back: () => go(Math.max(0, step - 1), 'back'),
      next,
      enterNext: (e) => { if (e.key === 'Enter') { e.preventDefault(); next(); } },
      reset: () => { const all = { ...(self.state.ob || {}) }; all[id] = { step: 0, ws: '', proj: '', key: '', keyEdited: false, emails: [], draft: '', touched: {}, dir: 'back', af: !cfg.noFocus, done0: false, done1: false, done2: false, skipped: false }; self.setState({ ob: all }); },
      nextLabel,
      ws, wsBad: !!(t.ws && wsErr), wsErr, wsCls: t.ws && wsErr ? 'bad' : '', slugShow: slug || 'your-team',
      onWs: (e) => set({ ws: String(e.target.value || '').slice(0, 40) }),
      blurWs: () => { if (ws) set({ touched: { ...t, ws: true } }); },
      proj, projBad: !!(t.proj && projErr), projErr, projCls: t.proj && projErr ? 'bad' : '',
      onProj: (e) => set({ proj: String(e.target.value || '').slice(0, 60) }),
      blurProj: () => { if (proj) set({ touched: { ...t, proj: true } }); },
      key, keyShow: key || 'KEY', keyBad: !!(t.key && keyErr) && !(t.proj && projErr), keyErr, keyCls: t.key && keyErr ? 'bad' : '',
      onKey: (e) => set({ key: String(e.target.value || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5), keyEdited: true, touched: { ...t, key: true } }),
      tpls: TPL.map((x) => ({ name: x[1], sel: tpl === x[0], on: tpl === x[0] ? 'on' : '', kan: x[0] === 'kanban', scr: x[0] === 'scrum', bug: x[0] === 'bugs', pick: () => set({ tpl: x[0] }) })),
      chips, chipsCls: t.inv && invErr ? 'bad' : '', invBad: !!(t.inv && invErr), invErr,
      emPh: emails.length ? '' : 'jordan@team.dev, sam@team.dev',
      draft,
      onDraft: (e) => {
        const v = String(e.target.value || '');
        if (/[,\s;]/.test(v)) { const parts = v.split(/[,\s;]+/); const rest = /[,\s;]$/.test(v) ? '' : parts.pop(); addEmails(parts, rest); set({ touched: { ...t, inv: true } }); }
        else set({ draft: v.slice(0, 80) });
      },
      onDraftKey: (e) => {
        if (e.key === 'Enter') { e.preventDefault(); if (draft.trim()) { addEmails([draft]); set({ touched: { ...t, inv: true } }); } else next(); }
        else if (e.key === 'Backspace' && !draft && emails.length) { set({ emails: emails.slice(0, -1) }); }
      },
      commitDraft: () => { if (draft.trim()) { addEmails([draft]); set({ touched: { ...t, inv: true } }); } },
      roles: [['member', 'Member'], ['admin', 'Admin'], ['viewer', 'Viewer']].map((r) => ({ name: r[1], sel: role === r[0], pick: () => set({ role: r[0] }) })),
      hasSum: sum.length > 0, sum
    };
  }
  renderVals() {
    const self = this;
    const st = this.state;
    const theme = this.props.theme || 'navy';
    const off = st.off;
    const ROWS = [
      { key: 'PRJ-42', title: 'Fix flaky board reflow on column resize', glyph: 'progress', color: 'var(--warn)', ini: 'AK', hue: 285, q: true },
      { key: 'PRJ-47', title: 'Persist saved filters per project', glyph: 'todo', color: 'var(--todo)', ini: 'JL', hue: 200, q: true },
      { key: 'PRJ-51', title: 'Rotate refresh tokens on sign-in', glyph: 'review', color: 'var(--info)', ini: 'SP', hue: 20, q: false },
      { key: 'PRJ-38', title: 'Virtualize board columns over 200 cards', glyph: 'done', color: 'var(--ok)', ini: 'RC', hue: 150, q: true },
      { key: 'MO-12', title: 'Queue task edits while offline', glyph: 'progress', color: 'var(--warn)', ini: 'MD', hue: 60, q: false },
      { key: 'IN-7', title: 'Cache board queries at the edge', glyph: 'todo', color: 'var(--todo)', ini: 'TN', hue: 330, q: false }
    ];
    const offRows = ROWS.map((r) => ({ ...r, queued: r.q && (off === 'off' || off === 'trying'), synced: r.q && (off === 'on' || off === 'leaving') }));
    const pwErr = !st.pw ? 'Enter your password' : (st.pw.length < 8 ? 'At least 8 characters' : '');
    const obFrames = [
      { label: 'Onboarding', meta: 'interactive · 3 steps + ready · Enter continues', r: 14, phone: false, obs: [this.obBuild('desk', { init: { ws: 'Platform team' } })] },
      { label: 'Onboarding · mobile', meta: '390 · step 2', r: 28, phone: true, obs: [this.obBuild('mob', { mobile: true, noFocus: true, init: { step: 1, ws: 'Platform team', proj: 'Platform Rebuild', key: 'PRJ', keyEdited: true, tpl: 'scrum', done0: true } })] }
    ];
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      reqIdle: st.req === 'idle', reqBusy: st.req === 'busy', reqSent: st.req === 'sent',
      requestAccess: () => { self.setState({ req: 'busy' }); self.later(() => self.setState({ req: 'sent' }), 700); },
      withdraw: () => self.setState({ req: 'idle' }),
      errBusy: st.err === 'busy', errReady: st.err !== 'busy', errFail: st.err === 'fail', errTries: String(st.errTries),
      retryLabel: st.err === 'fail' ? 'Retry again' : 'Retry',
      retry: () => { self.setState({ err: 'busy', refCopied: false }); self.later(() => self.setState({ err: 'fail', errTries: self.state.errTries + 1 }), 900); },
      refCopied: !!st.refCopied, refNotCopied: !st.refCopied,
      copyRef: () => { try { if (navigator.clipboard) navigator.clipboard.writeText('7F3A-91C2'); } catch (e) {} self.setState({ refCopied: true }); self.later(() => self.setState({ refCopied: false }), 1400); },
      sessOpen: st.sess === 'open' || st.sess === 'busy', sessBusy: st.sess === 'busy', sessIdle: st.sess === 'open', sessIn: st.sess === 'in',
      pw: st.pw, pwBad: !!(st.pwTouched && pwErr), pwErr, pwCls: st.pwTouched && pwErr ? 'bad' : '',
      onPw: (e) => self.setState({ pw: String(e.target.value || '').slice(0, 128) }),
      signIn: (e) => { if (e && e.preventDefault) e.preventDefault(); if (pwErr) { self.setState({ pwTouched: true }); return; } self.setState({ sess: 'busy' }); self.later(() => self.setState({ sess: 'in', pw: '', pwTouched: false }), 800); },
      expire: () => self.setState({ sess: 'open', pw: '', pwTouched: false }),
      banShow: off !== 'idle', banCls: off === 'off' || off === 'trying' ? 'off' : (off === 'leaving' ? 'on leaving' : 'on'),
      offOff: off === 'off', offTrying: off === 'trying', offOn: off === 'on' || off === 'leaving', offIdle: off === 'idle',
      reconnect: () => { self.setState({ off: 'trying' }); self.later(() => { self.setState({ off: 'on' }); self.later(() => { self.setState({ off: 'leaving' }); self.later(() => self.setState({ off: 'idle' }), 220); }, 1800); }, 1300); },
      goOffline: () => self.setState({ off: 'off' }),
      offRows,
      playCls: st.play ? 'play' : '',
      replay: () => { self.setState({ play: false }); self.later(() => self.setState({ play: true }), 40); },
      obFrames

  }
}
