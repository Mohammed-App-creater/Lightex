    const cps = canCreate || cfg.mock ? this.cpModel(fid, u, set, projAll, ws.name) : [];
    const cws = this.cwModel(fid, u, set, wsList);
    const swOpen = !!u.sw && !cws.length;
    const hours = new Date().getHours();
    const greet = hours < 5 ? 'Good evening' : hours < 12 ? 'Good morning' : hours < 18 ? 'Good afternoon' : 'Good evening';
    const requested = !!u.req;
    const toastOn = !!u.toast;
    const sbFrames = cfg.sb ? [this.sbx(fid, { role, collapsible: true, active: 'none', sub: 'none' }, {
      homeOn: 'on', homeCur: 'page',
      createWs: () => { self.sbSet(fid, { wsOpen: false }); set({ cw: { open: true, af: true, name: '', hue: 300 } }); },
      newProj: openCreate
    })] : [];
    return {
      desk: !cfg.phone, phone: !!cfg.phone, appCls: cfg.phone ? 'ph-app' : '', sbFrames,
      top: !cfg.phone, topTitle: !cfg.topSw, topSw: !!cfg.topSw,
      mockBg: !!cfg.mock, mockHidden: 'true', reopen: !!cfg.mock && !cfg.topSw && !cps.length,
      loading, isError, showBody: ready,
      skStats: [{ a: 22, b: 64 }, { a: 18, b: 52 }, { a: 22, b: 70 }, { a: 18, b: 84 }],
      skCards: [{ w: 72 }, { w: 54 }, { w: 40 }],
      skRows: [{ w: 46 }, { w: 30 }, { w: 52 }, { w: 38 }],
      retry: () => { set({ phase: 'loading' }); self._tt = self._tt || {}; clearTimeout(self._tt[fid + 'r']); self._tt[fid + 'r'] = setTimeout(() => self.fSet(fid, { phase: 'ready' }), 1100); },
      bodyCls: cfg.phone ? 'narrow' : '',
      greet, dateStr: 'Wednesday, Oct 7',
      showStats: hasProjects && canEdit, stats,
      hasProjects, projects, projCount: projects.length, canCreate,
      openCreate,
      showDue: hasProjects && canEdit, due, dueCount: dueList.filter((t) => t.st !== 'done').length, noDue: dueList.length === 0,
      showEmpty: !hasProjects && canCreate, showNoAccess: !hasProjects && !canCreate,
      admins: [['JL', 'Jordan Lee', 200, 'Owner'], ['MD', 'Morgan Diaz', 60, 'Admin']].map(([ini, name, hue, tag]) => ({ ini, name, hue, email: name.split(' ')[0].toLowerCase() + '@team.dev', tag: requested ? 'Notified' : tag, tagCls: requested ? 'ok' : '' })),
      canRequest: !requested, requested,
      requestAccess: () => set({ req: true }), withdraw: () => set({ req: false }),
      wsName: ws.name, wsBadge: ws.badge, wsHue: ws.hue,
      swOpen, toggleSw: () => set({ sw: !u.sw, swAf: true }), closeSw: () => set({ sw: false }),
      swKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); set({ sw: false }); } },
      swTop: cfg.phone ? 94 : 48, swLeft: cfg.phone ? 46 : 10, swW: cfg.phone ? 296 : 270, miH: cfg.phone ? 44 : 32,
      swItems: wsList.map((w, i) => ({ badge: w.badge, name: w.name, hue: w.hue, meta: w.meta, cur: w.name === ws.name, first: i === 0 && !!u.swAf, pick: () => set({ ws: w.name, sw: false }) })),
      swCreate: () => set({ sw: false, cw: { open: true, af: true, name: '', hue: 300 } }),
      cps, cws, ovCls: cfg.phone ? 'sheet' : '',
      toastL: cfg.sb ? 280 : 16, toastOn, toastText: toastOn ? u.toast.text : '', toastLink: toastOn && !!u.toast.link
    };
  }
  renderVals() {
    const role = this.props.role || 'admin';
    const theme = this.props.theme || 'navy';
    const frames = [
      { ...this.build('main', { role, sb: true }),
        label: 'Workspace home', meta: 'toggle a status glyph · New project card · workspace menu', gc: '1 / span 6', gr: '1', w: 1280, h: 860, r: 14 },
      { ...this.build('cp', { role: 'admin', mock: true, init: { cp: { open: true, name: 'Mobile Web', tpl: 'kanban' } } }),
        label: 'Create project', meta: 'key from name · hover a template to preview', gc: '1 / span 4', gr: '2', w: 840, h: 760, r: 12 },
      { ...this.build('ws', { role, mock: true, topSw: true, init: { sw: true } }),
        label: 'Switcher + Create workspace', meta: 'slug preview · icon color', gc: '5 / span 2', gr: '2', w: 390, h: 760, r: 12 },
      { ...this.build('empty', { role: 'admin', noProjects: true }),
        label: 'Empty · can create', meta: 'project.create', gc: '1 / span 3', gr: '3', w: 620, h: 580, r: 12 },
      { ...this.build('noacc', { role: 'member', noProjects: true }),
        label: 'Not on any project', meta: 'no project.create', gc: '4 / span 3', gr: '3', w: 620, h: 580, r: 12 },
      { ...this.build('load', { role, state: 'loading' }),
        label: 'Loading', meta: 'skeleton in final positions', gc: '1 / span 4', gr: '4', w: 840, h: 420, r: 12 },
      { ...this.build('mob', { role, phone: true }),
        label: 'Mobile', meta: '390 · projects scroll sideways', gc: '5 / span 2', gr: '4 / span 2', w: 390, h: 844, r: 36 },
      { ...this.build('err', { role, state: 'error' }),
        label: 'Error', meta: 'retry → skeleton → loaded', gc: '1 / span 4', gr: '5', w: 840, h: 384, r: 12 }
    ];
    return { themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy', frames };
  }
}
