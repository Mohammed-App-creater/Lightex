      commit(nd, { sel: { ...selMap, [scope]: nid }, edOpen: true, draft: null, ...toastPatch('Created ' + nm, data) });
    };
    const affected = members.filter((x) => x.role === R.id);
    const askDelete = () => {
      if (locked) return;
      if (affected.length) { set({ dialog: 'delete', reass: '', dmenu: false, menu: null }); return; }
      const rest = roles.filter((r) => r.id !== R.id);
      commit({ ...D, roles: rest }, { draft: null, sel: { ...selMap, [scope]: rest[0].id }, ...toastPatch('Deleted ' + R.name, data) });
    };
    const groups = ['Tasks', 'Planning', 'Collaboration', 'Reports', 'Administration'].map((area) => {
      const ps = PERMS.filter((p) => p.area === area);
      return {
        name: area, total: ps.length, onN: ps.filter((p) => has(cur.perms, p.id)).length,
        perms: ps.map((p) => ({
          name: p.name, desc: p.desc, on: has(cur.perms, p.id),
          cls: (locked ? 'lck' : '') + (permChanged(p.id) ? ' chg' : ''),
          toggle: () => { if (locked || !admin) return; editDraft({ perms: has(cur.perms, p.id) ? cur.perms.filter((x) => x !== p.id) : cur.perms.concat(p.id) }); }
        }))
      };
    });
    const roleItem = (r) => ({ name: r.name, count: countOf(r.id), on: r.id === R.id ? 'on' : '', cur: r.id === R.id ? 'true' : 'false', pick: () => { if (r.id === R.id) { set({ edOpen: true }); return; } if (dirty) { shake(); return; } set({ sel: { ...selMap, [scope]: r.id }, edOpen: true, draft: null, nameErr: '' }); } });

    // ---- members ----
    const q = String(u.q || '').trim().toLowerCase();
    const rf = u.rf && roles.some((r) => r.id === u.rf) ? u.rf : '';
    const shown = members.filter((x) => (!rf || x.role === rf) && (!q || (x.name || '').toLowerCase().indexOf(q) >= 0 || x.email.indexOf(q) >= 0));
    const resend = (xid) => {
      set({ menu: null, resent: xid });
      setTimeout(() => { if (self.msGet(id).resent === xid) self.msSet(id, { resent: null }); }, 2200);
    };
    const revoke = (x) => commit({ ...D, members: members.filter((y) => y.id !== x.id) }, { menu: null, ...toastPatch('Invite to ' + x.email + ' revoked', data) });
    const rows = shown.map((x) => {
      const inv = x.status === 'invited';
      const rr = roleById(x.role);
      const isYou = !!x.you;
      const canPick = admin && !isYou && x.role !== 'owner';
      const av = avOf(x);
      return {
        name: label(x), email: inv ? 'Invited ' + x.sent : x.email, ini: av.ini, avBg: av.bg, avCls: av.cls, isYou,
        roleName: rr.name, canPick, roStatic: !canPick, cls: inv ? 'is-inv' : '',
        stCls: inv ? 'inv' : 'act', stLabel: inv ? 'Invited' : 'Active', last: inv ? '—' : x.last,
        hasMenu: canPick, menuOpen: menu === 'row:' + x.id, pickOpen: menu === 'pick:' + x.id,
        toggleMenu: () => toggle('row:' + x.id), togglePick: () => toggle('pick:' + x.id), openPick: () => set({ menu: 'pick:' + x.id }),
        isAct: !inv, isInv: inv,
        opts: assignable.map((r) => ({
          name: r.name, sel: r.id === x.role, on: r.id === x.role ? 'on' : '',
          pick: () => { if (r.id === x.role) { set({ menu: null }); return; } commit({ ...D, members: members.map((y) => y.id === x.id ? { ...y, role: r.id } : y) }, { menu: null, ...toastPatch(label(x) + ' is now ' + r.name, data) }); }
        })),
        remove: () => commit({ ...D, members: members.filter((y) => y.id !== x.id) }, { menu: null, ...toastPatch('Removed ' + x.name, data) }),
        resend: () => resend(x.id), revoke: () => revoke(x)
      };
    });
    const invites = members.filter((x) => x.status === 'invited').map((x) => {
      const ok = u.resent === x.id;
      return { ini: x.ini, email: x.email, roleName: roleById(x.role).name, sent: x.sent, sentOk: ok, canResend: !ok, resend: () => resend(x.id), revoke: () => revoke(x) };
    });

    // ---- invite dialog ----
    const I = u.inv || { chips: [], text: '', role: scope === 'ws' ? 'member' : 'contrib', menu: false };
    const setInv = (patch) => set({ inv: { ...I, ...patch } });
    const iRole = assignable.find((r) => r.id === I.role) || assignable[0];
    const emails = members.map((x) => x.email);
    const RE = /^[^\s@,;]+@[^\s@,;]+\.[a-z]{2,}$/i;
    const addChips = (list, rest) => {
      const next = I.chips.slice();
      list.map((s) => String(s).trim().toLowerCase().slice(0, 120)).filter(Boolean).forEach((s) => { if (next.indexOf(s) < 0) next.push(s); });
      setInv({ chips: next.slice(0, 20), text: String(rest || '').slice(0, 120) });
    };
    const chips = I.chips.map((v, i) => {
      const ok = RE.test(v);
      const dup = ok && emails.indexOf(v) >= 0;
      return { v, ok, dup, cls: !ok ? 'bad' : (dup ? 'dup' : ''), title: !ok ? 'Invalid email' : (dup ? 'Already a member' : v), remove: () => setInv({ chips: I.chips.filter((_, j) => j !== i) }) };
    });
    const valid = chips.filter((c) => c.ok && !c.dup);
    const bad = chips.filter((c) => !c.ok);
    const dups = chips.filter((c) => c.dup);
    const cannotSend = valid.length === 0 || bad.length > 0;
    const closeDialog = () => set({ dialog: null, inv: null, reass: '', dmenu: false });
    const sendInv = () => {
      if (cannotSend) return;
      const ts = Date.now();
      const add = valid.map((c, i) => ({ id: 'i' + ts + i, name: '', ini: c.v.slice(0, 2).toUpperCase(), hue: 0, email: c.v, role: iRole.id, status: 'invited', last: '', sent: 'Oct 7' }));
      commit({ ...D, members: members.concat(add) }, { dialog: null, inv: null, ...toastPatch(add.length === 1 ? 'Invite sent to ' + add[0].email : add.length + ' invitations sent', data) });
    };
    const inv = {
      chips, text: I.text || '', ph: I.chips.length ? '' : 'name@team.dev, …', boxCls: bad.length ? 'bad' : '',
      hasMsg: bad.length > 0 || dups.length > 0,
      msg: bad.length ? (bad.length === 1 ? '“' + bad[0].v + '” isn’t a valid email' : bad.length + ' invalid emails') : (dups.length ? dups.map((c) => c.v).join(', ') + ' already in ' + scopeName + ' · skipped' : ''),
      msgCls: bad.length ? 'err' : 'note',
      hint: bad.length ? 'Fix invalid emails to send' : (valid.length ? '' : 'Enter or comma adds an email'),
      cannotSend, sendLabel: valid.length > 1 ? 'Send ' + valid.length + ' invites' : 'Send invite', send: sendInv,
      roleName: iRole.name, roleDesc: iRole.desc, menu: !!I.menu, toggleMenu: () => setInv({ menu: !I.menu }),
      opts: assignable.map((r) => ({ name: r.name, desc: r.desc, sel: r.id === iRole.id, on: r.id === iRole.id ? 'on' : '', pick: () => setInv({ role: r.id, menu: false }) })),
      onText: (e) => {
        const v = String(e.target.value || '');
        if (/[\s,;]/.test(v)) { const segs = v.split(/[\s,;]+/); const rest = /[\s,;]$/.test(v) ? '' : segs.pop(); addChips(segs, rest); }
        else setInv({ text: v.slice(0, 120) });
      },
      onKey: (e) => {
        const v = String(e.target.value || '');
        if ((e.key === 'Enter' || e.key === 'Tab') && v.trim()) { e.preventDefault(); addChips([v], ''); }
        else if (e.key === 'Enter' && !v.trim()) { e.preventDefault(); sendInv(); }
        else if (e.key === 'Backspace' && !v && I.chips.length) { setInv({ chips: I.chips.slice(0, -1) }); }
      },
      onBlur: (e) => { const v = String(e.target.value || ''); if (v.trim()) addChips([v], ''); },
      onDlgKey: (e) => { if (e.key !== 'Escape') return; e.stopPropagation(); if (I.menu) setInv({ menu: false }); else closeDialog(); }
    };

    // ---- delete dialog ----
    const toR = roles.find((r) => r.id === u.reass && r.id !== R.id);
    const n = affected.length;
    const del = {
      name: R.name,
      reason: 'In use by ' + n + (n === 1 ? ' member' : ' members') + '. Reassign before deleting.',
      avs: affected.slice(0, 5).map(avOf), names: affected.slice(0, 3).map(label).join(', ') + (n > 3 ? ' +' + (n - 3) : ''),
      toName: toR ? toR.name : 'Choose a role', selCls: toR ? '' : 'ph', menu: !!u.dmenu,
      toggleMenu: () => set({ dmenu: !u.dmenu }),
      opts: roles.filter((r) => r.id !== R.id && r.id !== 'owner').map((r) => ({ name: r.name, n: countOf(r.id), sel: !!toR && toR.id === r.id, on: toR && toR.id === r.id ? 'on' : '', pick: () => set({ reass: r.id, dmenu: false }) })),
      cannot: !toR, hint: toR ? n + ' → ' + toR.name : 'Pick a role to enable Delete',
      confirm: () => {
        if (!toR) return;
        const nd = { ...D, roles: roles.filter((r) => r.id !== R.id), members: members.map((x) => x.role === R.id ? { ...x, role: toR.id } : x) };
        commit(nd, { dialog: null, reass: '', dmenu: false, draft: null, sel: { ...selMap, [scope]: toR.id }, ...toastPatch(R.name + ' deleted · ' + n + ' moved to ' + toR.name, data) });
      },
      onDlgKey: (e) => { if (e.key !== 'Escape') return; e.stopPropagation(); if (u.dmenu) set({ dmenu: false }); else closeDialog(); }
    };

    const dialog = u.dialog || null;
    const showRoles = ready && tab === 'roles' && admin;
    const nRoleMembers = countOf(R.id);
    const grantN = PERMS.filter((p) => has(cur.perms, p.id)).length;
    const rfOpts = [{ name: 'All roles', n: members.length, sel: !rf, on: !rf ? 'on' : '', pick: () => set({ rf: '', menu: null }) }]
      .concat(roles.map((r) => ({ name: r.name, n: countOf(r.id), sel: rf === r.id, on: rf === r.id ? 'on' : '', pick: () => set({ rf: r.id, menu: null }) })));
    const toScope = (s) => () => { if (s === scope) return; if (dirty) { shake(); return; } set({ scope: s, menu: null, rf: '', q: '', edOpen: false, nameErr: '' }); };
    return {
      uid: 'mm-' + id,
      cls: (narrow ? 'narrow' : '') + (cfg.compact ? ' compact' : ''),
      admin, notAdmin: !admin, roleLabel: role,
      isWs: scope === 'ws', isPrj: scope === 'prj', segX: scope === 'ws' ? 0 : 100,
      toWs: toScope('ws'), toPrj: toScope('prj'), scopeName,
      tabM: tab === 'members', tabR: tab === 'roles', tabX: tab === 'members' ? 0 : 100,
      pickM: guard(() => set({ tab: 'members', menu: null })), pickR: () => set({ tab: 'roles', menu: null }),
      memCount: members.length, roleCount: roles.length,
      isLoading: view === 'loading', isError: view === 'error',
      skRows: [[120, 150], [96, 170], [132, 140], [104, 160], [118, 130], [90, 150]].map((w) => ({ w: w[0], w2: w[1] })),
      retry: () => { set({ view: 'loading' }); setTimeout(() => self.msSet(id, { view: 'ready' }), 900); },
      showMembers: ready && tab === 'members',
      q: u.q || '', onQ: (e) => set({ q: String(e.target.value || '').slice(0, 80) }),
      rfOpen: menu === 'rf', toggleRf: () => toggle('rf'), rfLabel: rf ? roleById(rf).name : 'All roles', rfOpts,
      roleColLabel: scope === 'ws' ? 'Role' : 'Project role',
      removeLabel: scope === 'ws' ? 'Remove from workspace' : 'Remove from project',
      rows, hasRows: rows.length > 0, noMatch: rows.length === 0 && members.length > 0,
      justYou: members.length === 1 && rows.length === 1,
      clearFilters: () => set({ q: '', rf: '' }),
      openInvite: () => set({ dialog: 'invite', inv: null, menu: null }),
      showPending: admin && invites.length > 0, invites, invCount: invites.length,
      showDenied: ready && tab === 'roles' && !admin,
      requested: !!u.requested, notRequested: !u.requested, requestAccess: () => set({ requested: true }),
      showRoles, edCls: u.edOpen ? 'ed-open' : '',
      sysRoles: roles.filter((r) => r.sys).map(roleItem), cusRoles: roles.filter((r) => !r.sys).map(roleItem),
      back: guard(() => set({ edOpen: false })),
      locked, editable: !locked, curName: cur.name, curDesc: cur.desc,
      onName: (e) => editDraft({ name: String(e.target.value || '').slice(0, 40) }),
      onDesc: (e) => editDraft({ desc: String(e.target.value || '').slice(0, 80) }),
      hasNameErr: !!u.nameErr, nameErr: u.nameErr || '',
      duplicate, askDelete,
      roleAvs: affected.slice(0, 4).map(avOf),
      roleCountLabel: nRoleMembers === 1 ? '1 member' : nRoleMembers + ' members',
      grantSummary: grantN + ' of ' + PERMS.length + ' permissions',
      showRoleMembers: guard(() => set({ tab: 'members', rf: R.id, q: '' })),
      groups,
      showBar: showRoles && dirty, chgCount, shkCls: u.shakeN ? 'shk' + (u.shakeN % 2) : '', save, discard,
      hasToast: !!toast, toastText: toast ? toast.text : '', canUndo: !!(toast && toast.undo),
      toastCls: showRoles && dirty ? 'up' : '',
      undo: () => { if (toast && toast.undo) set({ data: toast.undo, toast: null, draft: null }); },
      dismissToast: () => set({ toast: null }),
      inviteOpen: dialog === 'invite' && admin, inv,
      deleteOpen: dialog === 'delete' && admin && showRoles, del,
      closeDialog,
      menuOpen: !!menu, closeMenu: () => set({ menu: null }),
      onKey: (e) => {
        if (e.key === 'Escape' && menu) { set({ menu: null }); return; }
        if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S') && showRoles && dirty) { e.preventDefault(); save(); }
      }
    };
  }
  renderVals() {
    const theme = this.props.theme ?? 'navy';
    const role = this.props.role ?? 'admin';
    const seed = this.msSeed(false);
    const qa = seed.ws.roles.find((r) => r.id === 'qa');
    const S = (id, cfg) => [this.msBuild(id, cfg)];
    const frames = [
      { label: 'Members & roles', meta: 'interactive · switch scope, tabs, roles · role tweak', span: 6, w: '100%', h: 860, r: 14,
        sbFrames: [this.sbFrame('main', { role, collapsible: true, active: 'PR', sub: 'none' })],
        screens: S('main', { role, init: { sel: { ws: 'qa', prj: 'captain' } } }) },
      { label: 'Invite dialog', meta: 'chips · validation · Esc closes', span: 3, w: '100%', h: 580, r: 14, sbFrames: [],
        screens: S('inv', { compact: true, init: { dialog: 'invite', inv: { chips: ['priya@team.dev', 'sam@team.dev', 'jamie@team'], text: '', role: 'member', menu: false } } }) },
      { label: 'Delete role in use', meta: 'reassign first · Delete enables after', span: 3, w: '100%', h: 580, r: 14, sbFrames: [],
        screens: S('del', { compact: true, init: { tab: 'roles', sel: { ws: 'qa' }, dialog: 'delete' } }) },
      { label: 'Locked system role', meta: 'read-only toggles · duplicate', span: 3, w: '100%', h: 720, r: 14, sbFrames: [],
        screens: S('lock', { compact: true, init: { tab: 'roles', sel: { ws: 'admin' } } }) },
      { label: 'Unsaved changes', meta: 'sticky bar · ⌘S · switching role shakes', span: 3, w: '100%', h: 720, r: 14, sbFrames: [],
        screens: S('dirty', { compact: true, init: { tab: 'roles', sel: { ws: 'qa' }, draft: { rid: 'qa', scope: 'ws', name: qa.name, desc: qa.desc, perms: qa.perms.filter((x) => x !== 'r.export').concat(['p.sprints']) } } }) },
      { label: 'Permission denied', meta: 'member opens Roles', span: 3, w: '100%', h: 480, r: 14, sbFrames: [],
        screens: S('deny', { compact: true, role: 'member', init: { tab: 'roles' } }) },
      { label: 'Error', meta: 'retry', span: 3, w: '100%', h: 480, r: 14, sbFrames: [],
        screens: S('err', { compact: true, state: 'error' }) },
      { label: 'Loading', meta: 'skeleton in final positions', span: 3, w: '100%', h: 480, r: 14, sbFrames: [],
        screens: S('load', { compact: true, state: 'loading' }) },
      { label: 'Empty', meta: 'new workspace', span: 3, w: '100%', h: 480, r: 14, sbFrames: [],
        screens: S('empty', { compact: true, empty: true }) },
      { label: 'Mobile · members', meta: '390 · cards', span: 2, w: '390px', h: 800, r: 28, sbFrames: [],
        screens: S('mob1', { narrow: true, role }) },
      { label: 'Mobile · role editor', meta: 'full-screen page', span: 2, w: '390px', h: 800, r: 28, sbFrames: [],
        screens: S('mob2', { narrow: true, init: { tab: 'roles', sel: { ws: 'qa' }, edOpen: true } }) },
      { label: 'Mobile · invite', meta: 'bottom sheet', span: 2, w: '390px', h: 800, r: 28, sbFrames: [],
        screens: S('mob3', { narrow: true, init: { dialog: 'invite', inv: { chips: ['priya@team.dev'], text: '', role: 'member', menu: false } } }) }
    ];
    return { themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy', frames };
  }
}
</script>
