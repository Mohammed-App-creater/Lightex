<style>
body{margin:0}
.t-navy{--bg:#060B18;--surface:#0C1326;--raised:#131C34;--hover:#1B2644;--line:#1C2845;--line-2:#2B3A5E;--control:#5F6F96;--text:#EAF0FF;--text-2:#A5B2D1;--text-3:#8794B6;--accent:#2B67F5;--accent-h:#2F6DF6;--accent-t:#8AB0FF;--accent-s:rgba(43,103,245,.2);--ring:rgba(90,150,255,.5);--ok:#4ADE80;--warn:#F5B73B;--shadow-pop:0 8px 24px rgba(0,0,0,.5);--av-l:.40;--av-c:.10;--logo:#3B7BFF;--pk-l:.32;--pk-c:.07;--pkt-l:.88;--pkt-c:.09}

.t-light{--bg:#FAFAFB;--surface:#FFFFFF;--raised:#F3F3F6;--hover:#EAEAEF;--line:#E4E4EA;--line-2:#D0D0D9;--control:#8A8A9B;--text:#121217;--text-2:#55556A;--text-3:#5F5F70;--accent:#1D4ED8;--accent-h:#2563EB;--accent-t:#1D4ED8;--accent-s:rgba(29,78,216,.10);--ring:rgba(29,78,216,.35);--ok:#157A3A;--warn:#8A5A00;--shadow-pop:0 8px 24px rgba(18,18,23,.10);--av-l:.90;--av-c:.06;--logo:#1D4ED8;--pk-l:.93;--pk-c:.04;--pkt-l:.42;--pkt-c:.12}
.ds{--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.ds *{box-sizing:border-box}

.frame{margin:0;display:flex;flex-direction:column;gap:12px}

/*SB-CSS-START*/

.sb-wsb{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--text);font:600 13px/1 'Inter',system-ui,sans-serif;cursor:pointer;text-align:left;transition:background-color 120ms var(--ease)}

.sb-icb{width:30px;height:30px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--text-3);cursor:pointer;transition:background-color 120ms var(--ease),color 120ms var(--ease)}

.sb-search .kbd{position:absolute;right:8px;top:50%;margin-top:-9px;pointer-events:none}
.sb-sinp{width:100%;height:34px;padding:0 44px 0 32px;border-radius:9px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font:400 13px/1 'Inter',system-ui,sans-serif;transition:border-color 150ms var(--ease),box-shadow 150ms var(--ease)}
.sb-sinp::placeholder{color:var(--text-3)}
.sb-sinp:hover{border-color:var(--control)}
.sb-sinp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s),0 0 18px 2px var(--accent-s)}
.sb-new{display:flex;align-items:center;gap:8px;height:32px;margin:8px 10px 4px;padding:0 8px 0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);color:var(--text);font:500 13px/1 'Inter',system-ui,sans-serif;cursor:pointer;transition:background-color 120ms var(--ease),border-color 120ms var(--ease),transform 120ms var(--ease)}
.sb-new:hover{background:var(--hover);border-color:var(--control)}
.sb-new:active{transform:scale(.98)}
.sb-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.sb-scroll.masked{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 28px),transparent 100%)}
.sb-it{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:7px;color:var(--text-2);font-weight:500;text-decoration:none;border:0;background:transparent;width:100%;font-family:inherit;font-size:13px;cursor:pointer;text-align:left;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.sb-it:hover{background:var(--hover);color:var(--text)}
.sb-it.on{background:var(--hover);color:var(--text)}
.sb-it .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-count{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.sb-unread{min-width:20px;height:18px;padding:0 6px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-s);color:var(--accent-t);font:600 11px/1 'JetBrains Mono',monospace}
.sb-sec{display:flex;align-items:center;gap:4px;height:28px;margin-top:14px;padding:0 4px 0 8px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.sb-sec.sticky{position:sticky;top:-4px;background:var(--surface);z-index:2}
.sb-sect{flex:1;display:flex;align-items:center;gap:6px;height:100%;border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}

.sb-col>div{overflow:hidden;min-height:0}
.sb-pk{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font:600 9px/1 'JetBrains Mono',monospace;flex:none}
.sb-chev{flex:none;color:var(--text-3);transition:transform 200ms var(--ease)}
.sb-chev.open{transform:rotate(90deg)}
.sb-subs{position:relative;margin:2px 0 6px 16px;padding-left:10px;border-left:1px solid var(--line)}
.sb-ind{position:absolute;left:10px;right:0;top:0;height:30px;border-radius:7px;background:var(--accent-s);transition:transform 220ms var(--spring),opacity 150ms var(--ease);pointer-events:none}
.sb-si{position:relative;z-index:1;display:flex;align-items:center;gap:9px;height:30px;margin-bottom:2px;padding:0 8px;border-radius:7px;color:var(--text-2);text-decoration:none;font-weight:500;border:0;background:transparent;width:100%;font-family:inherit;font-size:13px;cursor:pointer;text-align:left;transition:color 120ms var(--ease),background-color 120ms var(--ease)}

.sb-filter::placeholder{color:var(--text-3)}
.sb-filter:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.sb-foot{padding:8px 10px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sb-spr{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:6px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;text-align:left;font:inherit;transition:border-color 120ms var(--ease),background-color 120ms var(--ease),transform 150ms var(--spring)}
.sb-spr:hover{border-color:var(--line-2);background:var(--raised);transform:translateY(-1px)}
.sb-rg{transition:stroke-dashoffset 800ms var(--ease)}
.sb-row{display:flex;align-items:center;gap:2px}
.sb-prof{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding:8px;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;cursor:pointer;text-align:left;transition:background-color 120ms var(--ease)}
.sb-prof:hover,.sb-prof[aria-expanded=true]{background:var(--hover)}
.sb-av{position:relative;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--text);flex:none;width:30px;height:30px;font-size:11px}
.sb-pres{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--surface)}
.sb-menu{position:absolute;z-index:30;padding:4px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);animation:sbpop 160ms var(--ease)}
@keyframes sbpop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.sb-menu.up{animation-name:sbpopup}
@keyframes sbpopup{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sb-mi{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text);font:500 13px/1 'Inter',sans-serif;cursor:pointer;text-align:left;text-decoration:none}
.sb-mi:hover{background:var(--hover)}
.sb-sep{height:1px;background:var(--line);margin:4px -4px}
.sb-wsb:focus-visible,.sb-icb:focus-visible,.sb-new:focus-visible,.sb-it:focus-visible,.sb-si:focus-visible,.sb-sect:focus-visible,.sb-spr:focus-visible,.sb-prof:focus-visible,.sb-mi:focus-visible,.sb-ri:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
/* rail */
.sb-rail{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;padding:10px 0;width:100%}
.sb-tw{position:relative;display:flex;justify-content:center}
.sb-ri{position:relative;width:40px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:var(--text-2);cursor:pointer;text-decoration:none;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.sb-ri:hover,.sb-ri.on{background:var(--hover);color:var(--text)}
.sb-dot{position:absolute;right:8px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent-t);box-shadow:0 0 0 2px var(--surface)}
.sb-tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translate(-4px,-50%);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;white-space:nowrap;padding:5px 8px;border-radius:6px;background:var(--raised);border:1px solid var(--line-2);box-shadow:var(--shadow-pop);font-size:12px;font-weight:500;color:var(--text);transition:opacity 120ms var(--ease),transform 150ms var(--ease);z-index:40}
.sb-tw:hover .sb-tip,.sb-tw:focus-within .sb-tip,.sb-tip.show{opacity:1;transform:translate(0,-50%);transition-delay:150ms}
.sb-tip.show{transition-delay:0ms}
.sb-rsep{width:28px;height:1px;background:var(--line);margin:6px 0}
/* touch */
.touch .sb-it,.touch .sb-si,.touch .sb-mi{height:42px}
.touch .sb-ind{height:42px}
.touch .sb-new{height:44px}
.touch .sb-sinp{height:44px}
@media (prefers-reduced-motion:reduce){.sbw,.sb-col,.sb-ind,.sb-chev,.sb-sect svg,.sb-rg,.sb-spr,.sb-menu,.sb-tip{transition:none!important;animation:none!important}}

.scrim{position:absolute;inset:0;background:rgba(2,5,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein 200ms var(--ease);z-index:2}
.drawer{position:absolute;left:0;top:0;bottom:0;z-index:3;box-shadow:24px 0 48px rgba(0,0,0,.4);animation:drawin 250ms var(--ease)}
@keyframes drawin{from{transform:translateX(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.fade{animation:none}}
</style>

<div class="ds t-navy" style="width:1440px;height:2080px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="mono" style="font-size:12px;color:var(--text-3);letter-spacing:.04em">SCREENS · NAVIGATION</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Sidebar</h1>
    </div>
    <div style="display:flex;gap:16px;color:var(--text-3);font-size:12px" class="mono"><span>264 / 64 px</span><span>⌘B collapse</span><span>⌘K search</span><span>C new task</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 40px">
    <sc-for list="{{frames}}" as="fr" hint-placeholder-count="5">
      <figure class="frame" style="grid-column:span {{fr.span}}">
        <figcaption>{{fr.label}}<span class="mono" style="font-size:11px;font-weight:500;color:var(--text-3)">{{fr.meta}}</span></figcaption>
        <div class="device {{fr.devCls}}" style="width:{{fr.w}}px;height:{{fr.h}}px;border-radius:{{fr.r}}px">

          <sc-if value="{{fr.phone}}" hint-placeholder-val="{{false}}">
            <div class="mock" style="position:absolute;inset:0">
              <div class="mock-top" style="height:52px;padding:0 8px">
                <button class="sb-icb" type="button" aria-label="Open navigation" sc-camel-on-click="{{fr.openDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"></path></svg></button>
                <span style="font-weight:600;color:var(--text);flex:1">Board</span>
                <button class="sb-icb" type="button" aria-label="Search" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg></button>
              </div>
              <div style="padding:14px;display:flex;flex-direction:column;gap:10px"><div class="blk" style="height:92px"></div><div class="blk" style="height:92px"></div><div class="blk" style="height:92px"></div></div>
            </div>
            <sc-if value="{{fr.drawerOpen}}" hint-placeholder-val="{{true}}"><div class="scrim" sc-camel-on-click="{{fr.closeDrawer}}"></div></sc-if>
          </sc-if>

          <sc-if value="{{fr.showSb}}" hint-placeholder-val="{{true}}">
          <div class="sbw {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                  <input class="sb-sinp" type="search" placeholder="Search or jump…" autocomplete="off">
                  <span class="kbd">⌘K</span>
                </label>

                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}">
                  <button class="sb-new" type="button"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span style="flex:1;text-align:left">New task</span><span class="kbd">C</span></button>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2080}}">
class Component extends DCLogic {
  state = { sb: {}, on: false };
  componentDidMount() { setTimeout(() => this.setState({ on: true }), 80); }
//SB-JS-START
  sbGet(id) { return (this.state.sb && this.state.sb[id]) || {}; }
  sbSet(id, patch) { const all = { ...(this.state.sb || {}) }; all[id] = { ...(all[id] || {}), ...patch }; this.setState({ sb: all }); }
  sbFrame(id, cfg) {
    const self = this;
    const u = this.sbGet(id);
    const role = cfg.role || 'admin';
    const viewer = role === 'viewer';
    const ICON = {
      board: 'M2.5 3h3v10h-3zM6.5 3h3v7h-3zM10.5 3h3v5h-3z',
      backlog: 'M2.5 4h11M2.5 8h11M2.5 12h7',
      sprints: 'M12.5 6.5A4.8 4.8 0 004 5M3.5 9.5A4.8 4.8 0 0012 11M3.8 2.8v2.4h2.4M12.2 13.2v-2.4H9.8',
      objectives: 'M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM8 5.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5z',
      milestones: 'M4 14V2.5h7.5L10 5.5l1.5 3H4',
      reports: 'M3 13V8M6.5 13V4M10 13V9.5M13.5 13V6'
    };
    const SUBS = [['board', 'Board'], ['backlog', 'Backlog'], ['sprints', 'Sprints'], ['objectives', 'Objectives'], ['milestones', 'Milestones'], ['reports', 'Reports']]
      .filter((s) => !viewer || ['board', 'backlog', 'objectives', 'milestones'].indexOf(s[0]) >= 0);
    const ALL = [
      ['PR', 'Platform Rebuild', 255], ['MO', 'Mobile App', 175], ['IN', 'Infra', 75], ['DS', 'Design System', 300], ['AP', 'Public API', 25],
      ['BI', 'Billing', 140], ['SE', 'Search', 215], ['ON', 'Onboarding', 335], ['DA', 'Data Pipeline', 100], ['QA', 'QA Automation', 50],
      ['SC', 'Security', 5], ['DO', 'Docs', 230], ['GR', 'Growth', 155], ['MK', 'Marketing Site', 285], ['PE', 'Performance', 195], ['AN', 'Analytics', 60]
    ];
    const list = cfg.many ? ALL : (viewer ? ALL.slice(0, 3) : ALL.slice(0, 5));
    const active = u.active || cfg.active || 'PR';
    const openKey = u.open === undefined ? active : u.open;
    const sub = u.sub || cfg.sub || 'board';
    const filter = u.filter || '';
    const q = filter.trim().toLowerCase();
    const shown = list.filter((p) => !q || p[1].toLowerCase().indexOf(q) >= 0 || p[0].toLowerCase() === q);
    const projects = shown.map(([badge, name, hue]) => {
      const isOpen = openKey === badge;
      const subs = SUBS.map(([k, label], i) => ({
        name: label, d: ICON[k], on: active === badge && sub === k ? 'on' : '', cur: active === badge && sub === k ? 'page' : 'false',
        pick: () => self.sbSet(id, { active: badge, sub: k, open: badge })
      }));
      const idx = SUBS.findIndex((s) => s[0] === sub);
      const step = cfg.touch ? 44 : 32;
      return {
        badge, name, hue, open: isOpen, on: active === badge && !isOpen ? 'on' : '',
        chev: isOpen ? 'open' : '', colCls: isOpen ? 'open' : '', subs,
        indY: Math.max(0, idx) * step, indO: active === badge && idx >= 0 ? 1 : 0,
        toggle: () => self.sbSet(id, { open: isOpen ? null : badge })
      };
    });
    const railProjects = list.slice(0, 6).map(([badge, name, hue]) => ({
      badge, name, hue, on: active === badge ? 'on' : '',
      toggle: () => self.sbSet(id, { active: badge, open: badge })
    }));
    const pinOpen = u.pinOpen === undefined ? true : u.pinOpen;
    const projOpen = u.projOpen === undefined ? true : u.projOpen;
    const pct = 65;
    const C = 72.3;
    const WS = [['PT', 'Platform team', 255], ['DG', 'Design guild', 300], ['PE', 'Personal', 155]];
    const wsName = u.ws || 'Platform team';
    const collapsed = u.rail === undefined ? !!cfg.rail : u.rail;
    const curProj = list.find((p) => p[0] === active) || list[0];
    const curSub = SUBS.find((s) => s[0] === sub) || SUBS[0];
    return {
      full: !collapsed, rail: collapsed,
      sbW: collapsed ? 64 : (cfg.width || 264),
      sbwCls: collapsed ? 'israil' : '',
      touchCls: cfg.touch ? 'touch' : '',
      collapsible: !!cfg.collapsible, closable: !!cfg.closable,
      wsName, wsOpen: !!u.wsOpen,
      toggleWs: () => self.sbSet(id, { wsOpen: !u.wsOpen, profOpen: false }),
      workspaces: WS.map(([b, n, h]) => ({ badge: b, name: n, hue: h, cur: n === wsName, pick: () => self.sbSet(id, { ws: n, wsOpen: false }) })),
      canTask: !viewer, showMine: !viewer, canProj: role === 'admin', canAdmin: role === 'admin', canSettings: !viewer,
      roleLabel: role.charAt(0).toUpperCase() + role.slice(1),
      inbox: viewer ? 1 : 3,
      pins: [
        { name: 'My open bugs', n: 4, d: 'M2.5 3.5h11l-4.2 5v4l-2.6 1v-5z' },
        { name: 'Due this week', n: 9, d: 'M3 4.5h10v8.5H3zM3 7h10M5.5 3v3M10.5 3v3' },
        { name: 'Blocked', n: 2, d: 'M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM4.1 4.1l7.8 7.8' }
      ],
      pinOpen, pinCls: pinOpen ? 'open' : '', togglePin: () => self.sbSet(id, { pinOpen: !pinOpen }),
      projOpen, projSecCls: projOpen ? 'open' : '', toggleProjSec: () => self.sbSet(id, { projOpen: !projOpen }),
      projects, railProjects, projCount: list.length,
      showFilter: !!cfg.many, filter, onFilter: (e) => self.sbSet(id, { filter: e.target.value.slice(0, 60) }), noMatch: shown.length === 0,
      maskCls: cfg.many ? 'masked' : '', secCls: cfg.many ? 'sticky' : '',
      sprPct: pct, sprOff: this.state.on ? (C * (1 - pct / 100)).toFixed(1) : C,
      openBoard: () => self.sbSet(id, { active: 'PR', sub: 'board', open: 'PR' }),
      profOpen: !!u.profOpen,
      toggleProf: () => self.sbSet(id, { profOpen: !u.profOpen, wsOpen: false }),
      profKey: (e) => { if (e.key === 'Escape') self.sbSet(id, { profOpen: false, wsOpen: false }); },
      toggleRail: () => self.sbSet(id, { rail: !collapsed, wsOpen: false, profOpen: false }),
      projName: curProj[1], subLabel: curSub[1],
      tipDemo: cfg.tipDemo ? 'show' : ''
    };
  }
//SB-JS-END
  renderVals() {
    const self = this;
    const eDrawer = this.sbGet('E').drawer;
    const drawerOpen = eDrawer === undefined ? true : eDrawer;
    const F = (id, label, meta, cfg, frame) => ({ ...this.sbFrame(id, cfg), label, meta, ...frame });
    const frames = [
      F('A', 'Expanded', 'click anything · ⌘B button collapses', { role: 'admin', collapsible: true },
        { span: 2, w: 840, h: 860, r: 14, content: true, phone: false, showSb: true, devCls: '' }),
      F('B', 'Collapsed rail', '⌘B · hover for tooltips', { role: 'admin', rail: true, tipDemo: true },
        { span: 1, w: 400, h: 860, r: 14, content: true, phone: false, showSb: true, devCls: 'ovf' }),
      F('C', '16 projects', 'scrolls · sticky header · filter', { role: 'admin', many: true, active: 'PR', collapsible: false },
        { span: 1, w: 264, h: 820, r: 14, content: false, phone: false, showSb: true, devCls: '' }),
      F('D', 'Viewer', 'fewer items', { role: 'viewer', collapsible: false },
        { span: 1, w: 264, h: 820, r: 14, content: false, phone: false, showSb: true, devCls: '' }),
      { ...this.sbFrame('E', { role: 'member', touch: true, closable: true, width: 300 }), label: 'Mobile drawer', meta: '44px targets · tap scrim to close',
        span: 1, w: 390, h: 820, r: 28, content: false, phone: true, showSb: drawerOpen, devCls: '', drawerOpen,
        openDrawer: () => self.sbSet('E', { drawer: true }), closeDrawer: () => self.sbSet('E', { drawer: false }) }
    ];
    frames[4].sbwCls = (frames[4].sbwCls || '') + ' drawer';
    return { frames };
  }
}
