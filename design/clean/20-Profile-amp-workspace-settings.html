<style>
body{margin:0}
.t-navy{--bg:#060B18;--surface:#0C1326;--raised:#131C34;--hover:#1B2644;--line:#1C2845;--line-2:#2B3A5E;--control:#5F6F96;--text:#EAF0FF;--text-2:#A5B2D1;--text-3:#8794B6;--accent:#2B67F5;--accent-h:#2F6DF6;--accent-t:#8AB0FF;--accent-s:rgba(43,103,245,.2);--ring:rgba(90,150,255,.5);--spark:#5BE0FF;--low:#2DD4BF;--todo:#C4CBE0;--ok:#4ADE80;--warn:#F5B73B;--danger:#FF7A70;--info:#B79CFF;--orange:#FF9A4D;--shadow-pop:0 8px 24px rgba(0,0,0,.5);--shadow-modal:0 24px 64px rgba(0,0,0,.6);--av-l:.40;--av-c:.10}
.t-dark{--bg:#0B0B0F;--surface:#121217;--raised:#1A1A21;--hover:#22222B;--line:#24242E;--line-2:#34343F;--control:#6A6A7C;--text:#ECECF1;--text-2:#A3A3B1;--text-3:#8E8E9D;--accent:#2662EE;--accent-h:#2B67F5;--accent-t:#7FA8FF;--accent-s:rgba(38,98,238,.18);--ring:rgba(79,140,255,.5);--spark:#5BE0FF;--low:#2DD4BF;--todo:#C4C4D0;--ok:#4ADE80;--warn:#F5B73B;--danger:#FF7A70;--info:#B79CFF;--orange:#FF9A4D;--shadow-pop:0 8px 24px rgba(0,0,0,.45);--shadow-modal:0 24px 64px rgba(0,0,0,.55);--av-l:.40;--av-c:.10}
.t-light{--bg:#FAFAFB;--surface:#FFFFFF;--raised:#F3F3F6;--hover:#EAEAEF;--line:#E4E4EA;--line-2:#D0D0D9;--control:#8A8A9B;--text:#121217;--text-2:#55556A;--text-3:#5F5F70;--accent:#1D4ED8;--accent-h:#2563EB;--accent-t:#1D4ED8;--accent-s:rgba(29,78,216,.10);--ring:rgba(29,78,216,.35);--spark:#0891B2;--low:#0F766E;--todo:#3E3E50;--ok:#157A3A;--warn:#8A5A00;--danger:#B92F26;--info:#6B3FD4;--orange:#A84A0A;--shadow-pop:0 8px 24px rgba(18,18,23,.10);--shadow-modal:0 24px 64px rgba(18,18,23,.18);--av-l:.90;--av-c:.06}
.t-navy{--pk-l:.32;--pk-c:.07;--pkt-l:.88;--pkt-c:.09;--logo:#3B7BFF;--danger-solid:#C23A30}
.t-dark{--pk-l:.32;--pk-c:.06;--pkt-l:.88;--pkt-c:.08;--logo:#3B7BFF;--danger-solid:#C23A30}
.t-light{--pk-l:.93;--pk-c:.04;--pkt-l:.42;--pkt-c:.12;--logo:#1D4ED8;--danger-solid:#B92F26}
.ds{--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.ds *{box-sizing:border-box}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
.frame{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.frame figcaption{display:flex;align-items:baseline;gap:10px;font-size:14px;font-weight:600}
.frame figcaption span{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.dev{position:relative;display:flex;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;transition:background-color 250ms var(--ease),color 250ms var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.kbd{font:500 11px/1 'JetBrains Mono',ui-monospace,monospace;min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;background:var(--raised);color:var(--text-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;font:500 13px/1 'Inter',system-ui,sans-serif;border:1px solid transparent;cursor:pointer;white-space:nowrap;text-decoration:none;background:transparent;color:var(--text-2);transition:background-color 120ms var(--ease),border-color 120ms var(--ease),box-shadow 120ms var(--ease),transform 120ms var(--ease),color 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-h);box-shadow:0 0 0 4px var(--accent-s)}
.btn-sec{background:var(--raised);border-color:var(--control);color:var(--text)}
.btn-sec:hover{background:var(--hover)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{background:var(--danger-solid);color:#fff}
.btn-danger:hover{box-shadow:0 0 0 4px rgba(255,122,112,.18)}
.btn-danger:disabled{background:var(--raised);border-color:var(--line);color:var(--text-3);cursor:not-allowed;box-shadow:none;transform:none}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:28px}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--text);flex:none;position:relative}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 50%,var(--raised) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--text-2);animation:spin .7s linear infinite;flex:none}
.spin.w{border-color:rgba(255,255,255,.35);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
/* settings shell */
.st-nav{width:220px;flex:none;border-right:1px solid var(--line);background:var(--surface);padding:16px 10px 10px;display:flex;flex-direction:column;gap:2px}
.st-back{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;margin-bottom:10px;border-radius:7px;color:var(--text);text-decoration:none;font-weight:600}
.st-back svg{color:var(--text-3)}
.st-back:hover{background:var(--hover)}
.st-sec{padding:12px 8px 6px;font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.st-it{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:7px;color:var(--text-2);font-weight:500;text-decoration:none;transition:background-color 120ms var(--ease),color 120ms var(--ease)}
.st-it:hover{background:var(--hover);color:var(--text)}
.st-it[aria-current=page]{background:var(--accent-s);color:var(--text)}
.st-it[aria-current=page] svg{color:var(--accent-t)}
.st-it.dng svg{color:var(--danger)}
.st-me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-top:1px solid var(--line)}
.st-main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.st-mtop{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line)}
.st-mtop h2{margin:0;font-size:15px;font-weight:600}
.st-ib{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;background:transparent;color:var(--text-2);cursor:pointer}
.st-ib:hover{background:var(--hover);color:var(--text)}
.touch .st-ib{width:44px;height:44px}
.st-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.st-wrap{max-width:880px;padding:28px 40px 96px;display:flex;flex-direction:column;animation:fadein 180ms var(--ease)}
.st-head{display:flex;align-items:center;gap:12px;padding-bottom:20px}
.st-head h2{margin:0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.st-row{display:grid;grid-template-columns:168px minmax(0,1fr);column-gap:32px;row-gap:10px;padding:20px 0;border-top:1px solid var(--line)}
.st-row h3{margin:0;font-size:13px;font-weight:600;line-height:32px}
.st-ctl{display:flex;flex-direction:column;gap:14px;max-width:560px;min-width:0}
.st-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.st-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-lbl{font-size:12px;font-weight:500;color:var(--text-2)}
.st-inp{height:34px;width:100%;padding:0 10px;border-radius:6px;border:1px solid var(--control);background:var(--surface);color:var(--text);font:400 13px/1 'Inter',system-ui,sans-serif;transition:border-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.st-inp::placeholder{color:var(--text-3)}
.st-inp:hover{border-color:var(--text-3)}
.st-inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.st-inp.err{border-color:var(--danger)}
.st-inp.err:focus{box-shadow:0 0 0 3px rgba(255,122,112,.25)}
.st-inp[readonly]{background:var(--raised);color:var(--text-2);border-color:var(--line);cursor:default}
.st-inp[readonly]:focus{box-shadow:none;border-color:var(--line-2)}
.st-inp.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.st-rel{position:relative}
.st-rel .st-inp{padding-right:38px}
.st-in-ic{position:absolute;right:4px;top:50%;margin-top:-14px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;color:var(--text-3);cursor:pointer}
.st-in-ic:hover{background:var(--hover);color:var(--text)}
span.st-in-ic{cursor:default}span.st-in-ic:hover{background:transparent;color:var(--text-3)}
.st-help{display:flex;align-items:center;gap:6px;min-height:16px;font-size:12px;line-height:16px;color:var(--text-3)}
.st-help.err{color:var(--danger)}
.st-help.ok{color:var(--ok)}
.touch .st-inp{height:44px;font-size:15px}
.touch .st-ig input{height:42px}
/* avatar */
.st-avrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.st-av{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line-2)}
.st-av img,.st-pv img{width:100%;height:100%;object-fit:cover;display:block}
.st-photo{display:block;width:100%;height:100%;background:radial-gradient(circle at 50% 40%,oklch(.80 .05 60) 0 21%,transparent 22%),radial-gradient(ellipse 46% 34% at 50% 100%,oklch(.62 .09 255) 0 98%,transparent 100%),linear-gradient(160deg,oklch(.48 .06 230),oklch(.30 .05 265))}
.st-upl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);animation:fadein 180ms var(--ease)}
.st-drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;padding:12px;border:1.5px dashed var(--line-2);border-radius:8px;text-align:center;color:var(--text-2);cursor:pointer;transition:border-color 120ms var(--ease),background-color 120ms var(--ease)}
.st-drop:hover{border-color:var(--control)}
.st-drop.over{border-color:var(--accent);background:var(--accent-s)}
.st-drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.st-drop:focus-within{box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
.st-pvs{display:flex;align-items:flex-end;gap:12px;padding:0 4px}
.st-pv{border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line-2)}
.st-hatch{display:block;width:100%;height:100%;background:repeating-linear-gradient(135deg,var(--raised) 0 5px,var(--surface) 5px 10px)}
/* strength */
.st-meter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:center;gap:4px}
.st-meter i{display:block;height:4px;border-radius:2px;transition:background-color 200ms var(--ease)}
.st-meter span{min-width:52px;text-align:right;font:500 11px/1 'JetBrains Mono',monospace;padding-left:6px}
/* theme tiles */
.st-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.st-tile{display:flex;flex-direction:column;gap:8px;padding:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;font:500 12.5px/1 'Inter',sans-serif;transition:border-color 150ms var(--ease),box-shadow 150ms var(--ease),transform 150ms var(--spring)}
.st-tile:hover{border-color:var(--control);transform:translateY(-1px)}
.st-tile[aria-checked=true]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.st-tl{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;min-height:16px}
.st-prev{position:relative;display:block;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.mm{position:absolute;inset:0;display:block;background:var(--bg)}
.mm i{position:absolute;display:block;border-radius:2px}
.mm .a{left:0;top:0;bottom:0;width:28%;background:var(--surface);border-right:1px solid var(--line);border-radius:0}
.mm .b{left:36%;top:12px;width:40%;height:6px;background:var(--text-2);opacity:.7}
.mm .c{left:36%;top:26px;width:54%;height:5px;background:var(--raised)}
.mm .d{left:36%;top:37px;width:46%;height:5px;background:var(--raised)}
.mm .e{left:36%;bottom:9px;width:18%;height:8px;background:var(--accent);border-radius:3px}
.mm .f{left:6%;top:12px;width:14%;height:4px;background:var(--line-2)}
.mm .g{left:6%;top:22px;width:12%;height:4px;background:var(--line-2)}
.mm.half{clip-path:polygon(100% 0,100% 100%,0 100%)}
/* workspace */
.st-ig{display:flex;align-items:center;border:1px solid var(--control);border-radius:6px;background:var(--surface);transition:border-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.st-ig:hover{border-color:var(--text-3)}
.st-ig:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.st-ig.err{border-color:var(--danger)}
.st-ig.err:focus-within{box-shadow:0 0 0 3px rgba(255,122,112,.25)}
.st-pre{padding-left:10px;font:400 12.5px/1 'JetBrains Mono',monospace;color:var(--text-3);white-space:nowrap}
.st-ig input{flex:1;min-width:0;height:32px;border:0;background:transparent;color:var(--text);font:500 12.5px/1 'JetBrains Mono',monospace;padding:0 2px}
.st-ig input:focus{outline:none}
.st-ig .st-stat{width:30px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.st-url{display:flex;align-items:center;gap:0;font:400 12px/16px 'JetBrains Mono',monospace;color:var(--text-3);min-width:0;overflow:hidden;white-space:nowrap}
.st-url b{font-weight:500;color:var(--accent-t)}
.st-url b.bad{color:var(--danger);background:rgba(255,122,112,.14);border-radius:2px}
.st-badge{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font:600 14px/1 'JetBrains Mono',monospace;flex:none;background:oklch(var(--pk-l) var(--pk-c) 255);color:oklch(var(--pkt-l) var(--pkt-c) 255)}
.st-ro{display:flex;align-items:center;gap:10px;min-height:34px;font-size:13px}
.st-note{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:20px;border-radius:8px;background:var(--raised);border:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
/* unsaved bar */
.st-bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 14px;max-width:calc(100% - 24px);border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);white-space:nowrap;z-index:5;animation:barin 240ms var(--ease)}
@keyframes barin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.st-bar .msg{display:inline-flex;align-items:center;gap:8px;font-weight:500;margin-right:8px;overflow:hidden;text-overflow:ellipsis}
.st-bar.err{border-color:var(--danger)}
.st-bar.ok{padding-right:14px}
/* danger */
.st-danger{border:1px solid var(--danger);border-radius:12px;background:var(--surface);overflow:hidden}
.st-drow{display:flex;align-items:center;gap:16px;padding:16px 18px}
.st-drow+.st-drow{border-top:1px solid var(--line)}
.st-drow h3{margin:0 0 4px;font-size:13px;font-weight:600}
.st-drow p{margin:0;font-size:12px;color:var(--text-3)}
.st-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);animation:fadein 200ms var(--ease)}
.st-scrim{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,5,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadein 200ms var(--ease)}
.st-dlg{width:420px;max-width:100%;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow-modal);animation:dlgin 240ms var(--spring)}
@keyframes dlgin{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.st-dlg h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.st-chips{display:flex;flex-wrap:wrap;gap:6px}
.st-chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--raised);border:1px solid var(--line);font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2)}
.st-code{font-family:'JetBrains Mono',monospace;font-size:12px;padding:1px 5px;border-radius:4px;background:var(--raised);border:1px solid var(--line);color:var(--text)}
/* mobile menu */
.st-mi{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:500;font-size:15px}
.st-mi:hover{background:var(--hover)}
.st-mi.dng svg:first-child{color:var(--danger)}
/* narrow */
.narrow .st-wrap{padding:16px 16px 96px}
.narrow .st-head{display:none}
.narrow .st-row{grid-template-columns:minmax(0,1fr);padding:16px 0}
.narrow .st-row h3{line-height:18px}
.narrow .st-g2{grid-template-columns:minmax(0,1fr)}
.narrow .st-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.narrow .st-upl{grid-template-columns:minmax(0,1fr)}
.narrow .st-drow{flex-direction:column;align-items:stretch}
.st-it:focus-visible,.st-back:focus-visible,.btn:focus-visible,.st-ib:focus-visible,.st-in-ic:focus-visible,.st-tile:focus-visible,.st-mi:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){
  .st-nav{display:none!important}
  .st-wrap{padding:16px 16px 96px}
  .st-row,.st-g2,.st-upl{grid-template-columns:minmax(0,1fr)}
  .st-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st-drow{flex-direction:column;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}.sk{animation:none}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:3440px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="mono" style="font-size:12px;color:var(--text-3);letter-spacing:.04em">SCREENS · SETTINGS</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Settings</h1>
    </div>
    <div class="mono" style="display:flex;gap:16px;font-size:12px;color:var(--text-3)"><span>Profile</span><span>Workspace</span><span>Danger zone</span><span>owner / viewer</span></div>
  </header>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="7">
      <figure class="frame" style="grid-column:{{fx.col}};grid-row:{{fx.row}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev {{fx.devTheme}} {{fx.layCls}}" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">

          <sc-if value="{{fx.wide}}" hint-placeholder-val="{{true}}">

                  <span class="st-help {{fx.whyCls}}" id="{{fx.id}}-dw" role="status">{{fx.whyText}}</span>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;navy&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;navy&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3440}}">
class Component extends DCLogic {
  state = { f: {} };
  componentWillUnmount() {
    this.dead = true;
    (this.timers || []).forEach(clearTimeout);
    const f = this.state.f || {};
    Object.keys(f).forEach((k) => { const u = f[k]; [u && u.uplUrl, u && u.avUrl].forEach((x) => { if (x) { try { URL.revokeObjectURL(x); } catch (e) {} } }); });
  }
  later(fn, ms) { const t = setTimeout(() => { if (!this.dead) fn(); }, ms); (this.timers = this.timers || []).push(t); return t; }
  fGet(id, init) { return { ...(init || {}), ...((this.state.f && this.state.f[id]) || {}) }; }
  fSet(id, patch) { const all = { ...(this.state.f || {}) }; all[id] = { ...(all[id] || {}), ...patch }; this.setState({ f: all }); }
  frame(id, cfg) {
    const self = this;
    const g = () => self.fGet(id, cfg.init);
    const set = (p) => self.fSet(id, p);
    const u = g();
    const me = cfg.person || { name: 'Alex Kim', email: 'alex@team.dev', ini: 'AK', hue: 285 };
    const role = cfg.role || 'owner';
    const owner = role === 'owner';
    const narrow = !!cfg.narrow;
    const page = u.page || cfg.page;
    const phase = cfg.phase || 'ready';
    const ICON = {
      profile: 'M8 7.5a2.6 2.6 0 100-5.2 2.6 2.6 0 000 5.2zM3 13.5c.6-2.5 2.6-4 5-4s4.4 1.5 5 4',
      notifications: 'M4 11V7a4 4 0 018 0v4l1 1.5H3zM6.5 14h3',
      workspace: 'M2.5 13.5V4l5-1.5v11M7.5 5.5h6v8M4.5 6.5h1M4.5 9h1M9.5 8h2M9.5 10.5h2M1.5 13.5h13',
      members: 'M6 7.5a2.3 2.3 0 100-4.6 2.3 2.3 0 000 4.6zM2 13c.5-2.2 2-3.5 4-3.5s3.5 1.3 4 3.5M10.5 3.2a2.2 2.2 0 010 4.2M12 9.8c1 .5 1.7 1.6 2 3.2',
      danger: 'M8 2.5l6 10.5H2zM8 6.5v3M8 11.3v.1'
    };
    const PAGES = { profile: 'Profile', workspace: 'Workspace', danger: 'Danger zone', menu: 'Settings' };
    const NAV = [['profile', 'Profile', 'acct'], ['notifications', 'Notifications', 'acct'], ['workspace', 'Workspace', 'ws'], ['members', 'Members', 'ws'], ['danger', 'Danger zone', 'ws']]
      .filter((n) => owner || n[0] !== 'danger');
    const nav = NAV.map(([k, name, sec]) => ({
      name, sec, icon: ICON[k], cur: page === k ? 'page' : 'false', dng: k === 'danger' ? 'dng' : '',
      href: k === 'notifications' ? 'Notifications.dc.html' : '#' + k,
      go: (e) => { if (PAGES[k]) { if (e && e.preventDefault) e.preventDefault(); set({ page: k, dlg: false, uplOpen: false }); } }
    }));

    // theme
    const glob = this.props.theme || 'navy';
    const tpref = u.theme || glob;
    let sysLight = false;
    try { sysLight = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); } catch (e) { sysLight = false; }
    const eff = tpref === 'system' ? (sysLight ? 'light' : 'navy') : tpref;
    const devTheme = eff === 'light' ? 't-light' : eff === 'dark' ? 't-dark' : 't-navy';
    const tiles = [['navy', 'Navy', 't-navy', ''], ['dark', 'Near-black', 't-dark', ''], ['light', 'Light', 't-light', ''], ['system', 'System', 't-light', 't-navy']]
      .map(([k, name, a, b]) => ({ name, a, b, split: !!b, on: tpref === k, pick: () => set({ theme: k }) }));

    // save engine
    const doSave = (commit) => {
      set({ saveState: 'saving' });
      self.later(() => {
        const v = self.fGet(id, cfg.init);
        if (v.failNext) { self.fSet(id, { saveState: 'error', failNext: false }); return; }

        self.later(() => { if (self.fGet(id, cfg.init).saveState === 'saved') self.fSet(id, { saveState: '' }); }, 2200);

    };

    // profile
    const nameOf = (v) => (v.name === undefined ? me.name : v.name);
    const savedNameOf = (v) => (v.savedName === undefined ? me.name : v.savedName);
    const name = nameOf(u);
    const savedName = savedNameOf(u);
    const nameErr = !name.trim() ? 'Required' : name.length > 40 ? 'Max 40 characters' : '';
    const av = u.av || 'photo';
    const pwErrs = (v) => {
      const cur = v.pwCur || '', nw = v.pwNew || '', cf = v.pwCf || '', sub = !!v.pwSub;
      return {
        cur: sub && !cur ? 'Required' : '',
        nw: nw && nw.length < 8 ? 'At least 8 characters' : (nw && cur && nw === cur ? 'Must differ from current' : (sub && !nw ? 'Required' : '')),
        cf: cf && cf !== nw ? 'Doesn’t match' : (sub && !cf ? 'Required' : '')
      };
    };
    const pe = pwErrs(u);
    const nw = u.pwNew || '';
    const cf = u.pwCf || '';
    const score = (p) => {
      if (!p) return 0;
      if (p.length < 8) return 1;
      let s = 1;
      if (p.length >= 12) s++;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
      if (/\d/.test(p) && /[^A-Za-z0-9]/.test(p)) s++;
      else if (/\d/.test(p) || /[^A-Za-z0-9]/.test(p)) s += 0.5;
      return Math.min(4, Math.floor(s));
    };
    const sc = score(nw);
    const SC = [['', 'var(--text-3)'], ['Weak', 'var(--danger)'], ['Fair', 'var(--orange)'], ['Good', 'var(--warn)'], ['Strong', 'var(--ok)']][sc];
    const cfOk = !!cf && cf === nw && !pe.nw && nw.length >= 8;
    const updatePw = () => {
      const v = g();
      const e = pwErrs({ ...v, pwSub: true });
      if (e.cur || e.nw || e.cf) { set({ pwSub: true, pwState: '' }); return; }
      set({ pwState: 'saving' });
      self.later(() => self.fSet(id, { pwState: 'done', pwCur: '', pwNew: '', pwCf: '', pwSub: false, pwShow: false }), 800);
      self.later(() => { if (self.fGet(id, cfg.init).pwState === 'done') self.fSet(id, { pwState: '' }); }, 3400);
    };
    const uplUrl = u.uplUrl || '';
    const onFile = (e) => {
      const file = e && e.target && e.target.files && e.target.files[0];
      if (!file) return;
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { set({ uplErr: 'PNG, JPG or WebP only', drop: false }); return; }
      if (file.size > 2 * 1024 * 1024) { set({ uplErr: 'Max 2 MB', drop: false }); return; }
      const prev = g().uplUrl;
      if (prev) { try { URL.revokeObjectURL(prev); } catch (err) {} }
      let url = '';
      try { url = URL.createObjectURL(file); } catch (err) { url = ''; }
      set({ uplUrl: url, uplErr: '', drop: false });
    };

    // workspace
    const TAKEN = ['design-guild', 'personal', 'admin', 'api', 'app', 'settings'];
    const wsSavedName = u.wsSavedName === undefined ? 'Platform team' : u.wsSavedName;
    const wsSavedSlug = u.wsSavedSlug === undefined ? 'platform-team' : u.wsSavedSlug;
    const wsName = u.wsName === undefined ? wsSavedName : u.wsName;
    const wsSlug = u.wsSlug === undefined ? wsSavedSlug : u.wsSlug;
    const slugBase = (s) => {
      if (!s) return 'Required';
      if (/[^a-z0-9-]/.test(s)) return /[A-Z]/.test(s) && !/[^A-Za-z0-9-]/.test(s) ? 'Lowercase only' : 'Use a–z, 0–9 and hyphens';
      if (s.length < 3) return 'At least 3 characters';
      if (s.length > 32) return 'Max 32 characters';
      if (/^-|-$/.test(s)) return 'Can’t start or end with a hyphen';
      if (/--/.test(s)) return 'No double hyphens';
      return '';
    };
    const sb = slugBase(wsSlug);
    const changedSlug = wsSlug !== wsSavedSlug;
    const checking = !sb && changedSlug && u.slugCheck === 'checking' && u.slugFor === wsSlug;
    const taken = !sb && changedSlug && u.slugCheck === 'taken' && u.slugFor === wsSlug;
    const avail = !sb && changedSlug && u.slugCheck === 'ok' && u.slugFor === wsSlug;
    const slugErr = sb || (taken ? 'Already taken' : '');
    const wsNameErr = !wsName.trim() ? 'Required' : wsName.length > 48 ? 'Max 48 characters' : '';
    const segs2 = [];
    wsSlug.split('').forEach((ch) => {
      const bad = !/[a-z0-9-]/.test(ch);
      const last = segs2[segs2.length - 1];
      if (last && last.bad === bad) last.t += ch; else segs2.push({ t: ch, bad });
    });
    const segsOut = (segs2.length ? segs2 : [{ t: '…', bad: false }]).map((x) => ({ t: x.t, cls: x.bad ? 'bad' : '' }));
    const words = wsName.trim().split(/\s+/).filter(Boolean);
    const wsBadge = ((words[0] || '?')[0] + (words[1] ? words[1][0] : (words[0] && words[0][1]) || '')).toUpperCase();
    const onSlug = (e) => {
      const v = String(e.target.value || '').slice(0, 40);
      const base = slugBase(v);
      const savedS = g().wsSavedSlug === undefined ? 'platform-team' : g().wsSavedSlug;
      const go = !base && v !== savedS;
      set({ wsSlug: v, slugCheck: go ? 'checking' : '', slugFor: v, saveState: g().saveState === 'saved' ? '' : g().saveState });
      if (go) self.later(() => { const n = self.fGet(id, cfg.init); if (n.slugFor === v && n.wsSlug === v) self.fSet(id, { slugCheck: TAKEN.indexOf(v) >= 0 ? 'taken' : 'ok' }); }, 450);
    };

    // bar
    let dirty = false, invalid = false, pending = false, commit = null, discard = () => {};
    if (phase === 'ready' && page === 'profile') {
      dirty = name !== savedName; invalid = !!nameErr;
      commit = (v) => ({ savedName: nameOf(v) });
      discard = () => set({ name: savedNameOf(g()), saveState: '' });
    } else if (phase === 'ready' && page === 'workspace' && owner) {
      dirty = wsName !== wsSavedName || wsSlug !== wsSavedSlug; invalid = !!(wsNameErr || slugErr); pending = checking;
      commit = (v) => {
        const sn = v.wsSavedName === undefined ? 'Platform team' : v.wsSavedName;
        const ss = v.wsSavedSlug === undefined ? 'platform-team' : v.wsSavedSlug;
        return { wsSavedName: v.wsName === undefined ? sn : v.wsName, wsSavedSlug: v.wsSlug === undefined ? ss : v.wsSlug, slugCheck: '' };
      };
      discard = () => set({ wsName: wsSavedName, wsSlug: wsSavedSlug, slugCheck: '', saveState: '' });
    }
    const ss = u.saveState || '';
    const save = () => { if (commit && !invalid && !pending) doSave(commit); };
    const barSaving = ss === 'saving';
    const barError = ss === 'error' && !!commit;
    const barSaved = ss === 'saved' && !dirty && !!commit;
    const barDirty = dirty && !barSaving && !barError && !invalid && !pending;
    const barInvalid = dirty && !barSaving && !barError && invalid;
    const barPending = dirty && !barSaving && !barError && !invalid && pending;

    // danger
    const dlgText = u.dlgText || '';
    const match = dlgText === wsSavedSlug;
    const prefix = !!dlgText && wsSavedSlug.indexOf(dlgText) === 0;
    const why = !dlgText ? ['Type the URL slug to enable delete', ''] : match ? ['Matches', 'ok'] : prefix ? ['Keep typing', ''] : ['Doesn’t match', 'err'];
    const confirmDel = () => {
      const v = g();
      const slugNow = v.wsSavedSlug === undefined ? 'platform-team' : v.wsSavedSlug;
      if ((v.dlgText || '') !== slugNow || v.deleting) return;
      set({ deleting: true });
      self.later(() => self.fSet(id, { deleting: false, dlg: false, deleted: true, dlgText: '' }), 900);
    };
    const closeDlg = () => { if (!g().deleting) set({ dlg: false, dlgText: '' }); };

    return {
      id, label: cfg.label, meta: cfg.meta, col: cfg.col, row: cfg.row, w: cfg.w, h: cfg.h, r: cfg.r || 14,
      devTheme, layCls: (narrow ? 'narrow' : 'wide'), touchCls: cfg.touch ? 'touch' : '',
      wide: !narrow, narrow,
      me, roleLabel: owner ? 'Owner' : 'Viewer',
      navAcct: nav.filter((n) => n.sec === 'acct'), navWs: nav.filter((n) => n.sec === 'ws'), navAll: nav,
      pageTitle: phase === 'loading' ? 'Workspace' : (PAGES[page] || 'Settings'),
      showBack: page !== 'menu', isMenu: phase === 'ready' && page === 'menu',
      goMenu: () => set({ page: 'menu', dlg: false, uplOpen: false }),
      isLoading: phase === 'loading',
      isProfile: phase === 'ready' && page === 'profile',
      isWsEdit: phase === 'ready' && page === 'workspace' && owner,
      isWsView: phase === 'ready' && page === 'workspace' && !owner,
      isDanger: phase === 'ready' && page === 'danger' && owner,
      // profile
      avPhoto: av === 'photo', avImg: av === 'img' && !!u.avUrl, avIni: av === 'initials' || (av === 'img' && !u.avUrl), avUrl: u.avUrl || '',
      canRemove: av !== 'initials', changeLabel: av === 'initials' ? 'Upload' : 'Change',
      uplOpen: !!u.uplOpen,
      toggleUpl: () => set({ uplOpen: !g().uplOpen, uplErr: '' }),
      removeAv: () => set({ av: 'initials', uplOpen: false }),
      dropCls: u.drop ? 'over' : '',
      dragOn: () => { if (!g().drop) set({ drop: true }); },
      dragOff: () => { if (g().drop) set({ drop: false }); },
      onFile,
      hasUpl: !!uplUrl,
      sizes: [64, 32, 20].map((px) => ({ px, url: uplUrl, has: !!uplUrl, none: !uplUrl })),
      cancelUpl: () => set({ uplOpen: false, uplErr: '' }),
      useUpl: () => { const v = g(); if (!v.uplUrl) return; set({ av: 'img', avUrl: v.uplUrl, uplUrl: '', uplOpen: false }); },
      uplErr: !!u.uplErr, uplErrText: u.uplErr || '',
      name, nameErr, nameBad: nameErr ? 'true' : 'false', nameCls: nameErr ? 'err' : '',
      onName: (e) => set({ name: String(e.target.value || '').slice(0, 60), saveState: '' }),
      pwCur: u.pwCur || '', pwNew: nw, pwCf: cf,
      onCur: (e) => set({ pwCur: e.target.value, pwState: '' }),
      onNew: (e) => set({ pwNew: e.target.value, pwState: '' }),
      onCf: (e) => set({ pwCf: e.target.value, pwState: '' }),
      cfKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); updatePw(); } },
      curErr: pe.cur, curBad: pe.cur ? 'true' : 'false', curCls: pe.cur ? 'err' : '',
      nwBad: pe.nw ? 'true' : 'false', nwCls: pe.nw ? 'err' : '',
      nwHelp: pe.nw || (nw ? '' : '8+ characters'), nwHelpCls: pe.nw ? 'err' : '',
      cfBad: pe.cf ? 'true' : 'false', cfCls: pe.cf ? 'err' : '',
      cfOk, cfHelp: pe.cf || (cfOk ? 'Matches' : ''), cfHelpCls: pe.cf ? 'err' : (cfOk ? 'ok' : ''),
      segs: [1, 2, 3, 4].map((i) => ({ c: i <= sc ? SC[1] : 'var(--raised)' })), scLabel: SC[0], scColor: SC[1],
      pwShow: !!u.pwShow, pwType: u.pwShow ? 'text' : 'password', eyeLabel: u.pwShow ? 'Hide password' : 'Show password',
      eyeSlash: u.pwShow ? 'M2.5 13.5l11-11' : '',
      toggleEye: () => set({ pwShow: !g().pwShow }),
      updatePw, pwSaving: u.pwState === 'saving', pwDone: u.pwState === 'done',
      tiles,
      // workspace
      wsName, wsSlug, wsSavedName, wsSavedSlug, wsBadge,
      wsNameErr, wsNameBad: wsNameErr ? 'true' : 'false', wsNameCls: wsNameErr ? 'err' : '',
      onWsName: (e) => set({ wsName: String(e.target.value || '').slice(0, 60), saveState: g().saveState === 'saved' ? '' : g().saveState }),
      onSlug, slugCls: slugErr ? 'err' : '', slugBad: !!slugErr, slugChecking: checking, slugAvail: avail,
      slugHelp: slugErr || (checking ? 'Checking…' : avail ? 'Available · old URL redirects' : 'a–z, 0–9, hyphens'),
      slugHelpCls: slugErr ? 'err' : avail ? 'ok' : '',
      segs2: segsOut,

      copyUrl: () => { try { navigator.clipboard && navigator.clipboard.writeText('https://lightex.app/' + wsSavedSlug); } catch (e) {} set({ copied: true }); self.later(() => self.fSet(id, { copied: false }), 1400); },
      // bar
      barShow: barDirty || barInvalid || barPending || barSaving || barError || barSaved,
      barCls: barError ? 'err' : barSaved ? 'ok' : '',
      barDirty, barInvalid, barPending, barSaving, barError, barSaved, save, discard,

      // danger

      restore: () => set({ deleted: false }),
      openDlg: () => set({ dlg: true, dlgText: '' }),
      dlgOpen: !!u.dlg, dlgText, closeDlg,
      scrimClick: (e) => { if (e && e.target === e.currentTarget) closeDlg(); },
      onDlgText: (e) => set({ dlgText: String(e.target.value || '').slice(0, 60) }),
      dlgKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeDlg(); } else if (e.key === 'Enter') { e.preventDefault(); confirmDel(); } },
      whyText: why[0], whyCls: why[1], dlgInpCls: why[1] === 'err' ? 'err' : '',
      dlgBlocked: !match || !!u.deleting, deleting: !!u.deleting, confirmDel
    };

    const theme = this.props.theme || 'navy';

      this.frame('P', { label: 'Profile', meta: 'theme tiles switch this frame · try the password', col: '1 / 4', row: '1', w: 1280, h: 900, page: 'profile' }),
      this.frame('W', { label: 'Workspace', meta: 'try “Design Guild” or “design-guild”', col: '1 / 3', row: '2', w: 840, h: 600, page: 'workspace' }),
      this.frame('L', { label: 'Loading', meta: 'skeleton', col: '3', row: '2', w: 400, h: 600, page: 'workspace', narrow: true, phase: 'loading' }),
      this.frame('D', { label: 'Danger zone', meta: 'type the slug to unlock', col: '1 / 3', row: '3', w: 840, h: 600, page: 'danger' }),
      this.frame('X', { label: 'Save failed', meta: 'Retry works', col: '3', row: '3', w: 400, h: 600, page: 'workspace', narrow: true, init: { wsName: 'Platform team HQ', saveState: 'error' } }),
      this.frame('V', { label: 'Viewer / non-owner', meta: 'read-only · danger zone hidden', col: '1 / 3', row: '4', w: 840, h: 520, page: 'workspace', role: 'viewer', person: TN }),
      this.frame('M', { label: 'Mobile', meta: '390 · back opens menu', col: '3', row: '4', w: 390, h: 844, r: 28, page: 'profile', narrow: true, touch: true })
    ];
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      frames
    };
  }
}
