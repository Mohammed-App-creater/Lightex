.rp-xlab span{position:absolute;top:7px;transform:translateX(-50%);font:500 10.5px/1 'JetBrains Mono',monospace;color:var(--text-3);white-space:nowrap}
.rp-xlab span.today{color:var(--text-2)}
.rp-plot{position:relative;min-width:0}
.rp-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.rp-gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.rp-gl.base{border-top-color:var(--line-2)}
.rp-today{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line-2)}
.rp-line{fill:none;stroke:var(--c1);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:0;transition:stroke-dashoffset 700ms var(--ease)}
.rp-ideal{fill:none;stroke:var(--cref);stroke-width:1.5;stroke-dasharray:4 4;transition:opacity 400ms var(--ease)}
.rp-area{fill:var(--c1);opacity:.1;transition:opacity 500ms var(--ease) 300ms}
.rp-hits{position:absolute;inset:0;display:flex}
.rp-hit{flex:1;min-width:0;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:0;border:0;border-radius:4px 4px 0 0;background:transparent;color:inherit;font:inherit;cursor:crosshair}
.rp-hit:hover,.rp-hit.on{background:rgba(128,140,170,.07)}
.rp-hit.on{z-index:4}
.rp-bar{display:block;width:clamp(5px,30%,24px);border-radius:4px 4px 0 0;transform-origin:50% 100%;transition:transform 700ms var(--ease),filter 120ms var(--ease)}
.rp-bar.one{width:clamp(6px,62%,24px);background:var(--c1)}
.rp-hit:hover .rp-bar,.rp-hit.on .rp-bar{filter:brightness(1.18)}
.t-light .rp-hit:hover .rp-bar,.t-light .rp-hit.on .rp-bar{filter:brightness(.88)}
.rp-xh{position:absolute;top:0;bottom:0;left:50%;width:0;border-left:1px solid var(--text-3);pointer-events:none}
.rp-dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c1);box-shadow:0 0 0 2px var(--surface);transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.rp-end{transition:opacity 200ms var(--ease) 600ms}
.rp-elab{position:absolute;transform:translate(9px,-120%);font-size:12px;font-weight:600;color:var(--text);pointer-events:none;white-space:nowrap}
.rp-tip{position:absolute;top:4px;left:calc(50% + 10px);z-index:6;min-width:128px;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;gap:6px;text-align:left;white-space:nowrap;pointer-events:none;animation:rptip 120ms var(--ease)}
.rp-tip.l{left:auto;right:calc(50% + 10px)}
.rp-tip.p{top:auto;bottom:calc(100% + 2px);left:auto;right:44px}
@keyframes rptip{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.rp-tiph{font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.rp-tipr{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--text-2)}
.rp-tipr b{font-size:13px;font-weight:600;color:var(--text);min-width:26px}
.rp-k{width:12px;height:2px;border-radius:1px;flex:none}
.rp-k.dash{height:0;border-top:2px dashed var(--cref);background:none!important}
.rp-k.tick{width:2px;height:10px}
.rp-k.rect{width:8px;height:8px;border-radius:2px}
.rp-pgrp{font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:4px 0 2px}
.rp-prow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 42% 34px;align-items:center;gap:10px;width:calc(100% + 12px);height:28px;margin:0 -6px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:var(--text);font:400 12.5px/1 'Inter',sans-serif;text-align:left;cursor:default}
.rp-prow:hover,.rp-prow.on{background:var(--hover)}
.rp-pname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-ptrack{position:relative;height:8px;border-radius:4px;background:var(--c1-t)}
.rp-pfill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c1);transform-origin:0 50%;transition:transform 700ms var(--ease)}
.rp-ptgt{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--text);box-shadow:0 0 0 1px var(--surface)}
.rp-pval{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums}
.rp-tw{max-height:236px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.rp-tw table{width:100%;border-collapse:collapse;font-size:12px}
.rp-tw th{position:sticky;top:0;background:var(--raised);padding:7px 10px;font-weight:500;color:var(--text-2);text-align:right}
.rp-tw td{padding:6px 10px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.rp-tw th:first-child,.rp-tw td:first-child{text-align:left}
.rp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;padding:16px;border:1px dashed var(--line-2);border-radius:10px;text-align:center}
.rp-empty b{font-size:13px;font-weight:600}
.rp-need{width:96px;height:4px;border-radius:2px;background:var(--raised);overflow:hidden}
.rp-need span{display:block;height:100%;border-radius:2px;background:var(--text-3)}
.rp-err{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:32px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 50%,var(--raised) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(128,140,170,.35);border-top-color:currentColor;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* reset state for the draw-on-load (applied for one frame, then removed) */
.rs .rp-bar{transform:scaleY(0);transition:none}
.rs .rp-line{stroke-dashoffset:1.05;transition:none}
.rs .rp-ideal,.rs .rp-area,.rs .rp-end{opacity:0;transition:none}
.rs .rp-pfill{transform:scaleX(0);transition:none}
.rp-sel:focus-visible,.rp-btn:focus-visible,.rp-mi:focus-visible,.rp-tbtn:focus-visible,.rp-prow:focus-visible,.rp-date:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
.rp-hit:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px var(--ring)}
@container rp (max-width:1000px){.rp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container rp (max-width:760px){.rp-mtop{display:flex}.rp-pg{padding:12px 16px 32px;gap:14px}.rp-ctl{margin-left:0;width:100%}.rp-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rp-grid{grid-template-columns:minmax(0,1fr)}.rp-span2{grid-column:auto}.rp-val{font-size:24px;line-height:30px}.rp-card{padding:12px 14px}.rp-hidem{display:none}.rp-stat{padding:12px 14px}}
@media (max-width:760px){.rp-mtop{display:flex}.rp-pg{padding:12px 16px 32px;gap:14px}.rp-ctl{margin-left:0;width:100%}.rp-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.rp-grid{grid-template-columns:minmax(0,1fr)}.rp-span2{grid-column:auto}.rp-val{font-size:24px;line-height:30px}.rp-card{padding:12px 14px}.rp-hidem{display:none}.rp-stat{padding:12px 14px}}
@media (prefers-reduced-motion:reduce){.ds *{animation-duration:.001ms!important;transition-duration:.001ms!important;transition-delay:0ms!important}.rs .rp-bar,.rs .rp-pfill{transform:none}.rs .rp-line{stroke-dashoffset:0}.rs .rp-ideal,.rs .rp-area,.rs .rp-end{opacity:1}.sk{animation:none}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:4720px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3);letter-spacing:.04em">SCREENS · REPORTS</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Reports</h1>
    </div>
    <div style="display:flex;gap:16px;align-items:center;font:500 12px/1 'JetBrains Mono',monospace;color:var(--text-3)">
      <span style="display:inline-flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:var(--c1)"></i>series 1</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><i style="width:10px;height:10px;border-radius:2px;background:var(--c2)"></i>series 2</span>
      <span>5 charts</span><span>700ms draw</span><span>table view</span>
    </div>
  </header>

  <div style="display:grid;grid-template-columns:850px 390px;column-gap:40px;row-gap:40px;align-items:start">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="6">
      <figure class="frame" style="grid-column:{{fx.gc}};grid-row:{{fx.gr}}">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev {{fx.themeCls}}" style="height:{{fx.h}}px;border-radius:{{fx.r}}px">
          <div class="app">
            <sc-if value="{{fx.sidebar}}" hint-placeholder-val="{{true}}">
              <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="1">
                <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>
                  <input class="sb-sinp" type="search" placeholder="Search or jump…" autocomplete="off">
                  <span class="kbd">⌘K</span>
                </label>

                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}">
                  <button class="sb-new" type="button"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg><span style="flex:1;text-align:left">New task</span><span class="kbd">C</span></button>
                </sc-if>

                <div class="sb-scroll {{fr.maskCls}}">
                  <a class="sb-it" href="#inbox"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="lab">Inbox</span><span class="sb-unread" aria-label="{{fr.inbox}} unread">{{fr.inbox}}</span></a>
                  <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}">
                    <a class="sb-it" href="#mine"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg><span class="lab">My tasks</span><span class="sb-count">7</span></a>
                  </sc-if>

                  <div class="sb-sec"><button class="sb-sect" type="button" aria-expanded="{{fr.pinOpen}}" sc-camel-on-click="{{fr.togglePin}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Pinned views</button></div>
                  <div class="sb-col {{fr.pinCls}}"><div>
                    <sc-for list="{{fr.pins}}" as="p" hint-placeholder-count="3">
                      <a class="sb-it" href="#view"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"></path></svg><span class="lab">{{p.name}}</span><span class="sb-count">{{p.n}}</span></a>
                    </sc-for>
                  </div></div>

                  <div class="sb-sec {{fr.secCls}}">
                    <button class="sb-sect" type="button" aria-expanded="{{fr.projOpen}}" sc-camel-on-click="{{fr.toggleProjSec}}"><svg width="10" height="10" sc-camel-view-box="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5L5 6l2.5-2.5"></path></svg>Projects<span style="color:var(--text-3);letter-spacing:0">{{fr.projCount}}</span></button>
                    <sc-if value="{{fr.canProj}}" hint-placeholder-val="{{true}}">
                      <span class="sb-tw"><button class="sb-icb sm" type="button" aria-label="New project"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New project</span></span>
                    </sc-if>
                  </div>
                  <div class="sb-col {{fr.projSecCls}}"><div>
                    <sc-if value="{{fr.showFilter}}" hint-placeholder-val="{{false}}">
                      <input class="sb-filter" type="text" placeholder="Filter projects…" aria-label="Filter projects" value="{{fr.filter}}" sc-camel-on-change="{{fr.onFilter}}">
                    </sc-if>
                    <sc-for list="{{fr.projects}}" as="pj" hint-placeholder-count="5">
                      <div>
                        <button class="sb-it {{pj.on}}" type="button" aria-expanded="{{pj.open}}" sc-camel-on-click="{{pj.toggle}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{pj.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{pj.hue}})">{{pj.badge}}</span>
                          <span class="lab">{{pj.name}}</span>
                          <svg class="sb-chev {{pj.chev}}" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                        </button>
                        <div class="sb-col {{pj.colCls}}"><div>
                          <div class="sb-subs" role="list">
                            <span class="sb-ind" style="transform:translateY({{pj.indY}}px);opacity:{{pj.indO}}"></span>
                            <sc-for list="{{pj.subs}}" as="s" hint-placeholder-count="6">
                              <button class="sb-si {{s.on}}" type="button" role="listitem" aria-current="{{s.cur}}" sc-camel-on-click="{{s.pick}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>{{s.name}}</button>
                            </sc-for>
                          </div>
                        </div></div>
                      </div>
                    </sc-for>
                    <sc-if value="{{fr.noMatch}}" hint-placeholder-val="{{false}}"><p style="margin:6px 8px;font-size:12px;color:var(--text-3)">No projects match.</p></sc-if>
                  </div></div>
                </div>

                <div class="sb-foot">
                  <button class="sb-spr" type="button" sc-camel-on-click="{{fr.openBoard}}" aria-label="Sprint 14, {{fr.sprPct}} percent, 7 days left. Open board">
                    <svg width="30" height="30" sc-camel-view-box="0 0 30 30" fill="none" aria-hidden="true"><circle cx="15" cy="15" r="11.5" stroke="var(--raised)" stroke-width="3.5"></circle><circle class="sb-rg" cx="15" cy="15" r="11.5" stroke="var(--accent-t)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="72.3" style="stroke-dashoffset:{{fr.sprOff}}" transform="rotate(-90 15 15)"></circle></svg>
                    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;font-size:13px;line-height:16px">Sprint 14</span><span class="mono" style="font-size:11px;line-height:14px;color:var(--text-3)">{{fr.sprPct}}% · 7d left</span></span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                  </button>
                  <div class="sb-row">
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <a class="sb-it" href="#members"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7.5a2.3 2.3 0 100-4.6 2.3 2.3 0 000 4.6zM2 13c.5-2.2 2-3.5 4-3.5s3.5 1.3 4 3.5M10.5 3.2a2.2 2.2 0 010 4.2M12 9.8c1 .5 1.7 1.6 2 3.2"></path></svg><span class="lab">Members &amp; roles</span></a>
                      </sc-if>
                      <sc-if value="{{fr.canSettings}}" hint-placeholder-val="{{true}}">
                        <a class="sb-it" href="#settings"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8zM8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M3.6 12.4l1.2-1.2M11.2 4.8l1.2-1.2"></path></svg><span class="lab">Settings</span><span class="sb-count">⌘,</span></a>

                        <svg class="rp-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>

      const isOpen = openKey === badge;
      const subs = SUBS.map(([k, label], i) => ({
        name: label, d: ICON[k], on: active === badge && sub === k ? 'on' : '', cur: active === badge && sub === k ? 'page' : 'false',
        pick: () => self.sbSet(id, { active: badge, sub: k, open: badge })
      }));
      const idx = SUBS.findIndex((s) => s[0] === sub);
      const step = cfg.touch ? 44 : 32;
      return {
        badge, name, hue, open: isOpen, on: active === badge && !isOpen ? 'on' : '',
        chev: isOpen ? 'open' : '', colCls: isOpen ? 'open' : '', subs,
        indY: Math.max(0, idx) * step, indO: active === badge && idx >= 0 ? 1 : 0,
        toggle: () => self.sbSet(id, { open: isOpen ? null : badge })
      };
    });
    const railProjects = list.slice(0, 6).map(([badge, name, hue]) => ({
      badge, name, hue, on: active === badge ? 'on' : '',
      toggle: () => self.sbSet(id, { active: badge, open: badge })
    }));
    const pinOpen = u.pinOpen === undefined ? true : u.pinOpen;
    const projOpen = u.projOpen === undefined ? true : u.projOpen;
    const pct = 65;
    const C = 72.3;
    const WS = [['PT', 'Platform team', 255], ['DG', 'Design guild', 300], ['PE', 'Personal', 155]];
    const wsName = u.ws || 'Platform team';
    const collapsed = u.rail === undefined ? !!cfg.rail : u.rail;
    const curProj = list.find((p) => p[0] === active) || list[0];
    const curSub = SUBS.find((s) => s[0] === sub) || SUBS[0];
    return {
      full: !collapsed, rail: collapsed,
      sbW: collapsed ? 64 : (cfg.width || 264),
      sbwCls: collapsed ? 'israil' : '',
      touchCls: cfg.touch ? 'touch' : '',
      collapsible: !!cfg.collapsible, closable: !!cfg.closable,
      wsName, wsOpen: !!u.wsOpen,
      toggleWs: () => self.sbSet(id, { wsOpen: !u.wsOpen, profOpen: false }),
      workspaces: WS.map(([b, n, h]) => ({ badge: b, name: n, hue: h, cur: n === wsName, pick: () => self.sbSet(id, { ws: n, wsOpen: false }) })),
      canTask: !viewer, showMine: !viewer, canProj: role === 'admin', canAdmin: role === 'admin', canSettings: !viewer,
      roleLabel: role.charAt(0).toUpperCase() + role.slice(1),
      inbox: viewer ? 1 : 3,
      pins: [
        { name: 'My open bugs', n: 4, d: 'M2.5 3.5h11l-4.2 5v4l-2.6 1v-5z' },
        { name: 'Due this week', n: 9, d: 'M3 4.5h10v8.5H3zM3 7h10M5.5 3v3M10.5 3v3' },
        { name: 'Blocked', n: 2, d: 'M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM4.1 4.1l7.8 7.8' }
      ],
      pinOpen, pinCls: pinOpen ? 'open' : '', togglePin: () => self.sbSet(id, { pinOpen: !pinOpen }),
      projOpen, projSecCls: projOpen ? 'open' : '', toggleProjSec: () => self.sbSet(id, { projOpen: !projOpen }),
      projects, railProjects, projCount: list.length,
      showFilter: !!cfg.many, filter, onFilter: (e) => self.sbSet(id, { filter: e.target.value.slice(0, 60) }), noMatch: shown.length === 0,
      maskCls: cfg.many ? 'masked' : '', secCls: cfg.many ? 'sticky' : '',
      sprPct: pct, sprOff: (C * (1 - pct / 100)).toFixed(1),
      openBoard: () => self.sbSet(id, { active: 'PR', sub: 'board', open: 'PR' }),
      profOpen: !!u.profOpen,
      toggleProf: () => self.sbSet(id, { profOpen: !u.profOpen, wsOpen: false }),
      profKey: (e) => { if (e.key === 'Escape') self.sbSet(id, { profOpen: false, wsOpen: false }); },
      toggleRail: () => self.sbSet(id, { rail: !collapsed, wsOpen: false, profOpen: false }),
      projName: curProj[1], subLabel: curSub[1],
      tipDemo: cfg.tipDemo ? 'show' : ''
    };
  }
//SB-JS-END
  buildFrame(c, themeCls) {
    const self = this;
    const D = this.data();
    const f = this.fGet(c.id);
    const id = c.id;
    const P = D.P[f.proj] || D.P.PR;
    const R = D.R[f.range] || D.R.r6;
    const mobile = !!c.mobile;
    const t = this.tFor(id);
    const e = 1 - Math.pow(1 - t, 3);
    const tip = f.tip;
    const hide = () => { if (self.fGet(id).tip) self.fSet(id, { tip: null }); };
    const showTip = (key) => () => { if (self.fGet(id).tip !== key) self.fSet(id, { tip: key }); };
    const side = (frac) => (frac > 0.58 ? 'l' : '');
    const W = mobile ? 296 : 572, H = mobile ? 170 : 200;
    const w2 = mobile ? 296 : 247, h2 = mobile ? 170 : 190;
    const isEmpty = !!P.empty;
    const sprintLabel = 'Sprint ' + P.sprint;
    const rangeName = f.range === 'custom' ? (this.fmtIso(f.cFrom) + ' – ' + this.fmtIso(f.cTo)) : R.name;

    // --- stats (count-up)
    const cyc = isEmpty ? P.st[2] : +(P.st[2] + R.off).toFixed(1);
    const scope = P.st[4];
    const sign = scope > 0 ? '+' : (scope < 0 ? '−' : '');
    const stats = [
      { label: 'Completed this sprint', val: String(Math.round(P.st[0] * e)), unit: '', meta: 'of ' + P.st[1] + ' planned', aria: 'Completed this sprint: ' + P.st[0] + ' of ' + P.st[1] },
      { label: 'Avg cycle time', val: (cyc * e).toFixed(1), unit: 'd', meta: 'p85 ' + (cyc * 1.7).toFixed(1) + 'd', aria: 'Average cycle time ' + cyc + ' days' },
      { label: 'Overdue', val: String(Math.round(P.st[3] * e)), unit: '', meta: P.st[3] ? 'oldest ' + P.oldest : 'none', alert: P.st[3] > 0, aria: 'Overdue: ' + P.st[3] },
      { label: 'Scope change', val: sign + Math.round(Math.abs(scope) * e), unit: 'pts', meta: 'since Oct 1', aria: 'Scope change ' + (scope > 0 ? 'plus ' : scope < 0 ? 'minus ' : '') + Math.abs(scope) + ' points since sprint start' }
    ];

    // --- burndown (current sprint, Oct 1-14, today = Oct 7)
    const N = 14, rem = P.burn, start = rem[0], today = rem.length - 1;
    const bMax = this.niceMax(Math.max.apply(null, rem), 10);
    const bx = (i) => (i + 0.5) / N * W;
    const by = (v) => (1 - v / bMax) * H;
    const ideal = (i) => Math.round(start * (1 - i / (N - 1)));
    const bHits = Array.from({ length: N }, (_, i) => {
      const key = 'b' + i, has = i < rem.length, day = 'Oct ' + (i + 1);
      const rows = (has ? [{ v: rem[i], n: 'pts remaining', c: 'var(--c1)', k: '' }] : []).concat([{ v: ideal(i), n: 'ideal', c: 'transparent', k: 'dash' }]);
      return {
        on: tip === key ? 'on' : '', tipOn: tip === key, hasV: has, y: has ? (by(rem[i]) / H * 100).toFixed(2) : 0,
        side: side((i + 0.5) / N), head: day + (i === today ? ' · today' : ''), rows,
        aria: day + ': ' + (has ? rem[i] + ' points remaining, ' : 'not reached, ') + 'ideal ' + ideal(i),
        show: showTip(key)
      };
    });
    const ahead = rem[today] <= ideal(today);
    const b = {
      meta: sprintLabel + ' · Oct 1–14', ar: W + ' / ' + H, vb: '0 0 ' + W + ' ' + H,
      grid: this.ticks(bMax),
      lineD: rem.map((v, i) => (i ? 'L' : 'M') + bx(i).toFixed(1) + ' ' + by(v).toFixed(1)).join(' '),
      idealD: 'M' + bx(0).toFixed(1) + ' ' + by(start).toFixed(1) + ' L' + bx(N - 1).toFixed(1) + ' ' + by(0).toFixed(1),
      endX: ((today + 0.5) / N * 100).toFixed(2), endY: (by(rem[today]) / H * 100).toFixed(2), endV: rem[today],
      hits: bHits,
      xl: [{ t: 'Oct 1', left: (0.5 / N * 100).toFixed(2), cls: '' }, { t: 'Today', left: ((today + 0.5) / N * 100).toFixed(2), cls: 'today' }, { t: 'Oct 14', left: ((N - 0.5) / N * 100).toFixed(2), cls: '' }],
      aria: sprintLabel + ' burndown: ' + rem[today] + ' of ' + start + ' points remaining on Oct 7, ideal ' + ideal(today) + ', ' + (ahead ? 'ahead of' : 'behind') + ' ideal.',
      tableOn: !!f.tabB, chartOn: !f.tabB,
      toggleTable: () => self.fSet(id, { tabB: !self.fGet(id).tabB, tip: null }),
      table: { head: [{ v: 'Day' }, { v: 'Remaining' }, { v: 'Ideal' }], rows: Array.from({ length: N }, (_, i) => ({ cells: [{ v: 'Oct ' + (i + 1) }, { v: i < rem.length ? String(rem[i]) : '—' }, { v: String(ideal(i)) }] })) }
    };

    // --- velocity
    const n = mobile ? Math.min(4, R.sp) : R.sp;
    const vc = (P.vc || []).slice(-n), vd = (P.vd || []).slice(-n);
    const vMax = this.niceMax(Math.max.apply(null, vc.concat(vd, [1])), 10);
    const sp0 = P.sprint - n;
    const vAvg = vd.length ? Math.round(vd.reduce((a, x) => a + x, 0) / vd.length) : 0;
    const vAvgC = vc.length ? Math.round(vc.reduce((a, x) => a + x, 0) / vc.length) : 0;
    const v = {
      has: !isEmpty, none: isEmpty,
      meta: isEmpty ? '' : 'avg ' + vAvg + ' pts', ar: w2 + ' / ' + h2, grid: this.ticks(vMax),
      groups: vc.map((cv, i) => {
        const key = 'v' + i, s = 'S' + (sp0 + i), pct = Math.round(vd[i] / cv * 100);
        return {
          h1: (cv / vMax * 100).toFixed(2), h2: (vd[i] / vMax * 100).toFixed(2), dl: i * 45, dl2: i * 45 + 60,
          on: tip === key ? 'on' : '', tipOn: tip === key, side: side((i + 0.5) / n), head: 'Sprint ' + (sp0 + i) + ' · ' + pct + '%',
          rows: [{ v: vd[i], n: 'completed', c: 'var(--c1)', k: 'rect' }, { v: cv, n: 'committed', c: 'var(--c2)', k: 'rect' }],
          aria: s + ': ' + vd[i] + ' of ' + cv + ' points completed', show: showTip(key)
        };
      }),
      xl: vc.map((_, i) => ({ t: 'S' + (sp0 + i), left: ((i + 0.5) / n * 100).toFixed(2), cls: '' })),
      aria: 'Velocity, last ' + n + ' sprints: average ' + vAvg + ' points completed of ' + vAvgC + ' committed.',
      tableOn: !!f.tabV && !isEmpty, chartOn: !f.tabV,
      toggleTable: () => self.fSet(id, { tabV: !self.fGet(id).tabV, tip: null }),
      table: { head: [{ v: 'Sprint' }, { v: 'Committed' }, { v: 'Completed' }], rows: vc.map((cv, i) => ({ cells: [{ v: 'S' + (sp0 + i) }, { v: String(cv) }, { v: String(vd[i]) }] })) }
    };

    // --- cycle time histogram
    const BINS = ['<1d', '1–2d', '2–3d', '3–5d', '5–8d', '8d+'];
    const counts = (P.hist || []).map((x) => Math.max(0, Math.round(x * R.k)));
    const total = counts.reduce((a, x) => a + x, 0);
    const cMax = this.niceMax(Math.max.apply(null, counts.concat([1])), 5);
    const peak = counts.indexOf(Math.max.apply(null, counts.concat([0])));
    const cc = {
      has: !isEmpty, none: isEmpty, meta: isEmpty ? '' : total + ' tasks · median ' + (cyc * 0.8).toFixed(1) + 'd', ar: w2 + ' / ' + (mobile ? 150 : 170), grid: this.ticks(cMax),
      bins: counts.map((cnt, i) => {
        const key = 'c' + i;
        return {
          h: (cnt / cMax * 100).toFixed(2), dl: i * 45, on: tip === key ? 'on' : '', tipOn: tip === key, side: side((i + 0.5) / BINS.length),
          head: BINS[i], rows: [{ v: cnt, n: 'tasks · ' + (total ? Math.round(cnt / total * 100) : 0) + '%', c: 'var(--c1)', k: 'rect' }],
          aria: BINS[i] + ': ' + cnt + ' tasks', show: showTip(key)
        };
      }),
      xl: BINS.map((bn, i) => ({ t: bn, left: ((i + 0.5) / BINS.length * 100).toFixed(2), cls: '' })),
      aria: 'Cycle time distribution: ' + total + ' tasks, most in ' + (BINS[peak] || '') + '.'
    };

    // --- throughput (completed weeks, last = week of Sep 28)
    const wk = R.wk, rnd = this.rng(f.proj + f.range);
    const tv = Array.from({ length: wk }, (_, i) => Math.max(1, Math.round((P.thr || 1) * (0.72 + 0.5 * rnd()) * (0.88 + 0.24 * i / Math.max(1, wk - 1)))));
    const wkDate = (i) => { const d = new Date(2026, 8, 28 - 7 * (wk - 1 - i)); return D.MON[d.getMonth()] + ' ' + d.getDate(); };
    const tMax = this.niceMax(Math.max.apply(null, tv), 5);
    const th2 = mobile ? 150 : 170;
    const tx = (i) => (i + 0.5) / wk * w2;
    const ty = (val) => (1 - val / tMax) * th2;
    const tLine = tv.map((val, i) => (i ? 'L' : 'M') + tx(i).toFixed(1) + ' ' + ty(val).toFixed(1)).join(' ');
    const mid = Math.floor((wk - 1) / 2);
    const tp = {
      has: !isEmpty, none: isEmpty, meta: isEmpty ? '' : 'tasks / week', ar: w2 + ' / ' + th2, vb: '0 0 ' + w2 + ' ' + th2, grid: this.ticks(tMax),
      lineD: tLine, areaD: tLine + ' L' + tx(wk - 1).toFixed(1) + ' ' + th2 + ' L' + tx(0).toFixed(1) + ' ' + th2 + ' Z',
      endX: ((wk - 0.5) / wk * 100).toFixed(2), endY: (ty(tv[wk - 1]) / th2 * 100).toFixed(2), endV: tv[wk - 1],
      hits: tv.map((val, i) => {
        const key = 't' + i;
        return { on: tip === key ? 'on' : '', tipOn: tip === key, y: (ty(val) / th2 * 100).toFixed(2), side: side((i + 0.5) / wk), head: 'Week of ' + wkDate(i), rows: [{ v: val, n: 'tasks completed', c: 'var(--c1)', k: '' }], aria: 'Week of ' + wkDate(i) + ': ' + val + ' tasks completed', show: showTip(key) };
      }),
      xl: [0, mid, wk - 1].map((i) => ({ t: wkDate(i), left: ((i + 0.5) / wk * 100).toFixed(2), cls: '' })),
      aria: 'Throughput over ' + wk + ' weeks: ' + Math.min.apply(null, tv) + ' to ' + Math.max.apply(null, tv) + ' tasks per week, last week ' + tv[wk - 1] + '.'
    };

    // --- objectives & milestones
    const prow = (name, pv, tg, i, pfx, extra) => {
      const key = pfx + i;
      const diff = pv - tg;
      return {
        name, pct: pv, tgt: tg, dl: i * 50, on: tip === key ? 'on' : '', tipOn: tip === key,
        rows: [{ v: pv + '%', n: 'complete', c: 'var(--c1)', k: 'rect' }, { v: tg + '%', n: 'expected today' + (extra ? ' · ' + extra : ''), c: 'var(--text)', k: 'tick' }],
        aria: name + ': ' + pv + ' percent, expected ' + tg + ' percent' + (diff < 0 ? ', behind by ' + (-diff) : ''),
        show: showTip(key)
      };
    };
    const pr = {
      has: !isEmpty, none: isEmpty, showMs: !mobile,
      objs: isEmpty ? [] : P.obj.map((o, i) => prow(D.OBJ[i], o[0], o[1], i, 'o', '')),
      mss: isEmpty ? [] : P.ms.map((m, i) => prow(D.MS[i][0], m[0], m[1], i + 4, 'm', 'due ' + D.MS[i][1]))
    };

    // --- menus
    const curMenu = f.menu;
    const pickProj = (k) => () => { self.fSet(id, { proj: k, menu: null, tip: null }); self.run(id); };
    const pickRange = (k) => () => { self.fSet(id, { range: k, menu: null, tip: null, customOpen: false }); self.run(id); };
    const projKeys = c.extra ? ['DS', 'PR', 'MO', 'IN'] : ['PR', 'MO', 'IN'];
    const exportPick = (fmt) => () => { self.fSet(id, { menu: null, exp: fmt }); setTimeout(() => { if (!self.stopped) self.fSet(id, { exp: null }); }, 1600); };

    const sbFrames = c.sidebar ? [this.sbFrame('sb-' + id, { role: 'admin', collapsible: true, active: P.badge === 'DS' ? 'DS' : P.badge, sub: 'reports' })] : [];

    return {
      id, label: c.label, meta: c.meta, gc: c.gc, gr: c.gr, h: c.h, r: c.r,
      themeCls: c.theme === 'light' ? 't-light' : themeCls,
      sidebar: !!c.sidebar, sbFrames,
      animCls: f.anim === 'rs' ? 'rs' : 'on',
      onKey: (ev) => { if (ev.key === 'Escape') { const cur = self.fGet(id); if (cur.menu || cur.tip) self.fSet(id, { menu: null, tip: null, customOpen: false }); } },
      proj: { name: P.name, badge: P.badge, hue: P.hue },
      sprintMeta: sprintLabel + ' · day 7 of 14 · ' + rangeName,
      projOpen: curMenu === 'proj', toggleProj: () => self.fSet(id, { menu: self.fGet(id).menu === 'proj' ? null : 'proj' }),
      projOpts: projKeys.map((k) => ({ name: D.P[k].name, badge: D.P[k].badge, hue: D.P[k].hue, on: f.proj === k, pick: pickProj(k) })),
      rangeLabel: rangeName, rangeOpen: curMenu === 'range',
      toggleRange: () => self.fSet(id, { menu: self.fGet(id).menu === 'range' ? null : 'range', customOpen: false }),
      rangeOpts: ['r2', 'r6', 'r90'].map((k) => ({ name: D.R[k].name, on: f.range === k, pick: pickRange(k) })),
      customOn: f.range === 'custom', customOpen: !!f.customOpen,
      toggleCustom: () => self.fSet(id, { customOpen: !self.fGet(id).customOpen }),
      cFrom: f.cFrom, cTo: f.cTo,
      onFrom: (ev) => self.fSet(id, { cFrom: String(ev.target.value || '').slice(0, 10) }),
      onTo: (ev) => self.fSet(id, { cTo: String(ev.target.value || '').slice(0, 10) }),
      applyCustom: () => {
        const cur = self.fGet(id);
        let a = cur.cFrom, z = cur.cTo;
        if (!self.fmtIso(a) || !self.fmtIso(z)) { a = '2026-08-03'; z = '2026-10-07'; }
        if (a > z) { const x = a; a = z; z = x; }
        self.fSet(id, { range: 'custom', cFrom: a, cTo: z, menu: null, customOpen: false, tip: null });
        self.run(id);
      },
      expOpen: curMenu === 'exp', toggleExp: () => self.fSet(id, { menu: self.fGet(id).menu === 'exp' ? null : 'exp' }),
      expOpts: [['CSV', 'data'], ['PNG', 'charts'], ['PDF', 'report']].map((x) => ({ name: x[0], hint: x[1], pick: exportPick(x[0]) })),
      expOn: !!f.exp, expMsg: f.exp ? 'Preparing ' + f.exp + '…' : '',
      isReady: f.view === 'ready', isLoading: f.view === 'loading', isError: f.view === 'error',
      retrying: !!f.retrying, notRetrying: !f.retrying,
      retry: () => {
        if (self.fGet(id).retrying) return;
        self.fSet(id, { retrying: true });
        setTimeout(() => { if (self.stopped) return; self.fSet(id, { retrying: false, view: 'ready' }); self.run(id); }, 900);
      },
      hide,
      need: '1 of 3 sprints', needPct: 33,
      stats, b, v, c: cc, tp, pr
    };
  }
  renderVals() {
    const theme = this.props.theme || 'navy';
    const themeCls = theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy';
    const self = this;
    return {
      themeCls,
      frames: this.frames().map((c) => self.buildFrame(c, themeCls))
    };
  }
}
</script>
