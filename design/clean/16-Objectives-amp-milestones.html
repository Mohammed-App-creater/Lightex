.g-oh{display:flex;align-items:center;gap:2px;padding-right:10px}
.g-otg{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 8px 12px 14px;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;border-radius:10px}
.g-ring{position:relative;width:40px;height:40px;flex:none}
.g-ring svg{display:block}
.g-rp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 10.5px/1 'JetBrains Mono',monospace;color:var(--text)}
.g-rg{transition:stroke-dashoffset 900ms var(--ease),stroke 200ms var(--ease)}
.g-oti{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.g-ott{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-meta{display:flex;align-items:center;gap:14px;color:var(--text-3);font-size:12px;flex-wrap:wrap}
.g-meta>span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.g-av{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--text);flex:none}
.g-chev{flex:none;color:var(--text-3);transition:transform 220ms var(--ease)}
.g-chev.open{transform:rotate(90deg)}
.g-col{display:grid;grid-template-rows:0fr;transition:grid-template-rows 280ms var(--ease)}
.g-col.open{grid-template-rows:1fr}
.g-col>div{overflow:hidden;min-height:0}
.g-ox{padding:2px 16px 16px 68px;display:flex;flex-direction:column;gap:12px}
.g-grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 24px}
.g-grp{display:flex;flex-direction:column;min-width:0}
.g-gh{display:flex;align-items:center;gap:8px;height:28px;font-size:12px;font-weight:600;color:var(--text-2)}
.g-gh .mono{font-size:11px;font-weight:500;color:var(--text-3)}
.g-tr{display:flex;align-items:center;gap:9px;min-height:30px;padding:0 8px;margin:0 -8px;border-radius:6px;min-width:0}
.g-tr:hover{background:var(--hover)}
.g-key{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-3);flex:none}
.g-tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-none{font-size:12px;color:var(--text-3)}
.g-link{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:7px;border:1px dashed var(--line-2);background:transparent;color:var(--text-2);font:500 12px/1 'Inter',sans-serif;cursor:pointer;transition:border-color 120ms var(--ease),color 120ms var(--ease)}
.g-link:hover,.g-link[aria-expanded=true]{border-color:var(--control);color:var(--text)}
.g-pick{border:1px solid var(--line-2);border-radius:10px;background:var(--raised);box-shadow:var(--shadow-pop);max-width:440px;animation:gin 180ms var(--ease)}
@keyframes gin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.g-psr{position:relative;padding:8px;border-bottom:1px solid var(--line)}
.g-psr svg{position:absolute;left:18px;top:50%;margin-top:-7px;color:var(--text-3);pointer-events:none}
.g-ps{width:100%;height:32px;padding:0 10px 0 30px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font:400 13px/1 'Inter',sans-serif}
.g-ps:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.g-pl{max-height:206px;overflow:auto;padding:4px}
.g-pi{display:flex;align-items:center;gap:9px;min-height:32px;padding:0 8px;border-radius:6px;cursor:pointer}
.g-pi:hover{background:var(--hover)}
.g-pf{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-top:1px solid var(--line);font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.g-cb{appearance:none;-webkit-appearance:none;width:16px;height:16px;margin:0;border:1.5px solid var(--control);border-radius:4px;background:transparent;display:grid;place-content:center;cursor:pointer;flex:none;transition:background-color 120ms var(--ease),border-color 120ms var(--ease)}
.g-cb::after{content:"";width:8px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform 150ms var(--spring)}
.g-cb:checked{background:var(--accent);border-color:var(--accent)}
.g-cb:checked::after{transform:rotate(-45deg) scale(1)}
/* badges */
.g-risk{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font:600 11px/1 'Inter',sans-serif;color:var(--warn);background:color-mix(in oklab,var(--warn) 13%,transparent);border:1px solid color-mix(in oklab,var(--warn) 35%,transparent);white-space:nowrap;flex:none}
.g-risk::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.g-days{white-space:nowrap}
.g-days.over{color:var(--danger)}
.g-days.dn{color:var(--ok)}
/* timeline */
.g-tl{--lab:210px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;flex:none}
.nar .g-tl{--lab:136px}
.ph .g-tl{--lab:112px}
.g-tlh{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);height:36px;border-bottom:1px solid var(--line)}
.g-lt{position:relative;display:block;height:100%;margin-right:36px}
.g-mo{position:absolute;top:0;bottom:0;padding-left:8px;display:flex;align-items:center;border-left:1px solid var(--line);font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.g-tdy{position:absolute;top:8px;transform:translateX(-50%);height:20px;padding:0 7px;border-radius:5px;background:var(--accent-s);color:var(--accent-t);font:600 10.5px/20px 'JetBrains Mono',monospace;z-index:2;white-space:nowrap}
.g-lane{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);width:100%;height:58px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;padding:0;transition:background-color 120ms var(--ease)}
.g-lane:last-child{border-bottom:0}
.g-lane:hover{background:var(--hover)}
.g-lane.sel{background:var(--hover);box-shadow:inset 2px 0 0 var(--accent-t)}
.g-ll{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 14px;min-width:0}
.g-ln{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g-lm{display:flex;align-items:center;gap:8px;font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.g-gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--accent-t);opacity:.75}
.g-bar{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--line-2);overflow:hidden}
.g-bf{display:block;height:100%;background:var(--accent-t);border-radius:4px;transition:width 800ms var(--ease),background-color 200ms var(--ease)}
.g-bf.risk{background:var(--warn)}
.g-bf.ok{background:var(--ok)}
.g-mk{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);border-radius:2px;background:var(--surface);border:2px solid var(--accent-t);z-index:1}
.g-mk.risk{border-color:var(--warn)}
.g-mkd{position:absolute;top:50%;margin:-8px 0 0 -8px;z-index:1;display:flex}
.g-md{position:absolute;top:50%;margin-top:-6px;transform:translateX(12px);font:500 11px/12px 'JetBrains Mono',monospace;color:var(--text-2);white-space:nowrap}
.g-md.l{transform:translateX(calc(-100% - 12px))}
/* selected milestone */
.g-msd{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:14px;flex:none}
.g-msh{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.g-msh h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.g-act{display:flex;align-items:center;gap:6px;margin-left:auto}
.g-pr{display:flex;align-items:center;gap:10px;font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2);min-width:0}
.g-pb{flex:1;min-width:40px;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.g-tks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 24px}
/* milestone list */
.g-ml{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;flex:none}
.g-lr{border-bottom:1px solid var(--line)}
.g-lr:last-child{border-bottom:0}
.g-lrb{display:grid;grid-template-columns:14px 16px minmax(0,1fr) 64px 76px 160px 64px;align-items:center;gap:14px;width:100%;min-height:54px;padding:8px 16px;border:0;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:background-color 120ms var(--ease)}
.g-lrb:hover{background:var(--hover)}
.g-mks{width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--accent-t);border-radius:2px;justify-self:center}
.g-mks.risk{border-color:var(--warn)}
.g-lrn{display:flex;flex-direction:column;gap:5px;min-width:0}
.g-lrt{display:flex;align-items:center;gap:8px;min-width:0}
.g-c{font:500 11.5px/1 'JetBrains Mono',monospace;color:var(--text-2);white-space:nowrap}
.g-sub{display:none;align-items:center;gap:8px;font:500 11px/1 'JetBrains Mono',monospace;color:var(--text-3)}
.nar .g-lrb{grid-template-columns:14px 16px minmax(0,1fr) 120px}
.nar .hn,.ph .hn{display:none}
.nar .g-sub,.ph .g-sub{display:flex}
.g-lx{padding:0 16px 16px 60px;display:flex;flex-direction:column;gap:10px}
/* empty, loading, error */
.g-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:32px 16px}
.g-eic{width:56px;height:56px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--accent-t)}
.g-et{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.g-es{margin:-8px 0 0;font-size:12.5px;color:var(--text-3)}
.sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--raised) 0%,var(--hover) 50%,var(--raised) 100%);background-size:200% 100%;animation:gshim 1.4s linear infinite}
@keyframes gshim{from{background-position:200% 0}to{background-position:-200% 0}}
.g-skr{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.g-eicd{color:var(--danger)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--text);animation:gspin .7s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
/* side panel form */
.g-scrim{position:absolute;inset:0;z-index:8;background:rgba(2,5,14,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:gfade 200ms var(--ease)}
.t-light .g-scrim{background:rgba(18,18,23,.22)}
@keyframes gfade{from{opacity:0}to{opacity:1}}
.g-sp{position:absolute;top:0;right:0;bottom:0;z-index:9;width:400px;max-width:100%;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line-2);box-shadow:var(--shadow-modal);animation:gslide 260ms var(--ease)}
@keyframes gslide{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes gsheet{from{transform:translateY(100%)}to{transform:none}}
.nar .g-sp{width:360px}
.ph .g-sp{top:auto;left:0;width:auto;height:88%;border-left:0;border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;animation:gsheet 280ms var(--ease)}
.g-sph{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 20px;border-bottom:1px solid var(--line)}
.g-sph h2{margin:0;flex:1;font-size:15px;font-weight:600;letter-spacing:-.01em}
.g-spb{flex:1;min-height:0;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.g-fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.g-fl{font-size:12px;font-weight:500;color:var(--text-2)}
.g-in{width:100%;height:34px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--bg);color:var(--text);font:400 13px/1 'Inter',sans-serif;transition:border-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.g-in:hover{border-color:var(--control)}
.g-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-s)}
.g-in.err,.g-in.err:hover{border-color:var(--danger)}
.g-in.err:focus{box-shadow:0 0 0 3px color-mix(in oklab,var(--danger) 25%,transparent)}
textarea.g-in{height:84px;padding:8px 10px;line-height:20px;resize:none}
.g-err{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--danger);animation:gin 160ms var(--ease)}
.g-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ph .g-row2{grid-template-columns:minmax(0,1fr)}
.g-lks{border:1px solid var(--line-2);border-radius:8px;background:var(--bg);max-height:184px;overflow:auto;padding:4px}
.g-spf{flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
/* toast */
.g-toast{position:absolute;left:50%;bottom:20px;z-index:7;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--raised);box-shadow:var(--shadow-pop);white-space:nowrap;animation:gtoast 240ms var(--spring)}
@keyframes gtoast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* narrow + phone */
.nar .g-top{padding:0 18px}.nar .g-head{padding:12px 18px 0}.nar .g-body{padding:16px 18px 28px}.nar .g-ox{padding-left:16px}.nar .g-lx{padding-left:16px}
.g-newm{display:none}
.ph .g-top{display:none}.ph .g-mtop{display:flex}.ph .g-newh{display:none}.ph .g-newm{display:inline-flex}
.ph .g-head{padding:0 12px;gap:0}
.ph .g-tools{width:100%;padding:0;margin-left:0}.ph .g-seg{margin:10px 0}
.ph .g-body{padding:12px 12px 32px;gap:10px}
.ph .g-otg{gap:12px;padding:12px}
.ph .g-ox{padding:2px 12px 14px}
.ph .g-lrb{grid-template-columns:14px 16px minmax(0,1fr) 70px;gap:10px;padding:10px 12px}
.ph .g-lx{padding:0 12px 14px}
.ph .g-msd{padding:14px}
.g-tab:focus-visible,.g-segb:focus-visible,.btn:focus-visible,.g-ib:focus-visible,.g-done:focus-visible,.g-otg:focus-visible,.g-link:focus-visible,.g-lane:focus-visible,.g-lrb:focus-visible,.g-cb:focus-visible,.g-ps:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--ring)}
@media (max-width:760px){
  .sb-host{display:none!important}
  .g-top{display:none}.g-mtop{display:flex}.g-newh{display:none}.g-newm{display:inline-flex}
  .g-head{padding:0 12px;gap:0}.g-tools{width:100%;padding:0;margin-left:0}.g-seg{margin:10px 0}
  .g-body{padding:12px 12px 32px}.g-ox,.g-lx{padding:2px 12px 14px}
  .g-lrb{grid-template-columns:14px 16px minmax(0,1fr) 70px;gap:10px;padding:10px 12px}.hn{display:none}.g-sub{display:flex}
  .g-tl{--lab:112px}.g-row2{grid-template-columns:minmax(0,1fr)}
  .g-sp{top:auto;left:0;width:auto;height:88%;border-left:0;border-top:1px solid var(--line-2);border-radius:18px 18px 0 0}
}
@media (prefers-reduced-motion:reduce){.ds *,.ds *::before,.ds *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</helmet>
<div class="ds {{themeCls}}" style="width:1440px;height:3920px;padding:64px 80px;display:flex;flex-direction:column;gap:36px;overflow:hidden">
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="mono" style="font-size:12px;color:var(--text-3);letter-spacing:.04em">SCREENS · GOALS</span>
      <h1 style="margin:0;font-size:48px;line-height:54px;font-weight:600;letter-spacing:-.03em">Objectives &amp; milestones</h1>
    </div>
    <div class="mono" style="display:flex;gap:16px;color:var(--text-3);font-size:12px"><span>ring = done / linked</span><span>at risk = behind time</span><span>Esc closes panel</span><span>today Oct 7</span></div>
  </header>

  <div class="frames">
    <sc-for list="{{frames}}" as="fx" hint-placeholder-count="9">
      <figure class="frame" style="width:{{fx.w}}px">
        <figcaption>{{fx.label}}<span>{{fx.meta}}</span></figcaption>
        <div class="dev {{fx.cls}}" style="width:{{fx.w}}px;height:{{fx.h}}px;border-radius:{{fx.r}}px">

          <sc-for list="{{fx.sbFrames}}" as="fr" hint-placeholder-count="1">
          <div class="sbw sb-host {{fr.sbwCls}}" style="width:{{fr.sbW}}px">
<!--SB-START-->
            <sc-if value="{{fr.full}}" hint-placeholder-val="{{true}}">
              <nav class="sb {{fr.touchCls}} fade" aria-label="Main navigation">
                <div class="sb-ws">
                  <button class="sb-wsb" type="button" aria-haspopup="menu" aria-expanded="{{fr.wsOpen}}" sc-camel-on-click="{{fr.toggleWs}}">
                    <span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span>
                    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{fr.wsName}}</span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6.5L8 10l3.5-3.5"></path></svg>
                  </button>
                  <sc-if value="{{fr.collapsible}}" hint-placeholder-val="{{true}}">
                    <span class="sb-tw"><button class="sb-icb" type="button" aria-label="Collapse sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M10.5 6.5L9 8l1.5 1.5"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Collapse <span class="kbd">⌘B</span></span></span>
                  </sc-if>
                  <sc-if value="{{fr.closable}}" hint-placeholder-val="{{false}}">
                    <button class="sb-icb" type="button" aria-label="Close navigation" sc-camel-on-click="{{fr.closeDrawer}}" style="width:44px;height:44px"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
                  </sc-if>
                  <sc-if value="{{fr.wsOpen}}" hint-placeholder-val="{{false}}">
                    <div class="sb-menu" role="menu" aria-label="Workspaces" style="top:48px;left:10px;right:10px">
                      <sc-for list="{{fr.workspaces}}" as="w" hint-placeholder-count="3">
                        <button class="sb-mi" type="button" role="menuitemradio" aria-checked="{{w.cur}}" sc-camel-on-click="{{w.pick}}">
                          <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) {{w.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{w.hue}})">{{w.badge}}</span>
                          <span style="flex:1">{{w.name}}</span>
                          <sc-if value="{{w.cur}}" hint-placeholder-val="{{false}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="var(--accent-t)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <div class="sb-sep"></div>
                        <button class="sb-mi" type="button" role="menuitem">Workspace settings</button>
                        <button class="sb-mi" type="button" role="menuitem">Create workspace</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </div>

                <label class="sb-search">
                  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</span>
                  <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg>

                  <div class="sb-sec {{fr.secCls}}">

                    <sc-if value="{{fr.canProj}}" hint-placeholder-val="{{true}}">
                      <span class="sb-tw"><button class="sb-icb sm" type="button" aria-label="New project"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New project</span></span>
                    </sc-if>
                  </div>
                  <div class="sb-col {{fr.projSecCls}}"><div>
                    <sc-if value="{{fr.showFilter}}" hint-placeholder-val="{{false}}">

                    <sc-for list="{{fr.projects}}" as="pj" hint-placeholder-count="5">

                          <span class="lab">{{pj.name}}</span>
                          <svg class="sb-chev {{pj.chev}}" width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                        </button>
                        <div class="sb-col {{pj.colCls}}"><div>
                          <div class="sb-subs" role="list">
                            <span class="sb-ind" style="transform:translateY({{pj.indY}}px);opacity:{{pj.indO}}"></span>
                            <sc-for list="{{pj.subs}}" as="s" hint-placeholder-count="6">
                              <button class="sb-si {{s.on}}" type="button" role="listitem" aria-current="{{s.cur}}" sc-camel-on-click="{{s.pick}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg>{{s.name}}</button>
                            </sc-for>
                          </div>
                        </div></div>
                      </div>
                    </sc-for>
                    <sc-if value="{{fr.noMatch}}" hint-placeholder-val="{{false}}"><p style="margin:6px 8px;font-size:12px;color:var(--text-3)">No projects match.</p></sc-if>
                  </div></div>
                </div>

                <div class="sb-foot">
                  <button class="sb-spr" type="button" sc-camel-on-click="{{fr.openBoard}}" aria-label="Sprint 14, {{fr.sprPct}} percent, 7 days left. Open board">

                    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;font-size:13px;line-height:16px">Sprint 14</span><span class="mono" style="font-size:11px;line-height:14px;color:var(--text-3)">{{fr.sprPct}}% · 7d left</span></span>
                    <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M6.5 4.5L10 8l-3.5 3.5"></path></svg>
                  </button>
                  <div class="sb-row">
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                      <sc-if value="{{fr.canAdmin}}" hint-placeholder-val="{{true}}">
                        <a class="sb-it" href="#members"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7.5a2.3 2.3 0 100-4.6 2.3 2.3 0 000 4.6zM2 13c.5-2.2 2-3.5 4-3.5s3.5 1.3 4 3.5M10.5 3.2a2.2 2.2 0 010 4.2M12 9.8c1 .5 1.7 1.6 2 3.2"></path></svg><span class="lab">Members &amp; roles</span></a>
                      </sc-if>
                      <sc-if value="{{fr.canSettings}}" hint-placeholder-val="{{true}}">
                        <a class="sb-it" href="#settings"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8zM8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M3.6 12.4l1.2-1.2M11.2 4.8l1.2-1.2"></path></svg><span class="lab">Settings</span><span class="sb-count">⌘,</span></a>
                      </sc-if>
                    </div>
                    <span class="sb-tw" style="align-self:flex-end"><button class="sb-icb" type="button" aria-label="Keyboard shortcuts"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM6.4 6.4a1.7 1.7 0 113 1.1c-.6.4-1.4.8-1.4 1.6M8 11.1v.1"></path></svg></button><span class="sb-tip" role="tooltip" style="left:auto;right:calc(100% + 8px)">Shortcuts <span class="kbd">?</span></span></span>
                  </div>
                  <div style="position:relative" sc-camel-on-key-down="{{fr.profKey}}">
                    <sc-if value="{{fr.profOpen}}" hint-placeholder-val="{{false}}">
                      <div class="sb-menu up" role="menu" aria-label="Account" style="left:0;right:0;bottom:calc(100% + 6px)">
                        <div style="padding:8px 8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column;gap:2px"><span style="font-weight:600">Alex Kim</span><span style="font-size:12px;color:var(--text-3)">alex@team.dev</span></div>
                        <a class="sb-mi" role="menuitem" href="#profile"><span style="flex:1">Profile</span><span class="kbd">G P</span></a>

                      </div>

                    <button class="sb-prof" type="button" aria-haspopup="menu" aria-expanded="{{fr.profOpen}}" aria-label="Account: Alex Kim" sc-camel-on-click="{{fr.toggleProf}}">
                      <span class="sb-av" style="background:oklch(var(--av-l) var(--av-c) 285)">AK<span class="sb-pres"></span></span>
                      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:13px;line-height:16px">Alex Kim</span><span style="font-size:11px;line-height:14px;color:var(--text-3)">{{fr.roleLabel}} · {{fr.wsName}}</span></span>
                      <svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-3)" aria-hidden="true"><path d="M4.5 6L8 2.8 11.5 6M4.5 10L8 13.2l3.5-3.2"></path></svg>
                    </button>
                  </div>
                </div>
              </nav>
            </sc-if>

            <sc-if value="{{fr.rail}}" hint-placeholder-val="{{false}}">
              <nav class="sb-rail fade" aria-label="Main navigation (collapsed)">
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Workspace: {{fr.wsName}}" sc-camel-on-click="{{fr.toggleRail}}"><span class="sb-xt" aria-hidden="true"><svg width="15" height="13" sc-camel-view-box="0 0 46 39" overflow="visible"><path d="M-4 -4L50 43" stroke="var(--text)" stroke-width="10" fill="none"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--surface)" stroke-width="17" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path><path d="M50 -5L26 18H39L-4 44" stroke="var(--logo)" stroke-width="10" fill="none" stroke-linejoin="miter" stroke-miterlimit="10"></path></svg></span></button><span class="sb-tip" role="tooltip">{{fr.wsName}}</span></span>
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Search"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M7 2.8a4.2 4.2 0 110 8.4 4.2 4.2 0 010-8.4zM10.2 10.2l3.3 3.3"></path></svg></button><span class="sb-tip" role="tooltip">Search <span class="kbd">⌘K</span></span></span>
                <sc-if value="{{fr.canTask}}" hint-placeholder-val="{{true}}"><span class="sb-tw"><button class="sb-ri" type="button" aria-label="New task" style="border:1px solid var(--line-2);background:var(--raised)"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button><span class="sb-tip" role="tooltip">New task <span class="kbd">C</span></span></span></sc-if>
                <div class="sb-rsep"></div>
                <span class="sb-tw"><a class="sb-ri" href="#inbox" aria-label="Inbox, {{fr.inbox}} unread"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 011 .8l1.6 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1zM2.5 9.5h3l1 1.5h3l1-1.5h3"></path></svg><span class="sb-dot"></span></a><span class="sb-tip {{fr.tipDemo}}" role="tooltip">Inbox <span class="mono" style="color:var(--accent-t)">{{fr.inbox}}</span><span class="kbd">G I</span></span></span>
                <sc-if value="{{fr.showMine}}" hint-placeholder-val="{{true}}"><span class="sb-tw"><a class="sb-ri" href="#mine" aria-label="My tasks"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 110 11 5.5 5.5 0 010-11zM5.6 8.1l1.7 1.7 3.2-3.4"></path></svg></a><span class="sb-tip" role="tooltip">My tasks <span class="kbd">G M</span></span></span></sc-if>
                <div class="sb-rsep"></div>
                <sc-for list="{{fr.railProjects}}" as="pj" hint-placeholder-count="4">
                  <span class="sb-tw"><button class="sb-ri {{pj.on}}" type="button" aria-label="{{pj.name}}" sc-camel-on-click="{{pj.toggle}}"><span class="sb-pk" style="width:22px;height:22px;font-size:10px;background:oklch(var(--pk-l) var(--pk-c) {{pj.hue}});color:oklch(var(--pkt-l) var(--pkt-c) {{pj.hue}})">{{pj.badge}}</span></button><span class="sb-tip" role="tooltip">{{pj.name}}</span></span>
                </sc-for>
                <div style="flex:1"></div>
                <span class="sb-tw"><button class="sb-ri" type="button" sc-camel-on-click="{{fr.openBoard}}" aria-label="Sprint 14, {{fr.sprPct}} percent"><svg width="24" height="24" sc-camel-view-box="0 0 30 30" fill="none" aria-hidden="true"><circle cx="15" cy="15" r="11.5" stroke="var(--raised)" stroke-width="4"></circle><circle class="sb-rg" cx="15" cy="15" r="11.5" stroke="var(--accent-t)" stroke-width="4" stroke-linecap="round" stroke-dasharray="72.3" style="stroke-dashoffset:{{fr.sprOff}}" transform="rotate(-90 15 15)"></circle></svg></button><span class="sb-tip" role="tooltip">Sprint 14 · {{fr.sprPct}}% · 7d left</span></span>
                <sc-if value="{{fr.canSettings}}" hint-placeholder-val="{{true}}"><span class="sb-tw"><a class="sb-ri" href="#settings" aria-label="Settings"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 110 4.8 2.4 2.4 0 010-4.8zM8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M3.6 12.4l1.2-1.2M11.2 4.8l1.2-1.2"></path></svg></a><span class="sb-tip" role="tooltip">Settings <span class="kbd">⌘,</span></span></span></sc-if>
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Expand sidebar" sc-camel-on-click="{{fr.toggleRail}}"><svg class="sb-ib" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3h11v10h-11zM6 3v10M9 6.5L10.5 8 9 9.5"></path></svg></button><span class="sb-tip" role="tooltip">Expand <span class="kbd">⌘B</span></span></span>
                <span class="sb-tw"><button class="sb-ri" type="button" aria-label="Account: Alex Kim" style="height:40px"><span class="sb-av" style="width:28px;height:28px;font-size:10px;background:oklch(var(--av-l) var(--av-c) 285)">AK<span class="sb-pres"></span></span></button><span class="sb-tip" role="tooltip">Alex Kim · {{fr.roleLabel}}</span></span>
              </nav>
            </sc-if>
<!--SB-END-->
          </div>
          </sc-for>

          <main class="pg" aria-label="Goals">
            <div class="g-top">
              <span class="sb-pk" style="background:oklch(var(--pk-l) var(--pk-c) 255);color:oklch(var(--pkt-l) var(--pkt-c) 255)">PR</span>
              <span>Platform Rebuild</span><span style="color:var(--text-3)">/</span><b>{{fx.tabName}}</b>
              <sc-if value="{{fx.viewer}}" hint-placeholder-val="{{false}}"><span class="g-ro"><svg width="12" height="12" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8zM8 6.2a1.8 1.8 0 110 3.6 1.8 1.8 0 010-3.6z"></path></svg>View only</span></sc-if>
            </div>
            <div class="g-mtop">
              <button class="g-ib" type="button" aria-label="Open navigation" style="width:44px;height:44px"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"></path></svg></button>
              <span style="flex:1;font-weight:600;font-size:15px">{{fx.tabName}}</span>
              <sc-if value="{{fx.viewer}}" hint-placeholder-val="{{false}}"><span class="g-ro" style="margin-right:8px">View only</span></sc-if>
              <sc-if value="{{fx.showNew}}" hint-placeholder-val="{{true}}">
                <button class="g-ib pri g-newm" type="button" aria-label="{{fx.newLabel}}" sc-camel-on-click="{{fx.openNew}}" style="margin-right:4px"><svg width="16" height="16" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
              </sc-if>
            </div>

            <div class="g-head">
              <div class="g-tabs" role="tablist" aria-label="Goals">
                <button class="g-tab" type="button" role="tab" aria-selected="{{fx.isObj}}" sc-camel-on-click="{{fx.setObj}}" style="width:{{fx.tabW}}px">Objectives<span class="n">{{fx.objN}}</span></button>
                <button class="g-tab" type="button" role="tab" aria-selected="{{fx.isMs}}" sc-camel-on-click="{{fx.setMs}}" style="width:{{fx.tabW}}px">Milestones<span class="n">{{fx.msN}}</span></button>
                <span class="g-ind" style="width:{{fx.tabW}}px;transform:translateX({{fx.indX}}px)"></span>
              </div>
              <div class="g-tools">
                <sc-if value="{{fx.showSeg}}" hint-placeholder-val="{{false}}">
                  <div class="g-seg" role="group" aria-label="Milestone view">
                    <span class="g-segt" style="transform:translateX({{fx.segX}}px)"></span>
                    <button class="g-segb" type="button" aria-pressed="{{fx.isTl}}" sc-camel-on-click="{{fx.setTl}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4h7M5 8h8M3 12h6"></path></svg>Timeline</button>
                    <button class="g-segb" type="button" aria-pressed="{{fx.isList}}" sc-camel-on-click="{{fx.setList}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"></path></svg>List</button>
                  </div>
                </sc-if>
                <sc-if value="{{fx.showNew}}" hint-placeholder-val="{{true}}">
                  <button class="btn btn-primary sm g-newh" type="button" sc-camel-on-click="{{fx.openNew}}"><svg width="14" height="14" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>{{fx.newLabel}}</button>
                </sc-if>
              </div>
            </div>

            <div class="g-body" role="tabpanel" aria-label="{{fx.tabName}}">

              <sc-if value="{{fx.isLoading}}" hint-placeholder-val="{{false}}">
                <div class="g-list" aria-busy="true" aria-label="Loading">
                  <sc-for list="{{fx.sk}}" as="sk" hint-placeholder-count="4">
                    <div class="g-skr" style="opacity:{{sk.o}}"><span class="sk" style="width:40px;height:40px;border-radius:50%"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="height:12px;width:{{sk.w}}%"></span><span class="sk" style="height:10px;width:34%"></span></span></div>
                  </sc-for>
                </div>
              </sc-if>

              <sc-if value="{{fx.isError}}" hint-placeholder-val="{{false}}">
                <div class="g-empty" role="alert">
                  <span class="g-eic g-eicd"><svg width="22" height="22" sc-camel-view-box="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 11.5h-13zM8 6.5v3M8 11.5v.1"></path></svg></span>
                  <p class="g-et">Couldn’t load goals</p>
                  <p class="g-es mono">503 · retrying won’t lose anything</p>
                  <button class="btn btn-sec sm" type="button" sc-camel-on-click="{{fx.retry}}">Retry</button>

      F('P', 'Mobile', '390', { w: 390, h: 820, r: 36, cls: 'ph' }, { tab: 'obj', oexp: 'o2', tabW: 182 })
    ];
    return {
      themeCls: theme === 'light' ? 't-light' : theme === 'dark' ? 't-dark' : 't-navy',
      frames
    };
  }
}
