  /api/v1/tracking/projects/{project_id}/tasks:
    get:
      operationId: tracking_projects_tasks_retrieve
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: filter[assignee]
        schema:
          type: array
          items:
            type: string
        description: user id, `me` or `none`
      - in: query
        name: filter[blocked]
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: has at least one open blocker
      - in: query
        name: filter[epic]
        schema:
          type: array
          items:
            type: string
      - in: query
        name: filter[from]
        schema:
          type: string
          format: date
        description: 'YYYY-MM-DD. Keeps tasks whose span (startDate ?? dueDate → dueDate
          ?? startDate) ends on or after this day. Undated tasks never match. With
          filter[to]: at most 400 days, inclusive.'
      - in: query
        name: filter[label]
        schema:
          type: array
          items:
            type: string
      - in: query
        name: filter[milestone]
        schema:
          type: array
          items:
            type: string
      - in: query
        name: filter[parent]
        schema:
          type: array
          items:
            type: string
      - in: query
        name: filter[priority]
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: filter[scheduled]
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: 'true: startDate or dueDate set; false: neither set'
      - in: query
        name: filter[sprint]
        schema:
          type: array
          items:
            type: string
        description: sprint id or `none`
      - in: query
        name: filter[status]
        schema:
          type: array
          items:
            type: string
      - in: query
        name: filter[to]
        schema:
          type: string
          format: date
        description: YYYY-MM-DD. Keeps tasks whose span starts on or before this day.
      - in: query
        name: limit
        schema:
          type: integer
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
        description: 'number, title, priority, dueDate, startDate, estimate, createdAt,
          updatedAt or position; - for descending (dates: empty last ascending, first
          descending)'
      tags:
      - tasks
      security:
      - bearerAuth: []
      - bearerAuth: []
