openapi: 3.0.3
info:
  title: Lightex API
  version: 1.0.0
  description: 'Lightex v1: project management for software teams. All paths are under
    /api/v1.'
paths:
  /api/v1/attachments/{attachment_id}:
    delete:
      operationId: attachments_destroy
      description: Base for workspace- and project-scoped endpoints.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      responses:
        '204':
          description: No response body
  /api/v1/attachments/{attachment_id}/confirm:
    post:
      operationId: attachments_confirm_create
      description: POST attachments/{id}/confirm (brief's form of the confirm step).
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/{attachment_id}/download-url:
    get:
      operationId: attachments_download_url_retrieve
      description: Base for workspace- and project-scoped endpoints.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrl'
          description: ''
  /api/v1/auth/forgot-password:
    post:
      operationId: auth_forgot_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/google/callback:
    get:
      operationId: auth_google_callback_retrieve
      description: Google redirects here. Sets the refresh cookie and returns to the
        client, which restores the session.
      tags:
      - auth
      security:
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/google/start:
    get:
      operationId: auth_google_start_retrieve
      description: 'Browser navigation (not fetch): redirects to Google''s consent
        screen.'
      tags:
      - auth
      security:
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOut'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/me/password:
    put:
      operationId: auth_me_password_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInRequest'
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessOut'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInRequest'
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOut'
          description: ''
  /api/v1/auth/reset-password:
    post:
      operationId: auth_reset_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetInRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/comments/{comment_id}:
    patch:
      operationId: comments_partial_update
      description: Base for workspace- and project-scoped endpoints.
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCommentInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    delete:
      operationId: comments_destroy
      description: Base for workspace- and project-scoped endpoints.
      parameters:
      - in: path
        name: comment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - comments
      responses:
        '204':
          description: No response body
  /api/v1/custom-fields/{field_id}:
    patch:
      operationId: custom_fields_partial_update
      description: Base for workspace- and project-scoped endpoints.
      parameters:
      - in: path
        name: field_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom fields
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomFieldPatchInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldOut'
          description: ''
    delete:
      operationId: custom_fields_destroy
      description: Base for workspace- and project-scoped endpoints.
      parameters:
      - in: path
        name: field_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom fields
      responses:
        '204':
          description: No response body
  /api/v1/epics/{item_id}:
    get:
      operationId: epics_retrieve
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - epics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpicOut'
          description: ''
    patch:
      operationId: epics_partial_update
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - epics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEpicInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpicOut'
          description: ''
    delete:
      operationId: epics_destroy
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - epics
      responses:
        '204':
          description: No response body
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/invites/{token}:
    get:
      operationId: invites_retrieve
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
          description: ''
  /api/v1/invites/{token}/accept:
    post:
      operationId: invites_accept_create
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteInRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInviteOut'
          description: ''
  /api/v1/me/recents:
    get:
      operationId: me_recents_list
      tags:
      - tasks
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recent'
          description: ''
  /api/v1/me/tasks:
    get:
      operationId: me_tasks_retrieve
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      tags:
      - tasks
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPageOut'
          description: ''
  /api/v1/me/timer:
    get:
      operationId: me_timer_retrieve
      tags:
      - time
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerStateOut'
          description: ''
  /api/v1/me/timer/stop:
    post:
      operationId: me_timer_stop_create
      description: Needs `time.log` on the timer's project (checked by the service,
        which also discards stale timers).
      tags:
      - time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerStopInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerStopOut'
          description: ''
  /api/v1/milestones/{item_id}:
    get:
      operationId: milestones_retrieve
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - milestones
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneOut'
          description: ''
    patch:
      operationId: milestones_partial_update
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - milestones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMilestoneInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MilestoneOut'
          description: ''
    delete:
      operationId: milestones_destroy
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - milestones
      responses:
        '204':
          description: No response body
  /api/v1/notification-preferences:
    get:
      operationId: notification_preferences_retrieve
      tags:
      - notifications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
          description: ''
    put:
      operationId: notification_preferences_update
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
          description: ''
  /api/v1/notifications:
    get:
      operationId: notifications_retrieve
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: filter[tab]
        schema:
          type: string
          enum:
          - all
          - assigned
          - mentions
      - in: query
        name: filter[unread]
        schema:
          type: boolean
      - in: query
        name: filter[workspace]
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      tags:
      - notifications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
          description: ''
  /api/v1/notifications/{notification_id}/read:
    post:
      operationId: notifications_read_create
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReadRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/read-all:
    post:
      operationId: notifications_read_all_create
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadAllRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAllOut'
          description: ''
  /api/v1/notifications/unread-count:
    get:
      operationId: notifications_unread_count_retrieve
      parameters:
      - in: query
        name: filter[workspace]
        schema:
          type: string
      tags:
      - notifications
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
          description: ''
  /api/v1/objectives/{item_id}:
    get:
      operationId: objectives_retrieve
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - objectives
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveOut'
          description: ''
    patch:
      operationId: objectives_partial_update
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - objectives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedObjectiveInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveOut'
          description: ''
    delete:
      operationId: objectives_destroy
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - objectives
      responses:
        '204':
          description: No response body
  /api/v1/objectives/{item_id}/tasks:
    post:
      operationId: objectives_tasks_create
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - objectives
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskIdsInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveOut'
          description: ''
  /api/v1/objectives/{item_id}/tasks/{task_id}:
    delete:
      operationId: objectives_tasks_destroy
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: task_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - objectives
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectiveOut'
          description: ''
  /api/v1/permissions:
    get:
      operationId: permissions_list
      parameters:
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - project
          - workspace
      tags:
      - roles
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionInfo'
          description: ''
  /api/v1/projects/{project_id}:
    get:
      operationId: projects_retrieve
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectInRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '204':
          description: No response body
  /api/v1/projects/{project_id}/access-requests:
    get:
      operationId: projects_access_requests_list
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access requests
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequestWithUser'
          description: ''
    post:
      operationId: projects_access_requests_create
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access requests
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/projects/{project_id}/access-requests/{request_id}/deny:
    post:
      operationId: projects_access_requests_deny_create
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access requests
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequest'
          description: ''
  /api/v1/projects/{project_id}/access-requests/mine:
    delete:
      operationId: projects_access_requests_mine_destroy
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - access requests
      responses:
        '204':
          description: No response body
  /api/v1/projects/{project_id}/active-sprint:
    get:
      operationId: projects_active_sprint_retrieve
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sprints
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintOut'
          description: ''
  /api/v1/projects/{project_id}/activity:
    get:
      operationId: projects_activity_retrieve
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - activity
      responses:
        '200':
          description: No response body
  /api/v1/projects/{project_id}/archive:
    post:
      operationId: projects_archive_create
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/v1/projects/{project_id}/backlog:
    get:
      operationId: projects_backlog_retrieve
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - board
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backlog'
          description: ''
  /api/v1/projects/{project_id}/board:
    get:
      operationId: projects_board_retrieve
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: query
        name: filter[sprint]
        schema:
          type: string
        description: '`active` (default), `all` or a sprint id'
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - board
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/v1/projects/{project_id}/custom-fields:
    get:
      operationId: projects_custom_fields_list
      description: Scope = the project in the URL; workspace non-members get 404,
        non-members 403.
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - custom fields
