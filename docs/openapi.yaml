components:
  schemas:
    AcceptInviteInRequest:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
    AcceptInviteOut:
      type: object
      properties:
        accessToken:
          type: string
        workspaceSlug:
          type: string
      required:
      - accessToken
      - workspaceSlug
    AccessOut:
      type: object
      properties:
        accessToken:
          type: string
      required:
      - accessToken
    AccessRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        message:
          type: string
        createdAt:
          type: string
          nullable: true
          readOnly: true
        status:
          type: string
      required:
      - createdAt
      - id
      - message
      - projectId
      - status
      - userId
    AccessRequestWithUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        message:
          type: string
        createdAt:
          type: string
          nullable: true
          readOnly: true
        status:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - createdAt
      - id
      - message
      - projectId
      - status
      - user
      - userId
    AccountOut:
      type: object
      properties:
        login:
          type: string
        kind:
          $ref: '#/components/schemas/AccountOutKindEnum'
        url:
          type: string
      required:
      - kind
      - login
      - url
    AccountOutKindEnum:
      enum:
      - organization
      - user
      - bot
      type: string
    ActivityOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
        verb:
          type: string
        projectId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          nullable: true
        taskKey:
          type: string
          nullable: true
        taskTitle:
          type: string
          nullable: true
        data: {}
        createdAt:
          type: string
          format: date-time
        actorName:
          type: string
          nullable: true
        actorKind:
          $ref: '#/components/schemas/ActorKindEnum'
      required:
      - actorId
      - actorKind
