  /api/v1/epics/{item_id}:
    get:
      operationId: epics_retrieve
      description: Scope = the project of the planning item in the URL.
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - epics
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpicOut'
          description: ''
    patch:
